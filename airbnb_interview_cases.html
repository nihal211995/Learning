measured confounders such as urgency or guest frustration. Report an E-value: how strong a hidden factor would need to be to erase the result. Also check overlap: if some groups have propensity near 0 or 1, trim them.", "<b>Step 7, positioning.<\/b> Propensity scores adjust only for what we measured. They are weaker than randomization or a natural experiment, so recommend a follow-up randomized holdout."], "hand": "<div class=\"tablewrap\"><table><tr><th>Issue type<\/th><th>Bot users<\/th><th>No bot<\/th><th>Repeat rate (bot / no bot)<\/th><th>P(bot)<\/th><\/tr>\n<tr><td>Simple<\/td><td>800<\/td><td>200<\/td><td>8% / 10%<\/td><td>0.8<\/td><\/tr>\n<tr><td>Complex<\/td><td>200<\/td><td>800<\/td><td>30% / 32%<\/td><td>0.2<\/td><\/tr><\/table><\/div>\n<ol><li>Naive: bot = (800×0.08 + 200×0.30) ÷ 1,000 = 12.4%. No bot = (200×0.10 + 800×0.32) ÷ 1,000 = 27.6%. Gap −15.2 points.<\/li>\n<li>Within each type the gap is −2 points. Both types are 1,000 guests, so the average is −2 points.<\/li>\n<li>IPW gives the same −2 points because the weights make both groups 50% simple and 50% complex.<\/li><\/ol>", "code": "c7", "pitfalls": ["Adjusting for a mediator (for example, a post-chatbot satisfaction score).", "Extreme weights from propensity near 0 or 1 (trim or stabilize them).", "Declaring balance without checking SMDs.", "Believing that adding more covariates removes hidden confounding.", "Reporting the effect without an interval or sensitivity analysis."], "follow": [["Propensity matching vs weighting?", "Matching pairs similar people and discards unmatched ones (easy to explain, estimates ATT). Weighting uses everyone (estimates ATE or ATT, can be unstable with extreme weights)."], ["What is a doubly robust estimator?", "It combines an outcome model and a propensity model. It is consistent if either one is correct."], ["A collider is conditioned on. What happens?", "Conditioning on a common effect of two variables opens a spurious path between them. For example, selecting only cases that were escalated can create a fake link between complexity and bot use."], ["What if there is no overlap for complex issues?", "Then there is no data to compare. Restrict the claim to the overlapping region and say so."]], "lead": ["Fits a logistic regression and compares.", "Draws the diagram, picks covariates deliberately, checks overlap and balance, reports interval and sensitivity, and says the estimate is only as good as the measured confounders."], "story": "Where have you used matching, weighting or regression to estimate an effect from observational data? Write the treatment, confounders, and what you recommended afterwards.", "drills": [["P(treated | x) = 0.25. Weight for a treated person? For an untreated one?", "Treated: 1 ÷ 0.25 = 4. Untreated: 1 ÷ 0.75 = 1.33."], ["Why must we adjust only for pre-treatment variables?", "Post-treatment variables can be affected by the treatment; adjusting removes part of the real effect or creates bias."], ["SMD is 0.4 after weighting. Is the sample balanced?", "No. The usual bar is below 0.1. Improve the model or trim."]]}, {"id": "8A", "group": "Causal inference and Bayes", "title": "Bayes' theorem: a safety-risk classifier flags a ticket", "pri": "P1", "round": "Technical", "time": "15 min", "prompt": "A model flags tickets as safety-risk. 1% of tickets are truly risky. The model catches 90% of the risky ones and wrongly flags 5% of the safe ones. A ticket is flagged. How likely is it truly risky?", "tests": "Conditional probability and base rates, with a support-operations framing. A strong answer uses natural frequencies and then explains the consequence for staffing a review team.", "clarify": [["Sensitivity (catch rate) and false-positive rate?", "90% and 5%."], ["Prevalence?", "1% of tickets."], ["What is the cost of a miss vs a false alarm?", "A miss is far worse, so a review team looks at all flags."]], "gloss": [["Prevalence", "Share of tickets that are truly risky: 1%."], ["Sensitivity (recall)", "Of the truly risky ones, the share the model flags: 90%."], ["False-positive rate", "Of the safe ones, the share wrongly flagged: 5%."], ["PPV (precision)", "Of the flagged tickets, the share truly risky. This is what the reviewer experiences."], ["P(A | B)", "The chance of A given that B is true."]], "framework": ["<b>Imagine 10,000 tickets<\/b> (natural frequencies).", "<b>Split by truth<\/b> using prevalence.", "<b>Apply the model<\/b> to each group.", "<b>Compute<\/b> PPV = true flags ÷ all flags.", "<b>Interpret<\/b> for the review team and for the threshold."], "steps": ["<b>Step 1, 10,000 tickets.<\/b> 1% risky = 100 risky and 9,900 safe.", "<b>Step 2, flags.<\/b> Of 100 risky tickets, 90% flagged = 90. Of 9,900 safe, 5% flagged = 495.", "<b>Step 3, answer.<\/b> Flagged in total = 90 + 495 = 585. Truly risky among them = 90. PPV = 90 ÷ 585 = <b>15.4%<\/b>.", "<b>Step 4, formula.<\/b> P(risky | flag) = P(flag | risky) × P(risky) ÷ P(flag) = 0.90 × 0.01 ÷ (0.90×0.01 + 0.05×0.99) = 0.009 ÷ 0.0585 = 0.154.", "<b>Step 5, accuracy trap.<\/b> Correct calls: 90 (risky found) + 9,405 (safe left alone) = 9,495 of 10,000, or 94.95% accurate, yet only 15% of flags are real. Accuracy hides the base rate.", "<b>Step 6, what it means for operations.<\/b> Reviewers will see about 6 false alarms for each real one. That may be acceptable for safety, but it sets staffing, and it is why we track precision@k and not accuracy. If prevalence were 10%, PPV would be 66.7%."], "hand": "<div class=\"tablewrap\"><table><tr><th><\/th><th>Flagged<\/th><th>Not flagged<\/th><th>Total<\/th><\/tr>\n<tr><td>Truly risky<\/td><td>90<\/td><td>10<\/td><td>100<\/td><\/tr>\n<tr><td>Safe<\/td><td>495<\/td><td>9,405<\/td><td>9,900<\/td><\/tr>\n<tr><th>Total<\/th><th>585<\/th><th>9,415<\/th><th>10,000<\/th><\/tr><\/table><\/div>\n<p>PPV = 90 ÷ 585 = 15.4%. NPV = 9,405 ÷ 9,415 = 99.9%.<\/p>", "code": "c8a", "pitfalls": ["Answering 90% (confusing P(flag | risky) with P(risky | flag)).", "Quoting accuracy for a rare event.", "Forgetting that prevalence differs by segment, so PPV differs too."], "follow": [["How do you reduce false alarms without missing more?", "Better features, a second-stage model on flagged tickets, or a calibrated threshold chosen by the cost ratio (case F4 on page 2)."], ["Prevalence doubles to 2%. PPV?", "0.9×0.02 = 0.018; 0.05×0.98 = 0.049; PPV = 0.018 ÷ 0.067 = 26.9%."], ["Two independent models both flag a ticket. PPV?", "Update the odds twice. Prior odds 1:99; each flag multiplies by 0.9/0.05 = 18. Posterior odds = 324:99, so PPV = 324 ÷ 423 = 76.6%."]], "lead": ["Plugs into the formula.", "Uses natural frequencies, explains the accuracy trap, links to review capacity and thresholds, and shows how PPV moves with prevalence."], "story": "Where did a model or rule with high accuracy turn out to have low precision? Write the case and what you changed.", "drills": [["Prevalence 5%, sensitivity 80%, false-positive rate 10%. PPV?", "0.8×0.05 = 0.04. 0.1×0.95 = 0.095. PPV = 0.04 ÷ 0.135 = 29.6%."], ["Why do natural frequencies help?", "They turn percentages into counts of people, which is easier to reason about."], ["If the false-positive rate drops to 1%, new PPV (prevalence 1%)?", "0.009 ÷ (0.009 + 0.0099) = 47.6%."]]}, {"id": "8B", "group": "Causal inference and Bayes", "title": "Bayesian A/B test: what is the chance B is better?", "pri": "P0", "round": "Technical and Hiring Manager", "time": "20 min", "prompt": "Using the test from case 3D, a stakeholder asks: \"What is the probability that the new search actually lowers the contact rate?\" How do you answer?", "tests": "Whether you can move from a p-value to a probability statement stakeholders want, with a Beta-Binomial update, a credible interval and expected loss, and explain the difference from frequentist inference.", "clarify": [["Prior belief?", "None strong. Use a flat Beta(1,1) prior, then discuss an informative one."], ["Data?", "Control 1,400 of 14,000; treatment 1,288 of 14,000."], ["Decision?", "Ship if the probability of improvement is high and expected loss is tiny."]], "gloss": [["Beta(a, b)", "A bell-like curve over a rate between 0 and 1. a−1 acts like past \"contacts\" and b−1 like past \"non-contacts\"."], ["Prior", "What we believed about the rate before this test."], ["Posterior", "What we believe after seeing the data. Prior + data combined."], ["Credible interval", "A range that contains the true rate with 95% probability, given the model and prior."], ["Expected loss", "The average amount we would lose by shipping if we are wrong, weighted by how likely each case is."]], "framework": ["<b>Choose a prior<\/b> (flat Beta(1,1) unless history says otherwise).", "<b>Update:<\/b> Beta(1 + contacts, 1 + non-contacts) for each arm.", "<b>Compare posteriors:<\/b> P(treatment &lt; control), interval for the difference.", "<b>Expected loss<\/b> and a decision threshold.", "<b>Contrast with p-values<\/b> in one plain sentence."], "steps": ["<b>Step 1, update.<\/b> Control: 1 + 1,400 = 1,401 and 1 + 12,600 = 12,601, so Beta(1401, 12601). Treatment: Beta(1289, 12713).", "<b>Step 2, posterior means.<\/b> Control: 1,401 ÷ 14,002 = 10.006%. Treatment: 1,289 ÷ 14,002 = 9.206%.", "<b>Step 3, the difference.<\/b> With this much data each posterior is close to a bell curve. The treatment minus control difference has mean about −0.80 points and standard deviation about 0.35 points (the same as the standard error in case 3D).", "<b>Step 4, probability.<\/b> P(difference &lt; 0) = Φ(0.80 ÷ 0.352) = Φ(2.27) = <b>98.8%<\/b>. Simulation gives 98.9%.", "<b>Step 5, interval.<\/b> 95% credible interval for the difference: about (−1.49, −0.11) points. Almost the same as the confidence interval, because the prior is flat and the data are large.", "<b>Step 6, expected loss.<\/b> If we ship and the truth is that treatment is worse, how much do we lose on average? About 0.0014 points. That is tiny, so shipping is low-regret.", "<b>Step 7, how to explain.<\/b> \"Given the data and a neutral starting belief, there is about a 99% chance the new search lowers the contact rate. The p-value says something different: how surprising the data would be if there were no effect.\" Bayesian answers depend on the prior; with small samples an informative prior from past tests can help, and you should show sensitivity to it."], "hand": "<div class=\"tablewrap\"><table><tr><th><\/th><th>Contacts<\/th><th>Non-contacts<\/th><th>Posterior Beta(a, b)<\/th><th>Mean<\/th><\/tr>\n<tr><td>Control<\/td><td>1,400<\/td><td>12,600<\/td><td>Beta(1401, 12601)<\/td><td>10.006%<\/td><\/tr>\n<tr><td>Treatment<\/td><td>1,288<\/td><td>12,712<\/td><td>Beta(1289, 12713)<\/td><td>9.206%<\/td><\/tr><\/table><\/div>\n<ol><li>Rule: a = 1 + contacts, b = 1 + non-contacts (flat prior adds 1 to each).<\/li>\n<li>Difference of means = 9.206% − 10.006% = −0.80 points.<\/li>\n<li>Wobble of each posterior is about √(p(1−p)÷n); combined wobble 0.352 points.<\/li>\n<li>z = 0.80 ÷ 0.352 = 2.27, so P(treatment lower) ≈ Φ(2.27) = 0.988.<\/li><\/ol>", "code": "c8b", "pitfalls": ["Saying the p-value is the probability the treatment works.", "Using an informative prior without showing sensitivity.", "Treating a high posterior probability as large effect size (the effect could be tiny).", "Peeking is less harmful in a Bayesian framework only if the stopping rule is declared and the decision uses expected loss."], "follow": [["Frequentist vs Bayesian: when does it matter?", "With big samples and flat priors they agree numerically. They differ in meaning, in small samples, and in how they handle early stopping and prior information."], ["How do you pick a prior?", "From historical tests of similar changes: fit a Beta to past contact rates, or a prior on the effect size centred near zero with typical spread."], ["Probability 95% that B is better. Ship?", "Not by itself. Also look at the effect size, the cost, and expected loss. 95% of a tiny gain may not matter."], ["Could the probability be 99% yet the p-value 0.06?", "Yes, if the prior is informative or the one-sided and two-sided framing differ. They answer different questions."]], "lead": ["Runs a Bayesian A/B and says \"98% chance of being better\".", "Chooses and defends a prior, reports interval and expected loss, ties them to a decision threshold, and explains the difference from p-values in plain words."], "story": "Have you explained probability of improvement to a non-technical stakeholder? Write what they asked, what you said and the decision that followed.", "drills": [["Prior Beta(1,1). Data: 30 successes, 70 failures. Posterior?", "Beta(31, 71). Mean = 31 ÷ 102 = 30.4%."], ["Why does the prior matter less with more data?", "The data counts (a, b) become much larger than the prior's 1 and 1."], ["Posterior difference mean −0.5 pts, SD 0.5 pts. P(difference &lt; 0)?", "Φ(1) = 84.1%."]]}, {"id": "5", "group": "Business cases and AI systems", "title": "Cut support cost without hurting guests and hosts", "pri": "P1", "round": "Business Acumen", "time": "25 min", "prompt": "Leadership wants to reduce support cost by 10% without hurting guest and host experience. Where do you start, and how do you decide between self-service deflection and fixing the root causes of repeat contacts?", "tests": "Business judgment: framing, quantification with explicit assumptions, trade-offs, sensitivity analysis and a clear recommendation. A Lead sizes options in dollars and says what would change the decision.", "clarify": [["What is the baseline volume and cost per contact?", "500,000 contacts per month at $4.00 each, so $2.0M per month. Illustrative."], ["What is the repeat-contact rate?", "18% (90,000 repeat contacts per month)."], ["What constraints?", "CSAT and safety response time must not fall."], ["Time horizon?", "Next two quarters."]], "framework": ["<b>Objective:<\/b> cost down 10% with guardrails.", "<b>Unit and baseline:<\/b> cost per resolved issue, not per contact.", "<b>List options<\/b> and size each: reduce repeats, deflect to self-service, improve routing.", "<b>Net the savings<\/b> for leakage (people who come back).", "<b>Sensitivity:<\/b> vary the uncertain assumptions.", "<b>Recommend,<\/b> sequence, and state kill criteria."], "steps": ["<b>Step 1, the target in dollars.<\/b> 10% of $2.0M = $200,000 per month.", "<b>Step 2, Option A: fewer repeats.<\/b> A fix improves first-contact resolution so repeats fall 15% (from 18% to 15.3%). Repeats avoided = 90,000 × 0.15 = 13,500 per month. Savings = 13,500 × $4 = <b>$54,000 per month<\/b>.", "<b>Step 3, Option B: self-service deflection.<\/b> Deflect 5% of contacts = 25,000. But 20% come back through an agent, so 80% are truly saved = 20,000. Savings = 20,000 × $4 = $80,000, minus bot cost 25,000 × $0.50 = $12,500, so <b>$67,500 per month<\/b>.", "<b>Step 4, sensitivity.<\/b> If 40% come back instead of 20%: 15,000 saved × $4 = $60,000 − $12,500 = $47,500. The deflection option breaks even only if 87.5% come back (25,000 × (1 − r) × $4 = $12,500 gives r = 0.875). So option B is robust to leakage but weaker on satisfaction risk.", "<b>Step 5, the combined view.<\/b> A + B = $121,500, which is 6% of baseline, short of the 10% target. Say so. Add routing improvements or reduce handling time for the rest, or negotiate the target.", "<b>Step 6, guardrails.<\/b> CSAT and escalations. Track a \"regret\" metric: share of deflected users who contact again within 7 days, and a safety-case misroute rate.", "<b>Step 7, recommendation.<\/b> Do B first (faster, measurable with an A/B test), run A as a root-cause project with a quantified list of repeat drivers, and review in 6 weeks with an explicit stop rule."], "hand": "<div class=\"tablewrap\"><table><tr><th>Option<\/th><th>Key assumption<\/th><th>Monthly savings<\/th><\/tr>\n<tr><td>A. Cut repeats 15%<\/td><td>90,000 repeats, $4 each<\/td><td>13,500 × $4 = $54,000<\/td><\/tr>\n<tr><td>B. Deflect 5%, 20% return<\/td><td>25,000 deflected, $0.50 bot cost<\/td><td>20,000×$4 − $12,500 = $67,500<\/td><\/tr>\n<tr><td>B if 40% return<\/td><td>15,000 saved<\/td><td>$60,000 − $12,500 = $47,500<\/td><\/tr>\n<tr><td>A + B<\/td><td>ignores overlap<\/td><td>$121,500 (6.1% of baseline)<\/td><\/tr><\/table><\/div>\n<p>Overlap: some repeat contacts might also be deflected, so the combined total is an upper bound.<\/p>", "pitfalls": ["Counting deflected contacts as fully saved.", "Ignoring the cost of the bot itself.", "Quoting one number with no sensitivity.", "Optimizing contact volume and ignoring satisfaction or safety.", "Not saying the target is not met."], "follow": [["How would you validate the 15% repeat reduction?", "Pilot with a holdout, or use DiD in a staggered rollout (case 2)."], ["What if CSAT falls 1 point in the deflection option?", "Convert to dollars with the estimated retention or rebooking effect of CSAT, or restrict the flow to segments where CSAT held."], ["Which would you do first and why?", "B, because it can be tested in 2 to 3 weeks with a clean A/B design, while A needs root-cause work first."], ["What if the bot cost is $2 per session?", "Net B = $80,000 − $50,000 = $30,000. Option A becomes the better first move."]], "lead": ["Picks the option with the largest savings.", "Normalizes to cost per resolved issue, nets leakage and bot cost, runs sensitivity, admits the shortfall against the target, sequences the work and sets guardrails and stop rules."], "story": "Tell a story where you quantified the value of an analytics recommendation. Use your real numbers; if you do not have them, describe the method and what you would measure.", "drills": [["Baseline 400,000 contacts at $5. Deflect 4%, 25% return, bot $0.40. Savings?", "Deflected 16,000. Saved 12,000 × $5 = $60,000. Bot cost 16,000 × $0.40 = $6,400. Net $53,600."], ["Break-even return rate formula?", "Deflected × (1 − r) × cost per contact = deflected × bot cost, so r = 1 − bot cost ÷ cost per contact."], ["Why cost per resolved issue and not per contact?", "Repeat contacts about one issue are one issue; per-contact cost can fall while cost per issue rises."]]}, {"id": "6", "group": "Business cases and AI systems", "title": "Design an AI analytics assistant (natural language to SQL)", "pri": "P1", "round": "Hiring Manager", "time": "30 min", "prompt": "Design an AI assistant that answers business questions about support using approved datasets and gives evidence-backed recommendations. How do you make it safe and trustworthy for production?", "tests": "AI-first analytics judgment: not just calling an LLM, but semantic layer, validation, permissions, evaluation and monitoring. This is explicitly in the job description.", "clarify": [["Who uses it?", "Product managers and operations leads, not analysts."], ["What data?", "Approved tables in Presto/Trino with a documented semantic layer of metrics."], ["What can it do?", "Answer questions, produce charts and draft summaries. No write actions."], ["What matters most?", "Correct numbers, then privacy, then speed."]], "framework": ["<b>1. Interpret the request:<\/b> classify the intent and extract metric, filters, time range.", "<b>2. Semantic layer:<\/b> governed metric definitions.", "<b>3. Retrieve<\/b> schema and metric metadata.", "<b>4. Generate and validate SQL.<\/b>", "<b>5. Enforce permissions.<\/b>", "<b>6. Execute in a sandbox.<\/b>", "<b>7. Verify results.<\/b>", "<b>8. Statistical and causal safeguards.<\/b>", "<b>9. Explain with evidence.<\/b>", "<b>10. Human approval for consequential actions.<\/b>", "<b>11. Log, monitor, evaluate.<\/b>"], "steps": ["<b>1 and 2, interpret and use a semantic layer.<\/b> Map \"contact rate\" to one governed definition (contacts per 100 trips, with its denominator) instead of letting the model invent SQL. Ask a clarifying question when the metric or time range is ambiguous.", "<b>3, retrieve.<\/b> Pull only the relevant tables, columns, descriptions and example queries (retrieval-augmented generation). Smaller context means fewer wrong joins.", "<b>4, generate and validate SQL.<\/b> Parse the query. Allow only SELECT, only approved tables, add a row limit and a partition filter, and reject anything else. The Python tab has a runnable version.", "<b>5, permissions.<\/b> Run as the user, not as a service account with full access. Row- and column-level rules (no personal data) are enforced by the database, not by the prompt.", "<b>6 and 7, execute and verify.<\/b> Run in a read-only, resource-limited environment. Check results: row counts reasonable, totals reconcile with the certified dashboard, no null explosion, time zones as expected.", "<b>8, statistical safeguards.<\/b> The assistant must not claim causation from correlation. Rules: report intervals, warn for small samples, label observational findings as associations, and send causal questions to a template (A/B or DiD) with an analyst review.", "<b>9, explain with evidence.<\/b> Show the SQL, the metric definition, the data freshness and the numbers behind each statement. Treat ticket text as untrusted: it can contain instructions (prompt injection), so it is data, never commands.", "<b>10, humans in the loop.<\/b> Anything consequential (staffing changes, policy recommendations, customer communications) requires approval.", "<b>11, evaluation and monitoring.<\/b> Build a golden set of 200 real questions with verified SQL and answers. Track execution accuracy, metric correctness, refusal rate on out-of-scope questions, latency, cost per query, thumbs-down rate and drift after schema changes.", "<b>Why a demo is not enough.<\/b> A demo works on questions you chose. Production meets ambiguous wording, schema changes, adversarial text, people who trust wrong numbers, cost spikes and audits. It needs tests, permissions, monitoring and an owner."], "hand": "<div class=\"tablewrap\"><table><tr><th>Layer<\/th><th>Control<\/th><th>Failure it prevents<\/th><\/tr>\n<tr><td>Semantic layer<\/td><td>One definition per metric<\/td><td>Different numbers in different answers<\/td><\/tr>\n<tr><td>SQL validator<\/td><td>SELECT only, allowlisted tables, limit<\/td><td>Destructive or runaway queries<\/td><\/tr>\n<tr><td>Permissions<\/td><td>Run as user; row and column rules<\/td><td>Data leaks<\/td><\/tr>\n<tr><td>Result checks<\/td><td>Reconcile with certified metrics<\/td><td>Plausible but wrong numbers<\/td><\/tr>\n<tr><td>Stats guardrails<\/td><td>Intervals; no causal claims from correlation<\/td><td>False insights<\/td><\/tr>\n<tr><td>Prompt-injection defence<\/td><td>Ticket text treated as data<\/td><td>Hijacked assistant<\/td><\/tr>\n<tr><td>Evaluation<\/td><td>Golden set run on every change<\/td><td>Silent regressions<\/td><\/tr><\/table><\/div>\n<p><b>Adoption metric:<\/b> weekly active stakeholders, share of questions answered without analyst help, and analyst hours saved, measured against a baseline before launch.<\/p>", "code": "c6", "codeNote": "Needs the sqlglot package. This is a minimal validator; production validators also check column permissions and query cost.", "pitfalls": ["Letting the model write SQL against raw tables with no semantic layer.", "Enforcing permissions in the prompt instead of in the database.", "No evaluation set, so quality is judged by anecdotes.", "Letting the assistant present correlations as causes.", "Ignoring cost and latency until the bill arrives."], "follow": [["How do you measure whether it works?", "Execution accuracy and metric correctness on a golden set, plus adoption and time saved in production."], ["A ticket contains the text \"ignore previous instructions\". What happens?", "It is passed as quoted data; tool permissions are fixed outside the prompt; outputs are checked. The injected text cannot expand access."], ["How do you keep it correct when a table schema changes?", "Data contracts with change notices, automated golden-set runs on each schema change, and an alert when validation failures spike."], ["Build or buy?", "Buy or extend commodity pieces (LLM, orchestration); build the semantic layer and evaluation, since these encode your business definitions."]], "lead": ["Describes calling an LLM to write SQL.", "Designs the full chain with controls at each step, defines the evaluation set and success metrics, and explains the production gap."], "story": "You have built multi-agent pipelines and a chatbot. Write which controls you added (validation, evaluation, permissions), what failed first, and how you measured quality.", "drills": [["Name three checks on a generated SQL query.", "SELECT only; allowlisted tables; row limit and partition filter. Also column permissions."], ["Why run queries as the user?", "The database enforces the user's real permissions, so a clever prompt cannot reach data they should not see."], ["What goes into a golden set?", "Real questions, verified SQL, expected answers, and out-of-scope questions that must be refused."]]}, {"id": "F1", "group": "Forecasting", "title": "Forecast ticket demand by hour and region for staffing", "pri": "P0", "round": "Technical", "time": "35 min", "prompt": "Support needs to staff agents for next week. Forecast ticket volume by hour and region, and tell me how many agents to schedule.", "tests": "End-to-end forecasting judgment: a baseline first, the right features for the horizon, a time-ordered evaluation, handling of peaks and hierarchy, and the step most analysts skip, turning a forecast into a staffing number. It echoes demand planning work you have done in retail.", "clarify": [["Forecast horizon and refresh?", "Next 7 days, hourly, refreshed daily."], ["What granularity do planners use?", "Region (4 regions) by hour; global total must equal the sum of regions."], ["What history is there?", "2 years of hourly contacts, with booking and check-in counts and a holiday calendar."], ["What drives volume?", "Check-ins and cancellations (known ahead through bookings), weekday and hour patterns, holidays, incidents."], ["What is the cost of being wrong?", "Being short breaches SLA and hurts guests; being long wastes agent hours."]], "gloss": [["Seasonal naive", "Predict this hour as the same hour last week. A strong, cheap baseline."], ["Lag feature", "A past value used as an input, such as volume 168 hours (one week) ago."], ["AHT", "Average handling time per contact, in minutes."], ["Occupancy", "Share of an agent's logged-in time spent on contacts. Nobody can be at 100%."], ["Shrinkage", "Share of scheduled time lost to breaks, leave and training."], ["P90", "The value that demand stays below 90% of the time."], ["WAPE", "Total absolute miss ÷ total actual. A volume-weighted percentage error."]], "framework": ["<b>Baseline first:<\/b> seasonal naive (same hour last week).", "<b>Understand structure:<\/b> daily and weekly cycles, holidays, trend, level shifts.", "<b>Features available at forecast time:<\/b> calendar, lags of 7 days or more, scheduled check-ins, holiday flags.", "<b>Models:<\/b> ETS or SARIMA for few series; gradient boosting across many region-hours; compare on the same split.", "<b>Evaluate with a rolling-origin backtest<\/b> and WAPE per fold; compare with the baseline.", "<b>Reconcile<\/b> regions to the global total, give intervals (P10, P50, P90).", "<b>Convert to staffing<\/b> with AHT, occupancy and shrinkage; staff to a chosen percentile."], "steps": ["<b>Step 1, baseline.<\/b> Forecast Monday 3 pm as last Monday 3 pm. If a fancy model cannot beat this, it is not worth running. In the code below the baseline has a WAPE of about 5.6% on a held-out fortnight.", "<b>Step 2, structure.<\/b> Plot by hour and weekday. Support volume usually has an hourly cycle (daytime peaks), a weekly cycle, and spikes on travel peaks and holidays. Spikes are the expensive part: they need explicit features (holiday flags, days to a major event) instead of being averaged away.", "<b>Step 3, features.<\/b> A 7-day-ahead forecast cannot use yesterday's volume, so use lags of 168 hours or more, the rolling average of the last week, hour, weekday, holiday, and leading indicators known ahead of time such as check-ins scheduled for the coming days. Using a 1-hour lag in a 7-day forecast leaks the future during testing and fails in production.", "<b>Step 4, models.<\/b> For a few smooth series, ETS or SARIMA. With many regions and hours and extra drivers, LightGBM with lag and calendar features is flexible and fast. Train on the past, test on the final 14 days. In the code, LightGBM gets about 4.8% WAPE vs 5.6% for the baseline.", "<b>Step 5, intervals.<\/b> Staffing needs a range, not a point. Use quantile regression (P10, P50, P90) or bootstrap residuals. Check coverage: P10 to P90 should contain about 80% of actuals.", "<b>Step 6, hierarchy.<\/b> Regions should add up to the global forecast. Forecast at the level with the best signal and reconcile (top-down proportions, bottom-up sums, or optimal reconciliation).", "<b>Step 7, staffing.<\/b> Work per hour = volume × AHT ÷ 60. Divide by occupancy, then by (1 − shrinkage). At 600 contacts per hour, AHT 12 minutes: work = 120 agent-hours, so 120 agents busy; at 80% occupancy 150 on the floor; at 30% shrinkage <b>215 scheduled<\/b>. For the P90 volume of 700: 140 → 175 → <b>250<\/b> scheduled.", "<b>Step 8, which percentile to staff to.<\/b> Not the mean. See F5: staff to the percentile set by the cost of being short vs idle."], "hand": "<p>Use this tiny example to see seasonal naive by hand. Daily volumes for two weeks (illustrative):<\/p>\n<div class=\"tablewrap\"><table><tr><th><\/th><th>Mon<\/th><th>Tue<\/th><th>Wed<\/th><th>Thu<\/th><\/tr><tr><td>Week 1 (actual)<\/td><td>100<\/td><td>118<\/td><td>92<\/td><td>108<\/td><\/tr><tr><td>Week 2 (actual)<\/td><td>104<\/td><td>124<\/td><td>90<\/td><td>112<\/td><\/tr><tr><td>Week 2 forecast (= week 1)<\/td><td>100<\/td><td>118<\/td><td>92<\/td><td>108<\/td><\/tr><tr><td>Error<\/td><td>−4<\/td><td>−6<\/td><td>+2<\/td><td>−4<\/td><\/tr><\/table><\/div>\n<ol><li>Absolute errors: 4, 6, 2, 4, total 16.<\/li><li>Actual total = 104 + 124 + 90 + 112 = 430.<\/li><li>WAPE = 16 ÷ 430 = 3.7%.<\/li><\/ol>\n<p><b>Staffing by hand:<\/b><\/p>\n<ol><li>600 contacts × 12 minutes ÷ 60 = 120 agent-hours of work in the hour.<\/li><li>÷ 0.80 occupancy = 150 agents logged in.<\/li><li>÷ (1 − 0.30) = 214.3, so schedule <b>215<\/b>.<\/li><li>For P90 = 700: 700×12÷60 = 140; ÷0.8 = 175; ÷0.7 = 250.<\/li><\/ol>", "code": "f1", "codeNote": "Runs end to end on synthetic data. Install lightgbm first (pip install lightgbm). Your WAPE values may differ slightly by library version.", "pitfalls": ["Starting with a complex model before checking the seasonal naive baseline.", "Random train/test splits, which leak the future.", "Lag features that would not exist at forecast time.", "Reporting only a point forecast.", "Ignoring holidays and event days, which are exactly when staffing matters most.", "Stopping at volume and not translating to agents."], "follow": [["A new region has only 4 weeks of data. What do you do?", "Borrow strength: forecast the share of a similar region or the global pattern and scale to the new region's level; use hierarchical models or a global model with region features."], ["Why LightGBM and not an LSTM?", "Tabular features, modest data, speed, and interpretability. A deep model rarely beats tuned gradient boosting here, and costs more to maintain."], ["How do you handle Christmas and other once-a-year peaks?", "Add event features and use last year's peak ratio; for new events use analogues; widen intervals; plan manual overrides with operations."], ["The forecast is unbiased but staffing is always short at peaks. Why?", "Average accuracy hides peak errors. Evaluate error in the top-decile hours, use quantile forecasts, and staff to a percentile above the median."]], "lead": ["Fits a model and reports MAPE.", "Builds the baseline, chooses features by what exists at forecast time, evaluates by rolling origin, gives intervals, reconciles the hierarchy and converts into agents with a stated percentile and cost trade-off."], "story": "At Target you worked on demand planning and forecasting. Write the series you forecast, the horizon, the baseline, the accuracy you reached, and what decision the forecast fed. Use only numbers you actually have.", "drills": [["450 contacts per hour, AHT 10 min, occupancy 75%, shrinkage 25%. Agents to schedule?", "Work = 450×10÷60 = 75. ÷0.75 = 100. ÷0.75 = 133.3, so 134."], ["Actual 80, 90, 100 and forecast 85, 85, 110. WAPE?", "Errors 5, 5, 10 = 20. Actual total 270. WAPE = 20 ÷ 270 = 7.4%."], ["Why must a 7-day-ahead model avoid a 24-hour lag?", "That value will not exist when the forecast is made; it leaks the future in testing."]]}, {"id": "F2", "group": "Forecasting", "title": "The forecast breaks: outage, policy change or pipeline failure", "pri": "P1", "round": "Technical and Business Acumen", "time": "25 min", "prompt": "Yesterday afternoon the volume was 2.5 times higher than the forecast. Is it a real incident, a policy change, or a data problem? And what do you do to the forecast and to your alerting?", "tests": "Anomaly detection with false-positive control, change-point thinking, and the habit of ruling out data issues before declaring an incident.", "clarify": [["Which series and level?", "Global contacts per hour, with region and case-type breakdowns."], ["What alerting exists?", "None for volume; a dashboard only."], ["What changed recently?", "Unknown. A cancellation policy was due this month."], ["Cost of a false alarm vs a missed incident?", "A missed incident costs far more; a false alarm costs on-call time."]], "gloss": [["MAD", "Median absolute deviation: the median distance of values from their median. A spread measure that outliers cannot distort."], ["Robust z-score", "(value − median) ÷ (1.4826 × MAD). Like a normal z-score but not fooled by past spikes."], ["Change point", "A time when the level or pattern of a series shifts for good."], ["False positive", "An alert for something that is not a real problem."]], "framework": ["<b>Rule out data issues:<\/b> freshness, duplicates, partition gaps, an independent source.", "<b>Define the expected value<\/b> from a seasonal baseline (same hour of week, previous weeks).", "<b>Score the surprise<\/b> with a robust z-score and require persistence.", "<b>Localize:<\/b> which case type, region, channel, language contributes most to the gap.", "<b>Explain:<\/b> link to outage logs, launches, policy dates.", "<b>Act on the forecast:<\/b> exclude or flag the anomaly in training; add an event feature if it will recur.", "<b>Tune the alert<\/b> for false positives."], "steps": ["<b>Step 1, data first.<\/b> Is the raw table fresh? Are there duplicate case IDs or a replayed partition? Does an independent system (telephony or CRM) show the same jump? If only one system shows it, suspect the pipeline.", "<b>Step 2, baseline.<\/b> Compare with the median of the same hour of week for the last 3 weeks. Use the median and MAD, not the mean and standard deviation, so that past spikes do not distort the baseline.", "<b>Step 3, worked example.<\/b> Last three same-hour values: 595, 600, 610. Median = 600. Deviations: 5, 0, 10; MAD = 5 (median of 0, 5, 10). That is too small to trust, so use a floor of 5% of the median = 30. Robust spread = max(1.4826×5, 30) = 30. Today's value of 1,500 is 2.5 times 600, so z = (1,500 − 600) ÷ 30 = 30. An extreme surprise.", "<b>Step 4, localize.<\/b> Break the excess (900 contacts) by case type and region. If 80% is one case type in one region, think policy change or regional incident; if spread evenly, think logging duplication or a global outage.", "<b>Step 5, persistence and false positives.<\/b> Alert only if z &gt; 4 for 2 consecutive hours. Keep a false-positive budget (for example one false page per week). Evaluate alerts on past data: precision (how many alerts were real), recall (how many real incidents were caught) and time to detect.", "<b>Step 6, the forecast.<\/b> Flag the spike in the training data so it does not teach the model that this hour is always high. If it was a policy change that persists, treat it as a level shift (change point): retrain with a regime feature. If a one-off outage, drop or down-weight those hours.", "<b>Step 7, control charts.<\/b> A control chart plots the metric with limits from stable history; points outside limits, or eight in a row on one side of the centre line, signal a shift. EWMA charts detect small persistent drifts that single-point thresholds miss."], "hand": "<div class=\"tablewrap\"><table><tr><th>Item<\/th><th>Value<\/th><\/tr>\n<tr><td>Same hour, last 3 weeks<\/td><td>595, 600, 610<\/td><\/tr>\n<tr><td>Median (baseline)<\/td><td>600<\/td><\/tr>\n<tr><td>Absolute deviations from median<\/td><td>5, 0, 10<\/td><\/tr>\n<tr><td>MAD<\/td><td>5<\/td><\/tr>\n<tr><td>Spread (floor of 5% of median = 30)<\/td><td>max(1.4826 × 5, 30) = 30<\/td><\/tr>\n<tr><td>Today<\/td><td>1,500<\/td><\/tr>\n<tr><td>Robust z<\/td><td>(1,500 − 600) ÷ 30 = 30<\/td><\/tr><\/table><\/div>\n<p>The floor stops a tiny MAD from making ordinary wiggles look extreme.<\/p>", "code": "f2", "pitfalls": ["Declaring an incident before checking the data.", "Using mean and standard deviation, which one past spike can ruin.", "Alerting on single points, which creates alert fatigue.", "Leaving the spike in the training data.", "Not evaluating the alerting rule itself."], "follow": [["Alerts fire 15 times a week and most are noise. What do you change?", "Raise the threshold, require persistence, add seasonality-aware baselines, group related alerts, and measure precision on past incidents."], ["How do you distinguish a one-off from a level shift?", "Check if the new level persists after the cause ends and compare against a change-point test; ask operations what changed."], ["Which anomaly detector would you use for 500 series?", "A simple robust baseline per series first. Use model-based residual scoring if baselines are weak, and tune by precision and recall on labelled incidents."], ["What do you tell the on-call manager in the first 10 minutes?", "Magnitude, where it is concentrated, whether data checks pass, and what you will check next. Do not guess causes."]], "lead": ["Sets a threshold on the metric and alerts.", "Checks the pipeline, builds a seasonal robust baseline, localizes the excess, requires persistence, manages the false-positive budget, and decides how the forecast should treat the event."], "story": "Write a time you found that a metric spike was a data problem, or a real incident. How did you decide, and how fast?", "drills": [["Baseline values 200, 210, 190. Median and MAD?", "Median 200. Deviations 0, 10, 10. MAD = 10."], ["Why persistence rules?", "A single high hour can be noise; two or three in a row is much less likely by chance."], ["What is precision of an alert rule?", "Real incidents among alerts ÷ all alerts."]]}, {"id": "F3", "group": "Features and evaluation", "title": "Choose features for a ticket-escalation model", "pri": "P0", "round": "Technical", "time": "30 min", "prompt": "We want a model that predicts at ticket creation whether a case will escalate. You have 200 candidate features. How do you decide which to use?", "tests": "Feature selection that respects time and deployment: leakage, redundancy, stability and business meaning, with a sensible mix of filter, embedded and permutation methods. Interviewers listen for leakage awareness first.", "clarify": [["When is the prediction made?", "At ticket creation, before any agent action."], ["What is the target and base rate?", "Escalated within 7 days; about 5% positive."], ["How will it be used?", "Route likely escalations to senior agents; prioritize by risk."], ["Do we need explanations?", "Yes. Agents and managers need reasons."]], "gloss": [["Leakage", "A feature that contains information from after the moment of prediction, so the model looks great in testing and fails live."], ["VIF", "Variance inflation factor = 1 ÷ (1 − R²), where R² says how well other features predict this one. Above 5 to 10 means near-duplicate."], ["L1 (Lasso)", "A penalty that pushes weak features' weights to exactly zero, selecting features while fitting."], ["Permutation importance", "Shuffle one feature in the test set; the drop in score shows how much the model relied on it."], ["AUC", "Chance the model scores a random escalation above a random non-escalation. 0.5 is guessing."], ["Stability", "A selected feature should be picked in most time-ordered folds, not just one."]], "framework": ["<b>Availability audit:<\/b> remove anything not known at ticket creation.", "<b>Sanity filters:<\/b> constant or mostly missing features, near-duplicates (VIF, correlation).", "<b>Univariate screen<\/b> (mutual information, target rate by bin) for ideas, not decisions.", "<b>Embedded selection<\/b> (L1 or tree-based) on time-ordered folds.", "<b>Permutation importance<\/b> on a held-out later period.", "<b>Stability and cost:<\/b> keep features picked consistently and cheap to compute reliably.", "<b>Check meaning<\/b> with domain owners; confirm with a final out-of-time test."], "steps": ["<b>Step 1, leakage audit.<\/b> Read feature definitions with an engineer. \"Number of agent replies\" exists only after handling starts; \"resolution code\" exists only after closing. Remove them. In the synthetic example, adding the agent-replies feature would push AUC unrealistically high; the real model should not see it.", "<b>Step 2, redundancy.<\/b> Two near-duplicate features (message length in characters and a 1.01× copy) have VIF around 1,479. R² = 0.9 gives VIF = 1 ÷ 0.1 = 10. Keep one. Redundant features dilute importance scores and make explanations unstable.", "<b>Step 3, embedded selection with time folds.<\/b> Standardize features, fit an L1 logistic regression on 4 expanding time windows, and count how often each feature survives. Features chosen in most folds are stable. Features chosen once are probably noise.", "<b>Step 4, permutation importance.<\/b> Train a gradient boosting model on earlier data, shuffle each feature in a later test period and measure the AUC drop. Unlike tree \"gain\" importance, it measures use on unseen data and is less biased toward high-cardinality features.", "<b>Step 5, SHAP for explanations.<\/b> After selection, use SHAP values to explain individual predictions to agents (\"flagged because: 2 prior contacts in 30 days, check-in in 2 days\").", "<b>Step 6, business filter.<\/b> Drop features that are expensive, fragile (a vendor feed that breaks) or sensitive (protected attributes or close proxies). A smaller stable model usually beats a bigger fragile one.", "<b>Step 7, time-aware test.<\/b> Final check on the most recent period, never touched in selection. If selection used the whole data set, the test result is optimistic (selection leakage)."], "hand": "<ol><li><b>VIF by hand.<\/b> If another feature predicts this one with R² = 0.90, VIF = 1 ÷ (1 − 0.90) = 10. At R² = 0.99, VIF = 100.<\/li>\n<li><b>Permutation importance by hand.<\/b> Baseline test AUC = 0.80. Shuffle days-to-check-in: AUC = 0.74. Importance = 0.80 − 0.74 = 0.06. Shuffle booking value: AUC = 0.80. Importance = 0.00, so the model ignores it.<\/li>\n<li><b>Stability by hand (illustrative counts).<\/b> Over 4 folds: prior contacts selected 4 times, days to check-in 4, host 3, booking value 1. Keep the first three; question the last.<\/li>\n<li><b>Mutual information idea.<\/b> If the escalation rate is 5% overall but 15% among tickets with 2 or more prior contacts, that feature carries information. If it is 5% in every bin, it carries none.<\/li><\/ol>", "code": "f3", "codeNote": "Synthetic data with a deliberately leaky feature and a duplicated feature. Note which features survive across folds; exact numbers vary with the random seed.", "pitfalls": ["Selecting features on the whole data set, then testing on part of it.", "Skipping the availability audit and celebrating a 0.98 AUC.", "Using impurity (gain) importance with high-cardinality features.", "Dropping a feature because of correlation without checking which one is cheaper and more stable.", "Treating importance as causation: \"the model uses X\" is not \"X causes escalation\"."], "follow": [["AUC is 0.97 on first run. What do you suspect?", "Leakage. Audit feature timestamps, check for features derived from the outcome, and re-run with an out-of-time split."], ["L1 vs tree importance?", "L1 gives sparse, interpretable selection for linear models; tree importance and SHAP handle interactions but can favour high-cardinality or correlated features. Use permutation importance on held-out data."], ["Features drift over time. What do you do?", "Monitor feature distributions (population stability index), compare importance by period, and retrain on a schedule or when drift thresholds trigger."], ["Is selecting fewer features always better?", "Fewer features reduce cost and drift risk, but dropping real signal hurts accuracy. Use out-of-time performance as the arbiter."]], "lead": ["Runs a feature selection library and keeps the top 20.", "Starts with availability and leakage, handles redundancy, selects on time-ordered folds, checks stability and cost, explains predictions, and validates out of time."], "story": "Have you built a model where a feature turned out to leak, or where selection changed the result? Write the feature, how you found the problem, and what changed.", "drills": [["VIF is 50. What is R² of that feature on the others?", "1 − 1/50 = 0.98."], ["A feature is available only after the ticket closes. Keep it?", "No. It is leakage for a prediction made at creation."], ["Baseline AUC 0.78. After shuffling feature A, AUC is 0.78. What does that say?", "The model does not rely on A (or it duplicates another feature that carries the signal)."]]}, {"id": "F4", "group": "Features and evaluation", "title": "Evaluate the model: is it good enough to ship?", "pri": "P0", "round": "Technical", "time": "35 min", "prompt": "You have a ticket-volume forecast and an escalation classifier. How do you evaluate each, and how do you decide whether either is good enough to ship?", "tests": "Choosing metrics that match the decision, building an honest backtest, understanding error by segment and by horizon, and handling imbalanced classification with thresholds based on cost. This is the highest-value skill in the Technical round.", "clarify": [["What decision does each model feed?", "Forecast: weekly staffing. Classifier: routing to senior agents, who can review about 8% of tickets."], ["What is the baseline today?", "Forecast: last week's same hour. Classifier: a rule on the number of prior contacts."], ["What do errors cost?", "Being short on staff is more costly than idle time. A missed escalation costs about $20; a needless review costs about $2."], ["How much history?", "Two years, weekly seasonality."]], "gloss": [["MAE", "Average size of the miss, same units as the data."], ["RMSE", "Like MAE but squares errors first, so big misses weigh more."], ["MAPE", "Average of |error| ÷ actual. Breaks when actual is 0 and over-penalizes low-volume points."], ["WAPE", "Total |error| ÷ total actual. Weights busy periods more."], ["MASE", "Your MAE ÷ the MAE of the naive method on the training data. Below 1 beats naive."], ["Bias", "Sum of (forecast − actual) ÷ sum of actual. Positive means over-forecasting."], ["Pinball loss", "Error measure for quantile forecasts; penalizes under-prediction more at high quantiles."], ["Precision, recall", "Precision: of those flagged, the share truly positive. Recall: of the true positives, the share flagged."], ["Lift", "Precision ÷ base rate. 7.5× means flagged tickets escalate 7.5 times as often as average."]], "framework": ["<b>Match metric to decision.<\/b> Staffing cares about volume-weighted and peak error; routing cares about precision at the review capacity.", "<b>Honest validation:<\/b> rolling-origin backtest for time series; out-of-time test for the classifier.", "<b>Compare to a baseline<\/b> that is already in use.", "<b>Break errors down<\/b> by horizon, region, hour, peak vs off-peak, and segment.", "<b>Check calibration and coverage<\/b> (do 80% intervals contain 80% of actuals; do predicted probabilities match rates).", "<b>Choose the threshold from costs.<\/b>", "<b>Define ship criteria and monitoring<\/b> in advance."], "steps": ["<b>Step 1, forecast metrics by hand.<\/b> Actual 100, 120, 90, 110; forecast 95, 130, 100, 100. Errors (forecast − actual): −5, +10, +10, −10. MAE = (5+10+10+10) ÷ 4 = 8.75. RMSE = √((25+100+100+100) ÷ 4) = √81.25 = 9.01. WAPE = 35 ÷ 420 = 8.33%. Bias = (425 − 420) ÷ 420 = +1.19%. MAPE = (5% + 8.33% + 11.11% + 9.09%) ÷ 4 = 8.38%.", "<b>Step 2, MASE.<\/b> Training history 90, 100, 95, 105, 100. The naive \"same as previous\" method misses by 10, 5, 10, 5, average 7.5. MASE = 8.75 ÷ 7.5 = <b>1.17<\/b>. Above 1: this forecast is worse than naive. A WAPE of 8% sounds fine until you see the baseline does better.", "<b>Step 3, why not MAPE for support.<\/b> Low-volume hours (3 am, one small language queue) make MAPE explode and dominate the average, while staffing impact comes from busy hours. Use WAPE or MAE for decisions and report MAPE only if volumes are always large.", "<b>Step 4, honest backtest.<\/b> Rolling origin: train on weeks 1 to 20, test on 21; train on 1 to 24, test on 25; and so on. Look at the spread of WAPE across folds. Random k-fold lets the model see days around each test day, so scores look too good.", "<b>Step 5, quantiles.<\/b> For a P80 forecast, check that 80% of actuals fall below it (coverage). Pinball loss for q = 0.8: if the actual is above the forecast, the penalty is 0.8 × miss; if below, 0.2 × miss. This rewards the right amount of safety stock.", "<b>Step 6, classifier on imbalanced data.<\/b> 10,000 tickets, 500 escalate (5%). The model flags 800; 300 of them truly escalate. Precision = 300 ÷ 800 = 37.5%. Recall = 300 ÷ 500 = 60%. Lift = 37.5% ÷ 5% = 7.5×. Accuracy would be (300 + 9,000) ÷ 10,000 = 93%, nearly the same as predicting \"never escalates\" (95%), which is why accuracy is useless here. Use precision-recall AUC and precision at the review capacity.", "<b>Step 7, threshold from cost.<\/b> Cost of a false positive (needless review) $2; cost of a false negative (missed escalation) $20. Flag a ticket if P(escalate) × $20 &gt; (1 − P) × $2, i.e. if P &gt; 2 ÷ 22 = <b>9.1%<\/b>. Then check this threshold fits the 8% review capacity; if not, raise it to fit capacity and say what is lost.", "<b>Step 8, calibration.<\/b> If the model says 20% and 20% of such tickets escalate, it is calibrated. The cost-based threshold only works with calibrated probabilities (use isotonic or Platt calibration if not).", "<b>Step 9, ship criteria.<\/b> For example: WAPE at least 15% better than the baseline in at least 80% of backtest folds; no region with bias beyond ±3%; P90 coverage between 85% and 95%. Define them before looking at the test set."], "hand": "<div class=\"tablewrap\"><table><tr><th>Metric<\/th><th>Calculation<\/th><th>Result<\/th><\/tr>\n<tr><td>MAE<\/td><td>(5+10+10+10) ÷ 4<\/td><td>8.75<\/td><\/tr>\n<tr><td>RMSE<\/td><td>√((25+100+100+100) ÷ 4)<\/td><td>9.01<\/td><\/tr>\n<tr><td>WAPE<\/td><td>35 ÷ 420<\/td><td>8.33%<\/td><\/tr>\n<tr><td>Bias<\/td><td>(425 − 420) ÷ 420<\/td><td>+1.19%<\/td><\/tr>\n<tr><td>MAPE<\/td><td>mean of 5%, 8.33%, 11.11%, 9.09%<\/td><td>8.38%<\/td><\/tr>\n<tr><td>MASE<\/td><td>8.75 ÷ 7.5<\/td><td>1.17 (worse than naive)<\/td><\/tr><\/table><\/div>\n<div class=\"tablewrap\"><table><tr><th>Classifier<\/th><th>Calculation<\/th><th>Result<\/th><\/tr>\n<tr><td>Precision<\/td><td>300 ÷ 800<\/td><td>37.5%<\/td><\/tr>\n<tr><td>Recall<\/td><td>300 ÷ 500<\/td><td>60%<\/td><\/tr>\n<tr><td>Lift<\/td><td>0.375 ÷ 0.05<\/td><td>7.5×<\/td><\/tr>\n<tr><td>Cost threshold<\/td><td>2 ÷ (2 + 20)<\/td><td>9.1%<\/td><\/tr><\/table><\/div>", "code": "f4", "pitfalls": ["Reporting MAPE for a volume forecast with small values.", "Random cross-validation on time series.", "One aggregate score hiding poor peak or small-region performance.", "Accuracy on imbalanced data.", "A 0.5 threshold with no link to costs or capacity.", "Choosing ship criteria after seeing the results."], "follow": [["Model A has lower RMSE but higher WAPE than model B. Which is better?", "Depends on the decision. RMSE punishes large misses (peak risk); WAPE reflects overall volume error. Check peak-hour error and cost-weighted loss, which matches the real objective."], ["The classifier has 0.90 AUC but low precision at 8% capacity. Why?", "AUC measures ranking over all thresholds. At small capacity only the top slice matters. Evaluate precision at k and lift in that slice."], ["How do you check for bias across regions?", "Compute bias and WAPE by region and by peak vs off-peak. A model unbiased overall can over-forecast one region and under-forecast another."], ["What do you monitor after launch?", "Rolling WAPE and bias vs baseline, interval coverage, feature drift, calibration, and the business metric (SLA breaches, idle hours)."]], "lead": ["Reports RMSE or AUC and says the model is good.", "Matches metrics to the decision, builds an honest backtest, compares with the baseline using MASE, evaluates by segment, picks the threshold from costs and capacity, and writes ship criteria before testing."], "story": "Describe a model you evaluated or rejected. Write the metric you chose and why, the baseline, and what decision followed. Do not invent figures.", "drills": [["Actual 50, 70; forecast 60, 60. WAPE and bias?", "Errors +10, −10. Absolute 20; actual 120; WAPE 16.7%. Bias 0 (they cancel). Bias hides this error, WAPE does not."], ["Cost of false positive $5, false negative $15. Flag when P is above?", "5 ÷ 20 = 25%."], ["500 positives in 10,000; model flags 400 with 200 correct. Precision, recall, lift?", "Precision 50%, recall 40%, lift 50% ÷ 5% = 10×."], ["What does MASE = 0.8 mean?", "Your average miss is 80% of the naive method's, so you beat naive by 20%."]]}, {"id": "F5", "group": "Features and evaluation", "title": "Prove the forecast improved the business", "pri": "P1", "round": "Business Acumen and Hiring Manager", "time": "25 min", "prompt": "The new forecast has been live for a month. Leadership asks whether it actually saved money or improved service. How do you answer, and how do you decide how much safety capacity to plan for?", "tests": "Tying model accuracy to business outcomes. The interviewer wants asymmetric-cost thinking (newsvendor), a measurement design that isolates the forecast's effect, and a clear ROI.", "clarify": [["What does a short hour cost vs an idle hour?", "$30 per agent-hour short (SLA breach, lost goodwill); $12 per idle agent-hour."], ["How was the forecast rolled out?", "Region by region over four weeks; two regions have not switched yet."], ["What business metrics matter?", "SLA attainment, idle hours, cost per contact, CSAT."], ["Is demand variable?", "Next-hour contacts are about normal with mean 600 and spread (SD) 60."]], "gloss": [["Critical ratio", "Cost of being short ÷ (cost short + cost idle). The percentile of demand to staff to."], ["Newsvendor", "The classic problem of choosing stock when over- and under-stock have different costs."], ["SD", "Standard deviation: the typical spread of demand around its mean."], ["DiD", "Difference in differences: change in treated regions minus change in comparison regions."]], "framework": ["<b>Pick the percentile from costs,<\/b> not the mean.", "<b>Compare outcomes<\/b> with and without the new forecast, using staggered regions as comparison (difference in differences).", "<b>Metrics:<\/b> SLA attainment, idle hours, cost per contact; guardrail CSAT.", "<b>Convert to dollars,<\/b> with sensitivity.", "<b>Report uncertainty and caveats,<\/b> then recommend next steps."], "steps": ["<b>Step 1, the cost-minimizing staffing level.<\/b> Being short costs $30 and being idle costs $12. Critical ratio = 30 ÷ (30 + 12) = 0.714. Staff to the 71.4th percentile of demand. For normal demand with mean 600 and SD 60, that is 600 + 0.566 × 60 = <b>634 contacts<\/b> worth of capacity (z for 0.714 is 0.566).", "<b>Step 2, why not the mean.<\/b> Staffing at 600 leaves you short about half the time, and shortage is the costlier mistake. Simulation shows expected cost per hour falls by about 15% when planning to 634 instead of 600 (about 8.6 vs 10.1 in the illustrative units).", "<b>Step 3, measuring the forecast's business effect.<\/b> Two regions switched in weeks 1 to 4 and two did not. Use DiD on SLA attainment and idle hours: (switched regions after − before) − (not-switched regions after − before). Check pre-trends and that the regions are alike.", "<b>Step 4, example.<\/b> Idle hours per week: switched regions fall from 1,200 to 1,000 (−200); comparison regions from 1,150 to 1,100 (−50). DiD = −150 idle hours per week. At $12 per hour: $1,800 per week saved. SLA attainment: switched +3 points, comparison +1 point, so +2 points attributable.", "<b>Step 5, ROI.<\/b> Annualize: $1,800 × 52 = $93,600 on idle time, plus value of 2 points more SLA attainment (fewer breaches, estimated separately). Subtract the build and run cost. Say what is assumed.", "<b>Step 6, caveats.<\/b> Demand shifts, staffing policy changes alongside, and agent attrition can confound. A longer window and region-level fixed effects help. If a clean test is possible, a switchback (alternate forecast vs old method by week) is stronger.", "<b>Step 7, recommendation.<\/b> Roll out to the remaining regions, adopt the percentile-based plan, and monitor SLA, idle hours and bias monthly."], "hand": "<ol><li>Critical ratio = 30 ÷ (30 + 12) = 30 ÷ 42 = 0.714.<\/li>\n<li>z for 0.714 ≈ 0.566.<\/li>\n<li>Plan to 600 + 0.566 × 60 = 634.<\/li>\n<li>Idle-hours DiD: (1,000 − 1,200) − (1,100 − 1,150) = −200 − (−50) = −150 hours per week.<\/li>\n<li>Dollars: 150 × $12 = $1,800 per week, about $93,600 per year.<\/li><\/ol>\n<div class=\"tablewrap\"><table><tr><th>Plan to<\/th><th>Capacity<\/th><th>Expected cost per hour (illustrative units)<\/th><\/tr><tr><td>Mean (50th percentile)<\/td><td>600<\/td><td>10.07<\/td><\/tr><tr><td>71st percentile<\/td><td>634<\/td><td>8.57<\/td><\/tr><\/table><\/div>", "code": "f5", "pitfalls": ["Staffing to the average when costs are asymmetric.", "Claiming savings from a before/after comparison.", "Ignoring SLA gains because they are harder to price.", "Forgetting build and run costs in ROI.", "Presenting a single number with no range."], "follow": [["What if the cost ratio is symmetric?", "The critical ratio is 0.5, so staff to the median (the mean, for symmetric demand)."], ["How would you price an SLA breach?", "Estimate effects on CSAT, repeat contact and rebooking from past breaches (observational with controls, or from a test), then convert to dollars with a range."], ["What if forecast error rises in one region?", "Check bias and WAPE by region, review drivers (new market, event), widen the safety percentile there, and retrain."], ["How do you handle the two not-yet-switched regions ethically and practically?", "Switch them on a schedule, using the delay as the comparison window; avoid keeping a worse method longer than needed."]], "lead": ["Compares cost before and after the forecast.", "Chooses the staffing percentile from costs, isolates the forecast effect with a comparison group, converts to dollars with sensitivity, and states caveats and next steps."], "story": "Describe a model or analysis of yours that changed an operational decision. What did the decision-maker do differently, and how did you measure the result?", "drills": [["Short costs $40 and idle costs $10. Critical ratio?", "40 ÷ 50 = 0.8. Staff to the 80th percentile."], ["Demand mean 500, SD 50, critical ratio 0.84 (z = 1). Plan to?", "500 + 1 × 50 = 550."], ["Switched regions: SLA 90 → 94. Comparison: 91 → 92. DiD?", "(94 − 90) − (92 − 91) = 4 − 1 = +3 points."]]}];
const QUIZ=[{"q": "Baseline 10%, target 9%, α 5%, power 80%. Roughly how many users per group?", "o": ["About 1,350", "About 13,500", "About 135,000", "About 6,700"], "a": 1, "w": "n = 7.85 × 0.1719 ÷ 0.0001 ≈ 13,490."}, {"q": "You double the smallest effect you care about (MDE). What happens to the needed sample size?", "o": ["It doubles", "It halves", "It falls to about a quarter", "It does not change"], "a": 2, "w": "The gap is squared in the denominator, so doubling it divides n by about 4."}, {"q": "Planned 50/50. Observed 51,000 vs 49,000. What do you do first?", "o": ["Report the metric difference", "Run a sample ratio mismatch check and find the cause", "Drop users from treatment until equal", "Run longer"], "a": 1, "w": "χ² = 40, p ≈ 2.5e-10. Do not read results until the cause is found."}, {"q": "You check an A/B test five times and stop at the first p &lt; 0.05. The false-positive rate is about:", "o": ["5%", "8%", "14%", "50%"], "a": 2, "w": "Repeated looks inflate false positives; five looks gives about 14%."}, {"q": "Power is 58% for the effect you care about and the result is p = 0.12. The best reading is:", "o": ["There is no effect", "The test is inconclusive; it was underpowered", "The treatment is harmful", "The p-value is wrong"], "a": 1, "w": "A real effect would be missed 42% of the time."}, {"q": "A: 20 → 17 hours. B: 21 → 20 hours. The DiD estimate is:", "o": ["−3", "−1", "−2", "+2"], "a": 2, "w": "(−3) − (−1) = −2 hours."}, {"q": "Which variable should NOT be adjusted for in a propensity model?", "o": ["Issue complexity before contact", "A satisfaction score measured after the chatbot session", "Guest tenure", "Booking value"], "a": 1, "w": "Post-treatment variables are affected by the treatment; adjusting for them biases the effect."}, {"q": "Prevalence 1%, sensitivity 90%, false-positive rate 5%. What share of flagged tickets are truly risky?", "o": ["90%", "50%", "About 15%", "5%"], "a": 2, "w": "90 ÷ (90 + 495) = 15.4%."}, {"q": "A Bayesian result says there is a 99% probability that B is better. What else do you need before shipping?", "o": ["Nothing, 99% is enough", "The effect size and expected loss", "A p-value", "A larger prior"], "a": 1, "w": "High probability can go with a tiny effect. Look at size, cost and expected loss."}, {"q": "Which containment definition is least misleading for a support bot?", "o": ["Session ended without an agent", "No agent in the session and no contact on any channel within 7 days", "Guest clicked \"helpful\"", "Bot replied within 2 seconds"], "a": 1, "w": "It counts people who give up or phone later as failures."}, {"q": "Which metric is most distorted by very small actual values?", "o": ["MAE", "WAPE", "MAPE", "Bias"], "a": 2, "w": "MAPE divides each error by the actual, so small actuals blow it up."}, {"q": "MASE = 1.17. What does it mean?", "o": ["Better than naive by 17%", "Worse than naive", "Equal to naive", "Biased upward"], "a": 1, "w": "MASE above 1 means the average miss is larger than the naive method's."}, {"q": "A 7-day-ahead forecast uses the volume from 24 hours ago as a feature. The problem is:", "o": ["Multicollinearity", "It leaks information not available at forecast time", "Seasonality", "Overfitting to holidays"], "a": 1, "w": "That value does not exist when the forecast is made."}, {"q": "Which validation fits time-series forecasting?", "o": ["Random 5-fold cross-validation", "Rolling-origin backtest", "Leave-one-out", "Bootstrap on rows"], "a": 1, "w": "Train on the past, test on the next block."}, {"q": "5% of tickets escalate. A model that never flags anything has accuracy of:", "o": ["5%", "50%", "95%", "0%"], "a": 2, "w": "Accuracy hides the failure; use precision, recall and lift."}, {"q": "False positive costs $2 and false negative costs $20. The cost-based threshold is about:", "o": ["50%", "9%", "20%", "2%"], "a": 1, "w": "2 ÷ (2 + 20) = 9.1%."}, {"q": "Short costs $30 and idle costs $12. Which percentile of demand do you staff to?", "o": ["50th", "Roughly 71st", "90th", "30th"], "a": 1, "w": "30 ÷ 42 = 0.714."}, {"q": "VIF of 10 corresponds to an R² of:", "o": ["0.10", "0.50", "0.90", "0.99"], "a": 2, "w": "VIF = 1 ÷ (1 − R²); 1 ÷ 0.1 = 10."}, {"q": "Why is permutation importance computed on held-out data?", "o": ["It is faster", "It shows what the model relies on for unseen data", "It removes correlated features", "It gives causal effects"], "a": 1, "w": "In-sample importance can reward overfitting."}, {"q": "Your 80% prediction interval contains only 60% of actuals. The intervals are:", "o": ["Too wide", "Too narrow", "Correct", "Biased low"], "a": 1, "w": "Coverage below the nominal level means over-confident, narrow intervals."}];
const CFG={"key": "airbnb-all", "tools": [{"id": "ss", "label": "Sample size calculator"}, {"id": "metrics", "label": "Forecast metric calculator"}, {"id": "staff", "label": "Staffing calculator"}, {"id": "backtest", "label": "Backtest diagram"}]};
</script>
<script>
(function(){
const $=(s,r=document)=>r.querySelector(s);
const el=(t,a={},h='')=>{const e=document.createElement(t);for(const k in a)e.setAttribute(k,a[k]);if(h)e.innerHTML=h;return e;};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const KEY=CFG.key;
let store={};
try{store=JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){store={};}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}};
const st=id=>(store[id]=store[id]||{});
const CRIT=['Correctness','Depth','Structure','Business judgment','Communication'];

/* ---------- normal distribution helpers ---------- */
function erf(x){const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+0.3275911*x);
  const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return s*y;}
const cdf=x=>0.5*(1+erf(x/Math.SQRT2));
function inv(p){let lo=-8,hi=8;for(let i=0;i<80;i++){const m=(lo+hi)/2;if(cdf(m)<p)lo=m;else hi=m;}return (lo+hi)/2;}
const fmt=(n,d=0)=>Number(n).toLocaleString('en-US',{maximumFractionDigits:d,minimumFractionDigits:d});

/* ---------- navigation ---------- */
const nav=$('#nav'),main=$('#main');
const items=[];
let lastGroup='';
CASES.forEach(c=>{
  if(c.group!==lastGroup){nav.appendChild(el('div',{class:'grp'},esc(c.group)));lastGroup=c.group;}
  items.push({type:'case',id:c.id,label:c.id+'. '+c.title,pri:c.pri});
});
nav.appendChild(el('div',{class:'grp'},'Tools'));
CFG.tools.forEach(t=>items.push({type:'tool',id:t.id,label:t.label}));
items.push({type:'quiz',id:'quiz',label:'Rapid-fire quiz'});
items.push({type:'prog',id:'prog',label:'Progress and weak areas'});
const btns={};
// rebuild nav in order with groups already inserted: simple approach, rebuild
nav.innerHTML='';
lastGroup='';
items.forEach(it=>{
  if(it.type==='case'){const c=CASES.find(x=>x.id===it.id);if(c.group!==lastGroup){nav.appendChild(el('div',{class:'grp'},esc(c.group)));lastGroup=c.group;}}
  else if(lastGroup!=='Tools'){nav.appendChild(el('div',{class:'grp'},'Tools'));lastGroup='Tools';}
  const b=el('button',{type:'button'});
  b.innerHTML='<span class="dot"></span><span>'+esc(it.label)+'</span>'+(it.pri?'<span class="pri '+(it.pri==='P0'?'p0':'p1')+'">'+it.pri+'</span>':'');
  b.onclick=()=>{go(it.id);$('#side').classList.remove('open');$('#menuBtn').setAttribute('aria-expanded','false');};
  nav.appendChild(b);btns[it.id]=b;
});
function refreshNav(){
  let done=0;
  CASES.forEach(c=>{const d=!!st(c.id).done;if(d)done++;btns[c.id].firstChild.className='dot'+(d?' done':'');});
  $('#prog').style.width=(100*done/CASES.length)+'%';
  return done;
}
$('#menuBtn').onclick=()=>{const s=$('#side');const o=s.classList.toggle('open');$('#menuBtn').setAttribute('aria-expanded',o);};

function go(id){
  Object.keys(btns).forEach(k=>btns[k].removeAttribute('aria-current'));
  btns[id].setAttribute('aria-current','true');
  const it=items.find(i=>i.id===id);
  $('#menuTitle').textContent=it.label;
  main.innerHTML='';
  if(it.type==='case')renderCase(CASES.find(c=>c.id===id));
  else if(it.type==='quiz')renderQuiz();
  else if(it.type==='prog')renderProgress();
  else renderTool(id);
  window.scrollTo(0,0);
  try{history.replaceState(null,'','#'+id.toLowerCase().replace(/[^a-z0-9]/g,'-'));}catch(e){}
  refreshNav();
}

/* ---------- case view ---------- */
function seg(n,title,body,locked){
  const s=el('section',{class:'seg'+(locked?' locked':'')});
  s.appendChild(el('h3',{},'<span class="n">'+n+'</span><span>'+title+'</span>'));
  const b=el('div',{class:'body'});if(typeof body==='string')b.innerHTML=body;else b.appendChild(body);
  s.appendChild(b);return s;
}
const list=a=>'<ul>'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
function codeBlock(text){
  const w=el('div');const pre=el('pre');const c=el('code');c.textContent=text;pre.appendChild(c);w.appendChild(pre);
  const row=el('div',{class:'row'});const cb=el('button',{class:'btn alt',type:'button'},'Copy code');
  cb.onclick=()=>{try{navigator.clipboard.writeText(text).then(()=>{cb.textContent='Copied';setTimeout(()=>cb.textContent='Copy code',1500);},()=>{cb.textContent='Select the code and copy';});}catch(e){cb.textContent='Select the code and copy';}};
  row.appendChild(cb);w.appendChild(row);return w;
}
function renderCase(c){
  const S=st(c.id);
  main.appendChild(el('h2',{},esc(c.id+'. '+c.title)));
  main.appendChild(el('div',{class:'meta'},
    '<span class="chip">'+esc(c.pri)+(c.pri==='P0'?' must do':' if time allows')+'</span><span class="chip">'+esc(c.round)+'</span><span class="chip">about '+esc(c.time)+'</span>'));
  main.appendChild(seg(1,'Interviewer prompt','<div class="prompt">'+c.prompt+'</div>'));
  main.appendChild(seg(2,'What it tests',c.tests));
  main.appendChild(seg(3,'Clarifying questions to ask first',c.clarify.map(q=>'<div class="qa"><b>'+q[0]+'</b><span class="assume">Assume: '+q[1]+'</span></div>').join('')));

  const att=el('div');
  att.innerHTML='<p>Write your answer first, as you would say it aloud. Use the framework you know, state assumptions, and show formulas. Then reveal the solution.</p>';
  const ta=el('textarea',{id:'att-'+c.id,'aria-label':'Your attempt'});ta.value=S.attempt||'';
  ta.oninput=()=>{S.attempt=ta.value;save();};
  const rv=el('button',{class:'btn',type:'button'},S.revealed?'Solution revealed':'Reveal the solution');
  rv.disabled=!!S.revealed;
  const hint=el('span',{class:'assume'},'');
  att.appendChild(ta);const r=el('div',{class:'row'});r.appendChild(rv);r.appendChild(hint);att.appendChild(r);
  main.appendChild(seg('✎','Your attempt',att));

  const locked=!S.revealed;
  const later=[];
  later.push(seg(4,'Framework you can say in 60 seconds','<ol>'+c.framework.map(x=>'<li>'+x+'</li>').join('')+'</ol>',locked));
  let steps='';
  if(c.gloss&&c.gloss.length)steps+='<div class="gloss"><h4>Every symbol in plain words</h4><dl>'+c.gloss.map(g=>'<dt>'+g[0]+'</dt><dd>'+g[1]+'</dd>').join('')+'</dl></div>';
  steps+=c.steps.map(x=>'<p>'+x+'</p>').join('');
  later.push(seg(5,'Step-by-step solution',steps,locked));

  const wrap=el('div');
  if(c.code){
    const tabs=el('div',{class:'tabs',role:'tablist'});
    const hand=el('div'),py=el('div');hand.innerHTML=c.hand;py.appendChild(codeBlock(SNIP[c.code]));
    if(c.codeNote){py.appendChild(el('p',{class:'assume'},c.codeNote));}
    const tb=[['By hand',hand],['In '+(c.lang||'Python'),py]].map((t,i)=>{
      const b=el('button',{type:'button',role:'tab','aria-selected':i===0},t[0]);
      b.onclick=()=>{tb.forEach((x,j)=>x.setAttribute('aria-selected',j===i));hand.style.display=i===0?'':'none';py.style.display=i===1?'':'none';};
      tabs.appendChild(b);return b;});
    py.style.display='none';wrap.appendChild(tabs);wrap.appendChild(hand);wrap.appendChild(py);
  } else wrap.innerHTML=c.hand;
  later.push(seg(6,c.code?'Worked example: by hand, then in code':'Worked example',wrap,locked));
  later.push(seg(7,'Pitfalls',list(c.pitfalls),locked));
  later.push(seg(8,'Follow-up questions',c.follow.map(f=>'<details><summary>'+f[0]+'</summary><p>'+f[1]+'</p></details>').join(''),locked));
  later.push(seg(9,'Lead-level vs mid-level','<div class="tablewrap"><table><tr><th>Mid-level answer</th><th>Lead-level answer</th></tr><tr><td>'+c.lead[0]+'</td><td>'+c.lead[1]+'</td></tr></table></div>',locked));
  const sb=el('div');sb.innerHTML='<p>'+c.story+'</p>';
  const sta=el('textarea',{'aria-label':'Your story notes',placeholder:'Your real project, your role, the metric, the number, the decision. Leave blank what you do not know.'});
  sta.value=S.story||'';sta.oninput=()=>{S.story=sta.value;save();};sb.appendChild(sta);
  later.push(seg(10,'Link to your own experience',sb,locked));
  later.push(seg(11,'Self-check drills',c.drills.map(f=>'<details><summary>'+f[0]+'</summary><p>'+f[1]+'</p></details>').join(''),locked));
  const sc=el('div',{class:'score'});
  sc.innerHTML='<p>Score your own attempt against the solution, 1 (weak) to 5 (strong).</p>';
  S.scores=S.scores||{};
  CRIT.forEach(k=>{const l=el('label');l.innerHTML=esc(k)+'<input type="range" min="1" max="5" step="1" value="'+(S.scores[k]||3)+'"><output>'+(S.scores[k]||3)+'</output>';
    const inp=$('input',l),o=$('output',l);inp.oninput=()=>{o.textContent=inp.value;S.scores[k]=+inp.value;save();};sc.appendChild(l);});
  const dn=el('button',{class:'btn',type:'button'},S.done?'Marked done':'Mark case done');
  dn.onclick=()=>{S.done=!S.done;CRIT.forEach(k=>{if(!S.scores[k])S.scores[k]=3;});save();dn.textContent=S.done?'Marked done':'Mark case done';refreshNav();};
  sc.appendChild(dn);
  later.push(seg(12,'Score and finish',sc,locked));
  later.forEach(x=>main.appendChild(x));
  rv.onclick=()=>{
    if((ta.value||'').trim().length<20){hint.textContent='Write at least a few sentences first.';return;}
    S.revealed=true;save();rv.textContent='Solution revealed';rv.disabled=true;later.forEach(x=>x.classList.remove('locked'));hint.textContent='';
  };
}

/* ---------- tools ---------- */
function field(id,label,val,step){return '<label>'+label+'<input type="number" id="'+id+'" value="'+val+'"'+(step?' step="'+step+'"':'')+'></label>';}
function renderTool(id){
  if(id==='ss')toolSampleSize();
  else if(id==='metrics')toolMetrics();
  else if(id==='staff')toolStaff();
  else if(id==='backtest')toolBacktest();
}
function toolSampleSize(){
  main.appendChild(el('h2',{},'Sample size, power and MDE calculator'));
  const box=el('div',{class:'seg'});
  box.innerHTML='<div class="body"><div class="calc">'
   +'<label>Metric type<select id="mt"><option value="p">Proportion (contact rate)</option><option value="m">Mean (resolution hours)</option></select></label>'
   +field('b','Baseline (rate like 0.10, or mean)',0.10,'any')
   +field('d','Smallest change you care about (MDE, absolute)',0.01,'any')
   +field('sd','Spread, SD (mean metrics only)',8,'any')
   +field('al','Significance level, alpha',0.05,'any')
   +field('pw','Power',0.8,'any')
   +field('dt','Eligible users per day (both arms)',4000,'any')
   +field('de','Design effect (1 if none)',1,'any')
   +'</div><div class="out" id="so"></div><div id="steps"></div><div id="pc"></div></div>';
  main.appendChild(box);
  const run=()=>{
    const g=i=>parseFloat($('#'+i).value);const t=$('#mt').value;
    const b=g('b'),d=g('d'),al=g('al'),pw=g('pw'),dt=g('dt'),de=g('de'),sd=g('sd');
    const za=inv(1-al/2),zb=inv(pw);let n,formula;
    if(t==='p'){const p2=b-d;const v=b*(1-b)+p2*(1-p2);n=Math.pow(za+zb,2)*v/(d*d);
      formula='<ol><li>Pick the error rates. Wrong-alarm chance alpha = '+al+' gives z(alpha/2) = '+fmt(za,3)+'. Power = '+pw+' gives z(power) = '+fmt(zb,3)+'. These two numbers are how many "standard errors" of room we demand.</li>'
       +'<li>Add them and square: ('+fmt(za,3)+' + '+fmt(zb,3)+')² = '+fmt(Math.pow(za+zb,2),3)+'.</li>'
       +'<li>Noise per person in each arm: p(1-p) summed over both arms = '+fmt(b*(1-b),4)+' + '+fmt(p2*(1-p2),4)+' = '+fmt(v,4)+'. Bigger noise means you need more people.</li>'
       +'<li>The change you want to see, squared: '+d+'² = '+fmt(d*d,6)+'. A smaller change means many more people.</li>'
       +'<li>People per arm = '+fmt(Math.pow(za+zb,2),3)+' × '+fmt(v,4)+' ÷ '+fmt(d*d,6)+' = <b>'+fmt(n)+'</b>.</li></ol>';}
    else{n=2*Math.pow(za+zb,2)*sd*sd/(d*d);
      formula='<ol><li>z(alpha/2) = '+fmt(za,3)+' and z(power) = '+fmt(zb,3)+'; square their sum: '+fmt(Math.pow(za+zb,2),3)+'.</li>'
       +'<li>Noise: two arms, each with variance SD² = '+sd+'² = '+fmt(sd*sd,2)+', so 2 × '+fmt(sd*sd,2)+' = '+fmt(2*sd*sd,2)+'.</li>'
       +'<li>Change squared: '+d+'² = '+fmt(d*d,4)+'.</li>'
       +'<li>People per arm = '+fmt(Math.pow(za+zb,2),3)+' × '+fmt(2*sd*sd,2)+' ÷ '+fmt(d*d,4)+' = <b>'+fmt(n)+'</b>.</li></ol>';}
    const na=Math.ceil(n*de);const days=Math.ceil(2*na/dt);
    $('#so').innerHTML='<div class="tile"><b>'+fmt(na)+'</b><span>users per arm</span></div><div class="tile"><b>'+fmt(2*na)+'</b><span>total users</span></div><div class="tile"><b>'+days+'</b><span>days at that traffic (round up to full weeks)</span></div>';
    $('#steps').innerHTML='<h3 style="font-size:16px;margin:6px 0">How it was calculated</h3>'+formula+(de!==1?'<p class="assume">Design effect '+de+' multiplies the answer because users in the same cluster are alike.</p>':'');
    // power curve at fixed n
    const W=520,H=190,pad=34;let pts=[];const maxd=d*2.2;
    for(let i=0;i<=40;i++){const x=maxd*i/40;let se;
      if(t==='p'){se=Math.sqrt((b*(1-b)+(b-x)*(1-(b-x)))/(na/de));}else{se=Math.sqrt(2*sd*sd/(na/de));}
      const pwr=cdf(x/se-za);pts.push([x,pwr]);}
    const X=x=>pad+(W-pad-10)*x/maxd,Y=p=>H-pad+ -(H-pad-10)*p;
    let svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Power curve">';
    [0,0.5,0.8,1].forEach(p=>{svg+='<line x1="'+pad+'" x2="'+(W-10)+'" y1="'+Y(p)+'" y2="'+Y(p)+'" stroke="currentColor" opacity=".15"/><text x="2" y="'+(Y(p)+4)+'">'+Math.round(p*100)+'%</text>';});
    svg+='<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="'+pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')+'"/>';
    svg+='<circle cx="'+X(d)+'" cy="'+Y(cdf(d/(t==='p'?Math.sqrt((b*(1-b)+(b-d)*(1-(b-d)))/(na/de)):Math.sqrt(2*sd*sd/(na/de)))-za))+'" r="5" fill="var(--accent)"/>';
    svg+='<text x="'+pad+'" y="'+(H-8)+'">true effect size: 0 to '+fmt(maxd,4)+' (dot = your MDE)</text></svg>';
    $('#pc').innerHTML='<h3 style="font-size:16px;margin:10px 0 0">Power at this sample size, for different true effects</h3>'+svg+'<p class="assume">Power is the chance of detecting a real effect. If the true effect is half your MDE, power is far below 80%. That is why an "inconclusive" test is often just an underpowered one.</p>';
  };
  box.addEventListener('input',run);run();
}
function parseNums(s){return s.split(/[\s,;]+/).filter(x=>x!=='').map(Number).filter(x=>!isNaN(x));}
function toolMetrics(){
  main.appendChild(el('h2',{},'Forecast metric calculator'));
  const box=el('div',{class:'seg'});
  box.innerHTML='<div class="body"><div class="calc">'
   +'<label style="grid-column:1/-1">Actual values (comma separated)<input type="text" id="ya" value="100,120,90,110" style="padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)"></label>'
   +'<label style="grid-column:1/-1">Forecast values<input type="text" id="yf" value="95,130,100,100" style="padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)"></label>'
   +'<label style="grid-column:1/-1">Training history, for MASE<input type="text" id="yt" value="90,100,95,105,100" style="padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)"></label>'
   +'</div><div class="out" id="mo"></div><div id="mx"></div></div>';
  main.appendChild(box);
  const run=()=>{
