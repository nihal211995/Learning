    const a=parseNums($('#ya').value),f=parseNums($('#yf').value),t=parseNums($('#yt').value);
    if(!a.length||a.length!==f.length){$('#mo').innerHTML='<p>Enter the same number of actual and forecast values.</p>';return;}
    const e=f.map((v,i)=>v-a[i]),n=a.length,sa=a.reduce((x,y)=>x+y,0);
    const mae=e.reduce((x,y)=>x+Math.abs(y),0)/n,rmse=Math.sqrt(e.reduce((x,y)=>x+y*y,0)/n);
    const wape=e.reduce((x,y)=>x+Math.abs(y),0)/sa,bias=e.reduce((x,y)=>x+y,0)/sa;
    const zero=a.some(v=>v===0);const mape=zero?NaN:e.reduce((x,y,i)=>x+Math.abs(y)/a[i],0)/n;
    let nm=NaN;if(t.length>1){let s=0;for(let i=1;i<t.length;i++)s+=Math.abs(t[i]-t[i-1]);nm=s/(t.length-1);}
    const mase=nm?mae/nm:NaN;
    const T=(v,l)=>'<div class="tile"><b>'+v+'</b><span>'+l+'</span></div>';
    $('#mo').innerHTML=T(fmt(mae,2),'MAE: average miss, same units as data')+T(fmt(rmse,2),'RMSE: punishes big misses')+T(fmt(wape*100,2)+'%','WAPE: total miss ÷ total actual')+T((bias>=0?'+':'')+fmt(bias*100,2)+'%','Bias: + means over-forecast')+T(isNaN(mape)?'undefined':fmt(mape*100,2)+'%','MAPE: breaks when actual is 0')+T(isNaN(mase)?'n/a':fmt(mase,2),'MASE: above 1 means worse than naive');
    $('#mx').innerHTML='<p class="assume">MASE compares your average miss with the average miss of "tomorrow equals today" on the training history ('+(nm?fmt(nm,2):'n/a')+'). WAPE weights busy periods more than MAPE does, which is what staffing cares about.</p>';
  };
  box.addEventListener('input',run);run();
}
function toolStaff(){
  main.appendChild(el('h2',{},'Staffing calculator'));
  const box=el('div',{class:'seg'});
  box.innerHTML='<div class="body"><div class="calc">'
   +field('v','Forecast contacts per hour (base)',600,'any')+field('lo','Low scenario (P10)',520,'any')+field('hi','High scenario (P90)',700,'any')
   +field('aht','Average handling time (minutes)',12,'any')+field('oc','Target occupancy (0 to 1)',0.8,'any')+field('sh','Shrinkage: breaks, leave, training (0 to 1)',0.3,'any')
   +field('cu','Cost of one agent-hour short ($)',30,'any')+field('co','Cost of one idle agent-hour ($)',12,'any')
   +'</div><div class="out" id="sa"></div><div id="sx"></div></div>';
  main.appendChild(box);
  const run=()=>{
    const g=i=>parseFloat($('#'+i).value);
    const ag=v=>Math.ceil(Math.round(v*g('aht')/60/g('oc')/(1-g('sh'))*1e6)/1e6);
    const T=(v,l)=>'<div class="tile"><b>'+v+'</b><span>'+l+'</span></div>';
    const cr=g('cu')/(g('cu')+g('co'));
    $('#sa').innerHTML=T(ag(g('lo')),'agents scheduled, low')+T(ag(g('v')),'agents scheduled, base')+T(ag(g('hi')),'agents scheduled, high')+T(fmt(cr*100,1)+'%','percentile to staff to (cost ratio)');
    const w=g('v')*g('aht')/60;
    $('#sx').innerHTML='<ol><li>Work to do each hour = contacts × handling minutes ÷ 60 = '+g('v')+' × '+g('aht')+' ÷ 60 = '+fmt(w,1)+' agent-hours, so about '+fmt(w,0)+' agents busy at once.</li>'
     +'<li>Nobody is busy 100% of the time. Divide by occupancy '+g('oc')+': '+fmt(w/g('oc'),1)+' agents on the floor.</li>'
     +'<li>Some scheduled people are on break or leave. Divide by (1 - shrinkage) = '+fmt(1-g('sh'),2)+': '+fmt(w/g('oc')/(1-g('sh')),1)+', rounded up to <b>'+ag(g('v'))+'</b> scheduled.</li>'
     +'<li>Being short costs $'+g('cu')+' and being idle costs $'+g('co')+', so the best plan covers the '+fmt(cr*100,1)+'th percentile of demand, not the average. This is the newsvendor rule: cost short ÷ (cost short + cost idle).</li></ol>';
  };
  box.addEventListener('input',run);run();
}
function toolBacktest(){
  main.appendChild(el('h2',{},'Backtest diagram: why random cross-validation leaks'));
  const box=el('div',{class:'seg'});
  const W=620,H=250;let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Rolling origin backtest folds">';
  s+='<text x="6" y="14">Rolling-origin backtest: train always comes before test</text>';
  for(let i=0;i<4;i++){const y=30+i*30,tr=200+i*70;
    s+='<rect x="60" y="'+y+'" width="'+tr+'" height="20" fill="var(--accent)" opacity=".75"/>';
    s+='<rect x="'+(60+tr)+'" y="'+y+'" width="70" height="20" fill="var(--warn)"/>';
    s+='<text x="4" y="'+(y+14)+'">fold '+(i+1)+'</text>';}
  s+='<text x="60" y="160">time →   (teal = train on the past, amber = test on the next block)</text>';
  s+='<text x="6" y="188">Random k-fold: test rows are scattered among training rows</text>';
  for(let i=0;i<30;i++){const t=(i*37)%5===0;s+='<rect x="'+(60+i*17)+'" y="198" width="14" height="20" fill="'+(t?'var(--warn)':'var(--accent)')+'" opacity="'+(t?1:.75)+'"/>';}
  s+='<text x="60" y="238">The model has seen days around each test day, so the score looks better than real life.</text></svg>';
  box.innerHTML='<div class="body">'+s+'<ul><li>Use rolling-origin folds. Report WAPE per fold, and look at the spread, not just the average.</li><li>Match the fold length to the real horizon. A model that will forecast 14 days ahead must be tested on 14-day blocks.</li><li>Features must be available at forecast time. A lag of 1 hour is fine for a 1-hour-ahead forecast and leaks for a 7-day-ahead one.</li></ul></div>';
  main.appendChild(box);
}

/* ---------- quiz ---------- */
function renderQuiz(){
  main.appendChild(el('h2',{},'Rapid-fire quiz'));
  const S=st('quiz');S.ans=S.ans||{};
  const wrap=el('div');
  QUIZ.forEach((q,qi)=>{
    const s=el('section',{class:'seg'});
    const b=el('div',{class:'body'});
    b.innerHTML='<b>'+(qi+1)+'. '+q.q+'</b>';
    const ex=el('p',{class:'assume'});
    q.o.forEach((o,oi)=>{
      const x=el('button',{class:'opt',type:'button'},o);
      x.onclick=()=>{S.ans[qi]=oi;save();paint();};
      b.appendChild(x);
    });
    b.appendChild(ex);s.appendChild(b);wrap.appendChild(s);
    q._paint=()=>{const sel=S.ans[qi];[...b.querySelectorAll('.opt')].forEach((x,i)=>{x.className='opt'+(sel!==undefined?(i===q.a?' right':(i===sel?' wrong':'')):'');});
      ex.innerHTML=sel!==undefined?q.w:'';};
  });
  const sum=el('div',{class:'seg'});const sb=el('div',{class:'body'});sum.appendChild(sb);
  function paint(){QUIZ.forEach(q=>q._paint());const done=Object.keys(S.ans).length;const ok=QUIZ.filter((q,i)=>S.ans[i]===q.a).length;
    sb.innerHTML='<b>Score: '+ok+' of '+QUIZ.length+'</b> ('+done+' answered)<div class="row"><button class="btn alt" id="qr" type="button">Reset quiz</button></div>';
    $('#qr',sb).onclick=()=>{S.ans={};save();paint();};}
  main.appendChild(sum);main.appendChild(wrap);paint();
}

/* ---------- progress ---------- */
function renderProgress(){
  main.appendChild(el('h2',{},'Progress and weak areas'));
  const done=refreshNav();
  const box=el('div',{class:'seg'});const b=el('div',{class:'body'});box.appendChild(b);
  let h='<p><b>'+done+' of '+CASES.length+'</b> cases marked done.</p>';
  const rows=CASES.filter(c=>st(c.id).done&&st(c.id).scores);
  const weak=[];
  rows.forEach(c=>CRIT.forEach(k=>{const v=st(c.id).scores[k];if(v&&v<3)weak.push([c.id+'. '+c.title,k,v]);}));
  h+='<h3 style="font-size:16px;margin:12px 0 4px">Scores below 3 (revisit these)</h3>';
  h+=weak.length?'<ul class="weak">'+weak.map(w=>'<li>'+esc(w[0])+': '+esc(w[1])+' ('+w[2]+')</li>').join('')+'</ul>':'<p class="assume">Nothing flagged yet. Mark a case done after scoring yourself.</p>';
  if(rows.length){
    h+='<h3 style="font-size:16px;margin:12px 0 4px">Average by criterion</h3><div class="tablewrap"><table><tr><th>Criterion</th><th>Average</th></tr>'+CRIT.map(k=>{const v=rows.map(c=>st(c.id).scores[k]||3);return '<tr><td>'+k+'</td><td>'+fmt(v.reduce((x,y)=>x+y,0)/v.length,1)+'</td></tr>';}).join('')+'</table></div>';
  }
  h+='<div class="row"><button class="btn alt" id="rs" type="button">Clear all saved answers</button></div>';
  b.innerHTML=h;main.appendChild(box);
  $('#rs',b).onclick=()=>{if(b.dataset.c==='1'){store={};save();location.reload();}else{b.dataset.c='1';$('#rs',b).textContent='Press again to confirm';}};
}

const start=(location.hash||'').replace('#','');
const first=items.find(i=>i.id.toLowerCase().replace(/[^a-z0-9]/g,'-')===start)||items[0];
go(first.id);
})();
</script>
