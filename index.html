<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nihal's Learning Hub</title>
<style>
/* Layout idea: a single column index of grouped link rows, filtered by a search box. Edit the PAGES list below to add files. */
:root{--bg:#f6f5f1;--panel:#fff;--ink:#1b2430;--muted:#5d6877;--line:#dcdad2;--accent:#0f6b63;--soft:#e4f0ee;
--display:Georgia,'Times New Roman',serif;--body:system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--panel:#1a2320;--ink:#e7ece9;--muted:#9aa8a2;--line:#2c3935;--accent:#4fc3b4;--soft:#1e2f2c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121816;--panel:#1a2320;--ink:#e7ece9;--muted:#9aa8a2;--line:#2c3935;--accent:#4fc3b4;--soft:#1e2f2c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
main{max-width:760px;margin:0 auto;padding:32px 16px 64px}
h1{font:700 30px/1.2 var(--display);margin:0 0 6px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 20px}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}
input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:26px 0 8px;font-weight:600}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
a.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none}
a.row:hover{border-color:var(--accent);background:var(--soft)}
.name{font-weight:600}
.file{color:var(--muted);font-size:13px;word-break:break-all}
.go{color:var(--accent);font-weight:600;flex:none}
.empty{color:var(--muted);display:none}
</style>
</head>
<body>
<main>
  <h1>Learning Hub</h1>
  <p class="sub">Interactive guides and practice pages. Tap a row to open it.</p>
  <label for="q" class="sub" style="display:block;margin-bottom:6px">Search</label>
  <input id="q" type="search" placeholder="Try: airbnb, bayesian, ml" autocomplete="off">
  <div id="list"></div>
  <p class="empty" id="empty">No page matches that search.</p>
</main>
<script>
// Add new pages here: { title, file, group }. The file name must match the repo exactly.
const PAGES=[
 {group:'Airbnb interview prep',title:'Analytics Interview Cases (18 cases, calculators, quiz)',file:'airbnb_interview_cases.html'},
 {group:'Airbnb interview prep',title:'Lead Advanced Analytics Interview Guide',file:'airbnb lead advanced analytics interview guide.html'},
 {group:'Airbnb interview prep',title:'Round 1 Mockup',file:'airbnb_round1_mockup.html'},
 {group:'Statistics and experimentation',title:'Experimentation Guide',file:'experimentation guide.html'},
 {group:'Statistics and experimentation',title:'Experimentation Mastery',file:'experimentation-mastery.html'},
 {group:'Statistics and experimentation',title:'Bayesian Quick Guide',file:'bayesian_quick_guide.html'},
 {group:'Statistics and experimentation',title:'Confidence Intervals Guide',file:'confidence_intervals_guide.html'},
 {group:'Statistics and experimentation',title:'Probability Distributions Guide',file:'probability_distributions_guide.html'},
 {group:'Statistics and experimentation',title:'Statistics Interactive',file:'statistics_interactive.html'},
 {group:'Machine learning',title:'ML Models Guide',file:'ml_models_guide.html'},
 {group:'Machine learning',title:'ML Revision Guide',file:'ml_revision_guide.html'},
 {group:'Other',title:'Hindu Baby Name Explorer',file:'hindu baby name explorer.html'},
 {group:'Other',title:'Vishnu Sahasranamam Interactive',file:'Vishnu Sahasranamam Interactive.html'}
];
const list=document.getElementById('list'),empty=document.getElementById('empty'),q=document.getElementById('q');
function draw(){
  const t=q.value.trim().toLowerCase();let n=0;list.innerHTML='';
  const groups=[...new Set(PAGES.map(p=>p.group))];
  groups.forEach(g=>{
    const items=PAGES.filter(p=>p.group===g&&(p.title+' '+p.file).toLowerCase().includes(t));
    if(!items.length)return;n+=items.length;
    const h=document.createElement('h2');h.textContent=g;list.appendChild(h);
    const ul=document.createElement('ul');
    items.forEach(p=>{
      const li=document.createElement('li'),a=document.createElement('a');
      a.className='row';a.href=encodeURI(p.file);
      const l=document.createElement('span'),nm=document.createElement('div'),fl=document.createElement('div'),go=document.createElement('span');
      nm.className='name';nm.textContent=p.title;fl.className='file';fl.textContent=p.file;go.className='go';go.textContent='Open';
      l.appendChild(nm);l.appendChild(fl);a.appendChild(l);a.appendChild(go);li.appendChild(a);ul.appendChild(li);
    });
    list.appendChild(ul);
  });
  empty.style.display=n?'none':'block';
}
q.addEventListener('input',draw);draw();
</script>
</body>
</html>
