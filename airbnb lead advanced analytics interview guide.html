{
"id": "S9",
"title": "Rolling baseline with gap-filled date spine + anomaly flag",
"level": "Advanced",
"topics": "Date spine, rolling windows, missing days",
"question": "Daily contacts per region may have missing days (zero volume or missing load). Build a date spine, fill gaps with 0, compute the trailing 7-day average excluding the current day, and flag days above 1.5\u00d7 that baseline (only when 7 prior days exist).",
"schema": "daily_contacts(ds DATE, region, contacts)",
"sql": "WITH spine AS (\n  SELECT CAST(d AS DATE) AS ds\n  FROM UNNEST(sequence(DATE '2026-10-01', DATE '2026-10-10', INTERVAL '1' DAY)) AS t(d)\n), filled AS (\n  SELECT s.ds, 'EU' AS region, COALESCE(c.contacts, 0) AS contacts\n  FROM spine s LEFT JOIN daily_contacts c ON c.ds = s.ds AND c.region = 'EU'\n), w AS (\n  SELECT ds, region, contacts,\n         AVG(contacts)  OVER (PARTITION BY region ORDER BY ds ROWS BETWEEN 7 PRECEDING AND 1 PRECEDING) AS baseline_7d,\n         COUNT(*)       OVER (PARTITION BY region ORDER BY ds ROWS BETWEEN 7 PRECEDING AND 1 PRECEDING) AS n_prior\n  FROM filled\n)\nSELECT ds, contacts, ROUND(baseline_7d, 1) AS baseline_7d,\n       CASE WHEN n_prior = 7 AND contacts > 1.5 * baseline_7d THEN 1 ELSE 0 END AS anomaly\nFROM w\nORDER BY ds",
"explain": "<p>Oct 5 is missing; without the spine, the 'previous 7 rows' would silently span 8 calendar days. Filling with 0 is right only if a missing row truly means zero contacts \u2014 if it means a failed load, mark it NULL and alert on data completeness instead (it also drags the baseline down: Oct 5's 0 lowers Oct 9's baseline from ~101.7 to 87.1. Oct 9 (160) is flagged either way here, but a borderline day would flip \u2014 confirm the gap's meaning before trusting the alert). Excluding the current day keeps an anomaly from inflating its own baseline.</p>",
"alt": "Same-weekday baseline (median of the last 4 same weekdays) handles weekly seasonality better than a flat 7-day mean.",
"errors": "ROWS over rows with missing dates. Including current day in baseline.",
"perf": "For many regions, generate the spine once and CROSS JOIN regions.",
"follow": [
"Replace the 1.5\u00d7 rule with a robust z-score.",
"How do you avoid alerting on public holidays?"
],
"sample": "daily_contacts\nds         | region | contacts\n-----------+--------+---------\n2026-10-01 | EU     | 100     \n2026-10-02 | EU     | 110     \n2026-10-03 | EU     | 95      \n2026-10-04 | EU     | 105     \n2026-10-06 | EU     | 98      \n2026-10-07 | EU     | 102     \n2026-10-08 | EU     | 100     \n2026-10-09 | EU     | 160     \n2026-10-10 | EU     | 104     ",
"output": "ds         | contacts | baseline_7d | anomaly\n-----------+----------+-------------+--------\n2026-10-01 | 100      | NULL        | 0      \n2026-10-02 | 110      | 100         | 0      \n2026-10-03 | 95       | 105         | 0      \n2026-10-04 | 105      | 101.7       | 0      \n2026-10-05 | 0        | 102.5       | 0      \n2026-10-06 | 98       | 82          | 0      \n2026-10-07 | 102      | 84.7        | 0      \n2026-10-08 | 100      | 87.1        | 0      \n2026-10-09 | 160      | 87.1        | 1      \n2026-10-10 | 104      | 94.3        | 0      "
},
{
"id": "S10",
"title": "Chatbot funnel and true containment",
"level": "Advanced",
"topics": "Funnels, cross-table outcomes, success definition",
"question": "For chatbot sessions in October, compute: sessions, engaged (\u22652 user turns), not escalated to an agent, and truly contained (not escalated AND no contact on the same booking within 7 days on any channel).",
"schema": "chatbot_sessions(session_id, user_id, booking_id, started_at, user_turns, escalated BOOLEAN)\ncontacts(contact_id, user_id, booking_id, channel, created_at)",
"sql": "WITH s AS (\n  SELECT cs.*,\n         EXISTS (SELECT 1 FROM contacts c\n                 WHERE c.user_id = cs.user_id AND c.booking_id = cs.booking_id\n                   AND c.created_at > cs.started_at\n                   AND c.created_at <= cs.started_at + INTERVAL '7' DAY) AS recontact_7d\n  FROM chatbot_sessions cs\n  WHERE cs.started_at >= TIMESTAMP '2026-10-01 00:00:00' AND cs.started_at < TIMESTAMP '2026-11-01 00:00:00'\n)\nSELECT COUNT(*) AS sessions,\n       SUM(CASE WHEN user_turns >= 2 THEN 1 ELSE 0 END) AS engaged,\n       SUM(CASE WHEN NOT escalated THEN 1 ELSE 0 END) AS not_escalated,\n       SUM(CASE WHEN NOT escalated AND NOT recontact_7d THEN 1 ELSE 0 END) AS truly_contained,\n       ROUND(1.0 * SUM(CASE WHEN NOT escalated THEN 1 ELSE 0 END) / COUNT(*), 3) AS naive_containment,\n       ROUND(1.0 * SUM(CASE WHEN NOT escalated AND NOT recontact_7d THEN 1 ELSE 0 END) / COUNT(*), 3) AS true_containment\nFROM s",
"explain": "<p>Naive containment counts s2 (one turn, then phoned) and s4 (chatted again two days later) as successes. True containment checks for any re-contact on the same booking within 7 days. u5's email on Oct 20 is outside the window. The denominator is all sessions \u2014 better still, all eligible issues including users who never opened the bot.</p>",
"alt": "LEFT JOIN with MIN(created_at) instead of EXISTS \u2014 watch fanout if multiple contacts.",
"errors": "Using escalated flag only. Same-channel-only recontact check.",
"perf": "Correlated EXISTS is usually rewritten to a semi-join by Trino; partition-prune contacts to Oct 1\u2013Nov 8.",
"follow": [
"Add censoring for sessions in the last 7 days.",
"How would anonymous sessions bias this?"
],
"sample": "chatbot_sessions\nsession_id | user_id | booking_id | started_at          | user_turns | escalated\n-----------+---------+------------+---------------------+------------+----------\ns1         | u1      | b1         | 2026-10-01 10:00:00 | 4          | False    \ns2         | u2      | b2         | 2026-10-02 10:00:00 | 1          | False    \ns3         | u3      | b3         | 2026-10-03 10:00:00 | 5          | True     \ns4         | u4      | b4         | 2026-10-04 10:00:00 | 3          | False    \ns5         | u5      | b5         | 2026-10-05 10:00:00 | 2          | False    \n\ncontacts\ncontact_id | user_id | booking_id | channel | created_at         \n-----------+---------+------------+---------+--------------------\n1          | u2      | b2         | phone   | 2026-10-02 18:00:00\n2          | u4      | b4         | chat    | 2026-10-06 09:00:00\n3          | u5      | b5         | email   | 2026-10-20 09:00:00",
"output": "sessions | engaged | not_escalated | truly_contained | naive_containment | true_containment\n---------+---------+---------------+-----------------+-------------------+-----------------\n5        | 4       | 4             | 2               | 0.8               | 0.4             "
},
{
"id": "S11",
"title": "Local-date reporting with time zones",
"level": "Intermediate",
"topics": "UTC vs local dates, at_timezone",
"question": "Count contacts per market by local calendar date (market time zone), and compare with UTC dates.",
"schema": "contacts(contact_id, market, created_at_utc TIMESTAMP WITH TIME ZONE)\nmarkets(market, tz)",
"sql": "SELECT c.market,\n       CAST(at_timezone(c.created_at_utc, m.tz) AS DATE) AS local_date,\n       COUNT(*) AS contacts,\n       SUM(CASE WHEN CAST(at_timezone(c.created_at_utc, m.tz) AS DATE)\n                  <> CAST(c.created_at_utc AS DATE) THEN 1 ELSE 0 END) AS differs_from_utc_date\nFROM contacts c JOIN markets m ON m.market = c.market\nGROUP BY 1, 2\nORDER BY 1, 2",
"explain": "<p>20:00 UTC is 01:30 next day in India; 02:00 UTC is 19:00 the previous day in Los Angeles (PDT). Half of these contacts land on a different date in UTC \u2014 daily trend and SLA reports by market must use local dates, and the spec must say which. (DuckDB was run with session time zone UTC.)</p>",

"task": "Use each user's pre-period contact count to reduce variance in a contacts-per-user experiment.",
"code": "import numpy as np\nrng = np.random.default_rng(1)\nn = 20_000\npre = rng.poisson(1.0, n).astype(float)\ntreat = rng.integers(0, 2, n)\npost = rng.poisson(0.5 + 0.5 * pre) - 0.05 * treat            # true effect -0.05 contacts/user\n\ntheta = np.cov(pre, post)[0, 1] / np.var(pre, ddof=1)\ncuped = post - theta * (pre - pre.mean())\n\ndef diff_se(y):\n    a, b = y[treat == 1], y[treat == 0]\n    return a.mean() - b.mean(), np.sqrt(a.var(ddof=1)/a.size + b.var(ddof=1)/b.size)\n\nfor name, y in [(\"raw\", post), (\"cuped\", cuped)]:\n    d, se = diff_se(y); print(f\"{name:5s} effect={d:+.4f}  SE={se:.4f}  95% CI [{d-1.96*se:+.4f}, {d+1.96*se:+.4f}]\")\nrho = np.corrcoef(pre, post)[0, 1]\nprint(f\"corr(pre, post)={rho:.2f}  expected variance reduction ~ rho^2 = {rho**2:.0%}\")",
"explain": "\u03b8 is estimated on pooled data; the adjustment is unbiased because the pre-period covariate is unaffected by treatment. Variance falls by about \u03c1\u00b2, which is the same as needing ~\u03c1\u00b2 fewer users for the same power.",

"task": "Estimate the association between first-response time and negative CSAT, adjusting for case type, with SEs clustered by agent.",
"code": "import numpy as np, pandas as pd\nimport statsmodels.formula.api as smf\nrng = np.random.default_rng(3)\nn = 6000\ndf = pd.DataFrame({\n    \"case_type\": rng.choice([\"refund\", \"checkin\", \"dispute\"], n, p=[.5, .3, .2]),\n    \"agent\": rng.integers(0, 120, n),\n})\ncomplexity = df.case_type.map({\"refund\": 0, \"checkin\": 0.5, \"dispute\": 1.5})\ndf[\"frt_h\"] = rng.gamma(2, 1 + complexity)                     # harder cases wait longer\nlogit = -2 + 0.15 * df.frt_h + 0.8 * complexity\ndf[\"neg_csat\"] = rng.binomial(1, 1 / (1 + np.exp(-logit)))\n\nnaive = smf.ols(\"neg_csat ~ frt_h\", df).fit()\nadj = smf.ols(\"neg_csat ~ frt_h + C(case_type)\", df).fit(cov_type=\"cluster\", cov_kwds={\"groups\": df.agent})\nprint(f\"naive LPM slope per hour:    {naive.params.frt_h:.4f}\")\nprint(f\"adjusted LPM slope per hour: {adj.params.frt_h:.4f}  (cluster SE {adj.bse.frt_h:.4f})\")\nlogit_m = smf.logit(\"neg_csat ~ frt_h + C(case_type)\", df).fit(disp=0)\nprint(f\"logit avg marginal effect:   {logit_m.get_margeff().margeff[-1]:.4f}\")\nbins = pd.qcut(df.frt_h, 5)\nprint(\"mean residual by FRT quintile (non-linearity check):\",\n      df.assign(r=adj.resid).groupby(bins, observed=True).r.mean().round(3).tolist())",
"explain": "The naive slope mixes the effect of waiting with the fact that disputes both wait longer and are rated worse. Adjusting for case type shrinks it. This is still an association \u2014 unobserved complexity within case type remains. Linear probability models are easy to communicate; check against logit marginal effects. Cluster SEs by agent because cases are not independent.",
"output": "naive LPM slope per hour:    0.0475\nadjusted LPM slope per hour: 0.0311  (cluster SE 0.0024)\nlogit avg marginal effect:   0.0263\nmean residual by FRT quintile (non-linearity check): [0.018, -0.004, -0.017, 0.001, 0.002]"
},

"code": "import numpy as np\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.ensemble import HistGradientBoostingClassifier\nfrom sklearn.metrics import roc_auc_score, average_precision_score, brier_score_loss, precision_recall_curve\nfrom sklearn.calibration import calibration_curve\nrng = np.random.default_rng(0)\nn = 40_000\nX = np.column_stack([rng.normal(size=n), rng.normal(size=n), rng.integers(0, 2, n), rng.exponential(1, n)])\nlogit = -4.4 + 1.1 * X[:, 0] + 0.6 * X[:, 2] + 0.4 * X[:, 3]\ny = rng.binomial(1, 1 / (1 + np.exp(-logit)))\nXtr, Xte, ytr, yte = train_test_split(X, y, test_size=0.3, random_state=0, stratify=y)\n\nm = HistGradientBoostingClassifier(max_iter=200, learning_rate=0.05).fit(Xtr, ytr)\np = m.predict_proba(Xte)[:, 1]\nprint(f\"positive rate={yte.mean():.3f}  ROC-AUC={roc_auc_score(yte, p):.3f}  PR-AUC={average_precision_score(yte, p):.3f}  Brier={brier_score_loss(yte, p):.4f}\")\nfrac_pos, mean_pred = calibration_curve(yte, p, n_bins=5, strategy=\"quantile\")\nprint(\"calibration (pred -> actual):\", [f\"{a:.3f}->{b:.3f}\" for a, b in zip(mean_pred, frac_pos)])\n\nC_FN, C_FP = 20.0, 2.0          # cost of a missed escalation vs an unnecessary specialist review (illustrative)\nthr = C_FP / (C_FP + C_FN)      # optimal if probabilities are calibrated\nprec, rec, t = precision_recall_curve(yte, p)\ni = np.searchsorted(t, thr)\nprint(f\"cost-optimal threshold={thr:.3f}: precision={prec[i]:.2f} recall={rec[i]:.2f} flagged={np.mean(p >= thr):.1%}\")",

"title": "Forecast hourly ticket volume: seasonal naive vs gradient boosting",
"deps": "numpy, pandas, scikit-learn",
"task": "Forecast next week's hourly volume with a rolling-origin-style holdout; compare to the seasonal naive baseline with WAPE.",
"code": "import numpy as np, pandas as pd\nfrom sklearn.ensemble import HistGradientBoostingRegressor\nrng = np.random.default_rng(5)\nidx = pd.date_range(\"2026-07-01\", periods=24 * 7 * 12, freq=\"h\")\nhour, dow = idx.hour.values, idx.dayofweek.values\ntrend = np.linspace(1.0, 1.15, idx.size)\nlevel = 80 * trend * (1 + 0.6 * np.sin((hour - 6) / 24 * 2 * np.pi)) * np.where(dow >= 5, 1.2, 1.0)\ny = rng.poisson(level)\ndf = pd.DataFrame({\"y\": y, \"hour\": hour, \"dow\": dow, \"t\": np.arange(idx.size)}, index=idx)\ndf[\"lag_168\"] = df.y.shift(168)                      # same hour last week\ndf[\"lag_336\"] = df.y.shift(336)\ndf = df.dropna()\n\ntest = df.iloc[-168:]; train = df.iloc[:-168]\nfeats = [\"hour\", \"dow\", \"t\", \"lag_168\", \"lag_336\"]\ngbm = HistGradientBoostingRegressor(max_iter=300, learning_rate=0.05).fit(train[feats], train.y)\npred_gbm = gbm.predict(test[feats]); pred_naive = test.lag_168.values\n\nwape = lambda a, f: np.abs(a - f).sum() / a.sum()\nprint(f\"WAPE seasonal naive: {wape(test.y.values, pred_naive):.3f}\")\nprint(f\"WAPE gradient boost: {wape(test.y.values, pred_gbm):.3f}\")\nunder = np.mean(pred_gbm < test.y.values)\nprint(f\"share of hours under-forecast by GBM: {under:.0%}  -> staff to an upper quantile, not the mean\")",
"explain": "Always beat seasonal naive before shipping a model. Trees can't extrapolate trend \u2014 the 't' feature helps only within the training range, which is why lag features carry most signal. For staffing, under-forecasting is costlier: train a quantile model (loss='quantile') for P80/P90.",
"output": "WAPE seasonal naive: 0.110\nWAPE gradient boost: 0.095\nshare of hours under-forecast by GBM: 51%  -> staff to an upper quantile, not the mean"

"id": "P8",
"title": "Anomaly detection on daily refund-contact rate (robust z on seasonal baseline)",
"deps": "numpy, pandas",
"task": "Flag days where refund-contact rate deviates from a same-weekday baseline, using a robust z-score and a persistence rule.",
"code": "import numpy as np, pandas as pd\nrng = np.random.default_rng(11)\ndays = pd.date_range(\"2026-07-01\", \"2026-10-20\", freq=\"D\")\nbase = 2.0 + 0.3 * (days.dayofweek >= 5)                     # weekends higher\nrate = base + rng.normal(0, 0.08, days.size)\nrate[days >= \"2026-10-14\"] += 0.45                             # real shift starting Oct 14\nrate[days == pd.Timestamp(\"2026-09-02\")] += 0.6                # one-day blip\ns = pd.Series(rate, index=days)\n\ndef robust_z(series, weeks=6):\n    out = pd.Series(np.nan, index=series.index)\n    for d in series.index:\n        hist = series[(series.index < d) & (series.index.dayofweek == d.dayofweek)].tail(weeks)\n        if len(hist) == weeks:\n            med = hist.median(); mad = max(1.4826 * (hist - med).abs().median(), 0.10)  # floor the scale\n            out[d] = (series[d] - med) / mad\n    return out\n\nz = robust_z(s)\nflag = z.abs() > 3.5\npersistent = flag & flag.shift(1, fill_value=False)           # 2 consecutive days\nprint(\"single-day flags:\", [d.strftime(\"%m-%d\") for d in z.index[flag]])\nprint(\"persistent alerts:\", [d.strftime(\"%m-%d\") for d in z.index[persistent]])",
"explain": "Same-weekday baselines remove weekly seasonality; median/MAD resist past outliers, and a floor on the scale stops a tiny MAD estimated from 6 points turning noise into alerts. The shift starts Oct 14: single-day flags begin Oct 15 and the persistent alert fires Oct 16 \u2014 the persistence rule suppresses the Sep 2 blip at the cost of a two-day detection delay. Oct 18 is missed because shifted days start entering the same-weekday baseline; production systems exclude flagged points from baselines.",
"output": "single-day flags: ['09-02', '10-15', '10-16', '10-17', '10-19', '10-20']\npersistent alerts: ['10-16', '10-17', '10-20']"
},

"code": "import numpy as np, pandas as pd\nimport statsmodels.formula.api as smf\nrng = np.random.default_rng(21)\nrows = []\nfor region, base in [(\"A\", 0.120), (\"B\", 0.110)]:\n    for week in range(1, 17):\n        seasonal = -0.0006 * week                                  # common improvement over time\n        effect = -0.015 if (region == \"A\" and week >= 9) else 0.0\n        n = 200_000\n        rows.append((region, week, rng.binomial(n, base + seasonal + effect) / n, n))\ndf = pd.DataFrame(rows, columns=[\"region\", \"week\", \"repeat_rate\", \"n\"])\ndf[\"treated\"] = (df.region == \"A\").astype(int); df[\"post\"] = (df.week >= 9).astype(int)\n\ndid = smf.wls(\"repeat_rate ~ treated * post\", df, weights=df.n).fit()\nprint(f\"DiD estimate: {did.params['treated:post']:+.4f} (SE {did.bse['treated:post']:.4f})\")\n\ndf[\"rel\"] = df.week - 9\nes = smf.wls(\"repeat_rate ~ C(week) + treated + \" +\n             \" + \".join(f\"I((treated==1)&(rel=={k}))\" for k in range(-8, 8) if k != -1), df, weights=df.n).fit()\nleads = {k: es.params[f\"I((treated == 1) & (rel == {k}))[T.True]\"] for k in range(-8, -1)}\nprint(\"pre-period coefficients (should be ~0):\", {k: round(v, 4) for k, v in leads.items()})",

const SQLK = new Set("select from where join left right inner outer full cross on and or not as with group by order having case when then else end distinct count sum avg min max over partition rows range between preceding following current row unbounded union all in is null limit interval day hour minute date timestamp cast coalesce nullif exists true false desc asc create table values lag lead row_number rank approx_percentile date_diff date_trunc date_format unnest sequence at_timezone explain analyze".split(" "));
const PYK = new Set("import from as def return for in if else elif while with lambda print True False None and or not is class try except range len np pd".split(" "));
function highlight(code, lang){
  const re = lang==="sql" ? /(--[^\n]*)|('(?:[^']|'')*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)|([\s\S])/g
                          : /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(\b\d[\d_]*(?:\.\d+)?(?:e-?\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)|([\s\S])/g;
  let out = "", m;
  while((m = re.exec(code))){
    if(m[1]) out += '<span class="c">'+esc(m[1])+'</span>';
    else if(m[2]) out += '<span class="s">'+esc(m[2])+'</span>';
    else if(m[3]) out += '<span class="n">'+esc(m[3])+'</span>';
    else if(m[4]){ const w=m[4]; const k = lang==="sql" ? SQLK.has(w.toLowerCase()) : PYK.has(w);
      const isFn = !k && code[re.lastIndex]==="(";
      out += k ? '<span class="k">'+esc(w)+'</span>' : isFn ? '<span class="f">'+esc(w)+'</span>' : esc(w); }
    else out += esc(m[5]);
  }
  return out;
}
function decorateCode(root){

    if(lang!=="txt") pre.innerHTML = highlight(code, lang==="py"?"py":"sql");
    const b = document.createElement("button"); b.className="copy"; b.textContent="Copy"; b.type="button";
    b.onclick = () => { const txt = code; (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>toast("Copied"), ()=>{ const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); toast("Copied");}catch(e){toast("Copy failed — select manually");} ta.remove(); }); };
    pre.appendChild(b);
  });
}

function wireBookmarks(root){ $$("[data-bm]", root).forEach(b=>b.onclick=e=>{ e.preventDefault(); e.stopPropagation(); const k=b.dataset.bm; if(S.bm[k]) delete S.bm[k]; else S.bm[k]={label:b.dataset.label, href:location.hash}; save(); b.classList.toggle("on"); b.textContent=S.bm[k]?"★":"☆"; toast(S.bm[k]?"Bookmarked":"Bookmark removed"); }); }
function totalSections(){ return MODULES.reduce((a,m)=>a+m.sections.length,0); }
function doneSections(mid){ const m = MODULES.find(x=>x.id===mid); return m.sections.filter(s=>S.done[mid+"/"+s.id]).length; }
function quizStats(){ const by={}; QUIZ.forEach(q=>{ const r=S.quiz[q.id]; if(!r || (q.type==="short" && r.graded===undefined)) return; by[q.topic]=by[q.topic]||{c:0,n:0}; by[q.topic].n++; if(r.correct) by[q.topic].c++; }); return by; }
function mockStats(){ const dims = RUBRIC.map(()=>({s:0,n:0})); const byTrack={}; S.mock.forEach(m=>{ m.scores.forEach((v,i)=>{dims[i].s+=v; dims[i].n++;}); const avg=m.scores.reduce((a,b)=>a+b,0)/m.scores.length; byTrack[m.track]=byTrack[m.track]||{s:0,n:0}; byTrack[m.track].s+=avg; byTrack[m.track].n++; }); return {dims, byTrack}; }
function weakTopics(){
  const w = [];
  const qs = quizStats(); Object.entries(qs).forEach(([t,v])=>{ if(v.n>=2 && v.c/v.n < 0.7) w.push({label:`Quiz: ${t} (${v.c}/${v.n})`, href:"#m/"+(QUIZ_TOPIC_MOD[t]||"m2")}); });
  const ms = mockStats(); ms.dims.forEach((d,i)=>{ if(d.n && d.s/d.n < 3.5) w.push({label:`Mock dimension: ${RUBRIC[i]} (avg ${(d.s/d.n).toFixed(1)})`, href:"#mock"}); });
  Object.entries(ms.byTrack).forEach(([t,v])=>{ if(v.s/v.n < 3.5) w.push({label:`Mock track ${t}: ${TRACKS[t]} (avg ${(v.s/v.n).toFixed(1)})`, href:"#mock"}); });
  const rev = Object.entries(S.qstat).filter(([k,v])=>v==="review").length; if(rev) w.push({label:`${rev} question(s) marked Review`, href:"#revision"});
  return w;
}
function bar(p){ return `<div class="bar"><span style="width:${Math.round(p*100)}%"></span></div>`; }

function vKPI(){

function vQuiz(topic){
  const topics=[...new Set(QUIZ.map(q=>q.topic))];
  const tsel = topic ? decodeURIComponent(topic) : "";
  const items = tsel==="diag" ? QUIZ.filter(q=>q.diag) : tsel ? QUIZ.filter(q=>q.topic===tsel) : QUIZ;
  const qs = quizStats();
  let h = `<h1>Quizzes</h1><p class="lede">Multiple-choice, numerical, scenario and short-answer items. Answers are revealed only after you submit. Short answers are self-graded against a model answer — there is no AI grading here.</p>
  <div class="sectionbar"><a class="btn ${!tsel?"on":""}" href="#quiz">All (${QUIZ.length})</a><a class="btn ${tsel==="diag"?"on":""}" href="#quiz/diag">Diagnostic (${QUIZ.filter(q=>q.diag).length})</a>${topics.map(t=>`<a class="btn ${tsel===t?"on":""}" href="#quiz/${encodeURIComponent(t)}">${esc(t)}${qs[t]?` · ${qs[t].c}/${qs[t].n}`:""}</a>`).join("")}<button class="btn" id="quizReset">Clear these answers</button></div>`;
  items.forEach((q,i)=>{ const r=S.quiz[q.id];
    h += `<div class="qcard" data-quiz="${q.id}"><div class="qmeta"><span class="tag">${esc(q.topic)}</span><span class="tag">${q.type}</span></div><div class="qtitle">${i+1}. ${esc(q.q)}</div>`;
    if(q.type==="mcq"||q.type==="scenario") h += q.opts.map((o,j)=>`<label class="opt ${r?(j===q.ans?"correct":(r.choice===j?"wrong":"")):""}"><input type="radio" name="z-${q.id}" value="${j}" ${r&&r.choice===j?"checked":""} ${r?"disabled":""}> ${esc(o)}</label>`).join("");
    else if(q.type==="num") h += `<input type="number" step="any" data-num="${q.id}" ${r?`value="${esc(r.value)}" disabled`:""} placeholder="Your answer">`;
    else h += `<textarea data-short="${q.id}" style="min-height:80px" ${r?"disabled":""}>${esc(r?r.text:"")}</textarea>`;
    h += `<div class="qactions">${r?"":`<button class="btn small primary" data-submit="${q.id}">Submit</button>`}</div><div data-fb="${q.id}">${r?feedback(q,r):""}</div></div>`; });

function feedback(q,r){
  if(q.type==="short") return r.graded===undefined ? `<div class="callout"><b>Model answer</b>${esc(q.model)}</div><div class="qactions"><button class="btn small" data-grade="${q.id}" data-v="1">I covered this</button><button class="btn small" data-grade="${q.id}" data-v="0">I missed parts</button></div>`
    : `<div class="callout ${r.correct?"ok":"bad"}"><b>${r.correct?"Self-graded: covered":"Self-graded: missed parts"}</b>${esc(q.model)}</div>`;

  return `<div class="callout ${r.correct?"ok":"bad"}"><b>${r.correct?"Correct":"Not quite"}${q.type==="num"?` — answer ≈ ${q.ans}`:""}</b>${esc(q.explain)}${extra}</div>`;
}

function startMock(track){
  const pool = QUESTIONS.filter(q=>q.track==track);

  const ids = pool.map(q=>[q.id,weight(q)]).sort((a,b)=>a[1]-b[1]).slice(0,6).map(x=>x[0]);
  mockState={track:+track, ids, i:0, revealed:false, answer:""}; rerender();
}

}

/* ---------- search ---------- */
let INDEX = null;
function buildIndex(){
  INDEX = [];
  MODULES.forEach(m=>m.sections.forEach(s=>INDEX.push({type:"Lesson", title:`${m.n}. ${m.short} — ${s.title}`, text:strip(s.html), href:`#m/${m.id}/${s.id}`})));
  QUESTIONS.forEach(q=>INDEX.push({type:"Question", title:`${q.id}: ${q.q}`, text:[q.skill,q.why,...q.strong,...q.mistakes,...q.follow,q.model?strip(q.model.verbal+" "+q.model.html):""].join(" "), href:`#q/${q.id}`}));
  SQLX.forEach(x=>INDEX.push({type:"SQL", title:`${x.id}: ${x.title}`, text:x.question+" "+x.topics+" "+x.sql+" "+strip(x.explain), href:`#sql/${x.id}`}));
  PYX.forEach(x=>INDEX.push({type:"Python", title:`${x.id}: ${x.title}`, text:x.task+" "+x.code+" "+x.explain, href:`#python/${x.id}`}));
  FORMULAS.forEach(f=>INDEX.push({type:"Formula", title:strip(f[1]), text:strip(f.join(" ")), href:"#formulas"}));
  KPI.forEach(k=>INDEX.push({type:"KPI", title:k.name, text:Object.values(k).join(" "), href:"#kpi"}));
  QUIZ.forEach(q=>INDEX.push({type:"Quiz", title:q.q, text:q.explain||q.model||"", href:"#quiz/"+encodeURIComponent(q.topic)}));
  [["Role assessment",OVERVIEW_HTML,"#overview"],["Interview-notes analysis",IMAGE_HTML,"#image"]].forEach(([t,h,href])=>INDEX.push({type:"Page", title:t, text:strip(h), href}));
}
function doSearch(term){
  if(!INDEX) buildIndex();
  const t = term.toLowerCase().trim(); const words=t.split(/\s+/).filter(Boolean);
  const res = INDEX.map(it=>{ const hay=(it.title+" "+it.text).toLowerCase(); if(!words.every(w=>hay.includes(w))) return null; const score=words.reduce((a,w)=>a+(it.title.toLowerCase().includes(w)?5:0)+1,0); return {it,score}; }).filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,60);
  const snip = txt => { const lo=txt.toLowerCase(); const i=lo.indexOf(words[0]); const s=Math.max(0,i-70); let sn=esc(txt.slice(s, s+200)); words.forEach(w=>{ sn=sn.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"), m=>`<mark>${m}</mark>`); }); return (s>0?"…":"")+sn+"…"; };
  content.innerHTML = `<h1>Search: "${esc(term)}"</h1><p class="muted">${res.length} result(s)${res.length===60?" (top 60)":""}</p><div class="searchres">${res.map(r=>`<a href="${r.it.href}"><span class="tag">${r.it.type}</span> <b>${esc(r.it.title)}</b><br><small>${snip(r.it.text)}</small></a>`).join("")}</div>`;
  $$(".searchres a").forEach(a=>a.onclick=()=>{ $("#search").value=""; });
}
$("#search").addEventListener("input", e=>{ const v=e.target.value; clearTimeout(doSearch._t); if(v.trim().length<2){ if(doSearch._active){ doSearch._active=false; route(); } return; } doSearch._t=setTimeout(()=>{ doSearch._active=true; doSearch(v); },180); });
$("#search").addEventListener("keydown", e=>{ if(e.key==="Escape"){ e.target.value=""; doSearch._active=false; route(); } });

/* ---------- router ---------- */
function vNotFound(){ return `<h1>Not found</h1><p><a href="#home">Back to dashboard</a></p>`; }
function rerender(){ route(true); }
function route(keepScroll){
  const parts = (location.hash.slice(1)||"home").split("/");
  const [v,a,b] = parts; let html, wire=null;
  switch(v){
    case "home": html=vHome(); wire=wireHome; break;
    case "overview": html=vOverview(); break;
    case "image": html=vImage(); break;
    case "plan": html=vPlan(); wire=wirePlan; break;
    case "m": html=vModule(a); wire=wireModule; break;
    case "questions": html=vQuestions(); wire=wireQuestions; break;
    case "q": html=vQ(a); wire=()=>wireQ(content); break;
    case "sql": html=vSQL(); wire=wireSQL; break;
    case "python": html=vPython(); break;
    case "formulas": html=vFormulas(); break;
    case "kpi": html=vKPI(); wire=wireKPI; break;
    case "quiz": html=vQuiz(a); wire=wireQuiz; break;
    case "cases": html=vCases(); wire=wireCases; break;
    case "ai": html=vAI(); wire=()=>{ wireAI(); wireQ(content); }; break;
    case "mock": html=vMock(); wire=wireMock; break;
    case "stories": html=vStories(); wire=wireStories; break;
    case "bookmarks": html=vBookmarks(); wire=wireBookmarksView; break;
    case "revision": html=vRevision(); wire=()=>wireQ(content); break;
    case "readiness": html=vReadiness(); break;
    default: html=vNotFound();
  }
  const y = window.scrollY;
  content.innerHTML = html; renderNav(); decorateCode(content); wireBookmarks(content); if(v==="m") wireQ(content); if(wire) wire();
  if(keepScroll===true) window.scrollTo(0,y);
  else {
    const target = v==="m"&&b ? $("#sec-"+b) : (v==="sql"&&a ? $("#sql-"+a) : (v==="python"&&a ? $("#py-"+a) : null));
    if(target){ target.scrollIntoView(); if(v!=="m") target.querySelectorAll("details").forEach(d=>d.open=true); } else window.scrollTo(0,0);
    content.focus({preventScroll:true});
  }
}
window.addEventListener("hashchange", ()=>{ doSearch._active=false; $("#search").value=""; route(); });
route();
})();

</script>
