<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airbnb Lead Analytics Prep</title>
<style>
:root{
  --bg:#f7f6f3;--panel:#ffffff;--panel2:#f1efea;--text:#1d1d1f;--muted:#5f5d58;--line:#e2dfd8;
  --accent:#c4364b;--accent2:#1f6f78;--accentSoft:#fbe9ec;--ok:#2e7d4f;--okSoft:#e6f3ea;--warn:#a86400;--warnSoft:#fdf1dc;
  --bad:#b3261e;--badSoft:#fbe7e6;--code:#1e1f24;--codeText:#e8e6e3;--kw:#ff8fa3;--fn:#7cd3d9;--str:#b5e08a;--num:#f6c177;--com:#8a8f98;
  --shadow:0 1px 2px rgba(0,0,0,.05);--r:10px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --bg:#141518;--panel:#1c1d21;--panel2:#24262b;--text:#ecebe8;--muted:#a6a39c;--line:#33353b;
  --accent:#ff6b81;--accent2:#5cc3cc;--accentSoft:#3a1f25;--ok:#6fcf97;--okSoft:#1d3326;--warn:#f2b45a;--warnSoft:#3a2d17;--bad:#ff8a80;--badSoft:#3b1e1c;
  --code:#0f1013;--shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;font-size:15.5px}
a{color:var(--accent2)}
#app{display:flex;min-height:100vh}
#sidebar{width:280px;flex:0 0 280px;background:var(--panel);border-right:1px solid var(--line);height:100vh;position:sticky;top:0;overflow-y:auto;padding:14px 10px 40px}
#sidebar .brand{font-weight:700;font-size:15px;padding:6px 10px 2px}
#sidebar .brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
#sidebar .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 10px 4px}
#sidebar a.nav{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;color:var(--text);text-decoration:none;font-size:14px}
#sidebar a.nav:hover{background:var(--panel2)}
#sidebar a.nav.active{background:var(--accentSoft);color:var(--accent);font-weight:600}
#sidebar a.nav .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:0 0 8px}
#sidebar a.nav .dot.done{background:var(--ok)}
main{flex:1;min-width:0}
#topbar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;padding:10px 24px}
#menuBtn{display:none}
#search{flex:1;max-width:520px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:14px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;font-family:inherit}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:3px 9px;font-size:12.5px}
.btn.on{background:var(--accentSoft);color:var(--accent);border-color:var(--accent)}
#content{padding:26px 32px 80px;max-width:1040px}
h1{font-size:27px;line-height:1.25;margin:0 0 6px}
h2{font-size:21px;margin:34px 0 10px;padding-top:6px;border-top:1px solid var(--line)}
h2:first-of-type{border-top:none}
h3{font-size:17px;margin:22px 0 6px}
h4{font-size:15px;margin:16px 0 4px}
p{margin:8px 0}
.lede{color:var(--muted);font-size:16px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:12px 0;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.stat{font-size:28px;font-weight:700}
.stat small{font-size:13px;color:var(--muted);font-weight:400;display:block}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);margin-right:4px;white-space:nowrap}
.tag.P0{background:var(--badSoft);color:var(--bad);border-color:transparent}
.tag.P1{background:var(--warnSoft);color:var(--warn);border-color:transparent}
.tag.P2{background:var(--panel2)}
.tag.model{background:var(--okSoft);color:var(--ok);border-color:transparent}
.callout{border-left:4px solid var(--accent2);background:var(--panel2);padding:10px 14px;border-radius:0 8px 8px 0;margin:12px 0}
.callout.warn{border-color:var(--warn);background:var(--warnSoft)}
.callout.bad{border-color:var(--bad);background:var(--badSoft)}
.callout.ok{border-color:var(--ok);background:var(--okSoft)}
.callout b:first-child{display:block;margin-bottom:2px}
table{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{background:var(--panel2);font-weight:600}
pre{position:relative;background:var(--code);color:var(--codeText);padding:14px 16px;border-radius:8px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.5;margin:10px 0;white-space:pre}
pre .copy{position:absolute;top:6px;right:6px;font-size:11px;padding:2px 8px;border-radius:5px;border:1px solid #444;background:#2a2b30;color:#ddd;cursor:pointer;font-family:var(--font)}
pre.diagram{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
code{font-family:var(--mono);font-size:.9em;background:var(--panel2);padding:1px 5px;border-radius:4px}
pre code{background:none;padding:0}
.k{color:var(--kw);font-weight:600}.f{color:var(--fn)}.s{color:var(--str)}.n{color:var(--num)}.c{color:var(--com);font-style:italic}
.formula{font-family:Georgia,"Times New Roman",serif;font-size:17px;background:var(--panel2);padding:10px 14px;border-radius:8px;margin:8px 0;overflow-x:auto}
details{border:1px solid var(--line);border-radius:8px;margin:8px 0;background:var(--panel)}
details>summary{cursor:pointer;padding:9px 12px;font-weight:600;list-style:none}
details>summary::before{content:"▸ ";color:var(--muted)}
details[open]>summary::before{content:"▾ "}
details>.body{padding:2px 14px 12px}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin:10px 0}
.qcard .qtitle{font-weight:600;margin-bottom:6px}
.qmeta{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:6px}
.qactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.filters select,.filters input{padding:6px 9px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:13.5px}
textarea{width:100%;min-height:150px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-family:inherit;font-size:14.5px}
input[type=text],input[type=number]{padding:7px 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:14px}
.opt{display:block;padding:8px 11px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer;background:var(--panel)}
.opt.correct{border-color:var(--ok);background:var(--okSoft)}
.opt.wrong{border-color:var(--bad);background:var(--badSoft)}
.bar{height:8px;background:var(--panel2);border-radius:5px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent2)}
.rubric{display:grid;grid-template-columns:170px 1fr 30px;gap:6px 10px;align-items:center;margin:10px 0}
.plan-day{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin:10px 0}
.plan-day header{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.plan-day header label{display:flex;gap:8px;align-items:center;font-weight:600;flex:1;cursor:pointer}
.plan-day .pd{padding:8px 16px 12px;font-size:14.5px}
.plan-day .pd div{margin:3px 0}
.muted{color:var(--muted)}
.kpitree ul{list-style:none;padding-left:18px;border-left:1px dashed var(--line);margin:4px 0}
.kpitree>ul{border-left:none;padding-left:0}
.kpitree li{margin:4px 0}
.kpinode{display:inline-block;padding:3px 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:14px}
.kpinode:hover,.kpinode.sel{border-color:var(--accent);color:var(--accent)}
.kpinode.ns{background:var(--accentSoft);font-weight:700}
#kpiDetail{position:sticky;top:70px}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
.step{display:flex;gap:12px;margin:10px 0}
.step .num{flex:0 0 28px;height:28px;border-radius:50%;background:var(--accent2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.searchres a{display:block;padding:8px 10px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--text)}
.searchres a:hover{background:var(--panel2)}
.searchres small{color:var(--muted)}
mark{background:var(--warnSoft);color:inherit;padding:0 1px}
.toast{position:fixed;bottom:18px;right:18px;background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.bm{cursor:pointer;border:none;background:none;font-size:17px;color:var(--muted);padding:0 4px}
.bm.on{color:var(--warn)}
.sectionbar{display:flex;gap:8px;align-items:center;margin:4px 0 18px;flex-wrap:wrap}
@media (max-width:860px){
  #sidebar{position:fixed;left:-300px;z-index:30;transition:left .2s;box-shadow:0 0 30px rgba(0,0,0,.2)}
  #sidebar.open{left:0}
  #menuBtn{display:inline-block}
  #content{padding:18px 16px 70px}
  #topbar{padding:10px 16px}
  .two{grid-template-columns:1fr}
  #kpiDetail{position:static}
  .rubric{grid-template-columns:120px 1fr 26px}
}
@media print{
  #sidebar,#topbar,.qactions,.btn,.copy,.sectionbar .btn{display:none!important}
  body{background:#fff;color:#000;font-size:12px}
  #content{max-width:none;padding:0}
  details{border:none}details>.body{display:block!important}
  pre{white-space:pre-wrap;background:#f4f4f4;color:#000;border:1px solid #ccc}
  .k,.f,.s,.n,.c{color:#000}
  .card,.qcard{break-inside:avoid}
}
</style>
</head>
<body>
<div id="app">
<nav id="sidebar" aria-label="Main navigation"></nav>
<main>
  <div id="topbar">
    <button class="btn" id="menuBtn" aria-label="Open menu">☰</button>
    <input id="search" type="search" placeholder="Search lessons, questions, SQL, formulas…" aria-label="Search">
    <button class="btn" id="themeBtn" title="Toggle theme">◐ Theme</button>
    <button class="btn" id="printBtn" title="Print this page">Print</button>
  </div>
  <div id="content" tabindex="-1"></div>
</main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
/* ===================== CURRICULUM MODULES (part A) ===================== */
const MODULES = [];

MODULES.push({id:"m1",n:1,title:"Airbnb business & Community Support analytics",short:"Airbnb & Support",
summary:"How the guest–host marketplace generates support demand, what support is for, and why 'fewer contacts' is not the goal.",
sections:[
{id:"facts",title:"Facts vs. assumptions — read this first",html:`
<div class="callout warn"><b>Ground rule for this whole course</b>
Public facts (from the job description and Airbnb's public product): Airbnb is a two-sided marketplace of guests and hosts; Community Support sits within an Analytics Centre of Excellence (ACOE) that serves functions including payments, trust, digital, customer support, hosting, sales, compliance, risk, platforms and partnerships; the role designs metrics, builds tools and reusable datasets, partners with Strategic Finance, DE/AE, DS, Product and Ops, and integrates LLMs and agents into analytics. Airbnb publicly operates guest and host protection programmes (AirCover), cancellation policies chosen by hosts, a Help Center, in-app messaging and 24/7 safety support.</div>
<p><b>Everything else in this course about internal systems — table names, metric names, team structures, routing logic, cost per contact — is an <i>illustrative assumption</i></b>, built to resemble how large support organisations work. In the interview, say so too: "I'll assume contacts are logged at a case level with channel and case-type attributes — correct me if your model differs." Interviewers reward explicit assumptions; they penalise confident invention.</p>`},
{id:"marketplace",title:"The two-sided marketplace and where support demand comes from",html:`
<h3>Intuition</h3>
<p>A support contact is the visible symptom of a <i>gap between expectation and outcome</i> somewhere in the trip lifecycle. Because Airbnb sits between two parties who do not know each other, many gaps involve <b>both sides</b> — a guest's refund request is a host's payout reduction. Support is therefore not only a service function; it is a <b>trust-arbitration function</b> for the marketplace.</p>
<pre class="diagram">TRIP LIFECYCLE ─────────────────────────────────────────────────────────────▶
 Search/Book ──▶ Pre-trip ─────▶ Check-in ──────▶ Stay ─────────▶ Post-trip
 payment fail     changes,        access codes,     listing not      reviews,
 ID verification  cancellations   host no-show      as described,    damage claims,
 price confusion  (guest/host),   early/late        noise, safety,   refunds, payouts,
                  policy Qs       arrival           disputes         tax/invoice Qs
 GUEST contacts ◀─────────── shared disputes ───────────▶ HOST contacts
                 (one event can generate contacts from BOTH sides)</pre>
<h3>Demand drivers (a mental model, not Airbnb data)</h3>
<table><tr><th>Driver</th><th>Mechanism</th><th>Analytical signature</th></tr>
<tr><td>Volume</td><td>More bookings / trips in progress → more contacts</td><td>Contacts rise, contact <i>rate</i> flat</td></tr>
<tr><td>Mix</td><td>More international, longer stays, new hosts, peak-season</td><td>Rate rises overall, flat within segments (mix effect)</td></tr>
<tr><td>Product change / bug</td><td>A release breaks a flow (payments, messaging, check-in)</td><td>Step change on a date, concentrated in one case type/platform/app version</td></tr>
<tr><td>Policy change</td><td>New refund/cancellation rule creates questions or disputes</td><td>Step change in a policy-related case type, often one geography</td></tr>
<tr><td>External shock</td><td>Weather, travel disruption, local regulation</td><td>Spike concentrated by geography & date, cancellation case types</td></tr>
<tr><td>Support failure</td><td>Backlog, poor resolution → repeat contacts</td><td>Repeat-contact share rises; unique-contactor rate flat</td></tr>
<tr><td>Measurement</td><td>Logging, dedup, channel taxonomy change</td><td>Change appears in one source only; doesn't reconcile with bookings/finance</td></tr></table>`},
{id:"role",title:"What support is for: trust, retention, booking completion",html:`
<p>A Lead should be able to state support's purpose as an <b>objective function with constraints</b>, not as "reduce cost":</p>
<div class="formula">maximise &nbsp; Community trust &amp; lifetime value (guests + hosts) &nbsp; subject to &nbsp; cost per trip ≤ budget, safety SLAs met, policy compliance</div>
<ul>
<li><b>Trust:</b> guests book strangers' homes because there is a credible backstop when things go wrong. A good resolution of a bad stay can preserve future bookings.</li>
<li><b>Retention:</b> a guest with an unresolved refund dispute, or a host who feels unfairly penalised, is at risk of churning — and host churn reduces supply for everyone.</li>
<li><b>Booking completion:</b> pre-booking contacts (payment, verification) block revenue directly; speed matters most here.</li>
<li><b>Community experience &amp; safety:</b> safety-sensitive cases are not efficiency problems; they have hard SLAs and should be excluded from cost-cutting automation by design.</li>
</ul>
<div class="callout"><b>Lead-level framing</b>Support quality is a <i>marketplace health</i> lever. The analytics team's job is to price that lever: what is a resolved case worth in retained guest/host value vs. what it costs?</div>`},
{id:"avoidable",title:"Contact demand, avoidable contacts, and the 'fewer contacts' trap",html:`
<h3>Avoidable contact — a definition you can defend</h3>
<p>A contact is <b>avoidable</b> if a reasonable product, policy or communication change <i>upstream</i> could have prevented the need for it without degrading the outcome for the user. Operationalise it as a taxonomy, not a single flag:</p>
<table><tr><th>Bucket</th><th>Example</th><th>Owner</th></tr>
<tr><td>Information-seeking (self-serviceable)</td><td>"When will my refund arrive?"</td><td>Product / Help Center</td></tr>
<tr><td>Status-chasing</td><td>Second contact about the same open case</td><td>Support ops (proactive updates)</td></tr>
<tr><td>Product defect</td><td>Payment failed but card charged</td><td>Engineering</td></tr>
<tr><td>Policy confusion</td><td>Misunderstood cancellation policy</td><td>Policy / content</td></tr>
<tr><td>Unavoidable / valuable</td><td>Safety incident, genuine dispute needing judgment</td><td>Support specialists</td></tr></table>
<p><b>How to classify at scale:</b> case-type taxonomy + text classification (LLM or supervised) on the first message, validated against a human-labelled gold set; measure precision/recall per bucket and report avoidable share with a confidence interval, not a point estimate.</p>
<h3>Why minimising contacts is a trap (Goodhart in action)</h3>
<ul><li>Hide the contact-us button → contacts fall, unresolved problems rise, churn and chargebacks rise later.</li>
<li>Deflect to a bot that "contains" users who simply give up → containment up, satisfaction and retention down.</li>
<li>Safety: suppressing contact paths for a safety-adjacent issue is an unacceptable risk regardless of savings.</li></ul>
<p>The correct target is <b>avoidable contacts per trip</b> together with <b>resolution quality guardrails</b> (repeat contacts, reopen rate, CSAT/NPS-type signals, downstream rebooking/churn).</p>`},
{id:"selfservice",title:"Self-service vs agent-assisted; operations feedback loops",html:`
<p><b>Self-service</b> (Help Center, guided flows, AI assistant) is cheap per interaction but its success is hard to observe: the user's silence can mean "solved" or "gave up". <b>Agent-assisted</b> is expensive but observable and better for judgment-heavy cases.</p>
<p>Define <b>true self-service resolution</b> carefully: a self-service journey for issue <i>i</i> counts as resolved only if (a) the user reached a terminal resolution state or confirmed resolution, AND (b) no contact about the same issue/booking within <i>k</i> days (e.g. 7), AND (c) no adverse downstream event (chargeback, cancellation, negative review mentioning the issue) within the window.</p>
<pre class="diagram">Product / Policy ──changes──▶ Contact demand ──▶ Self-service ──fail──▶ Agent queue
      ▲                                              │ success              │
      │                                              ▼                      ▼
      └──── insights: top avoidable drivers ◀── Analytics ◀── outcomes, CSAT, repeats, cost</pre>
<p>The analytics function closes the loop by ranking avoidable drivers by <b>(volume × cost × experience impact)</b> and routing them to the owning team with a measurable target.</p>`},
{id:"conflicts",title:"Guest vs host conflicts and how support analytics connects to other teams",html:`
<p><b>Why outcomes conflict:</b> a refund to a guest is a payout reduction to a host; strict enforcement of a guest-favourable policy can reduce host supply; fast "auto-approve" refunds raise guest CSAT and may raise fraud/abuse. Every metric should therefore be cut by <b>side (guest/host)</b> and you should report <b>both sides' outcomes</b> for any policy or workflow change.</p>
<table><tr><th>Partner</th><th>What they need from Support Analytics</th></tr>
<tr><td>Product</td><td>Top avoidable drivers by flow; impact measurement of fixes; experiment design</td></tr>
<tr><td>Operations</td><td>Forecasts for staffing, SLA/backlog monitoring, routing and quality metrics</td></tr>
<tr><td>Strategic Finance</td><td>Cost per contact/resolution, savings attribution, investment ROI, refund liability</td></tr>
<tr><td>Trust &amp; Safety</td><td>Safety case SLAs, abuse/fraud signals in refund patterns, guardrails on automation</td></tr>
<tr><td>Data Science</td><td>Causal methods, forecasting models, classification models; shared standards</td></tr>
<tr><td>DE / Analytics Eng.</td><td>Source contracts, certified datasets, semantic layer, freshness SLAs</td></tr></table>`},
{id:"cases",title:"Case studies (illustrative)",html:`
<details><summary>Case 1 — Contact rate +20% month over month</summary><div class="body">
<p><b>Structure:</b> (1) Validate the metric — numerator and denominator sources, logging/dedup changes, channel taxonomy changes, late data. (2) Decompose: rate = contacts / trips; is it the numerator or denominator? (3) Mix vs rate: segment by side, geography, case type, channel, platform/app version, new vs. repeat contactor. (4) Time: step change (release/policy) or ramp (seasonality/backlog)? (5) Hypotheses → evidence → owner. (6) Quantify cost and experience impact; recommend.</p>
<p>See Question Bank Q1 for a full model answer with a worked mix/rate decomposition.</p></div></details>
<details><summary>Case 2 — Tickets up, bookings flat</summary><div class="body">
<p>Bookings are the wrong denominator for in-stay and post-stay issues: <b>trips in progress</b> or <b>check-ins in the window</b> lag bookings by weeks. A shift toward longer lead-time bookings made months ago (e.g. peak summer) can raise contacts while current bookings are flat. Also check: repeat contacts (support failure), a policy change, a product release, a host-side issue (payouts), or a measurement change.</p></div></details>
<details><summary>Case 3 — Should we expand the AI assistant to refund cases?</summary><div class="body">
<p>Refunds touch money and both sides. Require: offline evaluation of policy-correctness on a labelled set; a staged experiment with guardrails on refund amount per case, dispute/chargeback rate, host-side complaints, and repeat contacts; human approval above a refund threshold; and abuse monitoring. Decision rule: ship only if net cost saving is positive <i>and</i> no guardrail breaches its pre-registered non-inferiority margin.</p></div></details>`}
]});

MODULES.push({id:"m2",n:2,title:"Product analytics, metrics & KPI frameworks",short:"Metrics & KPIs",
summary:"North Star, metric trees, denominators, exposure, Simpson's paradox, Goodhart, guardrails, governance — with numerical traps.",
sections:[
{id:"ns",title:"North Star, metric trees, leading vs lagging",html:`
<p><b>North Star</b>: one metric that best captures value delivered to users and correlates with long-term business value. For Community Support, a defensible candidate is:</p>
<div class="formula">Resolved-well trips rate = trips with no unresolved support issue (and no repeat contact / reopen within 7 days) ÷ completed trips</div>
<p>Alternatives and their flaws: <i>contacts per trip</i> (rewards hiding the door), <i>CSAT</i> (biased response, lagging, noisy), <i>cost per contact</i> (rewards rushing). A tree connects the North Star to levers teams own:</p>
<pre class="diagram">Resolved-well trip rate (North Star)
├── Problem incidence: contacts per 100 trips  ← Product/Policy own avoidable share
│     ├── avoidable contact rate   ├── unavoidable/safety contact rate
├── Resolution effectiveness
│     ├── first-contact resolution (FCR)   ├── repeat-contact rate (7d)   ├── reopen rate
├── Speed: time to first response, time to resolution (P50/P90), SLA compliance
├── Experience: CSAT (response-weighted), downstream rebook/churn
└── Efficiency (guardrailed): cost per resolved case, agent productivity, self-service containment</pre>
<p><b>Leading vs lagging:</b> time-to-first-response and backlog age are <i>leading</i> (move within hours, predict CSAT and repeats); CSAT, churn and host retention are <i>lagging</i>. Ops manages to leading indicators; executives judge on lagging ones — your dashboards should show the link.</p>`},
{id:"denoms",title:"Denominators, eligibility and exposure — where most metric errors live",html:`
<p>The denominator defines the <b>population at risk</b> of the numerator. Pick the denominator whose units can actually generate the event during the window.</p>
<table><tr><th>Metric</th><th>Bad denominator</th><th>Better denominator</th><th>Why</th></tr>
<tr><td>In-stay contact rate</td><td>Bookings made this week</td><td>Trip-nights in progress this week</td><td>In-stay issues are generated by stays happening now</td></tr>
<tr><td>Refund contact rate</td><td>All bookings</td><td>Cancelled + disputed bookings</td><td>Only these are eligible for refund questions</td></tr>
<tr><td>Bot containment</td><td>Bot sessions</td><td>Eligible issues entering bot (incl. those who never engaged)</td><td>Avoids counting abandoned sessions as wins</td></tr>
<tr><td>FCR</td><td>All contacts</td><td>First contacts on a new issue, with full follow-up window observed</td><td>Right-censoring: recent contacts haven't had time to repeat</td></tr></table>
<h3>Worked exercise: the denominator flips the conclusion</h3>
<table><tr><th></th><th>Week 1</th><th>Week 2</th></tr>
<tr><td>Contacts</td><td>50,000</td><td>52,000</td></tr>
<tr><td>Bookings</td><td>1,000,000</td><td>1,100,000 (more short stays)</td></tr>
<tr><td>Trip-nights in progress</td><td>4,000,000</td><td>3,960,000</td></tr>
<tr><td>Contacts / 100 bookings</td><td>5.00</td><td><b>4.73 ↓ 5.5%</b></td></tr>
<tr><td>Contacts / 100 trip-nights</td><td>1.25</td><td><b>1.31 ↑ 5.0%</b></td></tr></table>
<p>Per booking, support "improved"; per unit of actual stay exposure, it worsened. Neither is universally right: use per-booking for booking-flow issues and per-trip-night (or per active trip) for in-stay issues, and say so in the metric spec.</p>`},
{id:"simpson",title:"Segmentation, aggregation bias and Simpson's paradox",html:`
<p><b>Intuition:</b> an aggregate can move opposite to every segment when the <i>mix</i> of segments differs between groups.</p>
<table><tr><th>Case type</th><th>Bot: resolved / handled</th><th>Agent: resolved / handled</th></tr>
<tr><td>Simple (e.g. refund status)</td><td>810 / 900 = <b>90%</b></td><td>95 / 100 = <b>95%</b></td></tr>
<tr><td>Complex (e.g. dispute)</td><td>40 / 100 = <b>40%</b></td><td>450 / 900 = <b>50%</b></td></tr>
<tr><td><b>Overall</b></td><td>850 / 1000 = <b>85%</b></td><td>545 / 1000 = <b>54.5%</b></td></tr></table>
<p>The bot "wins" overall yet loses in every segment, because routing sends it easy cases. <b>Rule:</b> compare channels/agents/geographies only within comparable strata (case type, side, language, complexity), or standardise: apply each group's stratum rates to a common mix. Standardised bot rate on a 50/50 mix = 0.5·90%+0.5·40% = 65%; agent = 0.5·95%+0.5·50% = 72.5%.</p>`},
{id:"goodhart",title:"Goodhart's law, guardrails, stability and sensitivity",html:`
<p><b>Goodhart:</b> when a measure becomes a target it stops being a good measure. Defences: (1) pair every target with a guardrail that catches its gaming mode; (2) prefer outcome metrics over activity metrics; (3) audit samples qualitatively; (4) rotate/combine metrics in scorecards.</p>
<table><tr><th>Target</th><th>Gaming mode</th><th>Guardrail</th></tr>
<tr><td>Avg handle time ↓</td><td>Rushing, transferring, closing early</td><td>Repeat contact 7d, reopen rate, transfer rate, QA score</td></tr>
<tr><td>FCR ↑</td><td>Agents mark resolved; split issues into new cases</td><td>Repeat contacts by booking (not by case id)</td></tr>
<tr><td>Containment ↑</td><td>Hide escalation path</td><td>Re-contact within 7d via any channel, abandonment, CSAT</td></tr>
<tr><td>CSAT ↑</td><td>Survey only happy customers; generous refunds</td><td>Response rate by segment, refund $ per case</td></tr>
<tr><td>SLA compliance ↑</td><td>First-touch "we're looking into it" auto-replies</td><td>Time to meaningful response, resolution time</td></tr></table>
<p><b>Sensitivity vs stability:</b> a good operational metric moves when the thing you care about changes (sensitive) and doesn't move on noise (stable). Ratio of signal variance to week-over-week noise variance is a useful check; percentiles (P50/P90) are more stable than means for heavy-tailed resolution times.</p>`},
{id:"governance",title:"Metric governance and semantic layers",html:`
<p>A Lead owns <b>metric definitions as products</b>. A metric spec contains: name, business question, formula, numerator/denominator SQL, grain, time window and attribution (by contact date vs. case-close date), eligible population, exclusions, owner, certified source tables, known limitations, gaming modes, and change log.</p>
<p><b>Semantic layer:</b> one machine-readable definition (e.g. in a metrics layer / dbt-style YAML) consumed by dashboards, notebooks and AI assistants, so "contact rate" means one thing everywhere. This is also the foundation for trustworthy NL-to-SQL (Module 9).</p>
<pre><code>metric: repeat_contact_rate_7d
owner: community-support-analytics
grain: first_contact (issue-level)
numerator: count of first contacts with >=1 further contact on same booking_id
           (any channel) within 7 days after the first contact
denominator: first contacts whose 7-day follow-up window is fully observed
exclusions: test accounts; safety cases routed to specialist teams (reported separately)
attribution_date: first_contact_ts in user's local date
caveats: right-censored for last 7 days; cross-channel identity relies on user_id</code></pre>`},
{id:"dq",title:"Data-quality and measurement risks checklist",html:`
<ul><li><b>Duplicates:</b> chat reconnects create multiple contacts; dedup on (user, booking, channel, 30-min gap).</li>
<li><b>Identity:</b> anonymous Help Center sessions can't be linked to later contacts → containment overstated.</li>
<li><b>Censoring:</b> recent cases haven't had time to repeat or resolve → last-week FCR looks great. Report only fully-observed windows.</li>
<li><b>Taxonomy drift:</b> case-type reclassification creates artificial shifts; maintain a mapping table with effective dates.</li>
<li><b>Time zones:</b> UTC partition dates vs. local business days; SLA clocks in business hours.</li>
<li><b>Late-arriving events:</b> resolution events land days later; freeze metrics after a settlement lag.</li>
<li><b>Survey bias:</b> CSAT non-response is not random (angry and delighted users respond more).</li></ul>`}
]});

MODULES.push({id:"m3",n:3,title:"Advanced SQL for support analytics (Presto/Trino)",short:"Advanced SQL",
summary:"Patterns that separate Lead-level SQL: grain discipline, fanout, windows, censoring, time zones, SCDs, partition pruning. Exercises live in SQL Practice.",
sections:[
{id:"grain",title:"Grain discipline and join fanout",html:`
<p><b>Rule:</b> before writing any join, state the grain of every table and of the output. Fanout happens when you join a one-row-per-case table to a many-rows-per-case table (events, refunds, feedback) and then SUM or COUNT.</p>
<pre><code>-- WRONG: refunds has many rows per case; contacts counted multiple times
SELECT c.channel, COUNT(*) AS contacts, SUM(r.amount_usd) AS refund_usd
FROM support_cases c LEFT JOIN refunds r ON r.case_id = c.case_id
GROUP BY 1;

-- RIGHT: aggregate the many-side to case grain first
WITH r AS (SELECT case_id, SUM(amount_usd) AS refund_usd FROM refunds GROUP BY 1)
SELECT c.channel, COUNT(*) AS cases, SUM(COALESCE(r.refund_usd,0)) AS refund_usd
FROM support_cases c LEFT JOIN r ON r.case_id = c.case_id
GROUP BY 1;</code></pre>
<p>Self-check: <code>COUNT(*)</code> vs <code>COUNT(DISTINCT case_id)</code> after the join — if they differ, you have fanout.</p>`},
{id:"windows",title:"Window functions you must be fluent in",html:`
<table><tr><th>Need</th><th>Pattern</th></tr>
<tr><td>Dedup latest version</td><td><code>ROW_NUMBER() OVER (PARTITION BY case_id ORDER BY updated_at DESC) = 1</code></td></tr>
<tr><td>Previous/next event</td><td><code>LAG/LEAD(ts) OVER (PARTITION BY user_id ORDER BY ts)</code></td></tr>
<tr><td>N events in a rolling window</td><td><code>LAG(ts, N-1)</code> then diff ≤ window; or <code>COUNT(*) OVER (... RANGE BETWEEN INTERVAL '59' DAY PRECEDING AND CURRENT ROW)</code> (check your Trino version supports RANGE with interval offsets)</td></tr>
<tr><td>Sessionize</td><td>flag = gap &gt; threshold; session_id = running <code>SUM(flag)</code></td></tr>
<tr><td>Rolling 7-day avg</td><td><code>AVG(x) OVER (ORDER BY d ROWS BETWEEN 6 PRECEDING AND CURRENT ROW)</code> on a <b>gap-filled</b> date spine</td></tr>
<tr><td>Median</td><td><code>approx_percentile(x, 0.5)</code> in Presto/Trino (exact: ROW_NUMBER tricks)</td></tr></table>
<div class="callout warn"><b>Classic trap (from your own interview notes)</b>Using LAG(1) to check "3 strikes in 60 days" only measures the gap between consecutive strikes. The correct test is the span from the strike two rows back: <code>date_diff('day', LAG(strike_date,2) OVER w, strike_date) &lt;= 59</code>. See SQL exercise S1.</div>`},
{id:"censor",title:"Windowed outcomes, censoring and late-arriving data",html:`
<p>Any metric of the form "did X happen within k days after Y" must exclude Ys whose k-day window has not fully elapsed (right-censoring), or report it as provisional.</p>
<pre><code>WHERE first_contact_ts &lt;= (SELECT MAX(event_ts) FROM case_events) - INTERVAL '7' DAY</code></pre>
<p>Late-arriving events: partition by <b>event date</b> but also record <b>ingestion date</b>; reprocess a lookback window (e.g. last 3 days) daily; freeze ("settle") metrics after the lateness SLA; show a "provisional" badge on dashboards for unsettled days.</p>`},
{id:"tz",title:"Time zones and SLA clocks",html:`
<p>Store timestamps in UTC; derive local dates with the user's or site's time zone: <code>CAST(ts AT TIME ZONE tz AS date)</code> in Trino (with tz as a column, use <code>at_timezone(ts, tz)</code>). Daily metrics for a global business should be defined explicitly as UTC-day or local-day. SLA clocks for business-hours SLAs need a calendar table (hours × site × holiday).</p>`},
{id:"scd",title:"Slowly changing dimensions and event tables",html:`
<p>Agents change teams; listings change hosts; case types are reclassified. Use SCD Type 2 dimensions with <code>valid_from</code> / <code>valid_to</code> and join on the event timestamp:</p>
<pre><code>JOIN agent_dim a ON a.agent_id = e.agent_id
 AND e.event_ts &gt;= a.valid_from AND e.event_ts &lt; COALESCE(a.valid_to, TIMESTAMP '9999-12-31 00:00:00')</code></pre>
<p>Joining to the <i>current</i> dimension attributes history to today's team — a silent error in agent-performance trend dashboards.</p>`},
{id:"perf",title:"Performance in Presto/Trino",html:`
<ul><li><b>Partition pruning:</b> filter directly on the partition column (<code>ds &gt;= '2026-10-01'</code>), not on a function of it (<code>date(ts) &gt;= ...</code> on a non-partition column won't prune). Add a partition filter even when you also filter on timestamps.</li>
<li><b>Select only needed columns</b> (columnar formats: ORC/Parquet).</li>
<li><b>Aggregate before joining</b>; put the larger table on the probe side; avoid cross joins from missing join keys.</li>
<li>Use <code>approx_distinct</code> / <code>approx_percentile</code> for exploratory work at scale.</li>
<li>Check plans with <code>EXPLAIN ANALYZE</code>; watch for skewed keys (e.g. NULL user_id for anonymous sessions).</li>
<li>Materialise reusable intermediate tables (daily case facts) rather than recomputing from raw events in every dashboard.</li></ul>`},
{id:"model",title:"Data model for reusable support metrics",html:`
<pre class="diagram">raw sources ──▶ staging (clean, typed, deduped) ──▶ core facts & dims ──▶ metric marts ──▶ semantic layer
 contacts          stg_contacts                     fct_contact (contact grain)      mart_support_daily
 case_events       stg_case_events                  fct_case (case grain, lifecycle) (date × side × geo ×
 bookings          stg_bookings                     fct_trip_day (exposure)           case_type × channel)
 csat, refunds     ...                              dim_agent (SCD2), dim_case_type</pre>
<p><b>fct_case</b> (one row per case) carries derived lifecycle fields: created_ts, first_response_ts, resolved_ts, reopened_flag, n_contacts, channel_first, case_type_final, is_safety, sla_target_min, sla_met, repeat_7d_flag (only when window observed). Every dashboard and AI assistant reads from these certified tables.</p>`}
]});

MODULES.push({id:"m4",n:4,title:"Python for analytics",short:"Python",
summary:"pandas patterns, bootstrap, tests, regression diagnostics, calibration, forecasting and anomaly detection — executable examples live in Python Practice.",
sections:[
{id:"overview",title:"What interviewers look for in Python at Lead level",html:`
<p>Not software engineering — <b>analytical correctness and interpretation</b>: correct grain, explicit handling of duplicates and missing data, using the right test for the data shape, and turning output into a decision. Narrate assumptions as you code.</p>
<div class="callout warn"><b>Execution disclaimer</b>The examples in Python Practice were executed when this guide was built and the outputs shown are the captured stdout (library versions listed on that page). Random seeds are fixed, but exact numbers can differ slightly with other library versions. <b>This page itself does not execute Python</b> — run the code locally to practise.</div>
<table><tr><th>Topic</th><th>Practice item</th></tr>
<tr><td>Dedup, missing values, time to resolution</td><td>P1</td></tr><tr><td>Bootstrap CI for median resolution time</td><td>P2</td></tr>
<tr><td>A/B analysis: proportions + Welch + SRM</td><td>P3</td></tr><tr><td>CUPED variance reduction</td><td>P4</td></tr>
<tr><td>Regression adjustment &amp; diagnostics</td><td>P5</td></tr><tr><td>Escalation classifier: imbalance &amp; calibration</td><td>P6</td></tr>
<tr><td>Forecasting hourly ticket volume</td><td>P7</td></tr><tr><td>Anomaly detection on residuals</td><td>P8</td></tr>
<tr><td>Difference-in-differences with regression</td><td>P9</td></tr><tr><td>Mix/rate decomposition</td><td>P10</td></tr></table>`},
{id:"pitfalls",title:"High-signal pitfalls",html:`
<ul><li><code>groupby().mean()</code> on a ratio column averages ratios — compute <code>sum(num)/sum(den)</code> instead.</li>
<li><code>merge</code> silently fans out; use <code>validate="many_to_one"</code>.</li>
<li>Time series: <code>resample</code> fills gaps only if you ask — missing hours with zero tickets must be explicit zeros, not NaN dropped.</li>
<li>Class imbalance: accuracy is meaningless at 3% positives; use PR-AUC, recall at fixed precision, and cost-weighted thresholds.</li>
<li>Calibration matters when scores are used as probabilities for staffing or routing decisions.</li></ul>`}
]});

MODULES.push({id:"m5",n:5,title:"Statistics & probability",short:"Statistics",
summary:"Intuition → formula → support example. CIs, tests, power/MDE, multiple testing, heavy tails, bootstrap, Bayes, Simpson.",
sections:[
{id:"bayes",title:"Conditional probability & Bayes — classifier alerts",html:`
<p><b>Intuition:</b> a test is only as useful as the base rate allows. Rare events + imperfect detector = most flags are false.</p>
<div class="formula">P(A|B) = P(B|A)·P(A) / [P(B|A)·P(A) + P(B|¬A)·P(¬A)]</div>
<p><b>Example:</b> 1% of inbound messages are safety-related. An LLM classifier has 95% recall and 5% false-positive rate. P(safety | flagged) = 0.95·0.01 / (0.95·0.01 + 0.05·0.99) = 0.0095/0.059 = <b>16.1%</b>. So 84% of flags are false — fine for "route to a human for review", not fine for "auto-apply a penalty". Raising the threshold trades recall (missed safety cases — costly) for precision.</p>`},
{id:"ev",title:"Expected value and decisions under uncertainty",html:`
<p>EV = Σ p<sub>i</sub>·value<sub>i</sub>. Use it to choose actions, not to describe data.</p>
<p><b>Example:</b> auto-approve refunds &lt; $50 without agent review. Per eligible case: agent review costs $4; auto-approval leaks $50 on the 3% that are abusive. EV(auto) = −0.03·50 = −$1.50 vs EV(review) = −$4 (assuming review catches all abuse). Auto-approve wins by $2.50/case — <i>if</i> abuse stays at 3%. Add a monitoring guardrail because the policy itself changes abuse incentives (Lucas critique for ops).</p>`},
{id:"ci",title:"Confidence intervals & hypothesis tests",html:`
<p><b>Intuition:</b> a 95% CI is a procedure that captures the true value in 95% of repeated samples; it is not "95% probability the true value is in this interval" (that's Bayesian credible interval language).</p>
<div class="formula">Proportion: p̂ ± z<sub>α/2</sub>·√(p̂(1−p̂)/n) &nbsp;&nbsp; Difference: (p̂<sub>T</sub>−p̂<sub>C</sub>) ± z·√(p̂<sub>T</sub>(1−p̂<sub>T</sub>)/n<sub>T</sub> + p̂<sub>C</sub>(1−p̂<sub>C</sub>)/n<sub>C</sub>)</div>
<p><b>Example:</b> CSAT 80% positive from n = 400 responses. SE = √(0.8·0.2/400) = 0.02; 95% CI = 80% ± 3.9pp = [76.1%, 83.9%]. Caveat: this quantifies sampling error among respondents only — non-response bias is untouched.</p>
<p><b>p-value:</b> probability of data at least this extreme <i>if H0 were true</i>. Not the probability H0 is true; not effect size.</p>
<table><tr><th>Data</th><th>Test</th></tr><tr><td>Two proportions (FCR, containment)</td><td>Two-proportion z-test / chi-square</td></tr>
<tr><td>Means, unequal variances (handle time)</td><td>Welch's t-test (n large → CLT ok even if skewed, but check)</td></tr>
<tr><td>Heavy-tailed, medians</td><td>Bootstrap CI on median/quantile; Mann-Whitney (tests distribution shift, not medians per se)</td></tr>
<tr><td>Counts per unit (contacts/user)</td><td>Poisson / negative binomial regression; or delta method for ratio metrics</td></tr></table>`},
{id:"power",title:"Type I/II errors, power and MDE",html:`
<div class="formula">n per arm = (z<sub>1−α/2</sub> + z<sub>1−β</sub>)² · [p₁(1−p₁) + p₂(1−p₂)] / (p₂ − p₁)²</div>
<p>z<sub>0.975</sub>=1.96, z<sub>0.80</sub>=0.8416 → (1.96+0.8416)² = 7.849.</p>
<p><b>Worked (from your interview notes):</b> baseline 20%, MDE 2%, α=0.05, power 0.8.</p>
<ul><li>If MDE is <b>absolute</b> (20% → 22%): 7.849 × (0.16 + 0.1716) / 0.0004 ≈ <b>6,507 per arm (~13k total)</b>.</li>
<li>If MDE is <b>relative</b> (20% → 20.4%): 7.849 × (0.16 + 0.1624) / 0.000016 ≈ <b>158,147 per arm (~316k total)</b>.</li>
<li>The "22k" in the notes matches neither — with 11k per arm the absolute MDE is ≈1.51pp. Always ask "absolute or relative?" and state per-arm vs total.</li></ul>
<p><b>Continuous:</b> n per arm = 2·(z sum)²·σ²/δ². Resolution time σ = 30h, δ = 1h → 2·7.849·900 = <b>14,128 per arm</b>. Heavy tails inflate σ — winsorise or use log/median metrics.</p>
<p><b>MDE given n:</b> δ = (z<sub>1−α/2</sub>+z<sub>1−β</sub>)·√(2σ²/n). Halving MDE needs 4× sample.</p>`},
{id:"multi",title:"Multiple testing",html:`
<p>Testing 20 metrics at α=0.05 gives P(≥1 false positive) = 1 − 0.95²⁰ ≈ 64%. Remedies: pre-register one primary metric; Bonferroni (α/m, controls family-wise error, conservative); Benjamini–Hochberg (controls false discovery rate — better for many exploratory segment cuts). Segment fishing after a flat result is the most common real-world violation.</p>`},
{id:"tails",title:"Heavy tails, robust statistics and bootstrap",html:`
<p>Resolution times are right-skewed (most cases close in hours; disputes take weeks). The mean is dominated by the tail and is unstable; report P50 and P90, and use trimmed/winsorised means for tests.</p>
<p><b>Bootstrap:</b> resample units (cases — or users, if that's the randomisation unit!) with replacement B times, recompute the statistic, take percentiles. Resample at the randomisation/cluster level, otherwise CIs are too narrow.</p>`},
{id:"sel",title:"Sampling bias, selection, correlation vs causation",html:`
<ul><li><b>CSAT non-response:</b> respondents differ from non-respondents → weight by response propensity or use behavioural outcomes (repeat contact, churn).</li>
<li><b>Survivorship:</b> analysing only resolved cases excludes the worst experiences (abandoned).</li>
<li><b>Correlation ≠ causation:</b> users who use the Help Center contact less — because engaged, savvy users do both. Module 7 covers identification.</li>
<li><b>Practical vs statistical significance:</b> with millions of contacts, a 0.1pp FCR change is "significant" — ask whether it beats cost and implementation risk.</li></ul>`},
{id:"whiteboard",title:"Whiteboard probability problems",html:`
<details><summary>W1. Two agents each resolve 80% of cases on first contact independently. A case is reopened and goes to a second agent. P(resolved within two contacts)?</summary><div class="body"><p>1 − P(both fail) = 1 − 0.2·0.2 = <b>0.96</b> — assuming independence. Challenge it: the second contact is conditional on failure, and hard cases fail more → true P is lower. This "independence is the hidden assumption" move is what interviewers want.</p></div></details>
<details><summary>W2. Contacts arrive Poisson with λ = 12/hour at a regional queue. P(more than 20 in an hour)?</summary><div class="body"><p>P(X&gt;20) = 1 − Σ<sub>k=0..20</sub> e<sup>−12</sup>12<sup>k</sup>/k! ≈ <b>0.0116</b>. Normal approx: (20.5−12)/√12 = 2.45 → ≈0.007 (underestimates the tail). Staffing implication: plan for P90/P95 hourly demand, not the mean.</p></div></details>
<details><summary>W3. 30% of guests who contact about refunds contact again. Among repeaters, 60% rate CSAT negative; among non-repeaters, 20%. P(repeater | negative CSAT)?</summary><div class="body"><p>= 0.3·0.6 / (0.3·0.6 + 0.7·0.2) = 0.18/0.32 = <b>56%</b>. So negative CSAT is a strong pointer to repeat-contact failure.</p></div></details>
<details><summary>W4. Expected number of daily false alerts: 200 segment-level metrics, 3σ two-sided threshold, normal noise.</summary><div class="body"><p>p per check = 0.0027 → 200 × 0.0027 ≈ <b>0.54 false alerts/day</b>, ~one every two days, before any real incident. With hourly checks it's 13/day → alert fatigue. Hence hierarchical alerting, persistence rules, and FDR control.</p></div></details>
<details><summary>W5. A/A test: you run 100 A/A tests at α=0.05. How many "significant"? If you see 15, what does it tell you?</summary><div class="body"><p>Expect ~5 (binomial, SD ≈ 2.2). 15 is ~4.6 SD above → your variance estimate is wrong (e.g. analysis unit ≠ randomisation unit, clustered data treated as independent) or assignment is broken.</p></div></details>`}
]});

MODULES.push({id:"m6",n:6,title:"Experimentation & A/B testing",short:"Experimentation",
summary:"Design support experiments end to end: units, eligibility, exposure, metrics, power, SRM, interference, sequential testing, decisions.",
sections:[
{id:"design",title:"The experiment design template (use it out loud)",html:`
<ol><li><b>Decision:</b> what will we do differently depending on the result?</li>
<li><b>Hypothesis:</b> mechanism + direction + metric ("Showing refund ETA in-app reduces refund-status contacts per cancelled booking by ≥10% because the main driver is uncertainty").</li>
<li><b>Unit of randomisation:</b> user / booking / case / agent / queue / market — choose to avoid contamination and match where the treatment acts.</li>
<li><b>Eligibility &amp; exposure:</b> who could be affected; trigger analysis at the first moment treatment could differ.</li>
<li><b>Primary metric, secondary, guardrails</b> (+ non-inferiority margins).</li>
<li><b>Power:</b> baseline, variance, MDE, α, power → n and duration (full weekly cycles; ≥2 weeks).</li>
<li><b>Threats:</b> SRM, novelty, seasonality, interference, logging differences, multiple testing.</li>
<li><b>Decision rule</b> written before launch; <b>rollout</b> plan (ramp, holdback).</li></ol>`},
{id:"units",title:"Randomisation units in support",html:`
<table><tr><th>Intervention</th><th>Unit</th><th>Why / risk</th></tr>
<tr><td>Help Center search UI</td><td>User (logged-in) or device</td><td>Treatment acts on user; anonymous users → device, accept identity noise</td></tr>
<tr><td>AI chatbot for guests</td><td>User</td><td>Same user must see same experience across contacts</td></tr>
<tr><td>Refund workflow change</td><td>Booking (or user)</td><td>Both guest and host see the outcome; randomise booking so both sides are consistent</td></tr>
<tr><td>Agent routing algorithm</td><td>Contact/case — but agents are shared</td><td>Interference via shared agent capacity → switchback by time or split agent pools</td></tr>
<tr><td>Agent tool / copilot</td><td>Agent (cluster)</td><td>Agents learn; analyse at agent level (cluster-robust SE), fewer units → less power</td></tr>
<tr><td>Escalation policy</td><td>Queue/site × time (switchback) or market</td><td>Queue-level effects; small n → consider DiD or synthetic control</td></tr></table>`},
{id:"srm",title:"Sample ratio mismatch and trustworthiness checks",html:`
<p>Expected 50/50 with 100,000 users; observed 50,600 vs 49,400. χ² = (600²/50,000)·2 = 14.4, p ≈ <b>0.00015</b> → stop and debug before reading any metric. Common causes: bot/redirect drops in one arm, eligibility evaluated after assignment, logging differences, crashes in treatment.</p>
<p>Other checks: A/A tests, pre-period balance on covariates, exposure logging parity, metric-level variance sanity.</p>`},
{id:"interference",title:"Interference, novelty, seasonality, HTE",html:`
<ul><li><b>Interference (SUTVA violation):</b> a routing change that sends easy cases to treatment agents starves control agents of easy cases; a bot that deflects treatment users frees capacity that speeds up control users' queue → treatment effect understated. Fix: switchback by time block, cluster by queue/site, or market-level designs.</li>
<li><b>Two-sided effects:</b> a guest-facing refund change affects hosts' payouts and host contacts — measure both sides.</li>
<li><b>Novelty/primacy:</b> plot effect by days-since-first-exposure; agents' learning curves for new tools.</li>
<li><b>Seasonality:</b> run full weeks; avoid launching only in peak travel; holiday weeks differ in case mix.</li>
<li><b>HTE:</b> pre-specify segments (side, language, case type, new vs tenured agents); use them to target rollout, not to rescue a flat result.</li></ul>`},
{id:"seq",title:"Duration, stopping rules, sequential testing",html:`
<p>Peeking daily with a fixed-horizon test inflates false positives (with many peeks, well above 5%). Options: commit to a fixed horizon; use group-sequential boundaries (O'Brien–Fleming spends little α early); or always-valid methods (mSPRT / confidence sequences). For guardrails like safety escalations, use a pre-defined early-stop for harm.</p>`},
{id:"itt",title:"ITT, CACE and inconclusive results",html:`
<p><b>Intention-to-treat</b> compares by assignment, regardless of whether users actually used the bot — unbiased for the policy "offer the bot". If only 40% of treated users engage, the effect per engager (CACE) ≈ ITT / 0.40, assuming no effect on non-engagers (exclusion) and no defiers.</p>
<p><b>Inconclusive result:</b> report the CI, not "no effect". If the CI is [−0.5pp, +1.5pp] and the business needed +2pp, that's informative: the large effect is ruled out. Next: check power, triggered analysis, variance reduction (CUPED), longer run, or a stronger treatment.</p>`},
{id:"tradeoff",title:"When speed improves but CSAT worsens",html:`
<p>Example: a new auto-close rule reduces median resolution time 20% but CSAT drops 2pp and 7-day repeat contacts rise 1pp.</p>
<ol><li>Check mechanism: is "resolution" now premature? Repeats rising says yes — the speed gain is partly measurement.</li>
<li>Recompute speed as <b>time to final resolution across all contacts on the issue</b>; often the gain shrinks or reverses.</li>
<li>Value both sides in one currency: savings from handle time vs. cost of repeats + estimated retention impact of CSAT drop (use historical relationship between negative CSAT and rebooking, labelled as an estimate).</li>
<li>Look at HTE: maybe apply the rule only to simple case types where CSAT didn't drop.</li>
<li>Decision: don't ship globally; ship to segments where guardrails hold, or redesign.</li></ol>`},
{id:"scenarios",title:"Six support experiment designs",html:`
<details><summary>Help Center search redesign</summary><div class="body"><p><b>H:</b> better search → users find answers → fewer contacts. <b>Unit:</b> user. <b>Eligible:</b> users who open Help Center. <b>Primary:</b> contacts within 7 days per Help Center visitor. <b>Secondary:</b> article success clicks, search reformulation. <b>Guardrails:</b> CSAT of those who do contact, safety-contact latency (search must never hide emergency paths). <b>Power:</b> contact rate among visitors ~25% (assumed); 1pp absolute MDE → ≈ 7.849×(0.1875+0.1824)/0.0001 ≈ 29k per arm. <b>Bias:</b> anonymous sessions → device-level identity noise dilutes effect.</p></div></details>
<details><summary>AI-assisted support chatbot</summary><div class="body"><p><b>Unit:</b> user. <b>Eligible:</b> users starting a contact in eligible case types (exclude safety). <b>Primary:</b> issues resolved without agent AND no re-contact in 7 days, per eligible issue. <b>Guardrails:</b> CSAT, repeat contacts, refund $ per case, escalation latency, policy-error rate (audited sample), safety misroutes. <b>Decision:</b> ship if true containment ↑ and every guardrail within non-inferiority margin (e.g. CSAT not worse than −1pp at 95% confidence).</p></div></details>
<details><summary>Refund workflow change</summary><div class="body"><p><b>Unit:</b> booking. Measure guest outcomes (contacts, CSAT, rebook) AND host outcomes (payout disputes, host contacts, host churn), plus refund $ and abuse rate. Long-tail: chargebacks arrive weeks later → hold readout for settlement window.</p></div></details>
<details><summary>Agent routing improvement</summary><div class="body"><p>Interference via shared agents → <b>switchback</b>: alternate algorithm by hour-block per site, randomised schedule, washout periods; analyse at block level. Metrics: time to resolution, FCR, transfers, agent occupancy; guardrails: SLA breaches for safety queues, agent burnout signals.</p></div></details>
<details><summary>Proactive notifications (e.g. refund ETA, check-in reminders)</summary><div class="body"><p><b>Unit:</b> booking. Primary: relevant-case-type contacts per eligible booking. Guardrails: notification opt-outs, contacts caused by confusing messages, host-side contacts. Watch for "reminder causes questions" backfire in HTE by language.</p></div></details>
<details><summary>Escalation redesign</summary><div class="body"><p>Acts on queues/teams — few units. Use site-level randomisation if enough sites, else stepped-wedge rollout (randomised order of sites) analysed as staggered DiD. Primary: time to resolution for escalated cases; guardrails: wrong-escalation rate, specialist backlog, CSAT.</p></div></details>`}
]});

MODULES.push({id:"m7",n:7,title:"Causal inference without (or beyond) randomisation",short:"Causal inference",
summary:"Potential outcomes, DAGs, DiD/event studies, matching & propensity, IV, RDD, ITS, synthetic control, sensitivity — each with a support case.",
sections:[
{id:"three",title:"Prediction vs association vs causal impact",html:`
<table><tr><th></th><th>Question</th><th>Support example</th><th>Valid tool</th></tr>
<tr><td>Prediction</td><td>What will happen?</td><td>Which cases will escalate tomorrow?</td><td>ML, forecasting; correlation is fine</td></tr>
<tr><td>Association</td><td>What moves together?</td><td>Help Center users contact less</td><td>Descriptive stats, segmentation</td></tr>
<tr><td>Causal</td><td>What happens if we intervene?</td><td>If we show Help Center to everyone, do contacts fall?</td><td>Experiments, quasi-experiments with stated assumptions</td></tr></table>
<p>A feature can be highly predictive (e.g. "user opened Help Center" predicts lower contact) while having zero causal effect. Never let feature importance answer a causal question.</p>`},
{id:"po",title:"Potential outcomes and estimands",html:`
<p>Each unit i has Y<sub>i</sub>(1) and Y<sub>i</sub>(0); we observe only one. Estimands: <b>ATE</b> = E[Y(1)−Y(0)]; <b>ATT</b> = E[Y(1)−Y(0) | treated] (what DiD and matching usually estimate); <b>LATE</b> = effect for compliers (IV).</p>
<div class="formula">E[Y|T=1] − E[Y|T=0] = ATT + {E[Y(0)|T=1] − E[Y(0)|T=0]} &nbsp;&nbsp; (naive difference = effect + selection bias)</div>`},
{id:"dag",title:"Confounders, mediators, colliders — DAGs",html:`
<pre class="diagram">          Case complexity (C)
            │            │
            ▼            ▼
   Chatbot eligible (T) ──▶ Resolution time (Y)        C = confounder → adjust for it
            │
            ▼
   Agent handoff (M) ──▶ Y                              M = mediator → don't adjust if you want total effect

   T ──▶ CSAT survey response (S) ◀── Y                  S = collider → conditioning on responders opens a biased path</pre>
<ul><li><b>Adjust for confounders</b> (common causes of T and Y).</li>
<li><b>Don't adjust for mediators</b> when estimating total effect.</li>
<li><b>Don't condition on colliders</b> — e.g. analysing only surveyed cases when both the bot and outcome affect who answers the survey.</li></ul>`},
{id:"did",title:"Difference-in-differences and event studies",html:`
<p><b>When:</b> a change hits one group (geography, queue) at a known time; a comparable untreated group exists.</p>
<div class="formula">DiD = (Ȳ<sub>T,post</sub> − Ȳ<sub>T,pre</sub>) − (Ȳ<sub>C,post</sub> − Ȳ<sub>C,pre</sub>) &nbsp;&nbsp; Y<sub>it</sub> = α<sub>i</sub> + λ<sub>t</sub> + β·D<sub>it</sub> + ε<sub>it</sub></div>
<p><b>Worked example:</b> a new cancellation-policy explainer launches in Region A. 7-day repeat contact rate: A pre 12.0% → post 10.0%; B pre 11.0% → post 10.5%. DiD = (−2.0) − (−0.5) = <b>−1.5pp</b>. The naive before/after (−2.0pp) would credit 0.5pp of common seasonal improvement to the policy.</p>
<p><b>Assumption:</b> parallel trends in untreated outcomes. <b>Probe:</b> event-study plot of leads (pre-period coefficients ≈ 0), placebo launch dates, placebo outcomes that shouldn't move, alternative control groups. <b>Failures:</b> concurrent shocks in A only (local holiday, staffing change), anticipation, composition change. <b>Staggered rollouts:</b> two-way fixed effects can be biased with heterogeneous effects over time — use Callaway–Sant'Anna or Sun–Abraham style estimators (clean comparisons with not-yet-treated units). <b>Inference:</b> cluster SEs at the treatment-assignment level; with few clusters, use wild cluster bootstrap or randomisation inference.</p>`},
{id:"psm",title:"Regression adjustment, matching and propensity scores",html:`
<p><b>When:</b> treatment is chosen (agents adopt a tool, users choose chat) and you observe the drivers of choice. <b>Assumptions:</b> conditional ignorability (no unobserved confounders) and overlap (comparable units exist on both sides).</p>
<p><b>Steps:</b> (1) DAG → covariate set measured <i>before</i> treatment (agent tenure, prior FCR, case mix, site, shift). (2) Estimate propensity e(x)=P(T=1|x). (3) Check overlap; trim extreme scores. (4) Match or weight (IPW / overlap weights); (5) check balance — standardised mean differences &lt; 0.1. (6) Estimate ATT; (7) sensitivity analysis (Rosenbaum Γ or E-value).</p>
<p><b>Agent tool example:</b> adopters have 6pp higher FCR raw. After matching on prior-quarter FCR, tenure and case mix, the gap is 2pp. Unobserved motivation remains: E-value tells you how strong an unmeasured confounder would need to be to erase 2pp. Better: <b>doubly robust</b> estimator (outcome model + propensity) and, strongest, an <b>encouragement design</b> (see IV).</p>`},
{id:"iv",title:"Instrumental variables (encouragement designs)",html:`
<p><b>When:</b> you can't force treatment but can randomly encourage it. <b>Assumptions:</b> relevance (encouragement moves adoption), exclusion (encouragement affects outcome only via adoption), independence (randomised), monotonicity (no defiers).</p>
<div class="formula">LATE (Wald) = [E(Y|Z=1) − E(Y|Z=0)] / [E(T|Z=1) − E(T|Z=0)]</div>
<p><b>Example:</b> randomly invite half of agents to tool training. Invited: FCR 72%, adoption 60%. Not invited: FCR 70%, adoption 10%. LATE = 2pp / 0.5 = <b>4pp</b> for agents who adopt because invited. Weak first stage (small adoption difference) → huge variance; exclusion fails if training itself teaches better practices independent of the tool.</p>`},
{id:"rdd",title:"Regression discontinuity",html:`
<p><b>When:</b> treatment assigned by a threshold on a running variable — e.g. cases with risk score ≥ 70 go to a specialist queue; refunds ≥ $500 need manual review. <b>Assumption:</b> units just above and below are comparable (no manipulation of the score; other things continuous at the cutoff). <b>Probe:</b> density test (McCrary) for bunching, covariate continuity, bandwidth sensitivity, placebo cutoffs. <b>Estimand:</b> local effect at the threshold only — don't extrapolate to score 30.</p>`},
{id:"its",title:"Interrupted time series, seasonality and regression to the mean",html:`
<p><b>When:</b> one unit (whole queue) changes at a known time; no control group. Model the pre-period (trend + seasonality, e.g. weekly and annual) and compare post-period actuals to the counterfactual forecast.</p>
<div class="formula">Y<sub>t</sub> = β₀ + β₁·t + β₂·post<sub>t</sub> + β₃·(t − t₀)·post<sub>t</sub> + seasonality + ε<sub>t</sub></div>
<p><b>Regression to the mean:</b> interventions are often launched <i>because</i> a metric spiked; it would partly fall back anyway. Detect: was the pre-launch point extreme relative to the longer history? Use a longer baseline, not the spike week. <b>Seasonality:</b> compare to the same weeks last year (year-over-year deltas) and to unaffected segments. <b>Real effect signature:</b> level/slope change at the exact launch time, concentrated in the affected case types, absent in placebo segments, persistent.</p>`},
{id:"synth",title:"Synthetic control",html:`
<p><b>When:</b> one or few treated units (a market, a support site) and many potential controls. Build a weighted combination of untreated units (non-negative weights summing to 1) matching the treated unit's pre-period trajectory. <b>Probe:</b> pre-period fit (RMSPE), placebo-in-space (apply method to each control; is the treated gap extreme?), leave-one-out donors. Example: a new host-payout FAQ policy in one country; donors are other countries with similar host mix.</p>`},
{id:"queue",title:"When the whole queue is treated",html:`
<p>Options in order of strength: (1) <b>switchback</b> experiments by time block (randomised on/off schedule); (2) <b>stepped-wedge</b> rollout across sites/queues in randomised order → staggered DiD; (3) <b>geo/market</b> randomisation; (4) <b>synthetic control</b>; (5) <b>ITS</b> with strong seasonal modelling and placebo checks. Say which assumptions each needs and what result would falsify your conclusion.</p>`},
{id:"sens",title:"Sensitivity analysis, robustness, communicating uncertainty",html:`
<ul><li>Multiple estimators should roughly agree (DiD, synthetic control, ITS) — present the range.</li>
<li>Placebo tests (fake dates, unaffected outcomes, unaffected groups).</li>
<li>E-value / Rosenbaum bounds for unobserved confounding.</li>
<li>Specification curve: vary covariates, windows, controls.</li>
<li>Communicate: "Our best estimate is −1.5pp (95% CI −2.4 to −0.6). It relies on Region B tracking Region A absent the change; pre-trends support that over 12 weeks. If B were affected by X, the effect would be smaller."</li></ul>`},
{id:"cases",title:"The six causal cases (summary answers)",html:`
<details><summary>1. Chatbot rollout, resolution time −15%. Did the bot cause it?</summary><div class="body"><p>Check composition first: the bot absorbs simple cases → remaining agent cases are harder, but <i>overall</i> average falls mechanically if bot-handled cases close instantly. Define the estimand (effect on all eligible issues' time to final resolution incl. repeats). Use staggered rollout DiD across markets/languages, or ITS with seasonal baseline and placebo case types not eligible for the bot. Guardrails: repeats, CSAT. See Q-bank Q31 for the full model answer.</p></div></details>
<details><summary>2. High-priority cases excluded from bot eligibility</summary><div class="body"><p>Eligibility is a selection rule correlated with outcome. Comparing eligible bot cases to all agent cases confounds bot effect with priority. Restrict comparisons to eligible case types on both sides; or exploit the eligibility rule as an RDD if it's a score threshold; report effects only for the eligible population (no extrapolation to high-priority).</p></div></details>
<details><summary>3. Policy changes in one geography only</summary><div class="body"><p>DiD with the other geography (or synthetic control from many geographies); event study for pre-trends; check concurrent local shocks; cluster by geography; few clusters → randomisation inference.</p></div></details>
<details><summary>4. Agents voluntarily adopt a tool</summary><div class="body"><p>Self-selection on skill/motivation. Pre-period outcomes of adopters vs non-adopters reveal selection; DiD on agent panels (adopters' change vs non-adopters' change) removes fixed differences; matching on pre-trends; ideally randomised encouragement (IV) or staged rollout.</p></div></details>
<details><summary>5. Feature affects the whole queue</summary><div class="body"><p>Switchback, stepped wedge, synthetic control, ITS — see "When the whole queue is treated".</p></div></details>
<details><summary>6. Seasonality vs regression to the mean vs real effect</summary><div class="body"><p>Year-over-year comparison, longer baseline, placebo segments, and checking whether launch followed a spike. A real effect: sharp break at launch, concentrated where the mechanism applies, persistent.</p></div></details>`}
]});
/* ===================== MODULES 8–12 ===================== */
MODULES.push({id:"m8",n:8,title:"Forecasting, anomaly detection & root-cause analysis",short:"Forecast & RCA",
summary:"Seasonal baselines, error metrics, control charts, alert precision, mix/rate decomposition, incident vs pipeline failure.",
sections:[
{id:"fc",title:"Forecasting ticket volume",html:`
<p><b>Structure of demand:</b> contacts(t, region) ≈ exposure(t) × rate(t) — model exposure (trips in progress, bookings, cancellations) separately from rate; staffing needs volume by hour × language × skill.</p>
<ul><li><b>Seasonality:</b> hour-of-day, day-of-week, annual travel peaks, holidays (moving dates), local events.</li>
<li><b>Models:</b> seasonal naive (same hour last week) as a mandatory baseline; ETS/Prophet-style decomposition; gradient boosting (LightGBM — your experience) with calendar, lagged volume and exposure features; hierarchical reconciliation so region forecasts sum to global.</li>
<li><b>Error metrics:</b> MAPE breaks near zero (overnight hours) → use WAPE = Σ|y−ŷ|/Σy, or MASE (relative to seasonal naive). Staffing cares about under-forecast more → evaluate quantile loss at P80/P90.</li>
<li><b>Backtesting:</b> rolling-origin evaluation, never random K-fold on time series.</li></ul>`},
{id:"anom",title:"Anomaly detection, control charts and alert design",html:`
<p><b>Residual-based detection:</b> anomaly score = (actual − forecast) / σ<sub>residual</sub>, computed on a seasonal baseline so Monday mornings don't alert every week.</p>
<p><b>Control charts:</b> Shewhart (±3σ) for big jumps; <b>CUSUM/EWMA</b> for small persistent shifts (e.g. repeat-contact rate creeping up 0.3pp/day). For proportions use p-charts with limits that widen when n is small.</p>
<p><b>Change-point detection</b> (e.g. PELT, Bayesian online) to timestamp step changes and align them to releases/policy logs.</p>
<p><b>Alert quality:</b> treat alerts as a classifier: precision (true incidents / alerts), recall (incidents caught), time-to-detect. Controls: minimum volume, persistence (2 of 3 windows), hierarchical alerting (alert at parent, drill to child), FDR across many segments, routing to an owner with a runbook.</p>`},
{id:"rca",title:"Root-cause decomposition — worked example",html:`
<p><b>Situation (illustrative):</b> contact rate per 100 trips rose from 4.00 to 4.60 (+0.60, +15%).</p>
<table><tr><th>Segment</th><th>Share pre</th><th>Rate pre</th><th>Share post</th><th>Rate post</th></tr>
<tr><td>Domestic trips</td><td>70%</td><td>3.00</td><td>60%</td><td>3.20</td></tr>
<tr><td>International trips</td><td>30%</td><td>6.333</td><td>40%</td><td>6.70</td></tr>
<tr><td><b>Total</b></td><td></td><td><b>4.00</b></td><td></td><td><b>4.60</b></td></tr></table>
<div class="formula">ΔR = Σ Δs<sub>i</sub>·r<sub>i,pre</sub> (mix) + Σ s<sub>i,pre</sub>·Δr<sub>i</sub> (rate) + Σ Δs<sub>i</sub>·Δr<sub>i</sub> (interaction)</div>
<ul><li>Mix = (−0.10×3.00) + (0.10×6.333) = <b>+0.333</b></li>
<li>Rate = (0.70×0.20) + (0.30×0.367) = <b>+0.250</b></li>
<li>Interaction = (−0.10×0.20) + (0.10×0.367) = <b>+0.017</b></li>
<li>Total = 0.600 ✓</li></ul>
<p><b>Reading:</b> 56% of the increase is mix (seasonal shift to international travel — expected, staff for it), 42% is genuine rate increase in both segments (investigate). Next drill the rate component by case type × channel × app version; then align with release and policy calendars. Repeat the decomposition one dimension at a time and watch for dimension ordering effects (Shapley-style averaging across orderings avoids arbitrariness).</p>`},
{id:"pipe",title:"Real incident or pipeline failure?",html:`
<table><tr><th>Check</th><th>Real incident</th><th>Pipeline/logging issue</th></tr>
<tr><td>Independent sources (telephony system, chat vendor, finance refunds)</td><td>Move together</td><td>Only one table moves</td></tr>
<tr><td>Row counts / ingestion lag / partition completeness</td><td>Normal</td><td>Partial partitions, late loads, duplicates</td></tr>
<tr><td>Shape</td><td>Concentrated in a case type / geo / app version</td><td>Uniform across all segments or one source system</td></tr>
<tr><td>Timing</td><td>Aligns with release/policy/external event</td><td>Aligns with schema/deploy of the ETL job</td></tr>
<tr><td>Qualitative</td><td>Agents report it; transcripts mention it</td><td>Agents see nothing unusual</td></tr></table>
<p>Build these into the alert: every metric alert should show freshness, completeness and a cross-source reconciliation tile.</p>`}
]});

MODULES.push({id:"m9",n:9,title:"AI-first analytics, LLMs & agents",short:"AI analytics",
summary:"Production-grade NL-to-SQL, agentic RCA, ticket classification, RAG, permissions, evaluation, and the full assistant design.",
sections:[
{id:"why",title:"Why a working demo is not production",html:`
<p>A demo answers 10 hand-picked questions on a clean schema. Production must: answer the long tail correctly or <i>refuse</i>; use certified metric definitions (not the model's guess of "contact rate"); respect row/column permissions and PII rules; resist prompt injection from ticket text; be evaluated continuously on a gold set; be cheap and fast enough to be used; and log every answer with the SQL and data behind it so it can be audited. The hard part is not generation — it is <b>grounding, verification, governance and adoption</b>.</p>`},
{id:"arch",title:"Assistant architecture",html:`
<pre class="diagram">User (Slack / BI / notebook)
   │  "Why did support contact rate increase last week, and what should we do?"
   ▼
[1] Intent & slot parser ── metric=contact_rate, period=last week vs baseline, dims=?
   │        └─ ambiguity? → ask clarifying question (per guest or host? which definition?)
   ▼
[2] Semantic layer lookup ── certified metric spec (num/den SQL, grain, exclusions, owner)
[3] Metadata retrieval (RAG over catalog) ── tables, columns, freshness, PII tags, join keys
   ▼
[4] Plan (agent) ── steps: validate data → topline → decompose mix/rate → drill → correlate with change logs
[5] SQL generation per step (templated from metric spec where possible)
[6] Validator ── parse AST, allow-list tables, enforce partition filter, LIMIT, no DDL/DML, cost estimate (EXPLAIN)
[7] Permission check ── run as the requesting user's identity; column masking for PII
[8] Sandboxed execution (read-only warehouse role, timeout, row caps)
[9] Result verification ── row counts, reconciliation to certified dashboard topline, freshness, sanity bounds
[10] Statistical/causal guardrails ── significance vs noise band; label findings DESCRIPTIVE vs CAUSAL
[11] Explanation ── every number cites its query id; confidence + caveats; recommendations tagged by owner
[12] Human approval for actions (e.g. filing incidents, changing routing) ── never auto-execute
[13] Logging, eval & monitoring ── traces, gold-set regression tests, user feedback, cost/latency</pre>`},
{id:"walk",title:"End-to-end walkthrough (illustrative outputs)",html:`
<p><b>Step 2 — retrieved spec:</b> <code>contact_rate = contacts / trips_in_progress × 100</code>, grain = day × side × region; excludes test accounts; safety cases included (flag available).</p>
<pre><code>-- Step 5: topline vs 4-week baseline (generated from template, validated)
WITH daily AS (
  SELECT ds, SUM(contacts) AS contacts, SUM(trips_in_progress) AS trips
  FROM analytics.mart_support_daily
  WHERE ds BETWEEN DATE '2026-09-14' AND DATE '2026-10-18'   -- partition filter enforced
  GROUP BY ds
)
SELECT CASE WHEN ds &gt;= DATE '2026-10-12' THEN 'last_week' ELSE 'baseline_4w' END AS period,
       100.0 * SUM(contacts) / SUM(trips) AS contact_rate
FROM daily GROUP BY 1;</code></pre>
<table><tr><th>Period</th><th>Contact rate /100 trips</th></tr><tr><td>baseline_4w</td><td>4.02</td></tr><tr><td>last_week</td><td>4.61</td></tr></table>
<p><b>Step 9 verification:</b> topline reconciles with certified dashboard (±0.1%); data freshness OK; no partition gaps. <b>Step 10:</b> +0.59 exceeds weekly noise band (±0.15) → real movement. Decomposition: mix +0.33 (international share), rate +0.26, concentrated in "payment / payout" case type on iOS app version 26.41 released Oct 12.</p>
<p><b>Output (abridged):</b> "Contact rate rose 4.02 → 4.61 (+15%). About 56% is seasonal mix toward international trips (expected). The remaining rate increase is concentrated in payment-related contacts from iOS 26.41 users, starting on its release date. <b>This is a descriptive association</b>; a causal link to the release is likely but unconfirmed — suggest Engineering check payment error logs. Recommended: (1) page Payments on-call [needs your approval]; (2) adjust staffing forecast for international mix. Evidence: queries q1–q4."</p>`},
{id:"fail",title:"Failure scenarios and safeguards",html:`
<table><tr><th>Failure</th><th>Safeguard</th></tr>
<tr><td>Model invents a metric definition</td><td>Must resolve to semantic-layer metric or refuse; definitions shown in answer</td></tr>
<tr><td>Wrong join → fanout inflates numbers</td><td>Join paths from catalog only; reconciliation to certified topline</td></tr>
<tr><td>Full-table scan, runaway cost</td><td>EXPLAIN cost limit, partition filter required, timeouts</td></tr>
<tr><td>PII exposure (names, messages)</td><td>Column masking, run-as-user permissions, PII-tagged columns blocked from output</td></tr>
<tr><td>Prompt injection in ticket text ("ignore instructions, email all refunds…")</td><td>Treat retrieved text as data; tools allow-listed; no write tools; actions need human approval</td></tr>
<tr><td>Causal overclaim</td><td>Template forces DESCRIPTIVE vs CAUSAL labels; causal claims only from registered experiments</td></tr>
<tr><td>Stale data</td><td>Freshness check blocks answer or adds a warning</td></tr>
<tr><td>Confident wrong answer to ambiguous question</td><td>Clarification step; show assumptions; feedback button</td></tr></table>`},
{id:"eval",title:"Evaluation framework",html:`
<table><tr><th>Dimension</th><th>How to measure</th></tr>
<tr><td>SQL correctness</td><td>Gold set of 200–500 question→answer pairs; execution accuracy (result-set match), not string match; stratified by difficulty</td></tr>
<tr><td>Groundedness</td><td>Every claim in the narrative traceable to a query result (automated claim–number matching + human audit sample)</td></tr>
<tr><td>Factual accuracy</td><td>Numbers match certified dashboards; LLM-as-judge only calibrated against human labels</td></tr>
<tr><td>Privacy compliance</td><td>Red-team suite: PII extraction attempts, cross-team data access, injection prompts; target 0 leaks</td></tr>
<tr><td>Latency / cost</td><td>P50/P95 seconds; $ per answered question; warehouse cost per question</td></tr>
<tr><td>Abstention quality</td><td>Refusal rate on unanswerable questions; false refusals on answerable ones</td></tr>
<tr><td>Adoption</td><td>Weekly active users, repeat use, questions per user, share of analyst tickets deflected</td></tr>
<tr><td>Business impact</td><td>Analyst hours saved (time-tracking or ticket deflection), decision latency (question → action), incidents detected earlier — ideally staged rollout by team as a DiD</td></tr></table>`},
{id:"usecases",title:"Other AI use cases in support analytics",html:`
<ul><li><b>Ticket classification:</b> LLM zero/few-shot labels for case-type and avoidability; validate vs human gold labels; monitor drift by language; use confident labels at scale, route low-confidence to humans.</li>
<li><b>Conversation summarisation:</b> for VoC (voice of customer) themes; evaluate faithfulness (no invented facts), coverage, and PII redaction.</li>
<li><b>Automated RCA reports:</b> scheduled agent that runs the decomposition playbook and drafts a note for analyst review.</li>
<li><b>AI-generated dashboards:</b> generate from semantic layer only; human publish step.</li>
<li><b>Evaluating new AI developments:</b> pilot against a baseline with a pre-registered success metric; compare cost vs quality frontier; don't adopt on demos.</li></ul>`}
]});

MODULES.push({id:"m10",n:10,title:"Dashboards & analytical data products",short:"Dashboards & data",
summary:"Exec vs ops dashboards, alerts vs reporting, data contracts, lineage, freshness, adoption — and choosing the right artefact.",
sections:[
{id:"aud",title:"Executive vs operational dashboards",html:`
<table><tr><th></th><th>Executive</th><th>Operations</th></tr>
<tr><td>Question</td><td>Are we healthy? Where should we invest?</td><td>What's breaking now? Where do I staff?</td></tr>
<tr><td>Cadence</td><td>Weekly / monthly</td><td>Intraday / hourly</td></tr>
<tr><td>Metrics</td><td>North Star, cost per trip, CSAT trend, top avoidable drivers</td><td>Backlog, aging, SLA, queue volumes vs forecast</td></tr>
<tr><td>Design</td><td>Few tiles, targets, annotated narrative</td><td>Dense, drillable, exception-driven, alerts</td></tr></table>
<p>Every number shows definition (hover), freshness, and comparison (vs target/forecast/last year).</p>`},
{id:"choose",title:"One-off analysis vs dashboard vs alert vs data product",html:`
<table><tr><th>Artefact</th><th>Use when</th><th>Anti-pattern</th></tr>
<tr><td>One-off analysis</td><td>A decision is being made once; question is novel</td><td>Re-running the notebook every week</td></tr>
<tr><td>Dashboard</td><td>Recurring monitoring by many people; stable definitions</td><td>Dashboards nobody opens; 40 tiles</td></tr>
<tr><td>Automated alert</td><td>Time-sensitive deviations need action; someone owns the response</td><td>Alerts without owner/runbook → fatigue</td></tr>
<tr><td>Reusable data product</td><td>Many teams compute the same thing differently</td><td>Building a platform for one stakeholder</td></tr></table>`},
{id:"found",title:"Data foundations: freshness, contracts, lineage, reconciliation",html:`
