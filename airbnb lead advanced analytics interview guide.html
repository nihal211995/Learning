<ul><li><b>Data contracts:</b> producer (e.g. ticketing system team) commits to schema, semantics and SLAs; breaking changes require versioning; CI tests on contract.</li>
<li><b>Freshness SLAs</b> per table; dashboard banner when stale.</li>
<li><b>Lineage:</b> know which dashboards break when <code>stg_case_events</code> changes.</li>
<li><b>Reconciliation:</b> daily check that contact counts agree across vendor exports, warehouse and finance within tolerance.</li>
<li><b>Orchestration:</b> DAG-scheduled ETL (Airflow-style) with retries, backfills, idempotent partition overwrites.</li></ul>`},
{id:"platform",title:"System design: scalable support analytics platform",html:`
<pre class="diagram">Sources: ticketing/CRM · chat/voice vendors · Help Center events · bookings/trips · refunds/payouts · CSAT · agent WFM
   │ (CDC / batch, data contracts)
   ▼
Lake/warehouse (Hive/Iceberg tables, partitioned by ds) ── quality tests (dbt-style), freshness monitors
   ▼
Core models: fct_contact · fct_case · fct_trip_day (exposure) · dim_agent (SCD2) · dim_case_type (versioned)
   ▼
Metric marts + semantic layer (certified definitions, owners)
   ├─▶ Exec & ops dashboards (Tableau/Superset)
   ├─▶ Alerting service (seasonal baselines, owners, runbooks)
   ├─▶ Experiment analysis pipeline (standard metrics, CUPED, SRM checks)
   └─▶ AI assistant (NL→SQL over semantic layer, permissions, eval harness)</pre>`},
{id:"adopt",title:"Measuring dashboard and tool adoption and impact",html:`
<p>Adoption: weekly active viewers by target persona, repeat usage, time-to-insight. Impact: decisions traceable to the tool (decision log), reduction in ad-hoc requests, faster incident detection (time to detect before/after). Retire unused dashboards quarterly.</p>`}
]});

MODULES.push({id:"m11",n:11,title:"Business judgment & ROI",short:"ROI & judgment",
summary:"Transparent, sensitivity-tested business cases for repeat contacts, AI automation, cost per resolution and prioritisation.",
sections:[
{id:"repeat",title:"Case: reducing repeat contacts (illustrative)",html:`
<p><b>Assumptions (illustrative):</b> 2.0M contacts/month; 18% are 7-day repeats (360k); fully-loaded cost $6/contact.</p>
<p>Reduce repeat rate by 3pp → 60,000 fewer contacts/month × $6 = <b>$360k/month ≈ $4.3M/year</b>.</p>
<table><tr><th>Cost/contact ↓ / Reduction →</th><th>1.5pp</th><th>3pp</th><th>4.5pp</th></tr>
<tr><td>$4</td><td>$1.44M</td><td>$2.88M</td><td>$4.32M</td></tr>
<tr><td>$6</td><td>$2.16M</td><td>$4.32M</td><td>$6.48M</td></tr>
<tr><td>$8</td><td>$2.88M</td><td>$5.76M</td><td>$8.64M</td></tr></table>
<p><b>The trade-off a Lead catches:</b> if the fix is "spend longer on first contacts" and raises handle time 5% on all 2M contacts, cost = 2M × $6 × 5% = $600k/month — <i>more than the saving</i>. So target longer handling only to the case types driving repeats (e.g. 20% of volume): cost = $120k, net +$240k/month, plus CSAT/retention upside not counted.</p>`},
{id:"ai",title:"Case: AI automation investment",html:`
<p><b>Assumptions:</b> 1.0M eligible contacts/month; measured containment 35%; 10pp of those re-contact within 7 days → <b>true containment 25%</b>; agent contact $6; bot cost $0.40/session; build + run cost $150k/month.</p>
<p>Savings = 250k × $6 = $1.50M; bot cost = 1.0M × $0.40 = $0.40M; net before fixed = $1.10M; net = <b>$0.95M/month</b>. Using measured (35%) containment would overstate savings by $600k/month — the definition matters more than the model.</p>
<p><b>Sensitivity:</b> breakeven true containment = (0.40M + 0.15M)/($6 × 1.0M) ≈ <b>9.2%</b>. Guardrails: CSAT, refund leakage, safety misroutes. Recommendation: proceed with staged rollout and a holdback to measure true containment causally.</p>`},
{id:"cpr",title:"Cost per resolved case and agent productivity",html:`
<div class="formula">Cost per resolved case = (agent labour + vendor + tooling + refunds/credits issued*) ÷ cases resolved (no reopen within 7d)</div>
<p>*Decide explicitly whether goodwill credits are a support cost or a retention investment — Finance must agree. Productivity (cases/hour) must be paired with quality (repeats, QA, CSAT) and case-mix adjustment, otherwise agents with easy queues look best.</p>`},
{id:"prio",title:"Prioritisation under incomplete evidence",html:`
<p>Score opportunities with <b>expected value × confidence ÷ effort</b>, using ranges, not points:</p>
<table><tr><th>Opportunity</th><th>Volume addressed/mo</th><th>Est. reduction</th><th>$ / mo (at $6)</th><th>Confidence</th><th>Effort</th></tr>
<tr><td>Refund ETA notification</td><td>120k refund-status contacts</td><td>20–40%</td><td>$144k–$288k</td><td>Medium (pilot data)</td><td>Low</td></tr>
<tr><td>Bot for check-in issues</td><td>200k</td><td>10–25% true containment</td><td>$120k–$300k minus bot cost</td><td>Low</td><td>High</td></tr>
<tr><td>Fix payout-status page bug</td><td>40k</td><td>60–80%</td><td>$144k–$192k</td><td>High</td><td>Low</td></tr></table>
<p>Recommendation: do the bug fix and notification now (high confidence/low effort), run a controlled pilot on the bot to buy information before committing. Value of information is an explicit argument for experimentation.</p>`},
{id:"comm",title:"How to present a business case to executives",html:`
<p>Answer first (recommend + number + confidence), then 3 supporting points, then risks and what would change your mind. Show the sensitivity table, not just the point estimate. Make the decision reversible where possible (staged rollout).</p>`}
]});

MODULES.push({id:"m12",n:12,title:"Leadership & behavioral interviews",short:"Leadership",
summary:"STAR for senior analysts, story mapping from your Target and Rapido work (fill-in only — no invented outcomes), and Lead signals.",
sections:[
{id:"star",title:"STAR+ template for senior analytics",html:`
<table><tr><th>Part</th><th>What to say</th><th>Time</th></tr>
<tr><td><b>Situation</b></td><td>Business context, stakes in numbers, who the stakeholders were</td><td>15s</td></tr>
<tr><td><b>Task</b></td><td>Your specific ownership; the ambiguity or conflict</td><td>10s</td></tr>
<tr><td><b>Action</b></td><td>Analytical choices <i>and why</i> (metric definition, method, alternatives rejected), how you influenced, what you built</td><td>60–90s</td></tr>
<tr><td><b>Result</b></td><td>Decision made, measurable outcome, how you measured it (causal or not)</td><td>20s</td></tr>
<tr><td><b>+ Reflection</b></td><td>What you'd do differently; how you scaled it (mentoring, reusable asset)</td><td>15s</td></tr></table>
<div class="callout"><b>Lead signals interviewers listen for</b>You chose the question, not just the answer · you defined the metric · you said no to something · you made others better · you quantified impact and its uncertainty · you owned a mistake.</div>`},
{id:"bridge",title:"Bridging your experience to Community Support (without overclaiming)",html:`
<table><tr><th>Your background (stated)</th><th>Transferable to Support analytics</th><th>How to phrase it</th></tr>
<tr><td>Rapido — customer growth &amp; retention</td><td>Retention cohorts, incentive ROI, experimentation, two-sided marketplace (riders/captains)</td><td>"Support is a retention lever; I've measured retention levers in a two-sided marketplace."</td></tr>
<tr><td>Target — merch analytics, forecasting</td><td>Demand forecasting (→ ticket forecasting), metric design, reporting tools, stakeholder management at scale</td><td>"Forecasting demand by store × item maps directly to contacts by region × language × hour."</td></tr>
<tr><td>Flask / data apps, dashboards</td><td>Self-service tooling, decision support</td><td>"I've built tools that let stakeholders answer their own questions."</td></tr>
<tr><td>LightGBM / Random Forest</td><td>Escalation-risk models, volume forecasting</td><td>Discuss evaluation and business use, not algorithms.</td></tr>
<tr><td>AI/LLM automation work (multi-agent pipelines, chatbot — per your profile)</td><td>AI-first analytics</td><td>Describe architecture, evaluation, and what failed — be precise about what was production vs prototype.</td></tr></table>
<p><b>Honest gap statement</b> (use if asked): "I haven't owned a customer-support analytics function directly. The problems — contact demand, resolution quality, cost-to-serve — share structure with what I've done in retention and demand forecasting, and I've prepared specifically on support metric design and causal measurement of support changes."</p>`},
{id:"stories",title:"Story bank (fill-in) — see Story Bank view",html:`<p>The Story Bank view has 10 prompts mapped to Lead competencies with fill-in fields that save locally. Complete at least 6 stories with real numbers you can defend. Any field you can't fill with a verified number should say "qualitative" — never estimate in the interview as if it were measured.</p>`}
]});
/* ===================== QUESTION BANK — top 30 with model answers ===================== */
const CATS = {A:"Support cases",B:"Metrics & KPIs",C:"SQL & data modeling",D:"Statistics & probability",E:"Experimentation",F:"Causal inference",G:"Python & modeling",H:"Forecasting & RCA",I:"AI-first analytics",J:"Dashboards & data products",K:"ROI & judgment",L:"Leadership & behavioral",P:"Airbnb business"};
const TRACK_OF = {C:1,G:1,J:1,D:2,E:2,F:2,A:3,B:3,H:3,K:3,P:3,L:4,I:4};
const QUESTIONS = [];
function Q(o){ o.strong=o.strong.split("|"); o.mistakes=o.mistakes.split("|"); o.follow=o.follow.split("|"); o.track=TRACK_OF[o.cat]; QUESTIONS.push(o); }

Q({id:"Q1",cat:"A",diff:"Hard",pri:"P0",skill:"Structured RCA on a support KPI",
q:"Airbnb's support contact rate increased 20% month over month. How would you investigate?",
why:"The single most likely case-style question for this team; tests structure, metric scepticism, decomposition and business closure.",
strong:"Validate the metric before explaining it (numerator/denominator sources, logging, dedup, taxonomy, late data)|Decompose rate into numerator vs denominator movement|Mix vs within-segment rate decomposition (side, geo, case type, channel, platform/app version, new vs repeat contactor)|Shape over time: step change vs ramp; align to release/policy/external calendars|Quantify cost and experience impact; route each driver to an owner with a recommendation|Monitoring: alert so the next one is caught in days not a month",
mistakes:"Jumping to hypotheses before checking data validity|Treating contact volume and contact rate as the same thing|Listing 20 hypotheses with no prioritisation|Ending without a recommendation or owner",
follow:"Half the increase is from repeat contacts — what does that change?|The increase is only in hosts in one country — what next?|How would you know if it's seasonal?",
model:{verbal:"I'd first make sure the 20% is real — check that the contact and trip sources are complete, no logging or dedup change, no case-type remapping. Then I'd split it: is the numerator rising or the denominator falling? Next I'd separate mix from rate — has the share of high-contact segments like international trips or new hosts grown, or has the rate risen within segments? I'd cut by side, geography, case type, channel and app version, and look at the time shape — a step on a specific date points to a release or policy change; a ramp points to seasonality or a growing backlog. Each surviving hypothesis gets a cost estimate and an owner, and I'd add an alert so we catch the next one within days.",
html:`<h4>Framework</h4><ol><li><b>Clarify:</b> which contact rate (per trip? per booking?), guest/host/both, which month vs which baseline; is +20% outside normal seasonal variation (compare same month last year)?</li>
<li><b>Validate:</b> source row counts vs vendor exports; dedup logic; channel/case taxonomy changes; denominator pipeline (trips) intact.</li>
<li><b>Decompose:</b> ΔR = mix + rate + interaction across the top dimension, then drill the rate component. Also unique contactors vs contacts per contactor (repeat behaviour).</li>
<li><b>Hypotheses ranked by prior + evidence:</b> seasonal mix; product release; policy change; external event; support failure (backlog → repeats); measurement.</li>
<li><b>Impact:</b> excess contacts × cost per contact; CSAT/retention risk for affected users.</li>
<li><b>Action + monitoring.</b></li></ol>
<h4>Illustrative numbers</h4><p>Rate 4.00 → 4.80 per 100 trips. Decomposition: mix (international share 30%→40%) +0.33; rate +0.47, of which 0.30 sits in "payment issue" contacts from one app version released on day 9. Excess contacts ≈ 0.30/100 × 10M trips = 30k/month × $6 ≈ $180k/month, plus failed-payment booking losses. Action: Eng bug fix; staffing adjustment for seasonal mix; alert on case-type rates by app version.</p>
<h4>Adapting</h4><p>If the interviewer says "data is valid and uniform across all segments" → think external/global: policy change, Help Center outage pushing users to contact, or a contact-us entry point redesign. If "only repeat contacts rose" → resolution quality/backlog, not demand.</p>`,
lead:"A mid-level answer lists hypotheses. A Lead answer validates first, uses a decomposition that quantifies each driver's share, prioritises by impact, assigns owners, and fixes the detection gap (why did it take a month?)."}});

Q({id:"Q2",cat:"A",diff:"Medium",pri:"P0",skill:"Denominator reasoning and demand drivers",
q:"Support ticket volume has increased while bookings have remained flat. What could explain this?",
why:"Tests whether you know bookings are a lagged, partial exposure measure for support demand.",
strong:"Bookings ≠ exposure: in-stay/post-stay contacts depend on trips in progress, which lag bookings|Mix shift (longer stays, international, new hosts, peak season check-ins)|Cancellations/disruptions (weather, regulation) generate contacts without new bookings|Host-side contacts (payouts, taxes, policy) don't scale with bookings|Repeat contacts from backlog or poor resolution|Product/policy change; contact-entry-point change; measurement change",
mistakes:"Assuming volume must track bookings|Not separating unique contactors from repeats|Ignoring host side",
follow:"How would you build a better exposure denominator?|Which single chart would you show first?",
model:{verbal:"Bookings are the wrong clock for most support demand. Many contacts come from trips that are happening now — booked weeks or months ago — so if peak-season check-ins are high, contacts rise even with flat current bookings. I'd re-express volume per trip-in-progress and per cancellation, split guest vs host, and separate new issues from repeat contacts. If the rate per trip is also up, I'd look for a product or policy change, an external disruption causing cancellations, or a backlog causing repeats — and I'd confirm it isn't a logging or entry-point change.",
html:`<h4>Diagnostic sequence</h4><ol><li>Plot contacts against <b>trips in progress</b>, <b>check-ins</b>, <b>cancellations</b> — which tracks the volume?</li>
<li>Split by lifecycle stage (pre-trip, in-trip, post-trip) and side.</li>
<li>Unique contactors vs contacts per contactor.</li>
<li>Case-type step changes vs release/policy logs.</li></ol>
<p><b>Illustrative:</b> bookings flat at 1.0M/week, but check-ins up 15% (summer trips booked in spring) → in-trip contacts up 15%; per-check-in rate flat. Conclusion: expected seasonality — a staffing problem, not a quality problem.</p>`,
lead:"Lead answer reframes the denominator and produces the one chart that settles the question, then distinguishes 'expected demand' (staff for it) from 'problem demand' (fix it)."}});

Q({id:"Q3",cat:"A",diff:"Hard",pri:"P0",skill:"Measurement framework design",
q:"How would you measure the effectiveness of Airbnb's customer support organization?",
why:"Tests whether you can design a framework that balances experience, quality, efficiency and safety — core to 'design metrics and dimensions'.",
strong:"Start from purpose: trust, retention, safety, cost-to-serve|North Star (e.g. resolved-well trip rate) plus a tree of driver metrics|Quality (FCR, repeat contacts, reopen), speed (FRT, TTR P50/P90, SLA), experience (CSAT with bias handling, downstream retention), efficiency (cost per resolved case), safety SLAs|Guest and host views; segment by case type and channel|Guardrail pairs against gaming|Outcome linkage: does good support change rebooking/host retention?",
mistakes:"Picking CSAT or cost as the single metric|Ignoring safety and host side|No denominators or windows",
follow:"If you could only show the exec team 3 numbers, which?|How would you prove support quality affects retention?",
model:{verbal:"I'd define effectiveness against support's purpose: protect trust and lifetime value of guests and hosts at a sustainable cost, with safety non-negotiable. My North Star would be something like the share of trips with no unresolved support issue — problems either avoided or resolved well. Under it: incidence (avoidable contacts per trip), resolution quality (FCR, 7-day repeats, reopens), speed (time to resolution P50/P90, SLA), experience (CSAT corrected for response bias plus behavioural outcomes like rebooking), efficiency (cost per resolved case) and safety SLAs as hard constraints. Every efficiency metric gets a quality guardrail, and everything is split guest/host and by case type.",
html:`<h4>Three-number exec view</h4><ol><li>Resolved-well trip rate (North Star)</li><li>Cost per trip served (efficiency)</li><li>Safety-case SLA attainment (constraint)</li></ol>
<h4>Linking to business value</h4><p>Estimate the effect of resolution quality on retention: compare rebooking of guests with resolved vs unresolved issues <i>matched on issue severity and prior booking history</i>, or exploit quasi-random variation such as agent assignment (some agents resolve better; assignment is as-good-as-random within queue/hour) — an instrument for resolution quality. That turns "support quality" into dollars for Finance.</p>`,
lead:"Lead answer ties metrics to an objective function, includes both sides of the marketplace, and proposes how to value support causally (agent-assignment IV) rather than asserting it."}});

Q({id:"Q4",cat:"A",diff:"Medium",pri:"P0",skill:"Avoidable-contact definition and classification",
q:"How would you determine whether a contact was avoidable?",
why:"Avoidable contact is a core support analytics concept and drives product prioritisation.",
strong:"Precise definition: preventable by an upstream product/policy/communication change without degrading outcome|Taxonomy (info-seeking, status-chasing, defect, policy confusion, unavoidable)|Signals: case type, first message text, resolution code, whether self-serve content existed|Scaled labelling: LLM or supervised classifier validated against human gold set; per-bucket precision/recall|Report share with uncertainty; size by cost and experience impact; assign owners",
mistakes:"Calling every contact avoidable|Using agent dispositions alone (inconsistent)|Not validating the classifier",
follow:"How would you validate an LLM's avoidable labels?|What if agents disagree on the label 30% of the time?",
model:{verbal:"I'd define avoidable as 'a reasonable upstream change could have prevented the need to contact, without making the user worse off', and make it a taxonomy rather than a yes/no: information-seeking, status-chasing, product defect, policy confusion, and genuinely unavoidable cases like disputes and safety. I'd label a stratified sample by hand with clear guidelines, measure inter-rater agreement, then scale with a classifier — an LLM on the first message plus case metadata — validated against that gold set per bucket. The output is avoidable contacts per trip by driver, sized in cost and routed to the team that owns the fix.",
html:`<p><b>Inter-rater agreement:</b> if Cohen's κ is below ~0.6, the definition — not the model — needs work. <b>Classifier acceptance:</b> precision ≥ 0.85 for buckets that drive investment decisions. <b>Sizing:</b> 2M contacts × 35% avoidable (CI 32–38%) × $6 = $4.2M/month addressable (illustrative).</p>`,
lead:"Lead answer treats the definition as a governed metric (guidelines, agreement, validation, uncertainty) and closes the loop to owners."}});

Q({id:"Q5",cat:"A",diff:"Hard",pri:"P0",skill:"Repeat-contact driver analysis",
q:"How would you identify the largest drivers of repeat contacts?",
why:"Repeat contacts are the clearest signal of resolution failure; tests definition, SQL thinking and prioritisation.",
strong:"Define repeat at issue level (same user + booking within k days, any channel), with censoring handled|Rate by first-contact case type, channel, agent team, language, resolution code|Attribution: volume × repeat rate × cost → contribution to total repeats|Model propensity (logistic/GBM) for drivers, but interpret causally only with care|Qualitative: read transcripts of top drivers|Recommend fixes per driver and measure",
mistakes:"Counting repeats by case_id (agents open new cases)|Ignoring right-censoring|Ranking by rate instead of contribution",
follow:"Write the SQL for 7-day repeat rate by first-contact case type.|One team has high repeats but handles hard cases — how do you compare fairly?",
model:{verbal:"First a defensible definition: a repeat is another contact from the same user about the same booking within 7 days of the first contact on an issue, across any channel, and I only count first contacts whose full 7-day window has elapsed. Then I rank drivers by contribution, not rate: first-contact volume times repeat rate gives repeats attributable to each case type, channel or resolution code. For fair team comparisons I'd case-mix adjust. Then I'd read transcripts from the top three drivers to find the mechanism — e.g. refunds promised without an ETA — and propose a fix with a measurable target.",
html:`<p><b>Contribution table (illustrative):</b></p><table><tr><th>First-contact type</th><th>Volume</th><th>Repeat 7d</th><th>Repeats</th><th>Share</th></tr><tr><td>Refund status</td><td>300k</td><td>30%</td><td>90k</td><td>33%</td></tr><tr><td>Cancellation dispute</td><td>100k</td><td>40%</td><td>40k</td><td>15%</td></tr><tr><td>Check-in access</td><td>200k</td><td>12%</td><td>24k</td><td>9%</td></tr></table><p>Disputes have the highest rate but refund status contributes 2× the repeats. SQL: see exercise S4.</p>`,
lead:"Lead answer handles cross-channel identity and censoring, ranks by contribution, and case-mix adjusts team comparisons."}});

Q({id:"Q6",cat:"A",diff:"Hard",pri:"P0",skill:"Self-service impact measurement",
q:"How would you measure the impact of a new self-service resolution flow?",
why:"Self-service is where measurement is most often wrong (silent failure counted as success).",
strong:"Define true resolution: terminal state reached + no re-contact within k days on any channel + no adverse downstream event|Experiment at user level among eligible issues; ITT|Primary: agent contacts per eligible issue (or true resolution rate); guardrails CSAT, repeats, refund $, safety latency|Identity linkage for anonymous sessions|Long-term: rebooking/churn",
mistakes:"Using containment (no agent in session) as success|Denominator = flow sessions instead of eligible issues|Ignoring users who never enter the flow",
follow:"Users who enter the flow differ from those who don't — how does ITT handle that?|Containment rose but CSAT dropped — ship?",
model:{verbal:"I'd measure it as a change in outcomes for everyone with an eligible issue, not just people who used the flow. Randomise eligible users, compare agent contacts per eligible issue and a 'true resolution' rate — the user reached a resolution state and didn't contact us again on any channel within 7 days, and there was no chargeback or bad review about it. Guardrails are CSAT among contactors, refund amounts, and safety escalation time. Containment alone would count users who gave up as successes.",
html:`<p><b>Illustrative ITT:</b> control 40 agent contacts per 100 eligible issues; treatment 34 → −6 per 100 (−15%). Flow usage 50% → effect per user who used it ≈ 12 per 100 (CACE, assuming no effect on non-users). True-resolution rate 58% → 63%; CSAT −0.3pp (CI −1.1 to +0.5, within −1pp margin) → ship.</p>`,
lead:"Lead answer redefines success to avoid survivorship, uses ITT with a CACE translation, and pre-registers non-inferiority margins."}});

Q({id:"Q7",cat:"A",diff:"Medium",pri:"P0",skill:"CSAT bias and quality measurement",
q:"How would you measure support quality when CSAT response rates are low?",
why:"Low and biased response is the norm; tests survey bias reasoning and use of behavioural proxies.",
strong:"Non-response bias: respondents skew to extremes|Weight responses by response propensity (model on case features)|Track response rate by segment as its own metric|Behavioural quality signals: repeat contacts, reopens, escalations, downstream rebooking/churn|QA audits on stratified samples; LLM-scored transcripts calibrated to human QA|Triangulate",
mistakes:"Reporting raw CSAT as representative|Comparing CSAT across teams with different response rates|Over-trusting LLM scoring without calibration",
follow:"How would you validate that LLM transcript scores agree with humans?|CSAT up but repeats up — believe which?",
model:{verbal:"Low response is less of a problem than biased response. I'd model response propensity from case features and reweight CSAT, report response rate by segment so comparisons are honest, and lean on behavioural signals that exist for every case — repeat contacts, reopens, escalation, and whether the guest or host rebooked. I'd add stratified QA audits, and potentially LLM scoring of transcripts against a rubric, calibrated against human QA labels before anyone uses it in a scorecard.",
html:`<p>Inverse-propensity-weighted CSAT: CSAT<sub>w</sub> = Σ (y<sub>i</sub>/π<sub>i</sub>) / Σ (1/π<sub>i</sub>) over respondents. Valid if response depends only on observed features (MAR). Validate LLM scorer: agreement with human QA (κ), bias by language/segment.</p>`,
lead:"Lead answer names the assumption behind reweighting (MAR) and builds a triangulated quality index rather than defending one metric."}});

Q({id:"Q11",cat:"B",diff:"Hard",pri:"P0",skill:"Metric tree design",
q:"Design a metric tree for Community Support. What's the North Star and why?",
why:"Directly tests 'design metrics and dimensions' — the first responsibility in the JD.",
strong:"North Star tied to user value and business value|Decomposition into incidence × resolution × experience with efficiency as a constrained branch|Each node: formula, grain, owner|Leading vs lagging|Guardrails and gaming modes|How the tree drives prioritisation",
mistakes:"North Star = cost or contacts|No formulas|Tree with no owners",
follow:"Defend why not CSAT as North Star.|How does the tree differ for hosts?",
model:{verbal:"I'd anchor on 'resolved-well trip rate' — share of completed trips with no unresolved support issue and no repeat within 7 days. It goes up if we prevent problems or resolve them well, and it can't be gamed by hiding the contact button because unresolved problems still count. Under it: incidence (contacts per 100 trips, split avoidable/unavoidable — product owns this), resolution (FCR, repeat, reopen — ops owns), speed (FRT, TTR, SLA — leading indicators), experience (bias-corrected CSAT, rebooking), and efficiency as a constrained branch (cost per resolved case, containment). Safety SLA sits beside it as a hard constraint.",
html:`<p>See the interactive <b>KPI Tree</b> view for formulas, grains, exclusions and gaming modes of every node.</p><p><b>Why not CSAT:</b> biased response, lagging, can be bought with credits. <b>Why not contacts per trip:</b> rewards suppression.</p>`,
lead:"Lead answer explains why the North Star resists gaming, assigns owners per branch, and makes efficiency a constraint rather than the goal."}});

Q({id:"Q12",cat:"B",diff:"Hard",pri:"P0",skill:"Containment definition",
q:"How would you measure self-service containment without counting failed journeys as successes?",
why:"A frequent real-world error; tests denominator, identity and windowing.",
strong:"Denominator = eligible issues entering self-service (incl. abandons)|Success requires no re-contact on any channel within k days + terminal state or explicit confirmation|Cross-channel identity; anonymous sessions as a known gap|Adverse events (chargeback, negative review)|Censoring for recent sessions",
mistakes:"No agent in-session = contained|Denominator = completed bot sessions",
follow:"40% of sessions are anonymous — what do you report?",
model:{verbal:"Containment should be 'issues fully resolved without an agent', not 'sessions that didn't reach an agent'. Denominator: every eligible issue that entered self-service, including abandons. Numerator: issues with a terminal resolution or user confirmation, no contact about the same booking on any channel within 7 days, and no chargeback or complaint review. Anonymous sessions I'd report separately with bounds — worst case none contained, best case same rate as identified users.",
html:`<p>Illustrative: measured 35% → after 7-day re-contact rule 25% → after adverse-event rule 24%. That 11pp gap is worth ~$660k/month at 1M issues and $6/contact — exactly the error a business case would otherwise contain.</p>`,
lead:"Lead answer bounds what can't be identified rather than ignoring it."}});

Q({id:"Q13",cat:"B",diff:"Medium",pri:"P0",skill:"Exact metric formulas",
q:"Give exact formulas for contact rate, FCR, 7-day repeat rate and cost per resolution — and justify each denominator.",
why:"The project brief explicitly expects exact formulas; interviewers probe denominators.",
strong:"Contact rate = contacts / trips in progress (or per booking for booking-flow issues)|FCR = issues resolved with one contact and no further contact in k days / first contacts with observed window|Repeat 7d = first contacts with ≥1 further contact on same booking in 7d / first contacts with observed window|Cost per resolution = total support cost / issues resolved without reopen in k days|Grain, window, exclusions",
mistakes:"FCR measured on agent disposition only|Cost per contact presented as cost per resolution",
follow:"Why might FCR and repeat-rate not sum to 1?",
model:{verbal:"Contact rate: contacts divided by trips in progress in the period, because in-stay issues are generated by stays happening, not bookings made. FCR: issues resolved on the first contact with no further contact on that issue within 7 days, over first contacts whose 7-day window is complete — agent disposition alone overstates it. Repeat rate: first contacts with any further contact on the same booking within 7 days, same denominator. Cost per resolution: fully loaded support cost over issues resolved without reopen — cost per contact rewards cheap contacts that don't solve anything.",
html:`<p>FCR + repeat ≠ 1 because an issue can be unresolved without a repeat (user gave up) — that silent-failure gap is worth tracking.</p>`,
lead:"Lead answer names censoring, cross-channel identity and the silent-failure gap."}});

Q({id:"Q21",cat:"C",diff:"Medium",pri:"P0",skill:"Rolling-window window functions (from your interview notes)",
q:"Flag a user if they have 3 strikes within 60 days. Table: strikes(user_id, strike_date). Write it in Presto/Trino.",
why:"Appears in your own notes; checks LAG offset logic, boundary definitions and dedup.",
strong:"Compare each strike with the strike two rows earlier (LAG offset 2), not consecutive gaps|Explicit boundary: span ≤ 59 or ≤ 60 days — state it|Dedup same-day strikes|Return flag date (first time condition met)|Alternative: RANGE window count or self-join",
mistakes:"Using LAG(1) gaps > 60 (logic inverted and wrong window)|BigQuery date_diff argument order in Trino|Counting distinct strike_date with CASE that never returns the flag",
follow:"Return the date each user was first flagged.|Strikes expire after 60 days and flags should lift — model the flag as intervals.",
model:{verbal:"Three strikes in a 60-day window means the third strike lands within 60 days of the strike two before it. So for each strike I take LAG(strike_date, 2) over the user's ordered strikes and test the day difference. I'd confirm the boundary — I'll treat 'within 60 days' as span ≤ 59 days so all three fall in one 60-day window — and dedup same-day duplicates first.",
html:`<pre><code>WITH s AS (
  SELECT DISTINCT user_id, strike_date FROM strikes      -- dedup same-day strikes
), w AS (
  SELECT user_id, strike_date,
         LAG(strike_date, 2) OVER (PARTITION BY user_id ORDER BY strike_date) AS strike_2_back
  FROM s
)
SELECT user_id, MIN(strike_date) AS first_flag_date
FROM w
WHERE strike_2_back IS NOT NULL
  AND date_diff('day', strike_2_back, strike_date) &lt;= 59
GROUP BY user_id;</code></pre>
<p><b>Expected output on the sample:</b> 001 → 2024-11-01 (span 31 days). 002 is <i>not</i> flagged: 2024-11-10 → 2025-01-10 is 61 days. (Verified with DuckDB on the sample rows.)</p>
<p><b>What was wrong in the notes' attempt:</b> it computed consecutive gaps with LAG(1)/LEAD, used <code>date_diff(end, start, day)</code> (BigQuery order) instead of Trino's <code>date_diff('day', start, end)</code>, and the final COUNT(CASE WHEN gap &gt; 60) counts the opposite condition and was never compared to 3.</p>`,
lead:"Lead answer states the boundary assumption out loud, dedups, and offers the interval-model extension for operational use."}});

Q({id:"Q22",cat:"C",diff:"Hard",pri:"P0",skill:"Repeat contacts across windows",
q:"Compute 24h, 7-day and 30-day repeat-contact rates by first-contact channel, handling censoring.",

Q({id:"Q31",cat:"D",diff:"Medium",pri:"P0",skill:"Power/MDE (from your interview notes)",
q:"Baseline conversion 20%, MDE 2%, α = 0.05, power 0.8. What sample size do you need?",
why:"In your notes with an answer (22k) that doesn't reconcile — interviewers check whether you clarify absolute vs relative.",
strong:"Ask: absolute or relative MDE; per arm or total|Formula with both variances|Absolute 2pp → ~6.5k per arm|Relative 2% → ~158k per arm|Translate to duration using eligible traffic|Mention one- vs two-sided",
mistakes:"Not clarifying absolute vs relative|Reporting total as per-arm|Ignoring that randomisation unit traffic sets duration",
follow:"You only get 11k users per arm — what can you detect?|How would CUPED change this?",
model:{verbal:"First I'd ask whether 2% is absolute or relative. With a two-sided test, z-sum squared is about 7.85. Absolute — 20 to 22% — gives 7.85 × (0.16 + 0.1716) / 0.0004 ≈ 6,500 per arm, about 13k total. Relative — 20 to 20.4% — needs about 158k per arm. Then I'd convert to duration from eligible weekly traffic and round up to full weeks.",
html:`<div class="formula">n = 7.849 × [0.20·0.80 + 0.22·0.78] / 0.02² = 7.849 × 0.3316 / 0.0004 ≈ 6,507 per arm</div><p>With 11k per arm, detectable absolute MDE ≈ 2.80 × √(2×0.16/11,000) ≈ <b>1.5pp</b>. CUPED with pre-period correlation ρ = 0.5 cuts variance by ρ² = 25% → n × 0.75.</p>`,
lead:"Lead answer clarifies the spec, reconciles numbers, and turns n into calendar time and cost of waiting."}});

Q({id:"Q32",cat:"D",diff:"Medium",pri:"P1",skill:"Bayes with base rates",
q:"An LLM flags 'safety-related' messages with 95% recall and 5% FPR; 1% of messages are safety-related. What fraction of flags are true? What would you do with that?",
why:"Tests Bayes and operational judgment in AI triage.",
strong:"P = 0.0095/0.059 ≈ 16%|Use as triage to humans, not automated action|Cost-weighted threshold choice|Monitor recall on a labelled audit stream",
mistakes:"Answering 95%|Raising threshold without weighing missed safety cases",
follow:"How would you pick the threshold?",
model:{verbal:"About 16% — 0.95 × 1% true positives versus 5% × 99% false positives, so most flags are false because safety messages are rare. That's fine for routing to a trained human quickly; it's not fine for any automated penalty. I'd pick the threshold by cost: a missed safety case is far costlier than a reviewer's minute, so I'd keep recall high and size the review team for the flag volume.",
html:`<p>Threshold rule: flag if p(x) ≥ C<sub>FP</sub> / (C<sub>FP</sub> + C<sub>FN</sub>). If a false negative costs 200× a false positive, threshold ≈ 0.005.</p>`,
lead:"Lead answer moves from arithmetic to an operating policy with costs."}});

Q({id:"Q41",cat:"E",diff:"Hard",pri:"P0",skill:"End-to-end experiment design for AI support",
q:"Design an experiment for an AI-assisted support chatbot for guests.",
why:"Most likely experimentation scenario for this team.",
strong:"Decision + hypothesis|User-level randomisation among eligible issues; exclude safety|Primary: true resolution without agent / agent contacts per eligible issue|Guardrails with non-inferiority margins: CSAT, repeats, refund $, policy errors, safety latency|Power and duration (full weeks)|SRM, novelty, interference via shared agent queue|Decision rule and staged rollout with holdback",
mistakes:"Session-level randomisation|Containment as primary|No guardrails on money/safety",
follow:"Treatment frees agent capacity and speeds up control's queue — implications?|Effect is positive in English, negative in Japanese — what now?",
model:{verbal:"The decision is whether to route eligible guest issues to the bot first. I'd randomise at the user level among users starting a contact in eligible case types, with safety and high-value disputes excluded and always routed to humans. Primary metric: agent contacts per eligible issue — or true resolution without an agent — analysed ITT. Guardrails with pre-set margins: CSAT, 7-day repeats, refund dollars per case, audited policy-error rate, and time to reach a human when escalation is requested. Two-plus full weeks, SRM checks, novelty curves, and a decision rule written beforehand. Then ramp by language with a long-term holdback.",
html:`<h4>Power (illustrative)</h4><p>Baseline: 60 agent-handled issues per 100 eligible; target −5pp absolute. n ≈ 7.849 × (0.24 + 0.2475)/0.0025 ≈ 1,530 per arm — power is easy; guardrails (CSAT non-inferiority within −1pp at ~80% positive) need far more: ≈ 7.849 × 2 × 0.16/0.0001 ≈ 25k CSAT <i>responses</i> per arm. <b>Guardrails usually drive duration.</b></p>
<h4>Interference</h4><p>Deflection in treatment reduces queue load → control waits less → treatment–control difference in speed understated, and the at-scale effect differs. Measure queue-level effects with a switchback or market-level ramp.</p>`,
lead:"Lead answer notices the guardrails, not the primary, drive sample size; addresses queue interference; and writes the decision rule before launch."}});

Q({id:"Q42",cat:"E",diff:"Hard",pri:"P0",skill:"Interference / switchback",
q:"How would you A/B test a new agent-routing algorithm when all contacts share the same agent pool?",
why:"Tests SUTVA violations in operational systems.",
strong:"Explain why case-level randomisation is biased (shared capacity)|Switchback by time block per site; randomised schedule; washout; block-level analysis|Or split agent pools (cluster) with balance checks|Carryover effects|Metrics and guardrails",
mistakes:"Randomising contacts and reading case-level differences|Ignoring carryover between blocks",
follow:"How do you choose block length?|How many blocks do you need?",
model:{verbal:"Case-level randomisation breaks because both arms draw on the same agents — if the new algorithm grabs the best agents for its cases, control gets worse, and the difference exaggerates the benefit. I'd use a switchback: per site, alternate the algorithm by time blocks on a randomised schedule, drop a short washout after each switch for queue carryover, and analyse at block level comparing block means, with site and hour-of-week effects. Block length trades carryover against number of blocks — a few hours is typical for chat queues.",
html:`<p>Analysis: Y<sub>block</sub> = β·Treat + site FE + hour-of-week FE + ε; SEs clustered by day. With ~4-hour blocks, 3 sites, 3 weeks → ~380 blocks (ignoring overnight) — check power with historical block-level variance.</p>`,
lead:"Lead answer explains the direction of bias and the carryover/power trade-off of block length."}});

Q({id:"Q43",cat:"E",diff:"Medium",pri:"P0",skill:"SRM and trustworthiness",
q:"Your 50/50 refund-flow test shows 50,600 vs 49,400 users. Treatment wins on the primary. What do you do?",
why:"Tests discipline: no reading results on a broken experiment.",
strong:"Chi-square SRM test ≈ 14.4, p ≈ 0.00015|Do not interpret metrics|Debug: assignment, eligibility after assignment, logging, crashes, redirects|Check by segment/date for where imbalance originates|Re-run after fix",
mistakes:"Thinking 1.2% imbalance is small enough|'Adjusting' by reweighting",
follow:"SRM only appears on Android — what's likely?",
model:{verbal:"I wouldn't read the result. A 600-user imbalance on 100k is a chi-square of 14.4, p ≈ 0.00015 — assignment or logging is broken, which means the groups may differ in ways that bias every metric. I'd find where it comes from — by platform, day, eligibility step — fix it, and re-run.",
html:`<div class="formula">χ² = Σ (O−E)²/E = 600²/50,000 + 600²/50,000 = 14.4</div>`,
lead:"Lead answer treats SRM as a hard stop and localises the source."}});

Q({id:"Q44",cat:"E",diff:"Hard",pri:"P0",skill:"Metric trade-offs in decisions",
q:"A new auto-close rule cut median resolution time by 20% but CSAT fell 2pp and 7-day repeats rose 1pp. Ship it?",
why:"The brief explicitly asks for this trade-off.",
strong:"Speed gain may be measurement artefact (premature closure)|Recompute time to final resolution across contacts|Put outcomes in one currency with labelled assumptions|HTE: segments where guardrails hold|Decision: don't ship globally; targeted or redesigned",
mistakes:"Shipping because primary won|Rejecting without exploring segments",
follow:"Finance says the savings are worth the CSAT hit — respond.",
model:{verbal:"Not as is. Rising repeats suggest the rule closes cases before they're solved, so part of the speed gain is an artefact — I'd recompute time to final resolution across all contacts on the issue. Then value both sides: handle-time savings against the cost of extra repeats plus an estimated retention cost of the CSAT drop. And check heterogeneity — if simple case types show no CSAT or repeat harm, ship there only.",
html:`<p>Illustrative: savings $200k/month; extra repeats 1pp × 2M × $6 = $120k; retention estimate from historical link between negative CSAT and rebooking: $150k (wide CI). Net negative globally; positive for simple case types (60% of volume) where guardrails are flat.</p>`,
lead:"Lead answer questions the primary metric's validity, values trade-offs explicitly, and finds the segment where the change is a win."}});

Q({id:"Q51",cat:"F",diff:"Hard",pri:"P0",skill:"Causal attribution of a non-randomised rollout",
q:"An AI chatbot was rolled out and average resolution time decreased by 15%. How would you determine whether the chatbot caused the improvement?",
why:"Named in the brief; the archetypal causal question for this role.",
strong:"Define estimand: effect on time-to-final-resolution for eligible issues (incl. repeats)|Composition/mechanical effects (bot handles easy cases)|Seasonality and concurrent changes|Design: staggered rollout DiD, ITS with seasonality, placebo case types, synthetic control|Assumption probes|Guardrails",
mistakes:"Before/after comparison|Comparing bot-handled vs agent-handled cases|Ignoring repeats",
follow:"The rollout was everywhere on the same day — now what?|Pre-trends aren't parallel — what then?",
model:{verbal:"First I'd ask what improved — average resolution time across which cases? If the bot instantly resolves easy cases, the average falls mechanically even if no one's experience improved, and if bot 'resolutions' generate repeats, the true time is understated. So the estimand is time to final resolution for eligible issues, including repeats. Then I need a counterfactual: if rollout was staggered by market or language, a DiD/event study using not-yet-treated markets; if it was simultaneous, an interrupted time series with seasonal modelling plus placebo case types that weren't bot-eligible, which should show no change. I'd also check what else changed — staffing, policies, season.",
html:`<pre class="diagram">Season ─▶ case mix ─▶ resolution time
           ▲
Bot rollout ─▶ which cases reach agents ─▶ resolution time (composition)
Bot rollout ─▶ quality of resolution ─▶ repeats ─▶ total time</pre>
<p><b>Illustrative DiD:</b> eligible case types −15%, ineligible case types (placebo) −6% same period → seasonal/common component ≈ −6%; bot effect ≈ −9% (assuming parallel trends between eligible and ineligible types, checked over 12 pre-weeks). Including repeats, effect shrinks to −7%.</p>`,
lead:"Lead answer redefines the outcome before estimating, separates composition from causal effect, and uses placebo groups."}});

Q({id:"Q52",cat:"F",diff:"Hard",pri:"P0",skill:"Eligibility-driven selection bias",
q:"High-priority cases were excluded from chatbot eligibility. How does that affect the analysis?",
why:"Named in the brief; tests selection bias and estimand scoping.",
strong:"Eligibility correlates with outcome → naive comparisons confounded|Compare like with like: eligible types pre vs post, or eligible-treated vs eligible-control|Result generalises only to eligible population|If eligibility is a score threshold → RDD at the cutoff|Spillover: agents now handle more high-priority share",
mistakes:"Comparing bot cases to all agent cases|Extrapolating to high-priority cases",
follow:"Eligibility is 'priority score < 70' — exploit it?",
model:{verbal:"It creates selection on outcome: bot cases are easier by construction, so comparing them to agent cases overstates the bot. The comparison has to be within the eligible population — eligible issues before vs after, or randomised. The estimate then only applies to eligible cases. If eligibility is a score cutoff, cases just below and above are comparable, so I could use a regression discontinuity — but that gives an effect only near the threshold. I'd also watch for spillover: agents' remaining work is now harder, so agent metrics will look worse without anyone getting worse.",
html:`<p>Agent-metric trap: agent AHT rises from 12 to 15 min after launch — pure composition if high-priority share of agent work goes from 20% to 40%. Report agent metrics case-mix adjusted.</p>`,
lead:"Lead answer anticipates the spillover onto agent metrics."}});

Q({id:"Q53",cat:"F",diff:"Hard",pri:"P0",skill:"Difference-in-differences",
q:"A support policy changed in one geography but not another. How would you estimate its impact?",
why:"Named in the brief; DiD fluency with assumptions.",
strong:"DiD estimator and regression form|Parallel trends: event study, placebo dates|Choose control: similar seasonality, product mix; or synthetic control from many geos|Concurrent shocks|Inference with few clusters|Effect over time",
mistakes:"Before/after only|No pre-trend check|Cluster SE with two clusters",
follow:"Only one control geography exists and its pre-trend differs — what now?",
model:{verbal:"Difference-in-differences: the treated geography's before-after change minus the control's, which removes common shocks like seasonality. The key assumption is parallel trends, so I'd plot an event study with weekly coefficients — pre-period estimates should hover at zero — and run placebo launch dates. I'd pick controls with similar seasonality and trip mix, or build a synthetic control from several geographies if one isn't close. With only two units, conventional standard errors are unreliable, so I'd use the pre-period variability or randomisation inference across geographies to express uncertainty.",
html:`<p>Worked: A repeat rate 12.0% → 10.0%; B 11.0% → 10.5%; DiD = −1.5pp. Event-study leads (−8…−1 weeks) all within ±0.3pp → supports parallel trends.</p>`,
lead:"Lead answer handles small-cluster inference and offers synthetic control when one comparison unit is weak."}});

Q({id:"Q54",cat:"F",diff:"Hard",pri:"P0",skill:"Self-selection",
q:"Agents who adopt a new tool have better outcomes than those who do not. Can you attribute the improvement to the tool?",
why:"Named in the brief; tests selection bias and design alternatives.",
strong:"No — adopters self-select (skill, tenure, motivation)|Check pre-adoption differences|Agent-panel DiD (within-agent change)|Matching on pre-trends + doubly robust|Randomised encouragement → IV/LATE|Staggered rollout",
mistakes:"Controlling for post-adoption variables|Claiming causality from regression with a few controls",
follow:"Compute the LATE given invited/uninvited FCR and adoption.",
model:{verbal:"Not directly. Agents who adopt early are often already better or more motivated. I'd first compare adopters and non-adopters before adoption — if adopters were already ahead, that's selection. Then use within-agent change: did adopters improve more than comparable non-adopters over the same period (DiD on an agent panel, matched on prior performance and tenure)? The cleanest option going forward is to randomise encouragement — invite a random half to training — and estimate the effect for agents who adopt because of the invite.",
html:`<p>LATE = (72% − 70%) / (60% − 10%) = 4pp. Caveat: exclusion fails if training improves skills independently of the tool.</p>`,
lead:"Lead answer proposes changing the rollout to make future evaluation causal."}});

Q({id:"Q55",cat:"F",diff:"Hard",pri:"P0",skill:"Whole-queue interventions",
q:"Randomisation is impossible because the feature affects the entire support queue. What alternatives would you consider?",
why:"Named in the brief.",
strong:"Switchback (time randomisation)|Stepped wedge across sites/queues|Geo/market randomisation|Synthetic control|ITS with seasonality and placebos|Trade-offs and assumptions of each",
mistakes:"Saying 'can't measure'|Only before/after",
follow:"Which would you choose for an escalation-process redesign and why?",
model:{verbal:"'Can't randomise users' usually still allows randomising time or places. First choice: a switchback — turn it on and off in randomised time blocks. If it can't toggle quickly, a stepped-wedge rollout across sites in random order, analysed as staggered DiD. If only one queue exists, synthetic control from comparable queues or an interrupted time series with seasonality and placebo metrics. I'd state each method's assumption and what would falsify the result.",
html:`<table><tr><th>Method</th><th>Key assumption</th></tr><tr><td>Switchback</td><td>Limited carryover between blocks</td></tr><tr><td>Stepped wedge</td><td>No time-varying confounding beyond common trends</td></tr><tr><td>Synthetic control</td><td>Pre-fit implies post counterfactual</td></tr><tr><td>ITS</td><td>Pre-trend + seasonality model holds; no concurrent change</td></tr></table>`,
lead:"Lead answer reframes 'impossible' and ranks designs by strength."}});

Q({id:"Q56",cat:"F",diff:"Medium",pri:"P0",skill:"Seasonality, RTM, real effects",
q:"How would you distinguish seasonality, regression to the mean, and a real intervention effect?",
why:"Named in the brief.",
strong:"Seasonality: compare YoY, model seasonal baseline|RTM: intervention triggered by extreme value; use longer baseline|Real: break at launch, concentrated where mechanism applies, placebo groups flat, persistent|Control groups",
mistakes:"Comparing to the spike week",
follow:"Give a concrete support example of RTM.",
model:{verbal:"Seasonality repeats — compare against the same weeks last year and against segments the intervention didn't touch. Regression to the mean shows up when we intervened because a metric spiked; the next period would fall anyway — so I'd measure against the longer-run baseline, not the spike. A real effect has a break at the launch date, appears only where the mechanism applies, is absent in placebo segments, and persists.",
html:`<p>Example: a site's repeat rate spikes to 22% (normal 16–18%); a coaching programme starts; next month 17%. Most of that drop is RTM. Compare with other sites that spiked without coaching.</p>`,
lead:"Lead answer gives tests, not definitions."}});

Q({id:"Q61",cat:"H",diff:"Hard",pri:"P0",skill:"Incident vs data failure",
q:"Refund-related contacts doubled overnight in the dashboard. How do you tell a real incident from a pipeline failure?",
why:"Tests operational analytics maturity.",
strong:"Freshness, completeness, duplicate checks|Cross-source reconciliation (vendor, finance refunds)|Shape across segments|Timing vs ETL deploy vs product release|Qualitative confirmation from ops|Communicate status with confidence level",
mistakes:"Escalating to execs before validating|Assuming data is right",
follow:"Both sources agree; it's real. What next in the first hour?",
model:{verbal:"Two parallel tracks for the first 30 minutes. Data: check partition completeness and row counts against the vendor export, look for duplicates from a reprocessed batch, and check whether an ETL change deployed. Reality: are finance refund requests also up, are agents seeing it, and is it concentrated in a market, payment method or app version? If only our table moved, it's a pipeline issue; if independent sources agree and it's concentrated, it's a real incident — and I'd tell stakeholders which, with my confidence, before deep-diving.",
html:`<p>See Module 8 table "Real incident or pipeline failure?".</p>`,
lead:"Lead answer runs checks in parallel and communicates confidence early."}});

Q({id:"Q62",cat:"H",diff:"Hard",pri:"P1",skill:"Alerting system design",
q:"Design an alerting system for support KPIs across 50 markets × 12 case types without drowning ops in false alarms.",
why:"Tests anomaly detection and alert precision thinking.",
strong:"Seasonal baselines and residual z-scores|Volume minimums, persistence rules|Hierarchical alerting|FDR control across segments|Alerts evaluated as classifier (precision, recall, time to detect)|Owners, runbooks, feedback labels",
mistakes:"Static thresholds|One alert per segment with 3σ and no multiplicity thinking",
follow:"How would you set the threshold for safety-case SLA alerts differently?",
model:{verbal:"I'd forecast each series with a seasonal baseline, score residuals, and only alert with a minimum volume and persistence, say two of three consecutive windows. Alerts fire hierarchically: market-level first, with an automatic drill-down showing which case types explain it, instead of 600 independent alerts. With 600 daily checks at 3σ we'd expect about 1.6 false alarms a day, so I'd control false discovery rate and tune using labelled past incidents for precision and time-to-detect. Every alert has an owner and a runbook, and owners label alerts so precision is measured. Safety SLAs get lower thresholds — false negatives cost far more.",
html:`<p>600 × 0.0027 ≈ 1.6 false alerts/day at 3σ.</p>`,
lead:"Lead answer treats alerting as a product with measured precision and owners."}});

Q({id:"Q71",cat:"I",diff:"Hard",pri:"P0",skill:"AI analytics assistant system design",
q:"Design an AI analytics assistant that answers 'Why did support contact rate increase last week, and what should we do?' using approved datasets.",
why:"The JD's AI-first responsibilities; a likely system-design round.",
strong:"Interpretation and clarification|Semantic layer + metadata retrieval|SQL generation from templates; validation; permissions; sandboxed execution|Result verification and reconciliation|Statistical noise bands; descriptive vs causal labelling|Evidence-linked explanation|Human approval for actions|Logging, eval gold set, monitoring, cost/latency, adoption",
mistakes:"Describing only prompt → SQL → answer|No evaluation|Letting the agent take actions",
follow:"How do you evaluate it before launch?|A user asks for individual guest messages — what happens?",
model:{verbal:"I'd build it as a governed workflow, not a chatbot over the warehouse. It parses intent and asks if ambiguous, resolves 'contact rate' to the certified semantic-layer definition, retrieves only approved tables and join paths, generates SQL mostly from templates, validates it — allow-listed tables, partition filters, cost limits, read-only — and runs it as the requesting user so permissions and PII masking hold. It verifies results against the certified dashboard and freshness checks, compares the change to the normal noise band, runs a mix/rate decomposition, and writes an answer where every number links to its query, findings are labelled descriptive or causal, and recommendations need human approval. Everything is logged and evaluated against a gold set of questions.",
html:`<p>Full architecture, sample SQL, outputs, failure table and evaluation framework: see <b>AI System Design</b> view and Module 9.</p>`,
lead:"Lead answer centres verification, governance and evaluation, and frames production readiness — not the LLM call."}});

Q({id:"Q72",cat:"I",diff:"Hard",pri:"P0",skill:"Evaluating NL-to-SQL",
q:"How would you evaluate whether an NL-to-SQL assistant is good enough to give to Ops managers?",
why:"Tests evaluation rigour for AI tools.",
strong:"Gold set from real questions, stratified by difficulty|Execution accuracy vs certified answers|Abstention metrics|Groundedness of narrative|Red-team privacy and injection|Latency/cost|Pilot with shadow mode; adoption and decision impact|Launch threshold tied to risk",
mistakes:"String-matching SQL|Vibes-based evaluation|One accuracy number for all question types",
follow:"Accuracy is 92% overall but 60% on multi-join questions — launch?",
model:{verbal:"I'd collect 300 or so real questions from Ops, write certified answers, and stratify by difficulty — single metric lookups, filters, multi-join, time comparisons. Score by execution accuracy against the certified result, plus abstention: does it refuse unanswerable questions and not refuse answerable ones? I'd red-team for PII and injection, measure latency and cost, then run a shadow pilot where analysts check answers before users see them. Launch criteria are per stratum — it can go live for simple lookups while complex questions are routed to analysts.",
html:`<p>Scope by capability: 92% overall with 60% on multi-join → launch for supported question types with a confidence gate; route multi-join to analysts; keep expanding the gold set.</p>`,
lead:"Lead answer launches by capability tier and builds the eval as a regression suite."}});

Q({id:"Q81",cat:"K",diff:"Hard",pri:"P0",skill:"Incentive ROI (from your interview notes)",
q:"A PM wants to give a coupon on a user's first booking (ride-hailing in your notes; analogous for first Airbnb booking). How would you evaluate the business impact?",
why:"In your own notes; tests incrementality, unit economics and experiment design.",
strong:"Decision and objective: incremental contribution, not new-user count|Randomise eligible new users; ITT|Inframarginal users get the coupon too (deadweight cost)|Primary: incremental net contribution per eligible user at 60–90 days; leading: first-booking conversion|Guardrails: abuse/multi-accounting, unit economics, supply side, post-coupon retention|Breakeven math|Power",
mistakes:"Primary metric = new users|Control framed as 'cost, no gain'|Ignoring cannibalisation and abuse",
follow:"Conversion rises 2pp — is that enough?|How would you detect coupon abuse?",
model:{verbal:"The question isn't 'do more people book with a coupon' — they will — it's whether the extra value from incremental users outweighs the coupon cost on everyone who would have booked anyway. I'd randomise eligible new users, give treatment the coupon, and measure incremental net contribution per eligible user over 60–90 days, with first-booking conversion as the leading metric and retention after the coupon ride as a key secondary. Guardrails: abuse and multi-accounting, margin, supply. Then I'd compute breakeven: the incremental users' contribution must cover the coupon paid to all redeemers.",
html:`<h4>Breakeven (illustrative)</h4><p>Coupon ₹50; conversion 20% → 22% per 100 eligible users. Cost = 22 redeemers × ₹50 = ₹1,100. Incremental users = 2. Breakeven needs each incremental user's 90-day contribution ≥ ₹550 (ignoring any retention lift among the 20 who'd have converted anyway).</p>
<h4>Critique of the notes</h4><ul><li>"Primary: KPI new users" → gameable and ignores cost; use incremental contribution per eligible user.</li><li>"N – cost, no gain" → control has no coupon cost; the treatment pays for inframarginal users too.</li><li>Sample size line ("22k") needs absolute/relative MDE clarification — see Q31.</li></ul><p><b>Airbnb analogue:</b> goodwill credits after a bad stay — same incrementality logic: does a credit change rebooking enough to cover credits given to guests who'd rebook anyway?</p>`,
lead:"Lead answer frames incrementality and deadweight, does breakeven, and adds abuse guardrails."}});

Q({id:"Q82",cat:"K",diff:"Medium",pri:"P0",skill:"Quantifying repeat-contact savings",
q:"Quantify the savings from reducing repeat contacts by 3pp, and what could make the investment net-negative.",
why:"The brief asks for transparent ROI with sensitivity.",
strong:"Explicit assumptions|Calculation|Sensitivity grid|Offsetting costs (AHT increase)|Targeting|Non-cost benefits",
mistakes:"Point estimate only|Ignoring cost of the fix",
follow:"Finance wants a single number for the plan — what do you give?",
model:{verbal:"With illustrative numbers — 2M contacts a month, $6 each — a 3pp reduction in repeats is 60k fewer contacts, about $360k a month or $4.3M a year, ranging $2.9–5.8M across $4–8 per contact. But if the fix is longer first contacts and that adds 5% handle time to all contacts, it costs $600k a month and wipes out the saving. So I'd target the extra time to the case types driving repeats, which keeps cost near $120k.",
html:`<p>Give Finance the P50 with a range and the assumptions table; commit to measuring realised savings via holdback.</p>`,
lead:"Lead answer spots the self-defeating version of the plan."}});

"level": "Intermediate",

"question": "A user must be flagged if they receive 3 strikes within any 60-day window. Return each flagged user and the date they were first flagged. Assume 'within 60 days' means the 1st and 3rd strike are at most 59 days apart (so all three fall inside one 60-day window); state this assumption in the interview.",
"schema": "strikes(user_id VARCHAR, strike_date DATE)  -- may contain same-day duplicates",
"sql": "WITH s AS (\n  SELECT DISTINCT user_id, strike_date      -- same-day duplicate = one strike (assumption)\n  FROM strikes\n), w AS (\n  SELECT user_id, strike_date,\n         LAG(strike_date, 2) OVER (PARTITION BY user_id ORDER BY strike_date) AS strike_2_back\n  FROM s\n)\nSELECT user_id, MIN(strike_date) AS first_flag_date\nFROM w\nWHERE strike_2_back IS NOT NULL\n  AND date_diff('day', strike_2_back, strike_date) <= 59\nGROUP BY user_id\nORDER BY user_id",
"explain": "<ol><li><b>s</b> removes same-day duplicates \u2014 otherwise user 003 (two strikes on Feb 1 + one on Feb 20) would be flagged from 2 real events.</li><li><b>LAG(strike_date, 2)</b> fetches the strike two positions earlier; if the current strike is within 59 days of it, the last three strikes fit in one 60-day window.</li><li><b>MIN</b> gives the first date the condition became true.</li></ol><p>User 002: Nov 10 \u2192 Jan 10 = 61 days \u2192 not flagged. Ask the interviewer whether policy uses 60 or 59; the logic is unchanged.</p>",

"sql": "WITH ordered AS (\n  SELECT user_id, booking_id, channel, created_at,\n         ROW_NUMBER() OVER (PARTITION BY user_id, booking_id ORDER BY created_at, contact_id) AS rn,\n         LEAD(created_at) OVER (PARTITION BY user_id, booking_id ORDER BY created_at, contact_id) AS next_at\n  FROM contacts\n  WHERE booking_id IS NOT NULL\n), firsts AS (\n  SELECT channel AS first_channel, created_at, next_at,\n         TIMESTAMP '2026-11-15 00:00:00' AS as_of\n  FROM ordered WHERE rn = 1\n)\nSELECT first_channel,\n  SUM(CASE WHEN created_at <= as_of - INTERVAL '1' DAY THEN 1 ELSE 0 END) AS n_24h,\n  ROUND(1.0 * SUM(CASE WHEN created_at <= as_of - INTERVAL '1' DAY\n                        AND next_at <= created_at + INTERVAL '1' DAY THEN 1 ELSE 0 END)\n        / NULLIF(SUM(CASE WHEN created_at <= as_of - INTERVAL '1' DAY THEN 1 ELSE 0 END), 0), 3) AS repeat_24h,\n  SUM(CASE WHEN created_at <= as_of - INTERVAL '7' DAY THEN 1 ELSE 0 END) AS n_7d,\n  ROUND(1.0 * SUM(CASE WHEN created_at <= as_of - INTERVAL '7' DAY\n                        AND next_at <= created_at + INTERVAL '7' DAY THEN 1 ELSE 0 END)\n        / NULLIF(SUM(CASE WHEN created_at <= as_of - INTERVAL '7' DAY THEN 1 ELSE 0 END), 0), 3) AS repeat_7d,\n  SUM(CASE WHEN created_at <= as_of - INTERVAL '30' DAY THEN 1 ELSE 0 END) AS n_30d,\n  ROUND(1.0 * SUM(CASE WHEN created_at <= as_of - INTERVAL '30' DAY\n                        AND next_at <= created_at + INTERVAL '30' DAY THEN 1 ELSE 0 END)\n        / NULLIF(SUM(CASE WHEN created_at <= as_of - INTERVAL '30' DAY THEN 1 ELSE 0 END), 0), 3) AS repeat_30d\nFROM firsts\nGROUP BY first_channel\nORDER BY first_channel",
"explain": "<ol><li><b>ordered</b>: per issue, rank contacts and get the next contact time. The earliest next contact decides all three windows.</li><li><b>firsts</b>: keep the first contact of each issue; its channel is the attribution channel.</li><li>Each window has <b>its own denominator</b>: u6's issue (Nov 12) counts for 24h but not 7d; u4 (Oct 26) counts for 7d but not 30d.</li><li>u5 has two bookings \u2192 two separate issues, neither a repeat.</li></ol><p>Assumption to state: an 'issue' is user \u00d7 booking; contacts without booking_id need another rule (e.g. same user + same case type within 24h).</p>",
"alt": "Self-join first contacts to all later contacts on the issue with MIN(later.created_at). Or materialise next_contact_at in fct_case.",
"errors": "Single denominator for all windows (30-day rate biased low). Attributing to case_id (agents open new cases for the same issue). Not breaking ties in ORDER BY.",
"perf": "Partition-prune contacts to [as_of \u2212 60 days, as_of]; for a daily job, recompute only issues whose first contact is within the last 30 days.",
"follow": [
"Restrict to contacts on any channel vs same channel \u2014 which is right and why?",
"How would you handle contacts with no booking_id?"
],
"sample": "contacts\ncontact_id | user_id | booking_id | channel | created_at         \n-----------+---------+------------+---------+--------------------\n1          | u1      | b1         | chat    | 2026-10-01 10:00:00\n2          | u1      | b1         | phone   | 2026-10-01 20:00:00\n3          | u1      | b1         | chat    | 2026-10-20 09:00:00\n4          | u2      | b2         | phone   | 2026-10-02 09:00:00\n5          | u2      | b2         | chat    | 2026-10-06 09:00:00\n6          | u3      | b3         | email   | 2026-10-03 12:00:00\n7          | u4      | b4         | chat    | 2026-10-26 08:00:00\n8          | u5      | b5         | chat    | 2026-10-10 10:00:00\n9          | u5      | b6         | chat    | 2026-10-11 10:00:00\n10         | u6      | b7         | chat    | 2026-11-12 10:00:00\n11         | u6      | b7         | chat    | 2026-11-13 09:00:00",
"output": "first_channel | n_24h | repeat_24h | n_7d | repeat_7d | n_30d | repeat_30d\n--------------+-------+------------+------+-----------+-------+-----------\nchat          | 5     | 0.4        | 4    | 0.25      | 3     | 0.333     \nemail         | 1     | 0          | 1    | 0         | 1     | 0         \nphone         | 1     | 0          | 1    | 1         | 1     | 1         "
},
{
"id": "S5",
"title": "True FCR vs agent-disposition FCR",
"level": "Advanced",
"topics": "Outcome definitions, censoring, metric validity",
"question": "Agents tick 'resolved' on the contact. Compare the disposition-based FCR with true FCR (resolved on first contact AND no further contact on the issue within 7 days), for first contacts observed for 7 days (as_of 2026-10-20).",
"schema": "contacts(contact_id, user_id, booking_id, created_at TIMESTAMP, agent_marked_resolved BOOLEAN)",
"sql": "WITH ordered AS (\n  SELECT *,\n         ROW_NUMBER() OVER (PARTITION BY user_id, booking_id ORDER BY created_at) AS rn,\n         LEAD(created_at) OVER (PARTITION BY user_id, booking_id ORDER BY created_at) AS next_at\n  FROM contacts\n), firsts AS (\n  SELECT * FROM ordered\n  WHERE rn = 1\n    AND created_at <= TIMESTAMP '2026-10-20 00:00:00' - INTERVAL '7' DAY   -- window observed\n)\nSELECT COUNT(*) AS first_contacts,\n       ROUND(AVG(CASE WHEN agent_marked_resolved THEN 1.0 ELSE 0 END), 3) AS fcr_disposition,\n       ROUND(AVG(CASE WHEN agent_marked_resolved\n                       AND (next_at IS NULL OR next_at > created_at + INTERVAL '7' DAY)\n                      THEN 1.0 ELSE 0 END), 3) AS fcr_true\nFROM firsts",
"explain": "<p>u1 was marked resolved but came back two days later \u2192 counts for disposition FCR, not true FCR. u5's follow-up is 14 days later \u2192 still a true FCR under a 7-day rule. u6 (Oct 18) is excluded because its 7-day window isn't observed. The gap between the two numbers is a measure of disposition inflation \u2014 worth tracking by team.</p>",
"alt": "Compute at case grain in fct_case with repeat_7d_flag pre-materialised.",
"errors": "Including recent first contacts (inflates FCR). Using case_id rather than issue.",
"perf": "Same as S4.",

],

},
{
"id": "S6",
"title": "Median and P90 time to first response and to final resolution",
"level": "Advanced",
"topics": "Event tables, conditional aggregation, percentiles, open cases",
"question": "From the event log, compute per channel: cases, open cases, median and P90 minutes to first agent reply, and median and P90 hours to final resolution (last 'resolved' event, only for cases not reopened after it).",
"schema": "cases(case_id, channel)\ncase_events(case_id, event_type ['created','agent_reply','resolved','reopened'], event_ts TIMESTAMP)",
"sql": "WITH lifecycle AS (\n  SELECT case_id,\n         MIN(CASE WHEN event_type = 'created'     THEN event_ts END) AS created_at,\n         MIN(CASE WHEN event_type = 'agent_reply' THEN event_ts END) AS first_reply_at,\n         MAX(CASE WHEN event_type = 'resolved'    THEN event_ts END) AS last_resolved_at,\n         MAX(CASE WHEN event_type = 'reopened'    THEN event_ts END) AS last_reopened_at\n  FROM case_events\n  GROUP BY case_id\n), f AS (\n  SELECT c.channel, l.*,\n         CASE WHEN last_resolved_at IS NOT NULL\n               AND (last_reopened_at IS NULL OR last_resolved_at > last_reopened_at)\n              THEN last_resolved_at END AS final_resolved_at\n  FROM lifecycle l JOIN cases c ON c.case_id = l.case_id\n)\nSELECT channel,\n       COUNT(*) AS cases,\n       SUM(CASE WHEN final_resolved_at IS NULL THEN 1 ELSE 0 END) AS open_cases,\n       approx_percentile(date_diff('minute', created_at, first_reply_at), 0.5) AS p50_frt_min,\n       approx_percentile(date_diff('minute', created_at, first_reply_at), 0.9) AS p90_frt_min,\n       approx_percentile(date_diff('minute', created_at, final_resolved_at) / 60.0, 0.5) AS p50_ttr_h,\n       approx_percentile(date_diff('minute', created_at, final_resolved_at) / 60.0, 0.9) AS p90_ttr_h\nFROM f\nGROUP BY channel\nORDER BY channel",
"explain": "<p>Conditional aggregation turns the event log into one row per case (a mini fct_case). c2 was resolved, reopened and resolved again: final resolution uses the last resolved event (48h, not 2h). c3 is open \u2014 it is excluded from TTR percentiles (NULLs are ignored) but reported as open_cases so the reader knows the percentile is conditional on resolution. Percentile functions ignore NULLs.</p><p><i>Expected output generated with an exact discrete percentile; Trino's approx_percentile may differ slightly on tiny samples.</i></p>",
"alt": "Survival analysis (Kaplan\u2013Meier) for TTR including open cases as censored \u2014 the right tool when many cases are still open.",
"errors": "Using first resolved event (understates TTR after reopen). Averaging skewed durations. Silently dropping open cases.",
"perf": "Partition case_events by event date and limit to cases created in the reporting window plus a lookback for late events.",
"follow": [
"Report TTR in business hours.",
"Use Kaplan\u2013Meier to include open cases \u2014 what does it change?"
],
"sample": "cases\ncase_id | channel\n--------+--------\nc1      | chat   \nc2      | chat   \nc3      | chat   \nc4      | phone  \nc5      | phone  \n\ncase_events\ncase_id | event_type  | event_ts           \n--------+-------------+--------------------\nc1      | created     | 2026-10-01 10:00:00\nc1      | agent_reply | 2026-10-01 10:05:00\nc1      | resolved    | 2026-10-01 12:00:00\nc2      | created     | 2026-10-01 11:00:00\nc2      | agent_reply | 2026-10-01 11:30:00\nc2      | resolved    | 2026-10-01 13:00:00\nc2      | reopened    | 2026-10-02 09:00:00\nc2      | agent_reply | 2026-10-02 09:10:00\nc2      | resolved    | 2026-10-03 11:00:00\nc3      | created     | 2026-10-01 12:00:00\nc3      | agent_reply | 2026-10-01 12:20:00\nc4      | created     | 2026-10-01 09:00:00\nc4      | agent_reply | 2026-10-01 09:01:00\nc4      | resolved    | 2026-10-01 09:30:00\nc5      | created     | 2026-10-01 09:00:00\nc5      | agent_reply | 2026-10-01 09:02:00\nc5      | resolved    | 2026-10-02 09:00:00",
"output": "channel | cases | open_cases | p50_frt_min | p90_frt_min | p50_ttr_h | p90_ttr_h\n--------+-------+------------+-------------+-------------+-----------+----------\nchat    | 3     | 1          | 20          | 30          | 2         | 48       \nphone   | 2     | 0          | 1           | 2           | 0.5       | 24       "
},
{
"id": "S7",
"title": "SLA compliance with open cases",
"level": "Advanced",
"topics": "Policy join, deadlines, censoring",
"question": "First-response SLA depends on priority. As of 2026-10-01 12:00, compute per priority: cases due, met, breached (including still-unanswered cases past deadline), and compliance rate. Exclude unanswered cases not yet due.",
"schema": "cases(case_id, priority, created_at, first_response_at NULLABLE)\nsla_policy(priority, sla_minutes)",
"sql": "WITH x AS (\n  SELECT c.case_id, c.priority, c.created_at, c.first_response_at,\n         c.created_at + p.sla_minutes * INTERVAL '1' MINUTE AS deadline,\n         TIMESTAMP '2026-10-01 12:00:00' AS as_of\n  FROM cases c JOIN sla_policy p ON p.priority = c.priority\n), classified AS (\n  SELECT priority,\n         CASE\n           WHEN first_response_at IS NOT NULL AND first_response_at <= deadline THEN 'met'\n           WHEN first_response_at IS NOT NULL AND first_response_at >  deadline THEN 'breached'\n           WHEN first_response_at IS NULL     AND as_of > deadline            THEN 'breached'\n           ELSE 'not_yet_due'\n         END AS sla_status\n  FROM x\n)\nSELECT priority,\n       SUM(CASE WHEN sla_status <> 'not_yet_due' THEN 1 ELSE 0 END) AS due,\n       SUM(CASE WHEN sla_status = 'met' THEN 1 ELSE 0 END) AS met,\n       SUM(CASE WHEN sla_status = 'breached' THEN 1 ELSE 0 END) AS breached,\n       ROUND(1.0 * SUM(CASE WHEN sla_status = 'met' THEN 1 ELSE 0 END)\n             / NULLIF(SUM(CASE WHEN sla_status <> 'not_yet_due' THEN 1 ELSE 0 END), 0), 3) AS compliance\nFROM classified\nGROUP BY priority ORDER BY priority",
"explain": "<p>c5 has no response and its 120-minute deadline (11:00) has passed \u2192 breached, although a naive query on answered cases would ignore it. c3 and c6 are not yet due \u2192 excluded. Real SLAs often run on business hours per site; then the deadline comes from a calendar table, not a simple interval.</p>",
"alt": "Precompute deadline in fct_case at creation time (SLA policy can change \u2014 store the policy version used).",
"errors": "Computing compliance only among answered cases (survivorship). Joining to current SLA policy for historical cases.",
"perf": "Intraday monitoring should read a small 'open cases' table, not the full history.",
"follow": [
"Measure 'meaningful' response (exclude auto-acknowledgements).",
"Business-hours SLA with a calendar table."
],
"sample": "cases\ncase_id | priority | created_at          | first_response_at  \n--------+----------+---------------------+--------------------\nc1      | high     | 2026-10-01 09:00:00 | 2026-10-01 09:10:00\nc2      | high     | 2026-10-01 09:30:00 | 2026-10-01 10:00:00\nc3      | high     | 2026-10-01 11:50:00 | NULL               \nc4      | normal   | 2026-10-01 08:00:00 | 2026-10-01 09:30:00\nc5      | normal   | 2026-10-01 09:00:00 | NULL               \nc6      | normal   | 2026-10-01 11:00:00 | NULL               \n\nsla_policy\npriority | sla_minutes\n---------+------------\nhigh     | 15         \nnormal   | 120        ",
"output": "priority | due | met | breached | compliance\n---------+-----+-----+----------+-----------\nhigh     | 2   | 1   | 1        | 0.5       \nnormal   | 2   | 1   | 1        | 0.5       "
},
{
"id": "S8",
"title": "Sessionize chat messages into contacts (30-minute rule)",
"level": "Intermediate",
"topics": "LAG, running SUM, gaps-and-islands",
"question": "Group each user's chat messages into contacts: a new contact starts if the gap from the previous message exceeds 30 minutes. Return contacts with start, end and message count.",
"schema": "chat_messages(user_id, sent_at TIMESTAMP)",
"sql": "WITH flagged AS (\n  SELECT user_id, sent_at,\n         CASE WHEN LAG(sent_at) OVER (PARTITION BY user_id ORDER BY sent_at) IS NULL\n                OR date_diff('minute', LAG(sent_at) OVER (PARTITION BY user_id ORDER BY sent_at), sent_at) > 30\n              THEN 1 ELSE 0 END AS new_contact\n  FROM chat_messages\n), numbered AS (\n  SELECT *, SUM(new_contact) OVER (PARTITION BY user_id ORDER BY sent_at\n                                   ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS contact_seq\n  FROM flagged\n)\nSELECT user_id, contact_seq, MIN(sent_at) AS started_at, MAX(sent_at) AS ended_at, COUNT(*) AS messages\nFROM numbered\nGROUP BY user_id, contact_seq\nORDER BY user_id, contact_seq",
"explain": "<p>Flag the first message of each contact, then a running sum assigns a contact number. u2's messages cross midnight but stay one contact \u2014 date-based grouping would split it.</p>",
"alt": "Fixed windows (hourly buckets) are simpler but split real conversations.",
"errors": "Grouping by date. Forgetting the ROWS frame (default RANGE frame can behave differently with ties).",
"perf": "Partition by user; process only the last day plus a 30-minute overlap incrementally.",
"follow": [
"How sensitive is the contact count to the 30-minute threshold? How would you choose it from data?"
],

"output": "user_id | contact_seq | started_at          | ended_at            | messages\n--------+-------------+---------------------+---------------------+---------\nu1      | 1           | 2026-10-01 10:00:00 | 2026-10-01 10:35:00 | 3       \nu1      | 2           | 2026-10-01 11:30:00 | 2026-10-01 11:45:00 | 2       \nu2      | 1           | 2026-10-01 23:50:00 | 2026-10-02 00:10:00 | 2       "
