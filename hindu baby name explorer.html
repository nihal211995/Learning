<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Hindu Baby Name Explorer</title>
<style>
:root{--bg:#fbf6ea;--card:#fffdf7;--ink:#2d1a14;--muted:#6f5a50;--gold:#b8892b;--terra:#b5573a;--maroon:#6b1f2a;--line:#e8dcc3;--btn:#7a2331;--btnink:#fff;--chip:#f3e9d2;--ok:#2f6b3a;--warn:#9a5a00;--shadow:0 1px 3px rgba(80,40,20,.10);
--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;--dev:"Noto Serif Devanagari","Kohinoor Devanagari","Devanagari Sangam MN","Mangal","Nirmala UI",serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
:root[data-theme=dark]{--bg:#1c1412;--card:#261b18;--ink:#f3e9da;--muted:#b9a99a;--gold:#d9b25a;--terra:#df8a6a;--maroon:#e0a0a8;--line:#43332d;--btn:#b24a5a;--chip:#33251f;--ok:#7fc08c;--warn:#e0b060;--shadow:none}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1412;--card:#261b18;--ink:#f3e9da;--muted:#b9a99a;--gold:#d9b25a;--terra:#df8a6a;--maroon:#e0a0a8;--line:#43332d;--btn:#b24a5a;--chip:#33251f;--ok:#7fc08c;--warn:#e0b060;--shadow:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;font-size:16px;-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}
.top{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 8px calc(16px + env(safe-area-inset-left));color:var(--gold)}
.top h1{margin:0;font-family:var(--serif);font-size:1.35rem;color:var(--maroon);line-height:1.2;flex:1}
.top h1 small{display:block;font-size:.8rem;font-weight:400;color:var(--muted);font-family:var(--sans)}
#tabs{position:sticky;top:0;z-index:20;display:flex;gap:6px;overflow-x:auto;padding:8px calc(12px + env(safe-area-inset-right)) 8px calc(12px + env(safe-area-inset-left));background:var(--bg);border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:44px;padding:0 14px;border:1px solid var(--line);background:var(--card);border-radius:22px;cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
main{max-width:980px;margin:0 auto;padding:12px calc(14px + env(safe-area-inset-right)) 96px calc(14px + env(safe-area-inset-left))}
h2{font-family:var(--serif);color:var(--maroon);margin:8px 0}
h3{font-family:var(--serif);margin:0;overflow-wrap:anywhere}
.panel{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:14px;padding:12px 14px;margin:10px 0;box-shadow:var(--shadow)}
.panel p{margin:6px 0}
.src{color:var(--muted);font-size:.92rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{min-height:44px;padding:6px 14px;border:1px solid var(--line);background:var(--chip);border-radius:22px;cursor:pointer}
.chip.on{background:var(--maroon);color:#fff;border-color:var(--maroon)}
:root[data-theme=dark] .chip.on{color:#1c1412}
.cnt{opacity:.75;font-size:.85em}
.btn{min-height:44px;padding:6px 14px;border:1px solid var(--btn);background:var(--btn);color:var(--btnink);border-radius:10px;cursor:pointer}
.btn.alt{background:transparent;color:var(--btn)}
:root[data-theme=dark] .btn.alt{color:var(--ink);border-color:var(--gold)}
.btn.danger{background:#9b2226;border-color:#9b2226;color:#fff}
.btn.on{background:var(--gold);border-color:var(--gold);color:#2d1a14}
.btn:disabled{opacity:.4;cursor:not-allowed}
.search{display:flex;gap:8px;margin:10px 0}
.search input{flex:1;min-width:0;min-height:48px;padding:8px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:16px}
.fpanel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px 12px;margin-bottom:10px}
.fpanel fieldset{border:0;margin:8px 0;padding:0;min-width:0}
.fpanel legend{font-weight:600;font-size:.9rem;color:var(--muted)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
select,textarea{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:16px}
textarea{min-height:70px;resize:vertical}
label.chk{display:flex;align-items:center;gap:10px;min-height:44px}
label.chk input{width:22px;height:22px}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
.list{display:grid;gap:12px}
@media(min-width:760px){.list{grid-template-columns:1fr 1fr}.card.open{grid-column:1/-1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.card.is-hidden{opacity:.55}
.card.final{border-color:var(--gold);border-width:2px}
.ch{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.names{min-width:0}
.dev{font-family:var(--dev);line-height:1.7;color:var(--terra);font-weight:500;margin-left:6px}
.pron{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.mean{margin:6px 0;font-weight:500}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.b{font-size:.78rem;padding:2px 9px;border-radius:12px;background:var(--chip);border:1px solid var(--line)}
.b.ok{color:var(--ok)}.b.warn{color:var(--warn)}.b.g{color:var(--terra)}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.actions .btn{flex:1 1 auto;padding:6px 10px;font-size:.92rem}
.more{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
dl{margin:0}dt{font-weight:600;color:var(--maroon);margin-top:8px;font-size:.88rem}dd{margin:2px 0 0;overflow-wrap:anywhere}
.stars{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stars .btn{min-width:44px;padding:4px}
.rank{font-family:var(--serif);font-size:1.6rem;color:var(--gold);min-width:32px}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;min-width:120px;overflow-wrap:anywhere}
th{background:var(--chip);position:sticky;top:0}
.empty{text-align:center;padding:30px 14px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:14px}
#compareBar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;gap:8px;justify-content:center;align-items:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--gold)}
#compareBar.show{display:flex}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--maroon);color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border-radius:16px;padding:18px;max-width:440px;width:100%}
.modal .actions{justify-content:flex-end}
details.dd{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin:8px 0}
details.dd summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600}
.bar{background:#fff3cd;color:#5a3d00;border:1px solid #e6c36a;border-radius:12px;padding:10px 12px;margin:10px 0}
:root[data-theme=dark] .bar{background:#3d3115;color:#f3dfa5;border-color:#7a6320}
#printArea{display:none}
.rep{font-family:Georgia,serif;color:#222;max-width:800px;margin:0 auto}
.rep h1{color:#6b1f2a}.rep .it{border:1px solid #ccc;border-radius:8px;padding:8px 12px;margin:8px 0;page-break-inside:avoid}
.rep table{font-size:11px}.rep th,.rep td{border:1px solid #ccc;min-width:0}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important}body{background:#fff}}
</style>
</head>

<script>
/* ===== EMBEDDED DATASET ===== */
const NAMES = [];
const T = {
  LSN: 'Lalitā Sahasranāma (Brahmāṇḍa Purāṇa, Lalitopākhyāna)',
  LAK: 'Lakṣmī Aṣṭottaraśatanāmāvalī (108 names; recensions vary)',
  SRI: 'Śrī Sūkta (Ṛgveda Khila)',
  AH: 'Ādityahṛdayam (Rāmāyaṇa, Yuddha Kāṇḍa)',
  SN: 'Sūrya Namaskāra twelve-name mantra set',
  RV: 'Ṛgveda'
};
/* A(cols, en, dev, iast, pron, gender, meaning, root, definition, spiritual, srcCat, source, reference, attested, modern, themes, extras)
   cols: l = Lalitha, k = Lakshmi, s = Sun-inspired (letters may combine)
   srcCat: LS, LK, VE, PU, SU, SI
   themes: L light, S sun/fire, W wisdom, P prosperity, C strength, B beauty, K compassion, U purity/auspicious, R protection/leadership, N nature/cosmic, D devotion, V victory
   extras: v variants, nk suggested nicknames, note, sun (1-6), kind, assoc, auth (override label) */
function A(cols,en,dev,iast,pron,g,mean,root,def,spirit,sc,src,ref,att,mod,th,o){
  NAMES.push(Object.assign({cols:cols,en:en,dev:dev,iast:iast,pron:pron,g:g,mean:mean,root:root,def:def,spirit:spirit,srcCat:sc,src:src,ref:ref,att:att,mod:mod,th:th},o||{}));
}

/* ---------- LALITHA SAHASRANAMAM ---------- */
A('l','Shrimata','श्रीमाता','Śrīmātā','Shree-maa-taa','epithet','Auspicious Mother','śrī + mātṛ','Śrī (fortune, auspiciousness, glory) + mātā (mother): the auspicious or glorious Mother.','The opening name of the Sahasranāma; it presents the Goddess first as the compassionate Mother of all.','LS',T.LSN,'Name 1 (opening name) — confirm against your printed edition',true,'uncommon','UKD',{v:'Srimata, Shreemata',note:'Used almost only as a title of the Goddess; rare as a personal name.'});
A('l','Lalita','ललिता','Lalitā','Luh-lee-taa','girl','Graceful, playful, charming','√lal (to play, to sport)','From lalita, “playing, charming, delicate”. It is also the proper name of the Goddess whose thousand names the text lists.','Līlā, the Goddess’s effortless creative play, is central to the theology of Lalitā.','LS',T.LSN,'Deity name that titles the text (closing name is Lalitāmbikā)',true,'modern','BD',{v:'Lalitha, Lalitaa',nk:'Lali, Lita',note:'Lalitā is also the name of other figures in Hindu literature; here the sense is the Goddess.'});
A('l','Lalitambika','ललिताम्बिका','Lalitāmbikā','Luh-lee-taam-bi-kaa','girl','Playful, charming Mother','lalitā + ambikā','Lalitā (graceful, playful) + ambikā (little mother, a name of the Goddess).','Marks the unity of grace and motherhood in the Goddess.','LS',T.LSN,'The closing name of the text (traditionally the 1000th)',true,'uncommon','BD',{v:'Lalithambika, Lalithambikai',nk:'Lalita, Ambika (suggested)'});
A('l','Tripurasundari','त्रिपुरसुन्दरी','Tripurasundarī','Tri-pu-ra-sun-da-ree','girl','Beauty of the three cities / three worlds','tri + pura + sundarī','Tripura (“three cities”, read in Śākta teaching as three worlds or states of consciousness) + sundarī (beautiful woman).','The central name of the Goddess in the Śrīvidyā tradition.','LS',T.LSN,'Occurs near the end (śrīmatī tripurasundarī) — number not verified',true,'traditional','BDU',{v:'Tripura Sundari',nk:'Sundari, Tripura (suggested)'});
A('l','Sundari','सुन्दरी','Sundarī','Sun-da-ree','girl','Beautiful woman','sundara (beautiful)','The ordinary Sanskrit word for a beautiful woman, here read as the short form of Tripurasundarī.','Beauty as an aspect of the divine.','LS',T.LSN,'',false,'modern','B',{v:'Sundary',nk:'Sundu, Suni (suggested)',note:'DERIVED short form of Tripurasundarī; not claimed as a verbatim name in the Sahasranāma.'});
A('l','Tripura','त्रिपुरा','Tripurā','Tri-pu-raa','girl','She of the three cities / worlds','tri + pura','Feminine form commonly used for the Goddess in Śākta texts.','Refers to the Goddess as ruling the three worlds.','LS',T.LSN,'',false,'uncommon','DR',{v:'Tripuraa',note:'DERIVED short form of Tripureśī / Tripurasundarī; not claimed as verbatim. In Bengal and the north-east “Tripura” is also a place name.'});
A('l','Shiva (girl)','शिवा','Śivā','Shi-vaa','girl','Auspicious one','√śi / śiva (auspicious)','Feminine of śiva, “auspicious, kind”.','The auspicious, benevolent nature of the Goddess.','LS',T.LSN,'In the passage “śivā svādhīnavallabhā” — number not verified',true,'modern','UK',{v:'Shiwa, Siva',note:'In Sanskrit śivā also denotes a jackal and turmeric; in the Devī context it means “auspicious one”. The same spelling is the masculine deity name Shiva, so context matters.'});
A('l','Shivankari','शिवङ्करी','Śivaṅkarī','Shi-vang-ka-ree','girl','Bestower of auspiciousness','śiva + kara','Śiva (auspicious, well-being) + -karī (maker, bestower).','She who brings about well-being.','LS',T.LSN,'In the passage “śivaṅkarī śivapriyā” — number not verified',true,'uncommon','UP',{v:'Sivankari, Shivankari'});
A('l','Shankari','शङ्करी','Śaṅkarī','Shun-ka-ree','girl','Beneficent one; consort of Śaṅkara','śaṃ + kara','Śam (well-being) + -karī (maker): “she who does good”; also read as consort of Śaṅkara (Śiva).','Benevolence and peace.','LS',T.LSN,'In the passage “śaṅkarī śrīkarī sādhvī” — number not verified',true,'traditional','UKD',{v:'Sankari',nk:'Shanka (suggested)'});
A('l','Shreekari','श्रीकरी','Śrīkarī','Shree-ka-ree','girl','Bestower of prosperity and fortune','śrī + kara','Śrī (fortune, splendour) + -karī (maker).','The Goddess as giver of auspicious prosperity.','LS',T.LSN,'In the passage “śaṅkarī śrīkarī sādhvī” — number not verified',true,'uncommon','PU',{v:'Srikari, Shrikari'});
A('l','Sharvani','शर्वाणी','Śarvāṇī','Shar-vaa-nee','girl','Consort of Śarva (Śiva)','śarva + -āṇī','Feminine companion-form of Śarva, a name of Śiva (“the archer”).','Names the Goddess in relation to Śiva.','LS',T.LSN,'In the passage “śarvāṇī śarmadāyinī” — number not verified',true,'traditional','D',{v:'Sarvani'});
A('l','Sadhvi','साध्वी','Sādhvī','Saad-vee','girl','Virtuous, good woman','√sādh (to accomplish)','Feminine of sādhu, “straight, good, virtuous”.','Moral uprightness.','LS',T.LSN,'In the passage “śaṅkarī śrīkarī sādhvī” — number not verified',true,'modern','U',{v:'Sadhvi, Saadhvi',note:'Also used as a title for female renunciants.'});
A('l','Parvati','पार्वती','Pārvatī','Paar-va-tee','girl','Daughter of the mountain','parvata (mountain) + -ī','“She of the mountain”, as daughter of Himavān.','The Goddess as the daughter of the Himalaya and consort of Śiva.','LS',T.LSN,'In the passage “pārvatī padmanayanā padmarāgasamaprabhā” — number not verified',true,'modern','DN',{v:'Parvathi, Paarvati',nk:'Paru, Parvi (suggested)'});
A('l','Padmanayana','पद्मनयना','Padmanayanā','Pad-ma-na-ya-naa','girl','Lotus-eyed','padma + nayana','Padma (lotus) + nayana (eye).','Lotus-like eyes are a classical image of beauty and serenity.','LS',T.LSN,'In the passage “pārvatī padmanayanā” — number not verified',true,'uncommon','BU',{v:'Padmanayana',nk:'Padma, Nayana (suggested)'});
A('l','Rajivalochana','राजीवलोचना','Rājīvalocanā','Raa-jee-va-lo-cha-naa','girl','Lotus-eyed','rājīva + locana','Rājīva (lotus) + locana (eye).','Serene, beautiful vision.','LS',T.LSN,'In the passage “rājīvalocanā” — number not verified',true,'uncommon','B',{v:'Rajeevalochana',nk:'Rajiva (suggested)'});
A('l','Rajarajeshwari','राजराजेश्वरी','Rājarājeśvarī','Raa-ja-raa-jesh-va-ree','girl','Sovereign of sovereigns','rāja + rāja + īśvarī','“Queen of kings”: rājan (king) repeated + īśvarī (sovereign lady).','Supreme sovereignty of the Goddess.','LS',T.LSN,'In the passage “rājarājeśvarī rājyadāyinī” — number not verified',true,'traditional','RC',{v:'Rajarajeswari, Rajarajeshwari',nk:'Raji, Rajeshwari (suggested)'});
A('lk','Rama','रमा','Ramā','Ra-maa','girl','Delightful one; also a name of Lakṣmī','√ram (to delight)','From √ram, “to please, to rest”; ramā is “the charming one” and is also a standard name of Lakṣmī.','Delight and domestic well-being.','LS',T.LSN,'In the passage “ramā rākendumukhī” — number not verified',true,'modern','BP',{v:'Rama, Ramaa',note:'The identical spelling “Rama” is also the masculine name of Rāma.'});
A('l','Ramya','रम्या','Ramyā','Ram-yaa','girl','Charming, delightful','√ram','Feminine of ramya, “pleasing, lovely”.','Loveliness of form and character.','LS',T.LSN,'In the passage “ramyā rājīvalocanā” — number not verified',true,'modern','B',{v:'Ramya'});
A('l','Ranjani','रञ्जनी','Rañjanī','Run-ja-nee','girl','She who delights or gives colour','√rañj (to colour, to please)','Agent noun from √rañj: one who pleases or colours.','Joy and charm.','LS',T.LSN,'In the passage “rañjanī ramaṇī rasyā” — number not verified',true,'modern','BK',{v:'Ranjini, Ranjani',nk:'Ranju, Rani (suggested)'});
A('l','Kamakshi','कामाक्षी','Kāmākṣī','Kaa-maak-shee','girl','She whose eyes are loving / grant wishes','kāma + akṣi','Kāma (love, desire) + akṣi (eye). Commentaries may analyse the compound in more than one way.','Famous as the presiding goddess of Kāñcīpuram; fulfilment of rightful wishes.','LS',T.LSN,'In the passage “kāmākṣī kāmadāyinī” — number not verified',true,'traditional','DK',{v:'Kamakshi, Kamatchi',nk:'Kamu, Akshi (suggested)'});
A('l','Kalyani','कल्याणी','Kalyāṇī','Kul-yaa-nee','girl','Auspicious, beautiful, fortunate one','kalyāṇa (auspicious)','Feminine of kalyāṇa, “beautiful, auspicious, prosperous”.','Auspiciousness and welfare.','LS',T.LSN,'In the passage “kalyāṇī jagatīkandā” — number not verified',true,'modern','UP',{v:'Kalyani, Kalyaani',nk:'Kalu, Kally (suggested)'});
A('l','Karuna','करुणा','Karuṇā','Ka-ru-naa','girl','Compassion','karuṇā (compassion)','Ordinary Sanskrit word for compassion.','The Goddess’s compassion is a recurrent theme.','LS',T.LSN,'',false,'modern','K',{v:'Karuna, Karunaa',nk:'Karu (suggested)',note:'DERIVED from the epithet Karuṇārasasāgarā (“ocean of the nectar of compassion”); the stand-alone form is not claimed as verbatim.'});
A('l','Sudha','सुधा','Sudhā','Su-dhaa','girl','Nectar','sudhā (nectar)','Ordinary Sanskrit word for the nectar of immortality.','Immortality and sweetness.','LS',T.LSN,'',false,'modern','UN',{v:'Sudha, Sudhaa',note:'DERIVED from an epithet describing the Goddess seated amid an ocean of nectar (Sudhāsāgaramadhyasthā); not claimed as verbatim.'});

/* ---------- derived data ---------- */
const BYID=new Map();
function fold(s){return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();}
function sylls(s){const m=String(s).toLowerCase().match(/[aāiīuūṛṝḷeo]+/g);return m?m.length:1;}
NAMES.forEach(function(n,i){
  let base=n.en.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),id=base,k=2;
  while(BYID.has(id)){id=base+'-'+k++;}
  n.id=id;n.ord=i;BYID.set(id,n);
  n.len=n.en.replace(/[^A-Za-z]/g,'').length;
  n.syl=sylls(n.iast);
  const rare=(n.iast.match(/[ṅñḥṭḍṝḷ]/g)||[]).length;
  n.diff=(n.syl>=5||rare>=2)?3:(n.syl===4||rare===1)?2:1;
  n.deity=n.deity||(n.cols.indexOf('l')>=0?'Lalitā Tripurasundarī':n.cols.indexOf('k')>=0?'Lakṣmī':'Sūrya / solar tradition');
  n.thl=n.th.split('').map(function(c){return THEME_LABEL[c];});
  n.hay=fold([n.en,n.iast,n.dev,n.v,n.mean,n.root,n.def,n.spirit,n.src,n.ref,n.note,n.assoc,n.deity,n.kind,SRCLAB[n.srcCat],n.thl.join(' '),n.sun?SUNCAT[n.sun]:''].join(' | '));
});
const ALL=NAMES;

/* ---------- state ---------- */
function defF(){return {q:'',genders:[],src:'',theme:'',styles:[],len:'',diff:'',verified:false,pos:false,showHidden:false,coll:'all',sunCat:0,sort:'default'};}
function defaultState(){return {v:1,meta:{},order:[],lead:null,compare:[],prefs:{theme:'auto',weights:{auth:3,pron:2,uniq:2,use:3,rate:5},score:false},filters:{discover:defF(),lal:defF(),lak:defF(),sun:defF()},ui:{tab:'discover',sort:'manual',finalOnly:false}};}
let S=defaultState();
const RT={open:new Set(),filterOpen:{},curOpen:new Set(),curAll:new Set(),warnDismissed:false,storageOK:true,modal:[]};
const EMPTY=Object.freeze({});
const M=function(id){return S.meta[id]||EMPTY;};
const TABS=[['discover','Discover'],['lal','Lalitha'],['lak','Lakshmi'],['sun','Sun-inspired'],['curated','Curated'],['shortlist','My Shortlist'],['data','Backup & About']];
const VIEWKEYS=['discover','lal','lak','sun'];

function str(v,max){return (typeof v==='string')?v.slice(0,max):'';}
function sanitize(raw){
  const out=defaultState();
  if(!raw||typeof raw!=='object')return out;
  if(raw.meta&&typeof raw.meta==='object'){
    Object.keys(raw.meta).forEach(function(id){
      if(!BYID.has(id))return;
      const r=raw.meta[id];if(!r||typeof r!=='object')return;
      const o={};
      if(r.short===true)o.short=true;
      if(r.fav===true)o.fav=true;
      if(r.hidden===true)o.hidden=true;
      if(r.final===true&&r.short===true)o.final=true;
      const rt=parseInt(r.rating,10);if(rt>=1&&rt<=5)o.rating=rt;
      const nt=str(r.note,2000);if(nt)o.note=nt;
      const rs=str(r.reason,1000);if(rs)o.reason=rs;
      if(Object.keys(o).length)out.meta[id]=o;
    });
  }
  const seen=new Set();
  if(Array.isArray(raw.order))raw.order.forEach(function(id){if(typeof id==='string'&&out.meta[id]&&out.meta[id].short&&!seen.has(id)){seen.add(id);out.order.push(id);}});
  Object.keys(out.meta).forEach(function(id){if(out.meta[id].short&&!seen.has(id)){seen.add(id);out.order.push(id);}});
  if(typeof raw.lead==='string'&&seen.has(raw.lead))out.lead=raw.lead;
  if(Array.isArray(raw.compare)){raw.compare.forEach(function(id){if(typeof id==='string'&&BYID.has(id)&&out.compare.indexOf(id)<0&&out.compare.length<5)out.compare.push(id);});}
  if(raw.prefs&&typeof raw.prefs==='object'){
    if(['auto','light','dark'].indexOf(raw.prefs.theme)>=0)out.prefs.theme=raw.prefs.theme;
    out.prefs.score=raw.prefs.score===true;
    if(raw.prefs.weights&&typeof raw.prefs.weights==='object'){
      Object.keys(out.prefs.weights).forEach(function(k){const w=Number(raw.prefs.weights[k]);if(isFinite(w)&&w>=0&&w<=5)out.prefs.weights[k]=Math.round(w);});
    }
  }
  if(raw.filters&&typeof raw.filters==='object'){
    VIEWKEYS.forEach(function(k){
      const f=raw.filters[k];if(!f||typeof f!=='object')return;
      const d=out.filters[k];
      d.q=str(f.q,100);
      if(Array.isArray(f.genders))d.genders=f.genders.filter(function(g){return ['boy','girl','unisex','epithet'].indexOf(g)>=0;});
      if(Object.keys(SRCLAB).indexOf(f.src)>=0)d.src=f.src;
      if(THEME_LABEL[f.theme])d.theme=f.theme;
      if(Array.isArray(f.styles))d.styles=f.styles.filter(function(s){return ['modern','traditional','uncommon','short'].indexOf(s)>=0;});
      if(['','1','2','3','4'].indexOf(String(f.len))>=0)d.len=String(f.len);
      if(['','1','2','3'].indexOf(String(f.diff))>=0)d.diff=String(f.diff);
      d.verified=f.verified===true;d.pos=f.pos===true;d.showHidden=f.showHidden===true;
      if(COLLS[f.coll])d.coll=f.coll;
      const sc=parseInt(f.sunCat,10);if(sc>=0&&sc<=6)d.sunCat=sc;
      if(['default','az','short'].indexOf(f.sort)>=0)d.sort=f.sort;
    });
  }
  if(raw.ui&&typeof raw.ui==='object'){
    if(TABS.some(function(t){return t[0]===raw.ui.tab;}))out.ui.tab=raw.ui.tab;
    if(['manual','rating','name','meaning','source'].indexOf(raw.ui.sort)>=0)out.ui.sort=raw.ui.sort;
    out.ui.finalOnly=raw.ui.finalOnly===true;
  }
  return out;
}
let saveT=null;

  clearTimeout(saveT);saveT=null;

}

function loadState(){
  try{localStorage.setItem(KEY+'.t','1');localStorage.removeItem(KEY+'.t');}catch(e){RT.storageOK=false;}
  try{const s=localStorage.getItem(KEY);if(s)S=sanitize(JSON.parse(s));}catch(e){}
}

/* ---------- helpers ---------- */
const $=function(s,r){return (r||document).querySelector(s);};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(msg){const t=$('#toast');t.textContent=msg;t.className='show';clearTimeout(toast.t);toast.t=setTimeout(function(){t.className='';},2600);}
function showStorageWarn(){const b=$('#storageWarn');if(b)b.hidden=false;}
function setM(id,patch){
  const m=Object.assign({},S.meta[id]||{},patch);
  Object.keys(m).forEach(function(k){if(m[k]===false||m[k]===''||m[k]===0||m[k]==null)delete m[k];});
  if(Object.keys(m).length)S.meta[id]=m;else delete S.meta[id];
  saveSoon();
}
function authLabel(n){
  if(n.auth)return n.auth;
  if(n.att&&n.ref&&/not verified/i.test(n.ref)===false)return 'Attested in named text (locator given)';
  if(n.att)return 'Attested in named text (verse / number not verified)';
  if(n.srcCat==='SI')return 'Sanskrit-inspired — not a scriptural name';
  if(!n.src)return 'Source reference not verified';
  return 'Derived / short form — not claimed as verbatim';
}
function authScore(n){
  if(n.att&&n.ref&&!/not verified/i.test(n.ref))return 5;
  if(n.att)return 4;
  if(n.auth)return 2;
  if(n.srcCat==='SI')return 1;
  return n.src?2:1;
}
function diffLabel(n){return n.diff===1?'Easy':n.diff===2?'Moderate':'Challenging';}
function uniqLabel(n){return n.mod==='modern'?'Widely used (editorial)':n.mod==='traditional'?'Moderately distinctive (editorial)':'Distinctive / rare (editorial)';}
function refText(n){
  if(!n.src)return 'Source reference not verified';
  return n.src+' — '+(n.ref?n.ref:'verse / number not verified');
}
function uniqScore(n){return n.mod==='modern'?2:n.mod==='traditional'?3:5;}
function useScore(n){return n.mod==='modern'?5:n.mod==='traditional'?3:2;}
function pronScore(n){return n.diff===1?5:n.diff===2?3:1;}
function scoreOf(n){
  const w=S.prefs.weights,m=M(n.id);
  const parts=[['auth',authScore(n)],['pron',pronScore(n)],['uniq',uniqScore(n)],['use',useScore(n)],['rate',m.rating||0]];
  let num=0,den=0;
  parts.forEach(function(p){num+=w[p[0]]*p[1];den+=w[p[0]]*5;});
  return den?Math.round(num/den*100):null;
}

/* ---------- filtering ---------- */
function preset(key,f){
  if(key==='lal')return COLLS.lal.test;
  if(key==='lak')return COLLS.lak.test;
  if(key==='sun')return function(n){return n.cols.indexOf('s')>=0&&(!f.sunCat||n.sun===f.sunCat);};
  return COLLS[f.coll].test;
}
function matches(n,f,key){
  if(!preset(key,f)(n))return false;
  if(!f.showHidden&&M(n.id).hidden)return false;
  if(f.genders.length&&f.genders.indexOf(n.g)<0)return false;
  if(f.src&&n.srcCat!==f.src)return false;
  if(f.theme&&n.th.indexOf(f.theme)<0)return false;
  const mods=f.styles.filter(function(s){return s!=='short';});
  if(mods.length&&mods.indexOf(n.mod)<0)return false;
  if(f.styles.indexOf('short')>=0&&n.len>5)return false;
  if(f.len==='1'&&n.len>4)return false;
  if(f.len==='2'&&(n.len<5||n.len>6))return false;
  if(f.len==='3'&&(n.len<7||n.len>8))return false;
  if(f.len==='4'&&n.len<9)return false;
  if(f.diff&&String(n.diff)!==f.diff)return false;
  if(f.verified&&!n.att)return false;
  if(f.pos&&n.th.length<2)return false;
  if(f.q){
    const toks=fold(f.q).split(/\s+/).filter(Boolean);
    for(let i=0;i<toks.length;i++){if(n.hay.indexOf(toks[i])<0)return false;}
  }
  return true;
}
function activeCount(f){return f.genders.length+f.styles.length+(f.src?1:0)+(f.theme?1:0)+(f.len?1:0)+(f.diff?1:0)+(f.verified?1:0)+(f.pos?1:0)+(f.showHidden?1:0);}
function sortList(list,mode){
  const a=list.slice();
  if(mode==='az')a.sort(function(x,y){return x.en.localeCompare(y.en);});
  else if(mode==='short')a.sort(function(x,y){return x.len-y.len||x.en.localeCompare(y.en);});
  return a;
}
function collCount(k){return ALL.filter(COLLS[k].test).length;}

function card(n){
  const m=M(n.id),open=RT.open.has(n.id),cmp=S.compare.indexOf(n.id)>=0,id=esc(n.id);

 {id:'pro',t:'Associated with prosperity',c:'Tagged with the prosperity and abundance theme.',f:function(n){return n.th.indexOf('P')>=0;}},

/* ---------- shortlist ---------- */
function shortIds(){return S.order.filter(function(id){return M(id).short;});}
function sortedShort(){
  let ids=shortIds();
  const mode=S.ui.sort;
  if(S.ui.finalOnly)ids=ids.filter(function(id){return M(id).final;});
  const by=BYID;
  if(mode==='rating')ids.sort(function(a,b){return (M(b).rating||0)-(M(a).rating||0)||by.get(a).en.localeCompare(by.get(b).en);});
  else if(mode==='name')ids.sort(function(a,b){return by.get(a).en.localeCompare(by.get(b).en);});
  else if(mode==='meaning')ids.sort(function(a,b){return by.get(a).mean.localeCompare(by.get(b).mean);});
  else if(mode==='source')ids.sort(function(a,b){return SRCLAB[by.get(a).srcCat].localeCompare(SRCLAB[by.get(b).srcCat])||by.get(a).en.localeCompare(by.get(b).en);});
  return ids;
}

function download(name,text,type){
  const b=new Blob([text],{type:type});const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove();},1000);
}
function csvCell(v,user){let s=String(v==null?'':v);if(user&&/^[=+\-@\t\r]/.test(s))s="'"+s;if(/[",\r\n]/.test(s))s='"'+s.replace(/"/g,'""')+'"';return s;}

  const css=(document.getElementById('printCss')||{textContent:''}).textContent;
  const html='<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baby name shortlist</title><style>body{font-family:Georgia,serif;margin:16px;color:#222}.it{border:1px solid #ccc;border-radius:8px;padding:8px 12px;margin:8px 0}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #ccc;padding:4px 6px;text-align:left;vertical-align:top}h1{color:#6b1f2a}'+css+'</style></head><body>'+reportBody()+'</body></html>';
  download('baby-name-shortlist-report.html',html,'text/html;charset=utf-8');
  toast('Report downloaded');
}
function printReport(){
  if(!shortIds().length){toast('Your shortlist is empty');return;}
  $('#printArea').innerHTML='<div class="rep">'+reportBody()+'</div>';
  window.print();
}
function backupJSON(){return JSON.stringify({app:'hindu-baby-name-explorer',version:1,exported:new Date().toISOString(),data:{meta:S.meta,order:S.order,lead:S.lead,compare:S.compare,prefs:S.prefs,filters:S.filters,ui:S.ui}},null,2);}
function exportBackup(){download('baby-name-backup-'+new Date().toISOString().slice(0,10)+'.json',backupJSON(),'application/json');toast('Backup downloaded');}
function importBackupText(text){
  let obj;
  try{obj=JSON.parse(text);}catch(e){toast('That file is not valid JSON');return;}
  if(!obj||obj.app!=='hindu-baby-name-explorer'||obj.version!==1||!obj.data||typeof obj.data!=='object'){toast('Not a valid backup from this app');return;}
  const next=sanitize(obj.data);
  const cnt=Object.keys(next.meta).filter(function(id){return next.meta[id].short;}).length;
  showModal('Restore backup?','This replaces your current data with the backup ('+cnt+' shortlisted names). Export a backup of the current data first if you want to keep it.',[{label:'Cancel',cls:'alt'},{label:'Restore',cls:'',fn:function(){S=next;saveNow();applyTheme();toast('Backup restored');goTab(S.ui.tab);}}]);
}
function doReset(){
  showModal('Reset all data?','This permanently deletes your shortlist, favourites, ratings, notes, hidden names and preferences from this browser. This cannot be undone. Export a backup first if unsure.',[{label:'Cancel',cls:'alt'},{label:'Yes, reset everything',cls:'danger',fn:function(){try{localStorage.removeItem(KEY);}catch(e){}S=defaultState();RT.open.clear();applyTheme();toast('All data reset');goTab('data');}}]);
}

/* ---------- modal / theme / tabs ---------- */
function showModal(title,body,actions){
  RT.modal=actions;
  $('#modal').innerHTML='<div class="modal-back"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">'+esc(title)+'</h3><p>'+esc(body)+'</p><div class="actions">'+actions.map(function(a,i){return '<button class="btn '+(a.cls||'')+'" data-act="modal" data-val="'+i+'">'+esc(a.label)+'</button>';}).join('')+'</div></div></div>';
  const b=$('#modal .btn');if(b)b.focus();
}
function closeModal(){$('#modal').innerHTML='';RT.modal=[];}
function applyTheme(){const t=S.prefs.theme,r=document.documentElement;if(t==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t);const b=$('#themeBtn');if(b)b.textContent='Theme: '+t;}
function drawTabs(){
  $('#tabs').innerHTML=TABS.map(function(t){const c=t[0]==='shortlist'?' ('+shortIds().length+')':'';return '<button class="tab" role="tab" data-act="tab" data-val="'+t[0]+'" aria-selected="'+(S.ui.tab===t[0])+'">'+esc(t[1])+c+'</button>';}).join('');
}
function drawCompareBar(){
  const b=$('#compareBar'),n=S.compare.length;
  if(!n){b.className='';b.innerHTML='';return;}
  b.className='show';b.innerHTML='<span>Comparing '+n+' of 5</span><button class="btn" data-act="cmpgo">View comparison</button><button class="btn alt" data-act="cmpclear">Clear</button>';
}
function drawData(){
  const unv=ALL.filter(function(n){return !n.att;}).length;
  const cnt={l:ALL.filter(COLLS.lal.test).length,k:ALL.filter(COLLS.lak.test).length,b:collCount('sunboy'),g:collCount('sungirl')};
  $('#view').innerHTML='<h2>Backup & About</h2>'+
  '<div class="bar" id="storageWarn"'+(RT.storageOK?' hidden':'')+'>Browser storage is unavailable here (for example in a private window), so changes will not persist. Use Export Backup.</div>'+
  '<div class="panel"><h3>Where your data lives</h3><p>Everything is saved automatically in this browser’s local storage, on this device only. Nothing is sent to any server. Local storage belongs to the web address (origin) the page is opened from: if you clear site data, switch browsers, or open the file from a different address (or a different copy of the file), your shortlist will not appear. If the file is hosted on a website, storage is tied to that site’s origin. Export a backup regularly.</p></div>'+
  '<div class="panel"><h3>Backup</h3><div class="actions"><button class="btn" data-act="backup">Export Backup (JSON)</button><button class="btn alt" data-act="importbtn">Import Backup</button><button class="btn danger" data-act="reset">Reset Data</button></div><input type="file" id="importFile" accept="application/json,.json" hidden></div>'+
  '<div class="panel"><h3>Appearance</h3><button class="btn alt" data-act="theme" id="themeBtn">Theme: '+esc(S.prefs.theme)+'</button></div>'+
  '<div class="panel"><h3>About the data and its accuracy</h3><p>The dataset has '+ALL.length+' names ('+cnt.l+' Lalitha, '+cnt.k+' Lakshmi, '+cnt.b+' Sun-inspired boys/unisex, '+cnt.g+' Sun-inspired girls/unisex; some appear in more than one). It is far below the 100 / 100 / 50 / 50 research targets because I preferred fewer names whose status I could label honestly over padding.</p><ul><li>Names were compiled from recalled standard texts; I did not check them against printed editions or live sources in this build. Verse and name numbers are therefore “not verified” unless a locator is shown.</li><li>The Lakṣmī collection is not a verified Sahasranāma. Its names come from the 108-name Aṣṭottara list, the Śrī Sūkta and widely used epithets.</li><li>'+unv+' entries are not attested in a named text (derived forms, regional epithets or Sanskrit-inspired words) and are labelled as such on their cards.</li><li>Roots and etymologies are traditional or standard dictionary-style readings; where uncertain the card says so. “Modern”, “traditional”, “uncommon”, uniqueness and usability are subjective editorial assessments, not popularity data.</li><li>Please confirm any name you shortlist with a pandit or a printed edition before finalising.</li></ul></div>';
  $('#importFile').addEventListener('change',function(e){
    const f=e.target.files&&e.target.files[0];if(!f)return;
    if(f.size>2000000){toast('File is too large to be a backup');return;}
    const r=new FileReader();r.onload=function(){importBackupText(String(r.result));};r.readAsText(f);e.target.value='';
  });
}
function goTab(t){
  S.ui.tab=t;saveSoon();drawTabs();drawCompareBar();
  if(VIEWKEYS.indexOf(t)>=0)mountBrowse(t);
  else if(t==='curated')drawCurated();
  else if(t==='shortlist')drawShortlist();
  else drawData();
  window.scrollTo(0,0);
}
function refresh(){
  drawTabs();drawCompareBar();
  const t=S.ui.tab;
  if(VIEWKEYS.indexOf(t)>=0)drawRes();
  else if(t==='curated')drawCurated();
  else if(t==='shortlist')drawShortlist();
}

/* ---------- actions ---------- */
function curF(){return S.filters[V.key];}
const H={
 tab:function(id,v){goTab(v);},
 coll:function(id,v){curF().coll=v;saveSoon();mountBrowse(V.key);},
 sunCat:function(id,v){curF().sunCat=parseInt(v,10);saveSoon();drawHead();drawRes();},
 chip:function(id,v,b){const f=curF(),k=b.dataset.f,i=f[k].indexOf(v);if(i>=0)f[k].splice(i,1);else f[k].push(v);saveSoon();drawCtl();drawRes();},
 ftoggle:function(){RT.filterOpen[V.key]=!RT.filterOpen[V.key];drawCtl();},
 clear:function(){const f=curF(),c=f.coll,s=f.sunCat;S.filters[V.key]=Object.assign(defF(),{coll:c,sunCat:s});saveSoon();drawCtl();drawRes();},
 details:function(id){if(RT.open.has(id))RT.open.delete(id);else RT.open.add(id);refresh();},
 short:function(id){
  const m=M(id);
  if(m.short){setM(id,{short:false,final:false});S.order=S.order.filter(function(x){return x!==id;});if(S.lead===id)S.lead=null;toast('Removed from shortlist');}
  else{setM(id,{short:true});if(S.order.indexOf(id)<0)S.order.push(id);toast('Added to shortlist');}
  refresh();
 },
 fav:function(id){setM(id,{fav:!M(id).fav});refresh();},
 hide:function(id){const h=!M(id).hidden;setM(id,{hidden:h});toast(h?'Hidden from recommendations':'Unhidden');refresh();},
 cmp:function(id){
  const i=S.compare.indexOf(id);
  if(i>=0)S.compare.splice(i,1);
  else if(S.compare.length>=5){toast('You can compare up to five names');return;}
  else S.compare.push(id);
  saveSoon();refresh();
 },
 cmpclear:function(){S.compare=[];saveSoon();refresh();},
 cmpgo:function(){goTab('shortlist');},
 rate:function(id,v){setM(id,{rating:parseInt(v,10)});refresh();},
 up:function(id){const i=S.order.indexOf(id);if(i>0){const t=S.order[i-1];S.order[i-1]=id;S.order[i]=t;saveSoon();refresh();}},
 down:function(id){const i=S.order.indexOf(id);if(i>=0&&i<S.order.length-1){const t=S.order[i+1];S.order[i+1]=id;S.order[i]=t;saveSoon();refresh();}},
 final:function(id){setM(id,{final:!M(id).final});refresh();},
 lead:function(id){S.lead=(S.lead===id)?null:id;saveSoon();refresh();},
 remove:function(id){H.short(id);},
 curopen:function(id,v){if(RT.curOpen.has(v))RT.curOpen.delete(v);else RT.curOpen.add(v);drawCurated();},
 curall:function(id,v){if(RT.curAll.has(v))RT.curAll.delete(v);else RT.curAll.add(v);drawCurated();},
 dismisswarn:function(){RT.warnDismissed=true;drawShortlist();},
 csv:exportCSV,report:exportReport,print:printReport,backup:exportBackup,
 importbtn:function(){$('#importFile').click();},
 reset:doReset,
 theme:function(){const o=['auto','light','dark'];S.prefs.theme=o[(o.indexOf(S.prefs.theme)+1)%3];saveSoon();applyTheme();},
 modal:function(id,v){const a=RT.modal[parseInt(v,10)];closeModal();if(a&&a.fn)a.fn();}
};
document.addEventListener('click',function(e){
  const b=e.target.closest('[data-act]');if(!b)return;
  const fn=H[b.dataset.act];if(fn)fn(b.dataset.id,b.dataset.val,b,e);
});
document.addEventListener('input',function(e){
  const t=e.target;
  if(t.id==='q'){curF().q=t.value.slice(0,100);saveSoon();drawRes();}
  else if(t.dataset&&t.dataset.note){setM(t.dataset.note,{note:t.value.slice(0,2000)});}
  else if(t.dataset&&t.dataset.reason){setM(t.dataset.reason,{reason:t.value.slice(0,1000)});}
  else if(t.dataset&&t.dataset.weight){S.prefs.weights[t.dataset.weight]=parseInt(t.value,10);$('#wv-'+t.dataset.weight).textContent=t.value;saveSoon();RT.wopen=true;$('#finalTable').innerHTML=finalTableHTML();}
});
document.addEventListener('change',function(e){
  const t=e.target;
  if(t.dataset&&t.dataset.f==='slsort'){S.ui.sort=t.value;saveSoon();drawShortlist();}
  else if(t.dataset&&t.dataset.f&&t.tagName==='SELECT'){curF()[t.dataset.f]=t.value;saveSoon();drawRes();}
  else if(t.dataset&&t.dataset.fb){
    const k=t.dataset.fb;
    if(k==='score'){S.prefs.score=t.checked;saveSoon();RT.wopen=true;$('#finalTable').innerHTML=finalTableHTML();}
    else if(k==='finalOnly'){S.ui.finalOnly=t.checked;saveSoon();drawShortlist();}
    else{curF()[k]=t.checked;saveSoon();drawCtl();drawRes();}
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&RT.modal.length)closeModal();});
window.addEventListener('pagehide',saveNow);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')saveNow();});

/* ---------- boot ---------- */
loadState();
applyTheme();
goTab(S.ui.tab);
window.__hbne={S:function(){return S;},NAMES:NAMES,sanitize:sanitize,goTab:goTab};
})();

</script>
</body>
</html>
