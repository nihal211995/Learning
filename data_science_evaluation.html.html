<script>
(function () {
'use strict';
var MODS = {
  1: 'Experimentation & A/B Testing',
  2: 'Logistic Regression Evaluation',
  3: 'CUPED & Variance Reduction',
  4: 'Propensity Score Matching & Weighting',
  5: 'Forecasting Evaluation',
  6: 'Predictive ML Model Evaluation',
  7: 'AI & Generative AI Evaluation',
  8: 'Ranking, Recommendation & Personalization',
  9: 'Additional Analytical Scenarios'
};
var CATS = ['Statistical', 'Experimentation', 'Forecasting', 'ML', 'AI'];
var DIFFS = ['Intermediate', 'Advanced', 'Expert'];
var CASES = window.CASES.slice().sort(function (a, b) {
  var x = a.id.split('.').map(Number), y = b.id.split('.').map(Number);
  return x[0] - y[0] || x[1] - y[1];
});
var byId = {}; CASES.forEach(function (c, i) { c.i = i; byId[c.id] = c; c.m = +c.id.split('.')[0]; });

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function strip(h) { return String(h).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim(); }

/* ---------- persistence (safe on file://) ---------- */
var done = {}, notes = {};
try { done = JSON.parse(localStorage.getItem('dsc_done') || '{}'); } catch (e) { done = {}; }
function saveDone() { try { localStorage.setItem('dsc_done', JSON.stringify(done)); } catch (e) {} }
var revealed = {};

/* ---------- search index ---------- */
CASES.forEach(function (c) {
  c.hay = (c.id + ' ' + c.t + ' ' + c.cat.join(' ') + ' ' + c.d + ' ' + MODS[c.m] + ' ' + strip(c.biz.s + ' ' + c.biz.o + ' ' + c.biz.h) + ' ' +
    (c.wrong || []).map(function (w) { return w[0]; }).join(' ') + ' ' + (c.kw || '')).toLowerCase();
});
var F = { q: '', cat: 'All', diff: 'All', mod: 'All' };
function filtered() {
  var terms = F.q.toLowerCase().split(/\s+/).filter(Boolean);
  return CASES.filter(function (c) {
    if (F.cat !== 'All' && c.cat.indexOf(F.cat) < 0) return false;
    if (F.diff !== 'All' && c.d !== F.diff) return false;
    if (F.mod !== 'All' && String(c.m) !== String(F.mod)) return false;
    return terms.every(function (t) { return c.hay.indexOf(t) >= 0; });
  });
}

/* ---------- tables ---------- */
function cell(c, tag) {
  if (c && typeof c === 'object') return '<' + tag + ' class="' + (c.c || '') + '">' + c.t + '</' + tag + '>';
  return '<' + tag + '>' + c + '</' + tag + '>';
}
function table(b) {
  var h = '<div class="tblwrap"><table' + (b.txt ? ' class="txt"' : '') + '><thead><tr>' + b.head.map(function (x) { return cell(x, 'th'); }).join('') + '</tr></thead><tbody>';
  b.rows.forEach(function (r) { h += '<tr>' + r.map(function (x) { return cell(x, 'td'); }).join('') + '</tr>'; });
  return h + '</tbody></table></div>';
}

/* ---------- SVG charts ---------- */
var COL = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)'];
function nice(min, max, n) {
  if (min === max) { max = min + 1; }
  var span = max - min, step = Math.pow(10, Math.floor(Math.log10(span / n))), err = span / n / step;
  step *= err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1;
  var lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];
  for (var v = lo; v <= hi + step / 2; v += step) t.push(+v.toFixed(10));
  return t;
}
function fmtTick(v, c) { if (c.yfmt) return c.yfmt(v); return (Math.abs(v) >= 1000 ? v.toLocaleString('en-US') : (+v.toFixed(3)) + ''); }
function chart(c) {
  var W = 660, H = 320, m = { l: 58, r: 16, t: c.legend === false ? 34 : 46, b: c.xlab ? 62 : 46 };
  var pw = W - m.l - m.r, ph = H - m.t - m.b, s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(c.title || 'chart') + '">';
  s += '<text class="t" x="' + m.l + '" y="18">' + esc(c.title || '') + '</text>';
  var vals = [];
  c.series.forEach(function (se) {
    (se.y || []).forEach(function (v) { if (v != null) vals.push(v); });
    (se.lo || []).forEach(function (v) { if (v != null) vals.push(v); });
    (se.hi || []).forEach(function (v) { if (v != null) vals.push(v); });
    (se.pts || []).forEach(function (p) { vals.push(p[1]); });
  });
  if (c.hline != null) vals.push(c.hline);
  if (c.type === 'bar') vals.push(0);
  var ymin = c.ymin != null ? c.ymin : Math.min.apply(null, vals), ymax = c.ymax != null ? c.ymax : Math.max.apply(null, vals);
  var yt = nice(ymin, ymax, 5); if (c.ymin == null) ymin = yt[0]; if (c.ymax == null) ymax = yt[yt.length - 1];
  var Y = function (v) { return m.t + ph - (v - ymin) / (ymax - ymin) * ph; };
  yt.forEach(function (v) {
    if (v < ymin - 1e-9 || v > ymax + 1e-9) return;
    s += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="#e5e8ef"/><text x="' + (m.l - 7) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + fmtTick(v, c) + '</text>';
  });
  if (c.ylab) s += '<text transform="translate(13 ' + (m.t + ph / 2) + ') rotate(-90)" text-anchor="middle">' + esc(c.ylab) + '</text>';
  var X;
  if (c.type === 'xy') {
    var xs = []; c.series.forEach(function (se) { se.pts.forEach(function (p) { xs.push(p[0]); }); });
    var xmin = c.xmin != null ? c.xmin : Math.min.apply(null, xs), xmax = c.xmax != null ? c.xmax : Math.max.apply(null, xs);
    var xt = nice(xmin, xmax, 5); if (c.xmin == null) xmin = xt[0]; if (c.xmax == null) xmax = xt[xt.length - 1];
    X = function (v) { return m.l + (v - xmin) / (xmax - xmin) * pw; };
    xt.forEach(function (v) { if (v < xmin - 1e-9 || v > xmax + 1e-9) return; s += '<line x1="' + X(v) + '" x2="' + X(v) + '" y1="' + m.t + '" y2="' + (m.t + ph) + '" stroke="#f0f2f6"/><text x="' + X(v) + '" y="' + (m.t + ph + 16) + '" text-anchor="middle">' + (+v.toFixed(3)) + '</text>'; });
    if (c.diag) s += '<line x1="' + X(xmin) + '" y1="' + Y(Math.max(ymin, xmin)) + '" x2="' + X(Math.min(xmax, ymax)) + '" y2="' + Y(Math.min(xmax, ymax)) + '" stroke="#98a2b3" stroke-dasharray="5 4"/>';
    c.series.forEach(function (se, k) {
      var col = se.color || COL[k % 5];
      if (se.line !== false) s += '<polyline fill="none" stroke="' + col + '" stroke-width="2" points="' + se.pts.map(function (p) { return X(p[0]) + ',' + Y(p[1]); }).join(' ') + '"/>';
      se.pts.forEach(function (p) { s += '<circle cx="' + X(p[0]) + '" cy="' + Y(p[1]) + '" r="3.6" fill="' + col + '"/>'; });
    });
  } else {
    var n = c.x.length, step = pw / n;
    X = function (i) { return m.l + step * (i + 0.5); };
    var skip = Math.ceil(n / 14);
    c.x.forEach(function (lab, i) { if (i % skip === 0) s += '<text x="' + X(i) + '" y="' + (m.t + ph + 16) + '" text-anchor="middle">' + esc(lab) + '</text>'; });
    if (c.type === 'bar') {
      var ns = c.series.length, bw = Math.min(46, step * 0.78 / ns), y0 = Y(Math.max(ymin, 0));
      c.series.forEach(function (se, k) {
        var col = se.color || COL[k % 5];
        se.y.forEach(function (v, i) {
          if (v == null) return;
          var x = X(i) - bw * ns / 2 + k * bw, y = Y(v), top = Math.min(y, y0), h = Math.abs(y - y0);
          s += '<rect x="' + x + '" y="' + top + '" width="' + (bw - 2) + '" height="' + Math.max(h, 0.5) + '" rx="2" fill="' + col + '"/>';
          if (n * ns <= 16) s += '<text x="' + (x + bw / 2 - 1) + '" y="' + (v >= 0 ? top - 4 : top + h + 11) + '" text-anchor="middle">' + (c.vfmt ? c.vfmt(v) : (+v.toFixed(2))) + '</text>';
        });
      });
    } else {
      c.series.forEach(function (se, k) {
        var col = se.color || COL[k % 5], pts = [];
        if (se.lo && se.hi) {
          var up = [], dn = [];
          se.y.forEach(function (v, i) { if (se.lo[i] != null) { up.push(X(i) + ',' + Y(se.hi[i])); dn.unshift(X(i) + ',' + Y(se.lo[i])); } });
          s += '<polygon points="' + up.concat(dn).join(' ') + '" fill="' + col + '" opacity=".14"/>';
        }
        se.y.forEach(function (v, i) { if (v != null) pts.push(X(i) + ',' + Y(v)); });
        s += '<polyline fill="none" stroke="' + col + '" stroke-width="2.2"' + (se.dash ? ' stroke-dasharray="6 4"' : '') + ' points="' + pts.join(' ') + '"/>';
        se.y.forEach(function (v, i) { if (v != null && n <= 30) s += '<circle cx="' + X(i) + '" cy="' + Y(v) + '" r="3" fill="' + col + '"/>'; });
      });
    }
    if (c.vline != null) s += '<line x1="' + (X(c.vline) - step / 2) + '" x2="' + (X(c.vline) - step / 2) + '" y1="' + m.t + '" y2="' + (m.t + ph) + '" stroke="#b42318" stroke-dasharray="4 3"/><text x="' + (X(c.vline) - step / 2 + 4) + '" y="' + (m.t + 11) + '" fill="#b42318" style="fill:#b42318">' + esc(c.vlab || '') + '</text>';
  }
  if (c.hline != null) s += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + Y(c.hline) + '" y2="' + Y(c.hline) + '" stroke="#475467" stroke-dasharray="3 3"/>' + (c.hlab ? '<text x="' + (W - m.r - 2) + '" y="' + (Y(c.hline) - 4) + '" text-anchor="end">' + esc(c.hlab) + '</text>' : '');
  if (c.xlab) s += '<text x="' + (m.l + pw / 2) + '" y="' + (H - 26) + '" text-anchor="middle">' + esc(c.xlab) + '</text>';
  if (c.legend !== false && c.series.length > 1 || c.legend === true) {
    var lx = m.l;
    c.series.forEach(function (se, k) { s += '<rect x="' + lx + '" y="25" width="11" height="11" rx="2" fill="' + (se.color || COL[k % 5]) + '"/><text x="' + (lx + 16) + '" y="35">' + esc(se.name || '') + '</text>'; lx += 24 + (se.name || '').length * 6.2; });
  }
  return s + '</svg>';
}

/* ---------- case rendering ---------- */
function blocks(c) {
  return c.res.map(function (b) {
    var h = '<div class="blk">';
    if (b.h) h += '<h3>' + b.h + '</h3>';
    if (b.chart) h += chart(b.chart); else if (b.head) h += table(b); else if (b.html) h += b.html;
    if (b.note) h += '<div class="cap">' + b.note + '</div>';
    return h + '</div>';
  }).join('');
}
function renderCase(c) {
  var prev = CASES[c.i - 1], next = CASES[c.i + 1], isDone = !!done[c.id];
  var h = '<div class="crumbs"><a href="#/library">Library</a> &rsaquo; <a href="#/library/m' + c.m + '">Module ' + c.m + ': ' + esc(MODS[c.m]) + '</a> &rsaquo; Case ' + c.id + '</div>';
  h += '<h1>' + esc(c.t) + '</h1><div><span class="badge mod">Module ' + c.m + '</span><span class="badge ' + c.d + '">' + c.d + '</span>' + c.cat.map(function (x) { return '<span class="badge">' + x + '</span>'; }).join('') + '</div>';
  h += '<div class="synth"><b>Illustrative synthetic data.</b> Every number in this case was constructed for teaching. It is internally consistent but is not an empirical finding about any real product or company.</div>';
  h += '<section class="panel"><h2><span class="tag">A</span>Business scenario</h2><div class="grid2">' +
    '<div class="mini"><b class="l">Scenario</b>' + c.biz.s + '</div><div class="mini"><b class="l">Objective</b>' + c.biz.o + '</div>' +
    '<div class="mini"><b class="l">Hypothesis / business question</b>' + c.biz.h + '</div><div class="mini"><b class="l">Context &amp; constraints</b>' + c.biz.c + '</div></div></section>';
  h += '<section class="panel"><h2><span class="tag">B</span>Observed analytical results</h2>' + blocks(c) + '</section>';
  h += '<section class="turn"><h2>Your turn: interpret before you reveal</h2><div>' + (c.q ? '<p><b>Case prompt:</b> ' + c.q + '</p>' : '') +
    '<p>Write your read of the output below (or say it out loud). Aim to answer:</p><ol class="q7"><li>What do these results actually tell us?</li><li>Are they statistically <i>and</i> practically meaningful?</li><li>What could be wrong with them?</li><li>Which assumptions or diagnostics would you check?</li><li>What additional analysis would you run?</li><li>What would you recommend to the business?</li><li>What would change your conclusion?</li></ol></div>' +
    '<textarea id="note" placeholder="Type your interpretation here (kept only while this page is open)&hellip;" aria-label="Your interpretation">' + esc(notes[c.id] || '') + '</textarea>' +
    '<div class="row" style="margin-top:10px"><button class="btn primary" id="revealBtn" aria-expanded="false" aria-controls="analysis">Reveal analysis</button><span class="cap" style="margin:0">Commit to an answer first. The explanation is far more useful once you have a position to compare against.</span></div></section>';
  h += '<div id="analysis">';
  h += '<section class="panel interp"><h2><span class="tag">C</span>Interpretation of results</h2>' + c.interp.join('') + '</section>';
  h += '<section class="panel"><h2><span class="tag">D</span>What could be wrong?</h2><div class="row"><span class="cap" style="margin:0">Each item links the observed output to the failure mode it would produce.</span><span class="sp"></span><button class="btn" id="expAll">Expand all</button><button class="btn" id="colAll">Collapse all</button></div>';
  c.wrong.forEach(function (w, i) {
    h += '<details class="issue"><summary><span class="k">F' + (i + 1) + '</span>' + w[0] + '</summary><div class="iss">' +
      '<b>Why it matters</b><div>' + w[1] + '</div><b>How it shows in the output</b><div>' + w[2] + '</div><b>Evidence it is real</b><div>' + w[3] + '</div><b>Real problem vs. misleading signal</b><div>' + w[4] + '</div></div></details>';
  });
  h += '</section>';
  h += '<section class="panel"><h2><span class="tag">E</span>What needs to be done? (prioritized)</h2><div class="tblwrap"><table class="txt"><thead><tr><th>Priority</th><th>Issue</th><th>Diagnostic / analysis</th><th>What to look for</th><th>How to interpret</th><th>Corrective action</th></tr></thead><tbody>';
  c.todo.forEach(function (t, i) { h += '<tr><td><b>P' + (i + 1) + '</b></td><td>' + t[0] + '</td><td>' + t[1] + '</td><td>' + t[2] + '</td><td>' + t[3] + '</td><td>' + t[4] + '</td></tr>'; });
  h += '</tbody></table></div></section>';
  h += '<section class="panel"><h2><span class="tag">F</span>Final recommendation</h2><div class="rec ' + (c.rec.k || '') + '"><div class="v">' + c.rec.v + '</div>' + c.rec.why + '</div></section>';
  h += '<section class="iv panel"><h2><span class="tag" style="background:#fff;color:#14213d">G</span>Interview-ready explanation</h2>' + c.iv + '</section>';
  h += '</div>';
  h += '<div class="pager">' + (prev ? '<a class="btn" href="#/case/' + prev.id + '">&larr; ' + prev.id + ' ' + esc(prev.t.slice(0, 34)) + (prev.t.length > 34 ? '&hellip;' : '') + '</a>' : '') +
    '<span class="sp"></span><button class="btn ' + (isDone ? 'done' : '') + '" id="doneBtn">' + (isDone ? '&#10003; Completed (click to undo)' : 'Mark case complete') + '</button><span class="sp"></span>' +
    (next ? '<a class="btn primary" href="#/case/' + next.id + '">' + next.id + ' ' + esc(next.t.slice(0, 34)) + (next.t.length > 34 ? '&hellip;' : '') + ' &rarr;</a>' : '') + '</div>';
  return h;
}
function bindCase(c) {
  var note = document.getElementById('note'), an = document.getElementById('analysis'), rb = document.getElementById('revealBtn');
  note.addEventListener('input', function () { notes[c.id] = note.value; });
  function setR(on) { revealed[c.id] = on; an.classList.toggle('show', on); rb.textContent = on ? 'Hide analysis' : 'Reveal analysis'; rb.setAttribute('aria-expanded', on); }
  rb.addEventListener('click', function () { var on = !revealed[c.id]; setR(on); if (on) an.scrollIntoView({ block: 'start' }); });
  setR(!!revealed[c.id]);
  document.getElementById('expAll').onclick = function () { an.querySelectorAll('details.issue').forEach(function (d) { d.open = true; }); };
  document.getElementById('colAll').onclick = function () { an.querySelectorAll('details.issue').forEach(function (d) { d.open = false; }); };
  document.getElementById('doneBtn').onclick = function () { if (done[c.id]) delete done[c.id]; else done[c.id] = 1; saveDone(); renderAll(); };
}

/* ---------- library ---------- */
function renderLibrary() {
  var list = filtered(), h = '';
  if (!F.q && F.cat === 'All' && F.diff === 'All' && F.mod === 'All') {
    h += '<h1>Data Science Outcome Evaluation Casebook</h1>' +
      '<section class="panel intro"><h2>How to use this casebook</h2><p>' + CASES.length + ' case studies across ' + Object.keys(MODS).length + ' modules. Each one hands you finished analytical output, as if an analyst had just presented it, and asks you to judge it. This is not a statistics or ML tutorial: no derivations, no code walkthroughs.</p>' +
      '<ul><li><b>Study loop:</b> read the scenario and results (A, B) &rarr; commit to an interpretation &rarr; <b>Reveal analysis</b> &rarr; compare your reasoning against C&ndash;G.</li>' +
      '<li><b>Every case teaches the same reflex:</b> What does this tell me? What might be wrong? How do I validate it? What should I do next?</li>' +
      '<li><b>Data:</b> all numbers are synthetic and for illustration only. They are internally consistent, so you can recompute them, but they are not real findings.</li>' +
      '<li><b>Progress</b> is stored in this browser (when storage is permitted) and shown at the top right.</li></ul></section>';
  } else h += '<h1>Case library</h1>';
  h += '<div class="filters">' + ['All'].concat(CATS).map(function (x) { return '<button class="chip ' + (F.cat === x ? 'on' : '') + '" data-cat="' + x + '">' + x + '</button>'; }).join('') + '</div>';
  h += '<div class="filters"><label>Difficulty <select id="fd"><option>All</option>' + DIFFS.map(function (d) { return '<option' + (F.diff === d ? ' selected' : '') + '>' + d + '</option>'; }).join('') + '</select></label>' +
    '<label>Module <select id="fm"><option value="All">All modules</option>' + Object.keys(MODS).map(function (k) { return '<option value="' + k + '"' + (String(F.mod) === k ? ' selected' : '') + '>' + k + '. ' + esc(MODS[k]) + '</option>'; }).join('') + '</select></label>' +
    '<button class="btn" id="clr">Clear filters</button><span class="cap" style="margin:0">' + list.length + ' of ' + CASES.length + ' cases</span></div>';
  if (!list.length) h += '<div class="empty">No cases match. Try a broader search term or clear filters.</div>';
  Object.keys(MODS).forEach(function (k) {
    var ms = list.filter(function (c) { return String(c.m) === k; });
    if (!ms.length) return;
    h += '<div class="mh"><b>Module ' + k + '</b> &middot; ' + esc(MODS[k]) + '</div><div class="cards">';
    ms.forEach(function (c) {
      h += '<a class="card" href="#/case/' + c.id + '">' + (done[c.id] ? '<span class="ck" title="Completed">&#10003;</span>' : '') + '<span class="id">Case ' + c.id + '</span><h3>' + esc(c.t) + '</h3><p>' + esc(strip(c.biz.s).slice(0, 135)) + (strip(c.biz.s).length > 135 ? '&hellip;' : '') + '</p><div><span class="badge ' + c.d + '">' + c.d + '</span>' + c.cat.map(function (x) { return '<span class="badge">' + x + '</span>'; }).join('') + '</div></a>';
    });
    h += '</div>';
  });
  return h;
}
function bindLibrary() {
  document.querySelectorAll('.chip').forEach(function (b) { b.onclick = function () { F.cat = b.getAttribute('data-cat'); renderAll(); }; });
  document.getElementById('fd').onchange = function (e) { F.diff = e.target.value; renderAll(); };
  document.getElementById('fm').onchange = function (e) { F.mod = e.target.value; renderAll(); };
  document.getElementById('clr').onclick = function () { F = { q: '', cat: 'All', diff: 'All', mod: 'All' }; document.getElementById('q').value = ''; renderAll(); };
}

/* ---------- sidebar & progress ---------- */
function renderSide(cur) {
  var list = filtered(), h = '<a class="lib" href="#/library">&#9776; Case library &amp; filters</a>';
  Object.keys(MODS).forEach(function (k) {
    var all = CASES.filter(function (c) { return String(c.m) === k; }), ms = list.filter(function (c) { return String(c.m) === k; });
    if (!ms.length) return;
    var nd = all.filter(function (c) { return done[c.id]; }).length, open = (cur && cur.m === +k) || F.q || F.mod === k;
    h += '<details' + (open ? ' open' : '') + '><summary><span>' + k + '. ' + esc(MODS[k]) + '</span><span class="n">' + nd + '/' + all.length + '</span></summary>';
    ms.forEach(function (c) { h += '<a href="#/case/' + c.id + '" class="' + (cur && cur.id === c.id ? 'cur' : '') + '"><span class="id">' + c.id + '</span><span>' + esc(c.t) + '</span>' + (done[c.id] ? '<span class="ck">&#10003;</span>' : '') + '</a>'; });
    h += '</details>';
  });
  document.getElementById('side').innerHTML = h;
}
function renderProg() {
  var n = CASES.filter(function (c) { return done[c.id]; }).length;
  document.getElementById('progTxt').textContent = n + ' of ' + CASES.length + ' cases completed';
  document.getElementById('progBar').style.width = (100 * n / CASES.length) + '%';
}

/* ---------- router ---------- */
function renderAll() {
  var hash = location.hash || '#/library', main = document.getElementById('main'), cur = null, m;
  if ((m = hash.match(/^#\/case\/(\d+\.\d+)/)) && byId[m[1]]) {
    cur = byId[m[1]]; main.innerHTML = renderCase(cur); bindCase(cur); document.title = 'Case ' + cur.id + ' · Outcome Evaluation Casebook';
  } else {
    if ((m = hash.match(/^#\/library\/m(\d)/))) F.mod = m[1];
    main.innerHTML = renderLibrary(); bindLibrary(); document.title = 'Data Science Outcome Evaluation Casebook';
  }
  renderSide(cur); renderProg();
}
var lastHash = null;
window.addEventListener('hashchange', function () {
  document.getElementById('side').classList.remove('open');
  renderAll();
  if (location.hash !== lastHash) window.scrollTo(0, 0);
  lastHash = location.hash;
});
document.getElementById('q').addEventListener('input', function (e) {
  F.q = e.target.value;
  if (!/^#\/library/.test(location.hash)) { location.hash = '#/library'; } else renderAll();
});
document.getElementById('brand').onclick = function () { location.hash = '#/library'; };
document.getElementById('brand').onkeydown = function (e) { if (e.key === 'Enter') location.hash = '#/library'; };
document.getElementById('menuBtn').onclick = function () { document.getElementById('side').classList.toggle('open'); };
renderAll(); lastHash = location.hash;
window.__CASEBOOK = { cases: CASES, go: function (id) { location.hash = '#/case/' + id; } };
})();

</script>
</body>
</html>
