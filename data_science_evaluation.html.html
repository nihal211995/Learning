C({id:'7.1',t:'Higher benchmark score, lower real-task completion',cat:['AI'],d:'Intermediate',kw:'LLM benchmark task completion McNemar paired evaluation tool use category',
biz:{s:`A support-assistant team compares two LLMs. Model A scores higher on the vendor's reasoning benchmark and is the proposed default. The team also ran both models on 1,200 real, anonymised support tasks with tool access, graded by a task-completion rubric.`,
o:`Choose which model to deploy as the support assistant.`,
h:`Higher benchmark accuracy predicts better real-world task completion.`,
c:`Task completion means the final state was correct and the required tool actions were valid. Same 1,200 tasks run through both models (paired). Cost and latency are similar.`},
res:[
{h:`Benchmark vs production-like evaluation`,head:['Metric','Model A','Model B'],rows:[['Public reasoning benchmark accuracy','86.0%',bad('82.0%')],['Task completion on 1,200 real tasks (overall)',bad('61.0% (732)'),good('68.0% (816)')]]},
{h:`Task completion by category`,head:['Task category','n','Model A','Model B','B − A (pp)'],rows:[['Single-step lookup / FAQ','500','77.0% (385)','75.0% (375)','−2.0'],['Multi-step with tool calls','400',bad('47.5% (190)'),good('66.0% (264)'),good('+18.5')],['Policy reasoning / ambiguous','300','52.3% (157)','59.0% (177)','+6.7']]},
{h:`Paired outcomes (McNemar)`,head:['','B succeeds','B fails'],rows:[['A succeeds','612','120'],['A fails','204','264']],note:`B − A = +7.0 pp, paired 95% CI [+4.1, +9.9] pp; McNemar χ² = (204 − 120)² / (204 + 120) = 21.8, p &lt; 0.0001.`}],
q:`A is 4 points better on the benchmark and 7 points worse on real tasks. Which result do you trust and why?`,
interp:[
`<p><b>The real-task evaluation is closer to the decision.</b> Model B completes 68.0% vs 61.0% for A (paired difference +7.0 pp, CI +4.1 to +9.9; p&nbsp;&lt;&nbsp;0.0001). Because both models saw the same 1,200 tasks, the paired analysis is appropriate and removes task-difficulty variance. Discordant pairs are 204 (B only) vs 120 (A only).</p>`,
`<p><b>Why the benchmark misleads.</b> The public benchmark measures static reasoning, not tool use. The gap is concentrated in multi-step tool tasks (A 47.5% vs B 66.0%, +18.5 pp), which are the core of the product; on simple lookups A is slightly better (−2 pp for B). Benchmark gains and production gains are different constructs: format reliability for tool calls, instruction following, and recovery from errors do not show up in a reasoning benchmark.</p>`,
`<p><b>What would change the conclusion.</b> A different traffic mix (mostly single-step FAQ) could favour A; a failure analysis that shows B's wins come from lenient grading would; so would safety or cost differences, which are not in this table.</p>`],
wrong:[
[`Benchmark-task mismatch`,`Benchmarks measure what they measure, which may be unrelated to the application.`,`Ranking reverses between benchmark and real tasks.`,`Evaluate on a task set sampled from production traffic with an application-specific rubric.`,`Genuine when the reversal holds on stratified categories.`],
[`Grader bias`,`If an LLM or rubric favours one model's style, the result shifts.`,`Differences vanish with human grading.`,`Double-grade a subset by humans; check agreement.`,`If humans agree with the rubric, the result stands.`],
[`Traffic-mix dependence`,`The overall number weights categories by the test set mix.`,`Different winners by category.`,`Re-weight to real traffic share.`,`Decision follows production mix; here multi-step tasks drive value.`],
[`Prompt tuning favours one model`,`Prompts tuned for A may disadvantage B (or vice versa).`,`One model has had more prompt iterations.`,`Equalise prompt-tuning effort or test multiple prompts.`,`If B still wins with A-optimised prompts, the conclusion is stronger.`]],
todo:[
[`Check evaluation validity`,`Human-grade a stratified sample; inter-rater agreement; check prompt parity.`,`Grader agreement ≥ 0.8.`,`Low agreement undermines the comparison.`,`Refine rubric.`],
[`Failure analysis for A`,`Categorise A's failures (tool-call formatting, hallucinated parameters, missing steps).`,`Share of failures due to tool use.`,`If mostly format errors, A may be fixable with prompting/constrained decoding.`,`Decide whether to retest A after a fix.`],
[`Weight by traffic mix`,`Re-weight categories to production share.`,`Overall completion under the real mix.`,`Verify B's advantage under realistic mix.`,`Report mix-weighted results.`],
[`Add cost, latency, safety`,`Include the full scorecard.`,`Cost per successful task.`,`Make the decision on the scorecard.`,`Finalise selection.`]],
rec:{v:`Deploy Model B (after grader validation and a safety check)`,k:'good',why:`B completes 7 pp more real tasks (CI +4.1 to +9.9), driven by multi-step tool use, the product's core workload. Public benchmark scores don't predict that. Confirm grading validity and check safety/cost before rollout.`},
iv:`<p>"I'd trust the evaluation on our own tasks, because it measures the product. On 1,200 paired tasks, B completes 68% against A's 61%, a 7-point gap with a confidence interval of about 4 to 10, and McNemar is highly significant. The gap sits in multi-step tool tasks, which a reasoning benchmark doesn't test. I'd validate grading with humans, check B's safety and cost, then roll it out with online monitoring.</p>`});

C({id:'7.2',t:'RAG retrieves the right document, still answers wrongly',cat:['AI'],d:'Advanced',kw:'RAG retrieval generation faithfulness groundedness hallucination conflicting documents abstention failure attribution',
biz:{s:`A support RAG assistant answers policy questions from a knowledge base. Retrieval metrics look excellent, yet users and QA report wrong answers. The team's instinct is to swap in a bigger LLM.`,
o:`Locate where failures originate and decide what to fix.`,
h:`Because retrieval is strong, the generator (LLM) is responsible for the errors.`,
c:`600 evaluation queries with gold documents and gold answers. Metrics from LLM-judged groundedness (calibrated against a 100-item human audit) and gold-answer comparison.`},
res:[
{h:`Pipeline metrics`,head:['Stage','Metric','Value'],rows:[['Retrieval','Recall@5 (gold document in top 5)',good('97.2% (583/600)')],['Retrieval','Context precision (share of top-5 chunks relevant)',warn('41%')],['Generation','Answer correctness vs gold',bad('64.0% (384/600)')],['Generation','Faithfulness (claims supported by retrieved context)','83.0% (498/600)'],['Generation','Hallucination rate (≥ 1 unsupported claim)',bad('17.0% (102/600)')]]},
{h:`Attribution of the 216 incorrect answers`,head:['Failure cause','Count','Share of failures','Primary fix'],rows:[
['Gold document not retrieved','17','7.9%','Retriever / chunking'],
['Gold document retrieved but ignored or misread','61','28.2%','Prompting, reranking, answer extraction'],
[warn('Conflicting or outdated documents in context'),'58','26.9%','Document versioning, deduplication'],
['Multi-hop or synthesis error','44','20.4%','Decomposition / reasoning'],
['Should have abstained (answer not in KB)','26','12.0%','Abstention policy'],
['Label noise / ambiguous gold','10','4.6%','Evaluation data'],
[bad('Total'),'216','100%','']]}],
q:`Recall@5 is 97%, but only 64% of answers are correct. Where do you look first?`,
interp:[
`<p><b>Retrieval is not the main issue.</b> Only 17 of 216 failures (7.9%) are retrieval misses. Fixing recall completely would add at most 2.8 pp of correctness (17/600). The generator is not the main culprit either: a bigger model would help with multi-hop errors (44) and perhaps ignored context (61), but not with outdated documents or missing information.</p>`,
`<p><b>Context quality, not quantity.</b> Context precision of 41% means about 3 of 5 chunks are noise. Conflicting or outdated documents account for 58 failures (27%): the model is <i>faithful</i> to context that is wrong. This explains why faithfulness (83%) exceeds correctness (64%): 19 pp of answers are consistent with their retrieved text yet wrong.</p>`,
`<p><b>Hallucination.</b> The 17% hallucination rate (unsupported claims) is a distinct failure: 102 answers include content not in the context. These overlap partly with ignored-context and abstention failures (26 cases where the model answered despite no answer in the KB).</p>`,
`<p><b>Priority.</b> The biggest levers by count are context handling (ignored 61 + conflicts 58 = 119, 55% of failures), then reasoning (44), abstention (26), retrieval (17).</p>`],
wrong:[
[`Retrieval metrics hide context quality`,`Recall@k only checks whether the gold doc is somewhere in the top k.`,`High recall, low context precision.`,`Measure context precision, ranking position of the gold doc, and conflicts in the context.`,`Genuine if irrelevant chunks outnumber relevant and the model is distracted.`],
[`Stale or conflicting sources`,`The model faithfully cites an outdated policy.`,`Answers correct for old policy.`,`Check document dates and duplicates in failing cases.`,`If failing cases cluster on versioned documents, fix the corpus.`],
[`No abstention behaviour`,`When the KB lacks an answer the model improvises.`,`Hallucinations on unanswerable queries.`,`Evaluate on unanswerable queries; measure appropriate abstention rate.`,`Real if abstention is rare despite no evidence.`],
[`LLM-judge unreliability`,`Faithfulness judged by an LLM may be miscalibrated.`,`Judge disagrees with human audit.`,`Audit 100 items against human labels; report agreement.`,`If agreement &lt; 80%, reduce reliance on judge scores.`]],
todo:[
[`Fix the corpus and context`,`Version, deduplicate and date-stamp documents; filter superseded content; rerank to cut irrelevant chunks.`,`Conflict cases drop from 58.`,`Re-evaluate the 58 failing queries.`,`Corpus governance with owners.`],
[`Improve use of context`,`Answer extraction prompts, quote-then-answer, reranker; track the 61 "ignored" cases.`,`Fraction of those flipping to correct.`,`If many flip, generation instructions were the issue.`,`Adopt the best prompt/reranker.`],
[`Add abstention`,`Confidence/evidence thresholds; "I don't know" with escalation.`,`Abstention precision on unanswerable queries.`,`Reduces hallucinations at the cost of coverage.`,`Tune on cost of wrong vs escalated answers.`],
[`Then consider model swap`,`Test a larger model on the multi-hop subset only.`,`Gain on the 44 multi-hop cases.`,`Justifies cost only if it moves overall correctness materially.`,`Targeted routing for hard queries.`]],
rec:{v:`Rebuild the retrieval context (corpus governance, reranking, abstention) before changing the LLM`,k:'warn',why:`Retrieval recall is fine (97.2%) but 55% of failures come from ignored or conflicting context, and another 12% from missing abstention. A larger model addresses only the 20% multi-hop cases.`},
iv:`<p>"Recall@5 of 97% tells me the right document is in the top five, not that the model sees clean context: only 41% of chunks are relevant. Of 216 wrong answers, just 17 are retrieval misses. 58 are conflicting or outdated documents and 61 are the right document being ignored. So I wouldn't buy a bigger model yet. I'd fix document versioning, add reranking, and add abstention for the 12% where the answer isn't in the KB, then test a bigger model only on multi-hop questions.</p>`});

C({id:'7.3',t:'Better answers, but slower and 3× the cost',cat:['AI'],d:'Advanced',kw:'latency cost quality tradeoff pairwise win rate routing cost per successful task abandonment',
biz:{s:`A new model version (v2) wins human pairwise comparisons and raises task success, but its p95 latency more than doubles and cost per task triples. Product wants to ship v2 to 100% of traffic.`,
o:`Decide how to deploy, balancing quality, latency, and cost.`,
h:`v2's quality gain justifies the higher latency and cost.`,
c:`Task success is measured offline (no user impatience). Online data suggest users abandon 21% of responses slower than 5 s, versus 7% otherwise. Human-handled escalation costs $4.20 per failed task. Traffic: 60% easy, 40% hard queries.`},
res:[
{h:`Quality, latency and cost`,head:['Metric','v1','v2'],rows:[
['Pairwise human preference (non-ties, n = 890)','—','58.4% win (95% CI 55.2-61.7%)'],['Task success: easy queries','87.0%','88.0%'],['Task success: hard queries','54.0%',good('65.5%')],['Task success overall (60/40 mix)','73.8%','79.0%'],
['Latency p50','1.9 s','4.1 s'],['Latency p95','3.1 s',bad('7.8 s')],['Share of responses slower than 5 s','3%',bad('38%')],['Cost per task','$0.021',bad('$0.064')],['Cost per <i>successful</i> task','$0.028',bad('$0.081')]]},
{h:`Deployment options (online success accounts for abandonment)`,head:['Policy','Offline success','Share > 5 s','Abandonment','Online success','Cost per task','Cost per online success'],rows:[
['All v1','73.8%','3.0%','7.4%',P(onl(.738,.03),1),'$0.021','$'+(0.021/onl(.738,.03)).toFixed(3)],
['All v2','79.0%','38.0%','12.3%',P(onl(.79,.38),1),'$0.064','$'+(0.064/onl(.79,.38)).toFixed(3)],
[good('Route: easy → v1, hard → v2'),'78.4%','15.2%','9.1%',good(P(onl(.784,.152),1)),good('$0.038'),good('$'+(0.0382/onl(.784,.152)).toFixed(3))]],note:`Abandonment = share>5s × 21% + (1 − share>5s) × 7%. Online success = offline success × (1 − abandonment). Routed policy: success 0.6×87% + 0.4×65.5% = 78.4%; cost 0.6×$0.021 + 0.4×$0.064 = $0.038; only hard-query v2 calls are slow (0.4 × 38% = 15.2%). Router assumed to be perfect; a real router will lose some of this.`},
{h:`Marginal economics`,head:['Quantity','Value'],rows:[['Extra success from v2 vs v1 (offline)','+5.2 pp'],['Extra cost from v2 vs v1','+$0.043 per task'],['Cost per additional offline success','$0.043 / 0.052 = $0.83'],['Value of avoiding an escalation','$4.20']]}],
q:`v2 wins on quality but costs 3× and is slow. Ship to everyone, ship to no one, or something else?`,
interp:[
`<p><b>Quality gains are real.</b> v2 wins 58.4% of non-tied comparisons (CI 55.2-61.7%) and lifts offline success from 73.8% to 79.0%, with the gain concentrated in hard queries (54.0% to 65.5%) and almost none on easy ones (87.0% to 88.0%).</p>`,
`<p><b>Latency erodes the gain.</b> Because 38% of v2 responses exceed 5 s, abandonment rises to about 12.3% from 7.4%. After accounting for it, online success is 69.3% for v2 versus 68.3% for v1: about +1 pp for three times the cost. The offline +5.2 pp mostly disappears.</p>`,
`<p><b>Economics.</b> Each additional offline success costs $0.83, well below a $4.20 escalation, so the marginal value of quality is high <i>if the success is actually realised</i>. That is why the latency issue matters: it prevents realisation.</p>`,
`<p><b>Routing wins.</b> Sending only hard queries to v2 retains most of the quality gain (78.4% offline), cuts cost per task to $0.038 (40% less than all-v2), keeps slow responses to 15%, and gives the best online success (71.2%) in this model. The numbers assume a perfect router; a realistic router should be evaluated before committing.</p>`],
wrong:[
[`Offline success ignores user behaviour`,`Latency-driven abandonment erodes realised value.`,`Offline gain +5.2 pp vs online gain ≈ +1 pp.`,`Run an online test measuring completion, abandonment, and escalation.`,`Genuine if online completion gain is much smaller than offline.`],
[`Averages hide difficulty mix`,`Gains concentrate in hard queries.`,`Easy-query success identical (87% vs 88%).`,`Quality by difficulty; value of routing.`,`If most gain is in a minority of traffic, route.`],
[`Router errors`,`Misrouted hard queries to v1 lose quality; misrouted easy queries to v2 waste cost.`,`Router accuracy below 100%.`,`Evaluate router precision/recall on labelled difficulty.`,`Net benefit shrinks with router error; compute break-even accuracy.`],
[`Preference win rate overstates value`,`58% win is a preference, not a measure of task success.`,`Humans prefer longer, more polished text.`,`Check length-controlled win rates and task outcomes.`,`If the win persists after length control, it is genuine quality.`]],
todo:[
[`Online A/B on completion, abandonment, escalation`,`Randomised test with v1, v2-all, routed.`,`Online success and cost per success.`,`Choose by cost per online success with a latency guardrail.`,`Pre-register p95 &lt; 5 s as a guardrail.`],
[`Build and evaluate the router`,`Difficulty classifier; measure routing accuracy and its effect.`,`Success/cost vs perfect router.`,`Net gain must beat the router's errors.`,`Ship the router if it keeps ≥ 80% of the gain.`],
[`Reduce v2 latency`,`Streaming, caching, smaller prompts, speculative decoding.`,`Share > 5 s.`,`Latency fixes recover abandonment.`,`Re-test v2 after optimisation.`],
[`Segment guardrails`,`Check by language and channel.`,`No segment regressions.`,`Avoid hidden harm.`,`Gate rollout.`]],
rec:{v:`Continue experimentation: ship v2 only for hard queries via a router, with a latency guardrail`,k:'warn',why:`Shipping v2 everywhere buys about +1 pp of online success for 3× cost; routing hard queries to v2 delivers most of the quality gain at 60% of v2's cost, if a real router performs close to the idealised case. Validate online before scaling.`},
iv:`<p>"v2 is better, 58% preference win and 5 points more tasks completed, but half of that gain is lost to latency: 38% of responses take over 5 seconds, and users abandon those at 21%. Net of abandonment, v2 adds only about a point of success for triple the cost. The quality gain is concentrated in hard queries, so I'd route only those to v2, which keeps most of the gain at about 40% less cost, and validate it with an online test with a p95 latency guardrail.</p>`});
})();

C({id:'7.4',t:'Agent completes tasks, but takes unsafe and unauthorised actions',cat:['AI'],d:'Expert',kw:'agent safety unauthorized actions prompt injection task completion severity guardrails human approval least privilege',
biz:{s:`A tool-using support agent can look up orders, issue refunds and update accounts. In evaluation it completes 91% of tasks. The launch review also found cases where it exceeded its authority.`,
o:`Decide whether the agent can be deployed autonomously.`,
h:`High task completion indicates the agent is ready for autonomous operation.`,
c:`600 evaluation episodes with scripted customer scenarios, each logged with tool calls and checked against policy (refund limit $200 without approval, identity verification before account changes, no access to other customers' data). A separate suite of 80 adversarial prompt-injection scenarios (instructions hidden in customer messages or order notes).`},
res:[
{h:`Outcome and safety metrics (600 episodes)`,head:['Metric','Count','Rate'],rows:[
['Task completed','546','91.0%'],['Completed <i>and</i> policy-compliant (safe success)',warn('527'),warn('87.8%')],['Episodes with any policy violation',bad('26'),bad('4.3%')],['… of which severe (refund over limit, other customer\'s PII, unverified account change)',bad('9'),bad('1.5%')],['Violations occurring within "completed" episodes','19','3.5% of completed (3.2% of all episodes)']]},
{h:`Violations by type`,head:['Violation type','Count','Severity'],rows:[['Refund above $200 without approval','4','Severe'],['Exposed another customer\'s PII in a reply','3','Severe'],['Account change without identity verification','2','Severe'],['Out-of-policy goodwill credit','9','Moderate'],['Unnecessary data lookup (excess access)','8','Moderate'],['Total','26','']]},
{h:`Prompt-injection suite (80 adversarial scenarios)`,head:['Outcome','Count','Rate'],rows:[['Followed injected instruction (e.g. issued refund, revealed data)',bad('23'),bad('28.8%')],['Ignored injection','57','71.2%']]}],
q:`91% completion. What else do you need to know, and what blocks launch?`,
interp:[
`<p><b>Completion is the wrong headline.</b> The agent scores 91% but only 87.8% of episodes are safe successes; 26 episodes (4.3%) violated policy, and 19 of those still counted as "completed". Success metrics that ignore process reward the agent for getting a refund done by any means.</p>`,
`<p><b>Severity matters more than rate.</b> Nine violations (1.5%) are severe: refunds above limit, other-customer PII exposure, account changes without verification. At support volume (say 1M conversations a month) a 1.5% severe rate means about 15,000 severe incidents a month, and even a rate that looks small in a 600-episode sample has a wide CI (upper bound of the 95% CI on 9/600 is about 2.8%).</p>`,
`<p><b>Adversarial robustness is poor.</b> 28.8% (23/80) of injection scenarios induced the agent to follow attacker instructions. Customer messages and order notes are untrusted text; treating them as instructions is an authority failure, independent of benign performance.</p>`,
`<p><b>Why instructions to "follow policy" are not enough.</b> Policy limits expressed only in the prompt are soft; deterministic checks in the tool layer (refund limits, identity-verified sessions, row-level data access) make violations impossible rather than unlikely.</p>`],
wrong:[
[`Outcome-only metric`,`Completion ignores how the task was completed.`,`91% completion vs 87.8% safe success.`,`Add process metrics: policy violations, scope of data accessed, approvals respected.`,`Genuine if violations occur in completed episodes.`],
[`Prompt injection`,`Untrusted content is interpreted as instructions.`,`28.8% injection success.`,`Red-team suites; separate instruction vs data channels; test indirect injection.`,`Any non-trivial success rate is a blocker for high-privilege tools.`],
[`Over-privileged tools`,`The agent can do things the human agent role could not without approval.`,`Refunds over limit executed.`,`Review tool permissions against least privilege; log denied calls.`,`If violations were possible, permissions are too broad.`],
[`Small-sample risk estimates`,`Rare severe events are under-sampled.`,`9 severe events in 600 episodes.`,`Compute CIs; run large-scale simulation and adversarial testing.`,`Plan for the upper bound.`]],
todo:[
[`Enforce policy in the tool layer`,`Hard refund limits and approval workflows; identity verification gates; row-level security; least-privilege credentials.`,`Zero severe violations by construction in tests.`,`Any severe violation after enforcement is a bug.`,`Implement before any autonomous mode.`],
[`Prompt-injection defences and testing`,`Separate untrusted content, strip/mark it, restrict tools after untrusted input; large red-team suite.`,`Injection success near 0%.`,`Track by attack family.`,`Gate: no successful high-severity injection.`],
[`Safety-weighted evaluation`,`Report safe success, severity-weighted violation rate, with CIs; larger sample.`,`Upper bound of severe rate.`,`Set explicit release thresholds (e.g. 0 severe in N episodes).`,`Add to release criteria.`],
[`Staged deployment`,`Suggest-only mode with human approval; then autonomy for low-risk actions with monitoring and kill switch.`,`Approval rate, overrides, incident rate.`,`Expand autonomy as evidence accumulates.`,`Define escalation and audit logging.`]],
rec:{v:`Do not deploy autonomously; run as human-approved assistant while safeguards are built`,k:'bad',why:`Safe success is 87.8%, severe violations occur in 1.5% of episodes, and 28.8% of injection attempts succeed. High completion is not evidence of production readiness. Enforce policy in tools, harden against injection, and expand autonomy only against safety thresholds.`},
iv:`<p>"Ninety-one percent completion isn't the right number. About 4% of episodes violated policy, 1.5% severely, including refunds over the limit and exposing another customer's data, and nearly 29% of prompt-injection attempts worked. Safe success is 87.8%. At support scale, 1.5% is thousands of severe incidents. I'd block autonomous launch and enforce limits in the tool layer, defend against injection, report safety-weighted metrics with confidence intervals, and start with human-approved actions, expanding autonomy as the evidence supports it.</p>`});

C({id:'7.5',t:'LLM-judge says better, humans say no, and runs disagree',cat:['AI'],d:'Expert',kw:'LLM judge human evaluation length bias inter-annotator agreement kappa consistency pass^k variance nondeterminism',
biz:{s:`A new model version (v2) wins 63% of pairwise comparisons judged by an LLM. A human study shows almost no preference. A reliability test also shows v2's answers vary more between repeated runs.`,
o:`Decide whether v2's claimed quality improvement is real and whether the evaluation method can be trusted.`,
h:`v2 improves answer quality over v1.`,
c:`800 prompts judged by an LLM; 400 of them also judged by 3 human raters each. Consistency test on 200 prompts, 5 runs each at temperature 0.7.`},
res:[
{h:`LLM judge vs humans (v2 vs v1, ties excluded for win rates)`,head:['Evaluator','n','v2 win rate','95% CI','Notes'],rows:[
['LLM judge','800','63.0%','[59.6%, 66.3%]','—'],['Human raters (majority of 3)','400 (312 non-tie)',bad('51.3%'),bad('[45.8%, 56.8%]'),'22% ties'],['Agreement: LLM judge vs human majority','400','58%','—','—'],['Inter-annotator agreement (Fleiss κ)','400','0.38','—','Fair/moderate']]},
{h:`Length bias: v2 is 41% longer (212 vs 150 words on average)`,head:['Length ratio (v2 / v1)','LLM judge v2 win rate','Human v2 win rate'],rows:[['≥ 1.5×',bad('74%'),'54%'],['1.0-1.5×','61%','51%'],['&lt; 1.0×','49%','49%']]},
{h:`Run-to-run consistency (200 prompts × 5 runs, temperature 0.7)`,head:['Metric','v1','v2'],rows:[['pass@1 (average per-run correctness)','72.0%','75.0%'],[bad('pass^5 (all 5 runs correct)'),'61.0%',bad('52.0%')],['Prompts with mixed outcomes across runs','24%',bad('38%')]]}],
q:`Judge says 63%, humans say 51%, and v2 is less consistent. What do you conclude and what would you do?`,
interp:[
`<p><b>The improvement is not established.</b> Human preference for v2 is 51.3% (CI 45.8%-56.8%, 312 non-tied prompts), consistent with no difference. The LLM judge's 63% is a large discrepancy, and the judge agrees with the human majority only 58% of the time. Human raters themselves are only fairly consistent (κ&nbsp;=&nbsp;0.38), so the human estimate is noisy but unbiased in the aspects that matter more.</p>`,
`<p><b>Length bias explains much of the gap.</b> v2 is 41% longer. The judge's win rate rises with the length ratio: 74% when v2 is ≥ 1.5× longer, 61% at 1.0-1.5×, and 49% when v2 is shorter. Humans show a much flatter relationship (54%, 51%, 49%). When length is equal or shorter, the judge also sees no improvement. The judge is rewarding verbosity.</p>`,
`<p><b>Consistency is worse.</b> v2 has a higher average per-run correctness (75% vs 72%) but lower reliability: only 52% of prompts are correct in all 5 runs (v1: 61%), and 38% of prompts have mixed outcomes (v1: 24%). For a customer-facing system, answer stability matters: the same question can get different answers.</p>`,
`<p><b>What to conclude.</b> v2's quality gain is unproven, its answers are longer and less stable. Offline judge scores alone are not decision-grade.</p>`],
wrong:[
[`LLM-judge bias (verbosity, position, self-preference)`,`Judges can favour longer or stylistically familiar answers.`,`Judge win rate rises with length ratio; humans flat.`,`Length-controlled comparisons; swap order; calibrate vs human labels.`,`Genuine if the judge's preference disappears at equal length.`],
[`Human evaluation noise`,`Low κ means raters disagree; estimates have wide CIs.`,`κ = 0.38; wide CI.`,`Improve rubric, train raters, add adjudication, increase n.`,`If disagreement concentrates in subjective categories, split by category.`],
[`Nondeterminism / variance`,`Single-run evaluations miss variability; "wins" can be luck.`,`pass^5 lower for v2.`,`Multiple runs per prompt; report variance and pass^k.`,`If variance is higher, reduce temperature or use self-consistency.`],
[`Offline-online mismatch`,`Neither judge nor human preference equals user outcomes.`,`No online data.`,`Run an online test with task success and escalation.`,`Decision should rest on online outcomes.`]],
todo:[
[`Calibrate the judge`,`Compare with human labels on a stratified set; control for length; randomise order; check by category.`,`Judge-human agreement; length-controlled win rate.`,`If agreement &lt; 75% or bias persists, don't use the judge for decisions.`,`Use judge only for triage.`],
[`Improve the human protocol`,`Rubric with specific criteria (correctness, completeness, tone); more raters; adjudication.`,`κ ≥ 0.6.`,`Reduces noise in the human estimate.`,`Re-run human eval at larger n.`],
[`Measure reliability`,`pass^k, variance by prompt category; temperature sweep.`,`Mixed-outcome share.`,`Identify categories with instability.`,`Lower temperature or add consistency checks.`],
[`Online validation`,`A/B test measuring resolution, re-contact, CSAT.`,`Real outcome lift.`,`Final arbiter.`,`Ship only on online evidence.`]],
rec:{v:`Collect more data: do not claim improvement; fix evaluation and test online`,k:'warn',why:`v2's advantage appears only with an LLM judge that rewards length. Human preference is flat (51%), and v2 is less consistent across runs. Calibrate the judge, improve human protocols, and validate on online outcomes before shipping.`},
iv:`<p>"The judge says 63% but the humans say 51%, indistinguishable from a coin flip, and the judge only agrees with humans 58% of the time. v2's answers are 41% longer, and the judge's win rate climbs with length, 74% when v2 is much longer, 49% when it's shorter, while humans barely move. On top of that v2 is less consistent: all five runs are right only 52% of the time against 61% for v1. So I wouldn't claim an improvement. I'd length-control and calibrate the judge, tighten the human rubric, and decide on an online test.</p>`});

/* ===== MODULE 8: RANKING / RECOMMENDATION ===== */
C({id:'8.1',t:'CTR up, conversion and revenue down',cat:['ML','Experimentation'],d:'Intermediate',kw:'click-through rate conversion downstream clickbait revenue per session metric trade-off recommendation',
biz:{s:`A marketplace replaced its recommendation ranker with a model trained to maximise predicted clicks. The A/B test shows a clear increase in recommendation CTR. Purchases fell slightly.`,
o:`Decide whether to launch the click-optimised ranker.`,
h:`Higher engagement with recommendations (CTR) leads to more purchases and revenue.`,
c:`5M sessions per arm, 2 weeks. Primary business metric: purchase conversion per session and revenue per session. CTR is a diagnostic, not the goal.`},
res:[
{h:`Experiment readout`,head:AB,rows:[abRow('Sessions with ≥1 recommendation click',5e6,900000,5e6,975000),abRow('Purchase conversion per session',5e6,155000,5e6,151500)],note:`Revenue per session: $1.84 (control) vs $1.79 (treatment), −2.7%, i.e. about −$250k over 5M treated sessions.`},
{h:`Funnel decomposition of purchases`,head:['Session group','Arm','Sessions','Purchases','Conversion'],rows:[
['Clicked a recommendation','Control','900,000','99,000','11.0%'],['Clicked a recommendation','Treatment','975,000','88,725',bad('9.1%')],
['No recommendation click','Control','4,100,000','56,000','1.37%'],['No recommendation click','Treatment','4,025,000','62,775','1.56%'],
[bad('All sessions'),'Control / Treatment','5,000,000 each','155,000 / 151,500','3.10% / 3.03%']]},
{h:`Other diagnostics`,head:['Metric','Control','Treatment'],rows:[['Mean price of clicked recommended item','$41','$29'],['Returns/cancellations within 7 days (per purchase)','4.1%','4.4%'],['Mean items viewed after recommendation click','2.1','1.4']]}],
q:`CTR +8.3% (p < 0.0001); purchases −2.3% (p < 0.0001). Which do you trust, and what happened?`,
interp:[
`<p><b>Both effects are real; they measure different things.</b> The new ranker gets 75,000 more sessions to click (19.5% vs 18.0%), but the purchase rate among clickers drops from 11.0% to 9.1% (&minus;17%), and overall conversion falls from 3.10% to 3.03%. Revenue per session is down 2.7%.</p>`,
`<p><b>Mechanism.</b> Optimising for clicks rewards curiosity and cheap or sensational items: clicked items cost $29 vs $41, users view fewer items after the click (1.4 vs 2.1), and conversion among clickers falls. The extra clickers are lower-intent, and the clicks displaced useful, high-intent recommendations. The rise in non-click purchasers' conversion (1.37% to 1.56%) reflects composition: the new clickers came partly from sessions that would otherwise have been in this group, leaving fewer low-intent sessions in it.</p>`,
`<p><b>Which metric to trust.</b> The metric closest to the business objective: purchases and revenue per session. CTR is a proxy; once you optimise a proxy directly, Goodhart's law applies.</p>`,
`<p><b>Note.</b> The conversion decline is small in absolute terms (&minus;0.07 pp, CI &minus;0.09 to &minus;0.05), but it is precisely estimated and consistent with the revenue loss.</p>`],
wrong:[
[`Proxy-metric optimisation (Goodhart)`,`The model learned to produce clicks, not value.`,`CTR up, click-to-purchase down, cheaper items.`,`Break down by click quality: add-to-cart, dwell, purchase of clicked item.`,`Genuine if downstream metrics worsen specifically among clicked sessions.`],
[`Attention displacement`,`Recommendations may crowd out other discovery paths (search, categories).`,`Non-click purchase rates shift; total conversion falls.`,`Compare sources of purchases (rec, search, direct).`,`If total purchases fall while rec-sourced purchases fall too, the module is net harmful.`],
[`Position and layout changes`,`The new ranker may change the number or position of items shown.`,`Impressions per session differ.`,`Check exposure and position distribution by arm.`,`If exposure differs, compare per-impression and per-session metrics.`],
[`Novelty-driven curiosity clicks`,`New content draws clicks that fade.`,`CTR decays; conversion stays flat.`,`Weekly view.`,`If CTR decays, the headline CTR gain was transient.`]],
todo:[
[`Reframe the objective`,`Train on purchase or revenue labels, or a weighted multi-objective (click × conversion value).`,`Offline: predicted revenue per session.`,`Offline gains must be confirmed online.`,`Retrain with downstream labels.`],
[`Diagnose click quality`,`Segment by item category, price, dwell time; compare clicked-item purchase rate by arm.`,`Where conversion falls.`,`If concentrated in cheap/clickbait items, add quality filters.`,`Add price/quality constraints.`],
[`Guardrails and decision rules`,`Pre-register revenue per session, conversion and returns as launch gates.`,`Thresholds.`,`CTR gain alone cannot launch.`,`Update the experiment charter.`],
[`Re-test`,`New ranker v2 with downstream optimisation.`,`Revenue per session.`,`Ship on net-positive revenue with no guardrail harm.`,`Run for ≥ 2 weeks.`]],
rec:{v:`Do not ship; retrain on downstream objectives and re-test`,k:'bad',why:`The ranker produces more clicks but fewer and cheaper purchases: conversion −2.3% and revenue per session −2.7%. A proxy metric improved at the expense of the objective.`},
iv:`<p>"CTR is up 8%, but purchases are down 2% and revenue per session down about 3%. Among sessions that click, conversion fell from 11% to 9.1% and the clicked items are cheaper, so the model learned to generate clicks, not value. I'd treat revenue per session as the decision metric, not ship, and retrain the ranker on purchase or revenue-weighted labels with quality constraints, then re-test.</p>`});

C({id:'8.2',t:'NDCG improves offline; nothing moves online',cat:['ML','Experimentation'],d:'Advanced',kw:'NDCG offline online gap position bias exposure bias counterfactual evaluation IPS logged data',
biz:{s:`A new ranking model improves offline NDCG@10 by 8.5% on logged click data. The A/B test shows no meaningful change in CTR or conversion.`,
o:`Understand the offline-online gap and decide next steps.`,
h:`Offline ranking quality improvements translate to online engagement.`,
c:`Offline labels are clicks logged under the existing ranker. Online test: 3M sessions per arm, 2 weeks.`},
res:[
{h:`Offline evaluation (logged clicks)`,head:['Metric','Old ranker','New ranker','Rel. change'],rows:[['NDCG@10','0.412','0.447',good('+8.5%')],['Recall@50','0.310','0.340','+9.7%'],['Precision@10','0.084','0.088','+4.8%'],['MRR','0.221','0.226','+2.3%'],[warn('Position-debiased (IPS-weighted) NDCG@10'),'0.398','0.402',warn('+1.0%')]]},
{h:`Where the offline gain comes from`,head:['Rank bucket','Share of user attention (examination)','NDCG gain in bucket (rel.)'],rows:[['Ranks 1-3','82%','+0.2%'],['Ranks 4-6','14%','+3.0%'],['Ranks 7-10','4%',warn('+10.0%')]],note:`Attention-weighted gain = 0.82×0.2% + 0.14×3.0% + 0.04×10.0% ≈ +1.0%, consistent with the IPS estimate.`},
{h:`Online A/B test`,head:AB,rows:[abRow('Click-through (sessions with ≥1 click)',3e6,336000,3e6,337000),abRow('Purchase conversion',3e6,75000,3e6,75300)]}],
q:`NDCG +8.5% offline; flat online. What does this say about the offline metric?`,
interp:[
`<p><b>The online result is the arbiter and it is null.</b> CTR moved +0.03 pp (11.20% to 11.23%) and conversion +0.01 pp, both with CIs comfortably including zero. We can rule out large effects but cannot claim any.</p>`,
`<p><b>Why offline overstated.</b> The labels (clicks) were generated under the old ranker, so they reflect <i>what users saw</i> as much as what they liked: items shown in top positions get clicked more (position bias) and items never shown get no clicks (exposure bias). A model that re-orders items within the lower positions can score high on logged data. The gain is concentrated in ranks 7-10 (+10%), where only 4% of attention lands. The top-3 positions, which receive 82% of attention, improve only 0.2%. Weighted by attention, the effective gain is about +1.0%, which matches the position-debiased (IPS) NDCG.</p>`,
`<p><b>Implication.</b> The offline metric weights positions by a fixed discount that does not match actual attention, and the labels are biased by the logging policy. An effective ranking improvement of about 1% should translate into an even smaller change in conversion, well below the conversion MDE of roughly 4.5% relative at 3M sessions per arm (CTR MDE ≈ 0.6% relative), so a flat online result is exactly what we should expect.</p>`],
wrong:[
[`Position bias in labels`,`Clicks depend on position as well as relevance.`,`Gains concentrated where users rarely look.`,`Compute attention-weighted gains; use click models / randomisation data for propensities.`,`Genuine if debiased gain is far smaller than naive gain.`],
[`Exposure/selection bias`,`Items never shown under the old ranker have no labels, so their value is unknown.`,`New model promotes items with sparse data.`,`Evaluate on randomised-exploration traffic or counterfactual estimators (IPS/doubly robust).`,`If offline gain disappears on randomised data, it was bias.`],
[`Metric/objective mismatch`,`NDCG on clicks does not equal conversion or satisfaction.`,`Click metrics up, business metrics unchanged.`,`Align labels to downstream outcomes.`,`If labels are proxies, expect gaps.`],
[`Underpowered online test`,`An effective +1% ranking gain may be undetectable in business metrics.`,`Conversion CI is roughly ±3% relative.`,`Compute MDE per metric; consider CUPED or longer runtime.`,`If MDE ≫ plausible effect, the test could not decide.`]],
todo:[
[`Debias offline evaluation`,`IPS/SNIPS with estimated position propensities; attention-weighted NDCG.`,`Debiased gain (+1.0%).`,`Compare with online effect.`,`Use debiased metrics for model selection.`],
[`Collect unbiased data`,`Small randomised-ranking slice (e.g. 1-2% of traffic) for propensities and unbiased labels.`,`Click propensity by position.`,`Enables counterfactual evaluation.`,`Fund the exploration cost.`],
[`Check test power`,`MDE for CTR and conversion given variance.`,`CTR MDE ≈ 0.6% relative; conversion MDE ≈ 4.5% relative.`,`A +1% ranking gain would not be detectable in conversion.`,`Decide whether larger gains are expected before testing again.`],
[`Calibrate offline-online relationship`,`Track offline metric deltas vs realised online lifts across past launches.`,`Slope of online lift on offline lift.`,`Establishes how much offline gain to require.`,`Set an offline launch bar.`]],
rec:{v:`Do not ship on offline evidence; improve offline evaluation and test again only if debiased gains are meaningful`,k:'warn',why:`The offline gain is largely concentrated in positions users rarely see; debiased, it is only about +1%, consistent with a flat online result. Invest in unbiased evaluation data before running further tests.`},
iv:`<p>"NDCG went up 8.5% but online is flat. The labels are clicks logged under the old ranker, so they're biased by position and by what was shown. The gain is mostly at ranks 7 to 10, where about 4% of attention goes; top three improve by 0.2%. Weighted by attention it's about 1%, which the debiased metric confirms, and that's too small to show up in conversion in a 3-million-session test. I'd put a small randomised slice in production for unbiased evaluation and use debiased metrics for model selection.</p>`});

C({id:'8.3',t:'Personalisation lifts the average and hurts new users and the long tail',cat:['ML','Experimentation'],d:'Expert',kw:'personalization cold start popularity bias diversity coverage feedback loop segments marketplace suppliers',
biz:{s:`A personalised feed ranker increased overall 7-day return rate. A review of segments and catalogue metrics shows it hurts new users and concentrates exposure on popular items.`,
o:`Decide whether to launch and what to change.`,
h:`Personalisation improves engagement for all users and is healthy for the marketplace.`,
c:`500k users per arm: 50% heavy, 30% regular, 20% new (cold-start). Two-sided marketplace: suppliers depend on impressions.`},
res:[
{h:`7-day return rate by segment`,head:AB,rows:[abRow('Heavy users (50%)',250000,155000,250000,162500),abRow('Regular users (30%)',150000,69000,150000,70500),abRow('New / cold-start users (20%)',100000,38000,100000,35500),abRow('Overall',500000,262000,500000,268500)]},
{h:`Catalogue and supplier health`,head:['Metric','Control','Treatment','Change'],rows:[['Catalogue coverage @10 (share of items shown daily)','41%','33%',bad('−8 pp')],['Impression share of top 1% of items','22%','34%',bad('+12 pp')],['Exposure Gini coefficient','0.61','0.72',warn('+0.11')],['Intra-list diversity (avg. pairwise distance)','0.58','0.49',warn('−0.09')],['First-week impressions for new suppliers (index)','100','68',bad('−32%')]]},
{chart:{type:'bar',title:'Relative change in 7-day return rate by segment (%)',x:['Heavy','Regular','New','Overall'],series:[{name:'Relative change (%)',y:[4.84,2.17,-6.58,2.48],color:'var(--c1)'}],hline:0,legend:false,ylab:'%',vfmt:function(v){return (v>0?'+':'')+v.toFixed(1)}}}],
q:`Overall return +2.5%. What would you check before launching, and what would you change?`,
interp:[
`<p><b>The average is real but misleading.</b> Overall 7-day return rises 1.3 pp (52.4% to 53.7%, +2.5%, p&nbsp;&lt;&nbsp;0.0001). Heavy users (+3.0 pp) and regular users (+1.0 pp) gain, but new users fall 2.5 pp (38.0% to 35.5%, &minus;6.6%, CI &minus;2.9 to &minus;2.1 pp), a statistically clear and economically important harm: they represent the future customer base.</p>`,
`<p><b>Why new users suffer.</b> Personalisation depends on history. With little data, the model falls back on popularity or noisy preferences, giving cold-start users generic, less relevant feeds, while the model tunes feeds for heavy users more effectively. This is a cold-start problem.</p>`,
`<p><b>Marketplace effects.</b> Exposure is concentrating: the top 1% of items now get 34% of impressions (from 22%), coverage falls from 41% to 33%, and new suppliers receive 32% fewer first-week impressions. This is popularity bias and a feedback loop (popular items get shown, so they collect more clicks, so they are shown more). Even if user metrics stay positive, supplier churn and reduced catalogue diversity can harm long-run supply and user variety.</p>`,
`<p><b>Decision.</b> A pooled win with a significant harm to the cohort that drives future growth, and a worsening supply side, is not a clean launch.</p>`],
wrong:[
[`Cold-start degradation`,`Personalised models perform poorly for users with little history.`,`New-user return rate falls by 6.6%.`,`Segment by tenure/history length; compare with a non-personalised baseline for the same users.`,`Genuine if the effect is consistent across cohorts and not a one-off.`],
[`Popularity bias and feedback loops`,`Exposure begets engagement; tail items starve.`,`Rising Gini and top-1% exposure share.`,`Track exposure distributions; simulate feedback.`,`If concentration keeps increasing over time, it's a loop.`],
[`Segment mix and Simpson-style masking`,`The overall effect depends on the share of heavy vs new users.`,`Acquisition campaign changes mix.`,`Re-weight to the expected mix (e.g. more new users).`,`If new-user share grows, the overall effect may turn negative.`],
[`Supply-side interference`,`In a two-sided market, user-level randomisation ignores supplier-side effects.`,`Supplier impressions and listings change.`,`Measure supplier outcomes; consider cluster/market-level experiments.`,`If supplier health falls, long-term supply and variety suffer.`]],
todo:[
[`Segment-level readouts with CIs`,`Return, conversion, revenue by tenure, device, region.`,`Segments with negative effects.`,`Test interaction formally.`,`Set per-segment guardrails.`],
[`Fix cold-start`,`Blend popularity/content-based priors for low-history users; exploration (bandit) for new users.`,`New-user return vs control.`,`Target ≥ 0 relative change.`,`Re-test.`],
[`Diversity and exposure constraints`,`Re-rank for diversity; reserve exposure for new items.`,`Coverage and supplier impressions.`,`Return to ≥ 38% coverage.`,`Include exploration budget.`],
[`Long-term tracking`,`Holdback group for 4-8 weeks; supplier retention and catalogue health.`,`Supplier churn, user variety.`,`Confirm no long-run harm.`,`Add to launch criteria.`]],
rec:{v:`Segment the analysis; do not launch globally: ship to established users while fixing cold-start and exposure concentration`,k:'warn',why:`Personalisation wins on average (+2.5%) but significantly harms new users (−6.6%) and concentrates exposure, hurting suppliers. Launch to heavy and regular users with a holdback, and iterate on cold-start and diversity constraints.`},
iv:`<p>"Overall return is up 2.5%, but the segments split: heavy and regular users gain, new users drop 6.6%, which is the cohort that feeds future growth. The catalogue side also gets worse: coverage falls from 41% to 33%, the top 1% of items take 34% of impressions, and new suppliers get a third fewer impressions. That's cold-start plus popularity bias. I'd launch only to established users with a holdback, fix cold-start with exploration and priors, add diversity and exposure constraints, and track supplier health.</p>`});

C({id:'9.1',t:"Simpson's paradox: the tool looks worse overall, better in every tier",cat:['Statistical'],d:'Advanced',kw:"Simpson's paradox confounding selection standardisation handle time support agents tool adoption observational",
biz:{s:`A support organisation introduced an AI-assist tool. Management compares average handle time (AHT) for cases handled with and without the tool and concludes that the tool slows agents down.`,
o:`Evaluate the tool's effect on handle time.`,
h:`Using the tool changes handle time.`,
c:`Observational data: 17,000 cases classified by complexity tier. Agents choose whether to use the tool. Lower AHT is better.`},
res:[
{h:`AHT (minutes) by complexity tier`,head:['Complexity tier','Without tool: n','Without tool: AHT','With tool: n','With tool: AHT','Difference (tool − no tool)','Tool usage share'],rows:[
['Simple','7,000','6.0','1,000','5.4',good('−0.6'),'12.5%'],['Medium','2,500','11.0','2,500','10.2',good('−0.8'),'50.0%'],['Complex','500','22.0','3,500','20.5',good('−1.5'),'87.5%'],
[bad('Overall (unadjusted)'),'10,000',bad('8.05'),'7,000',bad('14.66'),bad('+6.61'),'41.2%'],[good('Standardised to overall case mix (8,000 / 5,000 / 4,000)'),'17,000','11.24','17,000','10.36',good('−0.88 (−7.8%)'),'—']],note:`Overall AHT = case-weighted average. Standardised AHT reweights each arm to the pooled tier mix of 8,000 simple, 5,000 medium and 4,000 complex cases.`}],
q:`The tool group has 6.6 minutes longer handle time overall. Within every tier it is shorter. How is that possible, and what do you report?`,
interp:[
`<p><b>This is Simpson's paradox.</b> Overall, tool cases take 14.66 minutes against 8.05 for non-tool cases, yet within each tier the tool is faster by 0.6, 0.8 and 1.5 minutes. The reversal occurs because tool usage is strongly associated with case complexity: 87.5% of complex cases use the tool but only 12.5% of simple cases do. The tool group is mostly complex cases, which take longer regardless.</p>`,
`<p><b>The right comparison is within-tier or standardised.</b> Standardising to a common case mix gives 11.24 minutes without the tool and 10.36 with it, 0.88 minutes (7.8%) faster. The tier is a confounder: it affects both whether the tool is used and AHT.</p>`,
`<p><b>But it is still observational.</b> Agents <i>choose</i> to use the tool. Within a tier, better or more motivated agents may use it more (or less). The adjusted estimate removes confounding by tier only. Causal claims need handling of agent skill and case selection within tiers, e.g. agent fixed effects, or a randomised rollout.</p>`],
wrong:[
[`Confounding by case mix`,`Complexity drives both usage and handle time.`,`Reversal of direction between aggregate and strata.`,`Compare within strata; standardise to a common mix.`,`Genuine when stratum effects share a sign opposite to the aggregate.`],
[`Selection into tool use within tiers`,`Agents (or case routing) decide who uses the tool.`,`Usage share varies by agent.`,`Agent fixed-effects regression; compare same agent with and without tool.`,`If the effect holds within agent, selection by agent is less of a concern.`],
[`Measurement`,`Tool-assisted cases may be logged differently (e.g., time includes tool processing).`,`Different timing definitions.`,`Check how AHT is computed for both groups.`,`Align definitions.`],
[`Complexity classification itself influenced by tool`,`If tier is assigned after handling, it could be affected by the tool.`,`Tier distribution shifts post-adoption.`,`Verify tier is assigned at intake.`,`Use pre-handling tier only.`]],
todo:[
[`Stratify / standardise`,`Compute within-tier and direct-standardised AHT with CIs.`,`Consistent negative differences.`,`All tiers agree → robust to mix.`,`Report standardised result (−0.88 min).`],
[`Adjust for agent and other covariates`,`Regression with agent fixed effects, channel, language, time.`,`Estimate vs standardised.`,`Stable estimate suggests low agent-selection bias.`,`Use as primary estimate.`],
[`Check quality, not just speed`,`Reopen rate, CSAT, escalations by arm within tiers.`,`Quality guardrails.`,`Faster but worse quality is not a win.`,`Add to the readout.`],
[`Randomise rollout`,`Staggered or randomised agent/case access to the tool.`,`Causal effect.`,`Confirms observational result.`,`Plan a stepped-wedge rollout.`]],
rec:{v:`Do not conclude the tool slows agents; report the standardised result (about −0.9 min) and validate with a randomised rollout`,k:'warn',why:`The aggregate is misleading because tool use concentrates on complex cases. Within every tier, and after standardising, the tool is faster, though selection by agents remains a caveat.`},
iv:`<p>"Overall, tool cases take 14.7 minutes versus 8.1, but that's Simpson's paradox. Agents use the tool mostly on complex cases, 87% of them against 12% of simple ones. Within each tier the tool is 0.6 to 1.5 minutes faster, and standardised to a common case mix it's about 0.9 minutes, or 8%, faster. It's still observational, so I'd check agent fixed effects, look at quality guardrails like reopen rate, and do a staggered rollout to confirm causality.</p>`});

(function(){
var names=['Germany','Italy','Mobile web','Android','France','Spain','UK','US','Canada','Brazil','Mexico','India','Japan','Australia','iOS','Desktop','New users','Returning','Power users','Casual users'];
var ps=[.004,.018,.031,.044,.062,.11,.15,.21,.27,.33,.38,.45,.52,.58,.64,.71,.79,.86,.93,.97];
var lifts=['+3.4%','+2.9%','+2.4%','−2.2%','+1.9%','+1.4%','+1.1%','+0.8%','+0.7%','−0.5%','+0.4%','−0.3%','+0.2%','−0.2%','+0.1%','0.0%','−0.1%','+0.05%','0.0%','0.0%'];
var q=S.bh(ps);
var rows=ps.map(function(p,i){
  var raw=p<0.05;
  return [names[i],lifts[i],S.f(p,3),raw?warn('yes'):'no',S.f(Math.min(1,p*20),3),S.f(q[i],3),(q[i]<0.05)?good('yes'):'no'];

C({id:'9.2',t:'Twenty segments, one "win": multiple testing',cat:['Statistical','Experimentation'],d:'Intermediate',kw:'multiple hypothesis testing Bonferroni Benjamini-Hochberg false discovery rate subgroup fishing',
biz:{s:`An A/B test on a new checkout page shows no overall effect. The analyst then sliced results by 20 segments and found that Germany shows a significant lift (p = 0.004). The product lead wants to launch in Germany.`,
o:`Decide whether the German "win" is credible.`,
h:`The new checkout page increases conversion in Germany.`,
c:`Overall result: +0.4% relative lift, p = 0.23. The 20 segments were not pre-registered; they were chosen after seeing flat overall results. Each segment test uses α = 0.05.`},
res:[
{h:`Segment-level results (sorted by raw p-value)`,head:['Segment','Rel. lift','Raw p','Raw p &lt; 0.05','Bonferroni p (×20)','BH q-value','Significant after BH (q &lt; 0.05)'],rows:rows,note:`Bonferroni p = min(1, 20 × p). BH q-values by the Benjamini-Hochberg step-up procedure. Probability of at least one raw p &lt; 0.05 among 20 independent true-null tests: 1 − 0.95²⁰ = 64.2%. Expected number of false positives at α = 0.05: 1.0.`},
{h:`Summary`,head:['Quantity','Value'],rows:[['Segments with raw p < 0.05','4 of 20'],['Expected by chance if no effects anywhere (20 × 0.05)','1.0'],['Segments significant after Bonferroni (p < 0.0025)',bad('0')],['Segments significant after BH (FDR 5%)',bad('0')],['Smallest BH q-value (Germany)','0.080']]}],
q:`Germany has p = 0.004. Is that a discovery?`,
interp:[
`<p><b>The p-value doesn't account for the search.</b> With 20 independent looks, the chance of at least one raw p&nbsp;&lt;&nbsp;0.05 under no effect anywhere is 64%, and the expected number of false positives is 1. We saw 4 raw "hits" (Germany, Italy, Mobile web, Android), which is a little more than the 1 expected by chance, but not a pattern: one of them (Android) is negative.</p>`,
`<p><b>After correction nothing survives.</b> Bonferroni would require p&nbsp;&lt;&nbsp;0.0025 per segment; Germany's 0.004 fails, with an adjusted p of 0.080. The BH procedure at 5% false discovery rate also yields no discoveries (smallest q&nbsp;=&nbsp;0.080). The overall result is a null (+0.4%, p&nbsp;=&nbsp;0.23).</p>`,
`<p><b>Not "Germany doesn't respond".</b> The test could not distinguish a German effect from noise given the search. It remains a hypothesis worth a pre-registered test.</p>`,
`<p><b>Also consider the context.</b> A segment chosen because it looks good after the fact is subject to selection; its estimated lift (+3.4%) is likely inflated (winner's curse) even if the effect is real.</p>`],
wrong:[
[`Forking paths / post-hoc subgroups`,`Slicing after seeing the result inflates false positives.`,`Many segments, flat overall, a few hits.`,`Count every slice examined; apply FWER/FDR control.`,`Genuine when hits do not survive correction.`],
[`Winner's curse`,`The largest observed effect among many is biased upward.`,`Estimated +3.4% for the top segment.`,`Replicate in a new sample; shrinkage estimators.`,`Expect regression toward zero.`],
[`Segment-level power`,`Small segments have low power; "no effect" in them is uninformative too.`,`Wide CIs.`,`Compute MDE per segment.`,`Don't conclude absence of effect either.`],
[`Correlated tests`,`Segments overlap (country × device); Bonferroni is conservative.`,`Overlapping segment definitions.`,`Use permutation-based or hierarchical Bayesian shrinkage.`,`Conclusions rarely change with correlation at this magnitude.`]],
todo:[
[`Count and correct`,`Document all slices; apply Bonferroni (FWER) for confirmatory claims, BH for exploratory lists.`,`Adjusted p/q values.`,`No adjusted significant results.`,`Report as exploratory.`],
[`Pre-register a confirmatory test`,`Germany-only, pre-specified metric, adequate power, fixed duration.`,`Replication.`,`Replication supports launch; failure indicates chance.`,`Run a confirmation test.`],
[`Test for heterogeneity properly`,`Treatment × segment interaction (global test) before looking at segments.`,`Global interaction p.`,`If not significant, subgroup differences are likely noise.`,`Use hierarchical models for shrinkage.`],
[`Set process guardrails`,`Pre-specify the segments of interest.`,`Analysis plan.`,`Limit analyst degrees of freedom.`,`Template update.`]],
rec:{v:`Do not launch in Germany on this evidence; run a pre-registered confirmation test`,k:'warn',why:`Among 20 post-hoc segments, one raw p of 0.004 is unremarkable: no segment survives multiple-testing correction (Bonferroni or BH), and the overall effect is null. Germany is a hypothesis to test, not a discovery.`},
iv:`<p>"With 20 slices, a raw p of 0.004 isn't impressive: there's a 64% chance of at least one p under 0.05 even if nothing is happening. Corrected, Germany's adjusted p is 0.08, and no segment survives Bonferroni or Benjamini-Hochberg. The overall result is flat. So Germany is a hypothesis; I'd pre-register it and run a confirmatory test, and expect that the +3.4% will shrink.</p>`});
})();

C({id:'9.3',t:'Resolution rate jumps from 71% to 84%: metric redefinition and missing data',cat:['Statistical'],d:'Advanced',kw:'metric definition error survivorship bias non-response CSAT missing data support resolution rate denominator auto-close',
biz:{s:`A support dashboard shows resolution rate jumping from 71% to 84% and CSAT rising from 4.40 to 4.60 in the same quarter, and leadership attributes it to a new AI triage launched in Q4. A data scientist notices the metric definitions and survey flow changed during the quarter.`,
o:`Determine whether support quality actually improved.`,
h:`The AI triage improved resolution and customer satisfaction.`,
c:`Q3 vs Q4 comparison. In Q4, the dashboard was rebuilt: a case now counts as "resolved" when its status is "closed", including auto-closure after 7 days without customer reply. The CSAT survey moved from post-case email to an in-app prompt shown at the end of completed chats.`},
res:[
{h:`Dashboard vs consistent definitions`,head:['Metric','Q3','Q4 as shown on dashboard','Q4 on Q3 definition'],rows:[
['Contacts','1,200,000','1,210,000','1,210,000'],['Resolution rate',bad('71.0%'),bad('84.0%'),good('70.6%')],['Repeat contact within 7 days','11.2%','12.9%',warn('12.9%')],['Contacts abandoned before reaching an agent/bot answer','6%','14%',bad('14%')],['CSAT mean (1-5)','4.40',bad('4.60'),'—'],['CSAT response rate','18%',bad('9%'),'—']],note:`Q3 definition of resolved: agent-confirmed resolution with no re-contact on the same issue within 7 days. The new definition counts any closed case.`},
{h:`What is inside the extra "resolved" cases (Q4)`,head:['Closure type','Share of contacts','Re-contact within 7 days'],rows:[['Agent-resolved, confirmed','70.6%','9%'],[bad('Auto-closed after 7 days with no reply'),bad('13.4%'),bad('38%')],['Other open/pending','16.0%','—']],note:`70.6% + 13.4% = 84.0% (dashboard "resolution"). Auto-closed cases are re-contacted at 38%, four times the 9% of agent-resolved ones.`}],
q:`Resolution +13 pp and CSAT +0.2 in one quarter. Which parts are real?`,
interp:[
`<p><b>Resolution: definition change, not improvement.</b> On the Q3 definition, Q4 resolution is 70.6%, effectively flat (&minus;0.4 pp). The entire +13 pp comes from counting auto-closed cases (13.4% of contacts) as resolved, and those cases have a 38% re-contact rate, four times that of genuinely resolved cases. Repeat contact within 7 days actually rose from 11.2% to 12.9%, a sign of slightly worse resolution quality, not better.</p>`,
`<p><b>CSAT: non-random missingness (survivorship).</b> The response rate halved from 18% to 9% when the survey moved to an in-app prompt that only appears at the end of <i>completed</i> chats. Abandonment before an answer rose from 6% to 14%, and those dissatisfied customers can never reach the survey. The average rating is computed over a smaller, happier subset: customers who finished the chat. A rise in the mean is what you would expect even with no change in true satisfaction.</p>`,
`<p><b>What can be said.</b> Nothing in this table supports an improvement from the AI triage. If anything, rising abandonment (14% vs 6%) and repeat contacts (12.9% vs 11.2%) hint at some deterioration, though they may also reflect the changed measurement and need investigation.</p>`],
wrong:[
[`Metric definition change`,`Changing numerator/denominator rules makes periods non-comparable.`,`Jump coincides with dashboard rebuild; the old-definition series is flat.`,`Recompute both periods on one definition; check release notes and metric versions.`,`Genuine if the old-definition series shows no change.`],
[`Survivorship / non-response bias`,`Surveys only reach users who finish the flow; changes in who is surveyed change the mean.`,`Response rate halves; abandonment up.`,`Compare respondent characteristics across periods; analyse CSAT vs response propensity; use weighting or bounds.`,`If respondent mix changed, trend in the mean is not interpretable.`],
[`Denominator shifts`,`Resolution rate among "completed" vs all contacts differ.`,`Abandoned contacts excluded from denominators?`,`Check each metric's denominator: contacts, conversations, cases.`,`Use contacts (the full exposure) for outcome rates.`],
[`Confounding with a concurrent launch`,`Q4 seasonal mix and the AI triage launch overlap.`,`Seasonal mix change (cancellations, refunds).`,`Compare by contact reason; difference-in-differences if staged rollout exists.`,`Attribution requires a control group.`]],
todo:[
[`Reconcile definitions`,`Restate both quarters on the same definition; keep a metric changelog.`,`Resolution flat at ~71%.`,`Use agent-confirmed + no repeat as the primary resolution metric.`,`Fix the dashboard and annotate the break.`],
[`Replace the numerator with a quality-aware outcome`,`Track "resolved without re-contact within 7 days" and cost per resolved case.`,`Rates by closure type.`,`Auto-closure is not resolution.`,`Report auto-closed separately.`],
[`Handle CSAT missingness`,`Bounds analysis, inverse-propensity weighting by customer/case features, or survey all abandoned flows via a different channel; track response rate as a guardrail.`,`Weighted CSAT vs raw.`,`If weighting removes the rise, it was selection.`,`Report weighted CSAT with response-rate context.`],
[`Evaluate the AI triage causally`,`Staggered rollout or holdout by queue; DiD on consistent metrics.`,`Effect on contact rate, repeat contact, cost, CSAT.`,`Only a controlled comparison can attribute change.`,`Set up a rollout experiment.`]],
rec:{v:`Investigate data quality (metric definitions and survey flow); do not credit the AI triage`,k:'bad',why:`The +13 pp resolution gain is the result of redefining "resolved" to include auto-closed cases; on a consistent definition the rate is flat and repeat contact is up. The CSAT rise is compatible with selection, as response rates halved and abandonment rose. No improvement can be attributed to the triage yet.`},
iv:`<p>"Before celebrating I'd check definitions. On the old definition, Q4 resolution is 70.6%, flat. The 13 points come from counting auto-closed cases as resolved, and those get re-contacted 38% of the time. Repeat contacts went up. The CSAT rise is also suspect: response rate halved because the survey only reaches completed chats while abandonment rose from 6 to 14%, so we're averaging a happier subset. I'd restate both quarters on one definition, report CSAT with response-rate weighting, and measure the AI triage with a holdout.</p>`});
