<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Round 1 Technical Case Workbook</title>
<style>
:root{--bg:#f7f6f3;--panel:#fff;--panel2:#f1efea;--text:#1d1d1f;--muted:#5f5d58;--line:#e2dfd8;--accent:#c4364b;--accent2:#1f6f78;--accentSoft:#fbe9ec;--ok:#2e7d4f;--okSoft:#e6f3ea;--warn:#a86400;--warnSoft:#fdf1dc;--bad:#b3261e;--badSoft:#fbe7e6;--code:#1e1f24;--codeText:#e8e6e3;--kw:#ff8fa3;--fn:#7cd3d9;--str:#b5e08a;--num:#f6c177;--com:#8a8f98;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
:root[data-theme=dark]{--bg:#141518;--panel:#1c1d21;--panel2:#24262b;--text:#ecebe8;--muted:#a6a39c;--line:#33353b;--accent:#ff6b81;--accent2:#5cc3cc;--accentSoft:#3a1f25;--ok:#6fcf97;--okSoft:#1d3326;--warn:#f2b45a;--warnSoft:#3a2d17;--bad:#ff8a80;--badSoft:#3b1e1c;--code:#0f1013}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;font-size:15.5px}
a{color:var(--accent2)}
#app{display:flex;min-height:100vh}
#side{width:270px;flex:0 0 270px;background:var(--panel);border-right:1px solid var(--line);height:100vh;position:sticky;top:0;overflow-y:auto;padding:14px 10px 40px}
#side .brand{font-weight:700;padding:6px 10px 0}#side .brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
#side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 10px 4px}
#side a{display:flex;gap:8px;align-items:center;padding:6px 10px;border-radius:7px;color:var(--text);text-decoration:none;font-size:14px}
#side a:hover{background:var(--panel2)}#side a.on{background:var(--accentSoft);color:var(--accent);font-weight:600}
#side a .d{width:8px;height:8px;border-radius:50%;background:var(--line);flex:0 0 8px}#side a .d.p{background:var(--warn)}#side a .d.f{background:var(--ok)}
main{flex:1;min-width:0}
#top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;padding:10px 22px}
#menu{display:none}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;font-family:inherit}.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
#page{max-width:980px;margin:0 auto;padding:26px 22px 120px}
h1{font-size:28px;line-height:1.2;margin:0 0 6px}h2{font-size:21px;margin:30px 0 10px}h3{font-size:16.5px;margin:20px 0 6px}
.lead{color:var(--muted);margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--panel2);color:var(--muted);margin-right:4px;white-space:nowrap}
.tag.sql{background:#e3eefb;color:#1a4f94}.tag.py{background:#e8f4e5;color:#2c6b25}.tag.stat{background:#fdf1dc;color:#8a5200}.tag.ml{background:#f1e6fb;color:#6a2b9c}.tag.biz{background:#fbe9ec;color:#a02a3e}
:root[data-theme=dark] .tag.sql{background:#1b2b40;color:#8ab8f0}:root[data-theme=dark] .tag.py{background:#1f3320;color:#8fd48a}:root[data-theme=dark] .tag.stat{background:#3a2d17;color:#f2b45a}:root[data-theme=dark] .tag.ml{background:#2d1f3a;color:#c9a0ee}:root[data-theme=dark] .tag.biz{background:#3a1f25;color:#ff9aab}
table{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}th{background:var(--panel2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
pre.code{background:var(--code);color:var(--codeText);border-radius:8px;padding:12px 14px;overflow-x:auto;font:13px/1.5 var(--mono);margin:10px 0;white-space:pre}
pre.out{background:var(--panel2);color:var(--text);border:1px dashed var(--line)}
pre.code .k{color:var(--kw)}pre.code .s{color:var(--str)}pre.code .c{color:var(--com)}pre.code .n{color:var(--num)}
pre.out .k,pre.out .s,pre.out .c,pre.out .n{color:inherit}
.cap{font-size:12px;color:var(--muted);margin:10px 0 -6px;text-transform:uppercase;letter-spacing:.06em}
code{font-family:var(--mono);font-size:.9em;background:var(--panel2);padding:1px 5px;border-radius:4px}
.callout{border-left:4px solid var(--accent2);background:var(--panel2);padding:10px 14px;border-radius:0 8px 8px 0;margin:12px 0}
.callout.warn{border-color:var(--warn);background:var(--warnSoft)}.callout.bad{border-color:var(--bad);background:var(--badSoft)}.callout.ok{border-color:var(--ok);background:var(--okSoft)}
.callout b.t{display:block;margin-bottom:2px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:18px 0;overflow:hidden}
.qh{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.qh b{color:var(--text)}
.qb{padding:14px 18px}
.qb .qt{font-size:16px;font-weight:600;margin:0 0 8px}
.qa{display:none;border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}
.q.open .qa{display:block}
.aloud{background:var(--okSoft);border-left:4px solid var(--ok);padding:10px 14px;border-radius:0 8px 8px 0;margin:6px 0 12px}
.aloud b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ok);margin-bottom:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sc button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;margin-right:4px}
.sc button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.hint{display:none;margin-top:8px}.hint.show{display:block}
ul,ol{padding-left:22px;margin:6px 0}li{margin:3px 0}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
#timer{position:fixed;right:16px;bottom:16px;background:var(--panel);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.12);border-radius:12px;padding:8px 12px;display:flex;gap:8px;align-items:center;z-index:9;font-size:13px}
#timer .tm{font:600 20px var(--mono);min-width:64px}#timer .ph{color:var(--muted);max-width:150px;font-size:12px}
.day{border-left:3px solid var(--accent);padding-left:14px;margin:18px 0}
label.chk{display:flex;gap:8px;align-items:flex-start;margin:4px 0;cursor:pointer}
@media(max-width:860px){#side{position:fixed;left:-290px;z-index:20;transition:left .2s;width:270px}#side.open{left:0;box-shadow:0 0 30px rgba(0,0,0,.3)}#menu{display:inline-block}.two{grid-template-columns:1fr}#page{padding:18px 14px 120px}#timer .ph{display:none}#timer{right:8px;bottom:8px;padding:5px 8px}#timer .tm{font-size:16px;min-width:52px}#timer .btn{padding:4px 8px}}
@media print{#side,#top,#timer{display:none}.q .qa{display:block!important}.q{break-inside:avoid}#page{max-width:none}body{background:#fff}}
</style>
</head>
<body>
<div id="app"><nav id="side"></nav><main><div id="top"><button class="btn" id="menu">☰</button><span id="crumb" style="font-weight:600"></span><span style="flex:1"></span><button class="btn" id="theme">Theme</button><button class="btn" id="print">Print</button></div><div id="page"></div></main></div>
<div id="timer"><span class="tm" id="tm">60:00</span><span class="ph" id="ph">Round timer</span><button class="btn" id="tgo">Start</button><button class="btn" id="trs">Reset</button></div>
<script>
/* ---------- helpers used by content ---------- */
var CASES=[],WB=[],REF=[],PLAN=[],MOCK=null,HOME='';
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
var SQLK='SELECT|FROM|WHERE|GROUP BY|ORDER BY|PARTITION BY|OVER|WITH|AS|JOIN|LEFT JOIN|INNER JOIN|ON|USING|CASE|WHEN|THEN|ELSE|END|AND|OR|NOT|NULL|IS|IN|BETWEEN|DISTINCT|COUNT|SUM|AVG|MIN|MAX|LEAD|LAG|ROW_NUMBER|ROWS|PRECEDING|FOLLOWING|CURRENT ROW|INTERVAL|DAY|HOUR|MINUTE|HAVING|LIMIT|DESC|ASC|UNION ALL|CROSS JOIN|COALESCE|CAST|DATE_TRUNC|ROUND|TIMESTAMP|STDDEV_SAMP|WINDOW|EXISTS|LIKE|APPROX_PERCENTILE|DATE_DIFF|FILTER|NULLIF|ABS';
var PYK='import|from|as|def|return|for|in|if|else|elif|while|lambda|None|True|False|and|or|not|with|class|print';
function hl(code,lang){var e=esc(code);var kw=lang==='sql'?SQLK:PYK;var flags=lang==='sql'?'gim':'gm';
 var re=new RegExp("(--.*$|#.*$)|('[^'\\n]*'|\"[^\"\\n]*\")|\\b("+kw+")\\b|\\b(\\d+\\.?\\d*)\\b",flags);
 if(lang==='sql')re=new RegExp("(--.*$)|('[^'\\n]*')|\\b("+kw+")\\b|\\b(\\d+\\.?\\d*)\\b",flags);
 return e.replace(re,function(m,c,s,k,n){if(c)return '<span class="c">'+c+'</span>';if(s)return '<span class="s">'+s+'</span>';if(k)return '<span class="k">'+k+'</span>';return '<span class="n">'+n+'</span>'});}
function sql(c){return '<pre class="code">'+hl(c.replace(/^\n/,'').replace(/\s+$/,''),'sql')+'</pre>'}
function py(c){return '<pre class="code">'+hl(c.replace(/^\n/,'').replace(/\s+$/,''),'py')+'</pre>'}
function out(c){return '<div class="cap">Output (real run on the synthetic data shown)</div><pre class="code out">'+esc(c.replace(/^\n/,'').replace(/\s+$/,''))+'</pre>'}
function tbl(h,rows,num){num=num||[];var s='<div class="tw"><table><tr>'+h.map(function(x,i){return '<th'+(num.indexOf(i)>=0?' class="n"':'')+'>'+x+'</th>'}).join('')+'</tr>';
 rows.forEach(function(r){s+='<tr>'+r.map(function(x,i){return '<td'+(num.indexOf(i)>=0?' class="n"':'')+'>'+x+'</td>'}).join('')+'</tr>'});return s+'</table></div>'}
function box(t,b,k){return '<div class="callout '+(k||'')+'"><b class="t">'+t+'</b>'+b+'</div>'}
function ul(a){return '<ul>'+a.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>'}
function ol(a){return '<ol>'+a.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ol>'}
/* ---------- state ---------- */
var S={scores:{},seen:{},plan:{},theme:'light'},mem=S;
try{var raw=localStorage.getItem('r1wb2');if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem('r1wb2',JSON.stringify(S))}catch(e){}}
var root=document.documentElement;
function setTheme(t){S.theme=t;root.setAttribute('data-theme',t);save()}
setTheme(S.theme||'light');
/* ---------- question renderer ---------- */
var TYPES={sql:'SQL',py:'Python',stat:'Stats',ml:'ML',biz:'Case',exp:'Experiment',cau:'Causal'};
function renderQ(q,label){
 var tags='<span class="tag '+(q.t==='exp'||q.t==='cau'?'stat':q.t)+'">'+(TYPES[q.t]||q.t)+'</span>';
 var h='<div class="q" id="'+q.id+'"><div class="qh"><b>'+label+'</b>'+tags+'<span>⏱ '+(q.time||'5 min')+'</span><span>'+(q.diff||'')+'</span><span style="flex:1"></span><span id="st-'+q.id+'"></span></div><div class="qb"><p class="qt">'+q.q+'</p>';
 if(q.data)h+=q.data;
 if(q.hint)h+='<button class="btn" data-hint="'+q.id+'">Hint</button><div class="hint" id="hint-'+q.id+'">'+box('Hint',q.hint,'warn')+'</div> ';
 h+='<button class="btn pri" data-reveal="'+q.id+'">Show model answer</button>';
 h+='<div class="qa">';
 if(q.aloud)h+='<div class="aloud"><b>Say it aloud (30–45 s)</b>'+q.aloud+'</div>';
 h+=q.a;
 if(q.mist&&q.mist.length)h+='<h3>Common mistakes</h3>'+ul(q.mist);
 if(q.follow&&q.follow.length)h+='<h3>Likely follow-ups</h3>'+ul(q.follow);
 h+='<h3>How did your own attempt compare?</h3><div class="sc" data-sc="'+q.id+'">'+[1,2,3,4,5].map(function(n){return '<button data-s="'+n+'">'+n+'</button>'}).join('')+' <span style="color:var(--muted);font-size:13px">1 = missed it, 5 = matched or beat it</span></div>';
 return h+'</div></div></div>'}
function paintScores(){document.querySelectorAll('[data-sc]').forEach(function(el){var id=el.getAttribute('data-sc');el.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',S.scores[id]==b.getAttribute('data-s'))})});
 document.querySelectorAll('.q').forEach(function(q){var s=document.getElementById('st-'+q.id);if(!s)return;s.textContent=S.scores[q.id]?('Your score: '+S.scores[q.id]+'/5'):(S.seen[q.id]?'Viewed':'')})}
/* ---------- pages ---------- */
function allQ(){var a=[];CASES.forEach(function(c){c.qs.forEach(function(q,i){a.push({q:q,c:c,l:c.n+'.'+(i+1)})})});WB.forEach(function(q,i){a.push({q:q,c:{id:'wb',title:'Whiteboard'},l:'W'+(i+1)})});MOCK.qs.forEach(function(q,i){a.push({q:q,c:{id:'mock',title:'Mock'},l:'M'+(i+1)})});return a}
function caseStatus(c){var n=c.qs.length,d=c.qs.filter(function(q){return S.scores[q.id]}).length;return d===0?'':(d===n?'f':'p')}
function nav(){var cur=(location.hash||'#home').slice(1);var h='<div class="brand">Round 1 Technical<small>Airbnb · Lead, Advanced Analytics · Community Support</small></div>';
 function a(id,t,st){return '<a href="#'+id+'" class="'+(cur===id?'on':'')+'"><span class="d '+(st||'')+'"></span>'+t+'</a>'}
 h+='<div class="grp">Start</div>'+a('home','Briefing & framework')+a('plan','3-day plan (Nov 4–6)')+a('progress','Progress & weak spots');
 h+='<div class="grp">Case studies</div>';CASES.forEach(function(c){h+=a('case-'+c.n,c.n+'. '+c.short,caseStatus(c))});
 h+='<div class="grp">Drills & reference</div>'+a('wb','Whiteboard stats (12)')+a('ref','Reference sheets')+a('mock','Timed 60-min mock');
 document.getElementById('side').innerHTML=h}
function route(){var id=(location.hash||'#home').slice(1);var p=document.getElementById('page'),cr=document.getElementById('crumb'),h='';
 if(id==='home'){h=HOME;cr.textContent='Briefing'}
 else if(id.indexOf('case-')===0){var c=CASES.filter(function(x){return 'case-'+x.n===id})[0];if(!c){location.hash='#home';return}
  cr.textContent='Case '+c.n;h='<h1>Case '+c.n+': '+c.title+'</h1><p class="lead">'+c.tags.map(function(t){return '<span class="tag">'+t+'</span>'}).join('')+' · about '+c.time+'</p><div class="card">'+c.scenario+'</div>';
  c.qs.forEach(function(q,i){h+=renderQ(q,'Q'+c.n+'.'+(i+1))});
  var ix=CASES.indexOf(c);h+='<p style="display:flex;justify-content:space-between;margin-top:24px">'+(ix>0?'<a href="#case-'+CASES[ix-1].n+'">← Case '+CASES[ix-1].n+'</a>':'<span></span>')+(ix<CASES.length-1?'<a href="#case-'+CASES[ix+1].n+'">Case '+CASES[ix+1].n+' →</a>':'<a href="#wb">Whiteboard drills →</a>')+'</p>'}
 else if(id==='wb'){cr.textContent='Whiteboard';h='<h1>Whiteboard stats and probability</h1><p class="lead">Twelve short problems. Work each on paper first; every number below was checked by computation.</p>';WB.forEach(function(q,i){h+=renderQ(q,'W'+(i+1))})}
 else if(id==='mock'){cr.textContent='Timed mock';h='<h1>'+MOCK.title+'</h1><p class="lead">Start the timer (bottom right) and treat this as the real 60 minutes. Do not open answers until the stage is done.</p><div class="card">'+MOCK.scenario+'</div>';MOCK.qs.forEach(function(q,i){h+=renderQ(q,'Stage '+(i+1)+' · '+q.stage)});h+=MOCK.after}
 else if(id==='ref'){cr.textContent='Reference';h='<h1>Reference sheets</h1><p class="lead">Use these for revision on Nov 5–6. Do not learn anything new from them on the day.</p>';REF.forEach(function(r){h+='<h2>'+r.title+'</h2><div class="card">'+r.html+'</div>'})}
 else if(id==='plan'){cr.textContent='Plan';h='<h1>3-day plan: Nov 4 to Nov 6</h1><p class="lead">Round 1 is the 60-minute technical case. Each day ends with a gate: pass it without notes.</p>';
  PLAN.forEach(function(d,di){h+='<div class="day"><h2 style="margin-top:0">'+d.day+' · '+d.focus+' <span class="tag">'+d.hours+'</span></h2>';d.blocks.forEach(function(b,bi){var k='p'+di+'_'+bi;h+='<label class="chk"><input type="checkbox" data-plan="'+k+'" '+(S.plan[k]?'checked':'')+'><span>'+b+'</span></label>'});h+=box('Readiness gate',d.gate,'ok')+'</div>'})}
 else if(id==='progress'){cr.textContent='Progress';var A=allQ(),done=A.filter(function(x){return S.scores[x.q.id]}),avg=done.length?(done.reduce(function(s,x){return s+S.scores[x.q.id]},0)/done.length).toFixed(1):'–';
  h='<h1>Progress and weak spots</h1><div class="grid"><div class="card"><b style="font-size:26px">'+done.length+'/'+A.length+'</b><br>questions self-scored<div class="bar"><i style="width:'+(100*done.length/A.length)+'%"></i></div></div><div class="card"><b style="font-size:26px">'+avg+'</b><br>average self-score (of 5)</div><div class="card"><b style="font-size:26px">'+A.filter(function(x){return S.scores[x.q.id]&&S.scores[x.q.id]<=3}).length+'</b><br>to revisit (score 3 or below)</div></div><h2>Revisit list</h2>';
  var weak=A.filter(function(x){return S.scores[x.q.id]&&S.scores[x.q.id]<=3}).sort(function(a,b){return S.scores[a.q.id]-S.scores[b.q.id]});
  h+=weak.length?ul(weak.map(function(x){var href=x.c.id==='wb'?'#wb':(x.c.id==='mock'?'#mock':'#case-'+x.c.n);return '<a href="'+href+'" data-jump="'+x.q.id+'">'+x.l+'</a> · '+x.q.q.replace(/<[^>]+>/g,'').slice(0,110)+' <b>('+S.scores[x.q.id]+'/5)</b>'})):'<p>Nothing flagged yet. Score a question after revealing its answer and it appears here if you rate it 3 or below.</p>';
  h+='<h2>By case</h2>'+tbl(['Case','Scored','Avg'],CASES.map(function(c){var d=c.qs.filter(function(q){return S.scores[q.id]});return ['<a href="#case-'+c.n+'">'+c.n+'. '+c.short+'</a>',d.length+'/'+c.qs.length,d.length?(d.reduce(function(s,q){return s+S.scores[q.id]},0)/d.length).toFixed(1):'–']}),[1,2]);
  h+='<p><button class="btn" id="reset">Reset all progress</button></p>'}
 p.innerHTML=h;nav();paintScores();window.scrollTo(0,0);document.getElementById('side').classList.remove('open')}
document.addEventListener('click',function(e){var t=e.target;
 var r=t.closest&&t.closest('[data-reveal]');if(r){var q=document.getElementById(r.getAttribute('data-reveal'));q.classList.toggle('open');r.textContent=q.classList.contains('open')?'Hide model answer':'Show model answer';if(q.classList.contains('open')){S.seen[q.id]=1;save();paintScores()}return}
 var hb=t.closest&&t.closest('[data-hint]');if(hb){document.getElementById('hint-'+hb.getAttribute('data-hint')).classList.toggle('show');return}
 var sc=t.closest&&t.closest('[data-sc] button');if(sc){var id=sc.parentNode.getAttribute('data-sc');S.scores[id]=+sc.getAttribute('data-s');save();paintScores();nav();return}
 if(t.id==='reset'){if(confirm('Reset all progress?')){S.scores={};S.seen={};S.plan={};save();route()}return}
 if(t.id==='menu'){document.getElementById('side').classList.toggle('open');return}
 if(t.id==='theme'){setTheme(S.theme==='dark'?'light':'dark');return}
 if(t.id==='print'){window.print();return}
 if(t.getAttribute&&t.getAttribute('data-plan')){S.plan[t.getAttribute('data-plan')]=t.checked?1:0;save()}
 var j=t.closest&&t.closest('[data-jump]');if(j){var qid=j.getAttribute('data-jump');setTimeout(function(){var el=document.getElementById(qid);if(el)el.scrollIntoView()},60)}});
window.addEventListener('hashchange',route);
/* timer */
var T={left:3600,run:false,iv:null};
function fmt(s){var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x}
function phase(){var el=3600-T.left;return el<300?'Clarify (to 5:00)':el<2400?'Analysis (to 40:00)':el<3000?'Recommend (to 50:00)':'Q&A / wrap-up'}
function tick(){document.getElementById('tm').textContent=fmt(T.left);document.getElementById('ph').textContent=T.run||T.left<3600?phase():'Round timer'}
document.getElementById('tgo').onclick=function(){if(T.run){clearInterval(T.iv);T.run=false;this.textContent='Resume'}else{T.run=true;this.textContent='Pause';T.iv=setInterval(function(){if(T.left>0){T.left--;tick()}else{clearInterval(T.iv)}},1000)}tick()};
document.getElementById('trs').onclick=function(){clearInterval(T.iv);T.run=false;T.left=3600;document.getElementById('tgo').textContent='Start';tick()};

CASES.push({n:1,short:'Contact-rate spike',title:'Contact rate up 20% with flat bookings',tags:['Metric definition','Decomposition','SQL','pandas','Measurement'],time:'35 min',
scenario:`<p><b>Scenario.</b> You are the analytics lead for Community Support. October contacts were <b>74,400</b> against <b>62,000</b> in September (+20%). Bookings were flat at 1,000,000 both months. The VP wants to know what happened and what to do.</p>
<p>All numbers in this workbook are <b>synthetic and illustrative</b>, built to practise reasoning. They are not Airbnb data.</p>
<div class="cap">Tables you may assume</div>
${tbl(['Table','Grain','Key columns'],[['contacts','one row per customer contact','contact_id, user_id, role (guest/host), case_type, channel, created_ts, resolved_ts, booking_id'],['bookings','one row per booking','booking_id, user_id, status, created_ts, check_in_date, gbv'],['refunds','one row per refund','refund_id, booking_id, amt']])}`,
qs:[
{id:'c1q1',t:'biz',time:'5 min',diff:'Medium',q:'Before opening any data: define "contact rate". What denominators could you use, and which would you choose here?',
hint:'Think about when a contact is generated relative to a booking: at booking, during the stay, or after a cancellation.',
aloud:`"Contact rate is contacts divided by some exposure, and the exposure should be whatever generates the contacts. Contacts per booking made is the common default, but flat bookings don't mean flat exposure. Stays in progress and cancellations can move on their own. I'd report contacts per 1,000 bookings as the headline for continuity, and also per 1,000 active stays and per cancellation, then see which one explains the move."`,
a:`<h3>Candidate denominators</h3>${tbl(['Denominator','Good for','Weakness'],[['Bookings made','Simple trend; finance-friendly','Contacts mostly come from trips and cancellations, not from the act of booking'],['Check-ins / stays in progress','Contacts during a stay (access, cleanliness, safety)','Lags bookings; needs a stay table'],['Cancellations','Cancellation and refund contacts','Only valid for that case type'],['Active users','Overall demand for help per customer','Dilutes when user mix changes']])}
<p><b>Rule:</b> the denominator should be the population <i>at risk</i> of producing the contact. Use a different denominator per case type, and one blended number only for the executive headline.</p>
<p><b>Two checks on any denominator:</b> (1) it must not be affected by the thing you are trying to change, (2) it must be defined the same way in both periods (timezone, status filters, cancelled bookings included or not).</p>`,
mist:['Treating "flat bookings" as proof that demand for support is flat','Using bookings made in the month for stay-related contacts','Changing the denominator between periods without saying so'],
follow:['Which denominator would you use for safety-related contacts?','How do you handle contacts that arrive months after the booking?']},

{id:'c1q2',t:'biz',time:'8 min',diff:'Hard',q:'Contacts are up 20%. Walk through the investigation, and tell me what the first cut of the data below says.',
data:`<div class="cap">First cut by case type (illustrative)</div>${tbl(['Case type','Sep','Oct','Change','% of total change','Growth'],[['Cancellation','18,000','28,400','+10,400','83.9%','+57.8%'],['Refund','16,000','16,600','+600','4.8%','+3.8%'],['Payment','12,000','12,100','+100','0.8%','+0.8%'],['Other','16,000','17,300','+1,300','10.5%','+8.1%'],['<b>Total</b>','62,000','74,400','+12,400','100%','+20.0%']],[1,2,3,4,5])}
<p>Extra fact: cancellations (the events, not the contacts) went from 40,000 to 70,000.</p>`,
aloud:`"First I'd confirm the increase is real and not a logging or definition change. Then I'd find when it started and decompose by case type, role, channel and geography. Here, 84% of the increase is cancellation contacts. Cancellations themselves rose 75%, while contacts per cancellation actually fell about 10%. So the driver is exposure, not customer propensity. Next I'd find why cancellations jumped: host-initiated, an event like weather, or a policy change, and whether our proactive messaging kept pace."`,
a:`<h3>Framework (10-minute version)</h3>${ol(['<b>Is it real?</b> Definition or instrumentation change, duplicate logging, new contact entry point, pipeline backfill.','<b>When and how?</b> Step change vs ramp; which day; what shipped that day.','<b>Decompose</b> by case type, role, channel, geography, language, platform. Find where the change is concentrated.','<b>Exposure vs propensity.</b> Did more people hit the situation, or did the same situation create more contacts?','<b>Impact.</b> Cost, backlog, SLA breaches, CSAT effect.','<b>Hypotheses, then tests,</b> then actions and monitoring.'])}
<h3>Exposure vs propensity, with numbers</h3>
<p>Let E = cancellations and r = contacts per cancellation. Then contacts = E × r.</p>
${tbl(['','Sep','Oct'],[['Cancellations E','40,000','70,000'],['Contacts per cancellation r','0.450','0.406'],['Cancellation contacts','18,000','28,400']],[1,2])}
<p>Change in contacts = (E₁ − E₀) × r₀ + E₁ × (r₁ − r₀) = 30,000 × 0.45 + 70,000 × (−0.0443) = <b>13,500 − 3,100 = 10,400</b>. The whole increase is volume of cancellations; propensity moved the other way.</p>
${py(`
import pandas as pd
d = pd.DataFrame({'case_type': ['cancel', 'refund', 'payment', 'other'],
                  'sep': [18000, 16000, 12000, 16000],
                  'oct': [28400, 16600, 12100, 17300]})
d['delta'] = d.oct - d.sep
d['share_of_delta_pct'] = (100 * d.delta / d.delta.sum()).round(1)
d['growth_pct'] = (100 * d.delta / d.sep).round(1)
print(d)
`)}
${out(`
  case_type    sep    oct  delta  share_of_delta_pct  growth_pct
0    cancel  18000  28400  10400                83.9        57.8
1    refund  16000  16600    600                 4.8         3.8
2   payment  12000  12100    100                 0.8         0.8
3     other  16000  17300   1300                10.5         8.1
`)}
<h3>What you recommend</h3>${ul(['Segment cancellations: guest vs host initiated, geography, lead time. A weather or regulatory event looks different from a host-side supply problem.','If the spike is an event, forecast and staff for it, and send proactive messages so customers do not need to contact us.','If it is a policy change, check whether the self-serve cancellation and refund flow handles it.','Add cancellations as a standing exposure metric on the dashboard so this is visible next time.'])}`,
mist:['Stopping at "cancellations drove it" without separating volume from propensity','Segmenting by only one dimension and missing an interaction (for example one region and one channel)','Not checking the measurement first'],
follow:['Cancellation volume doubled in one region only. What do you do next?','How would you tell a weather event from a host-policy problem in the data?']},

{id:'c1q3',t:'sql',time:'7 min',diff:'Medium',q:'Write the monthly query for contacts per 1,000 bookings. Then explain why joining bookings, contacts and refunds in one query is dangerous.',
data:`<div class="cap">Tiny tables you can trace by hand</div>${tbl(['booking_id','gbv'],[['b1','100'],['b2','200'],['b3','150']],[1])}${tbl(['contact_id','booking_id'],[['c1','b1'],['c2','b1'],['c3','b2']])}${tbl(['refund_id','booking_id','amt'],[['r1','b1','20'],['r2','b1','30'],['r3','b2','50']],[2])}`,
aloud:`"Aggregate each table to the month grain first, then join the aggregates. If I join the raw many-side tables to bookings, every booking row is repeated once per contact times once per refund, and SUM(gbv) is inflated. That's join fanout."`,
a:`<h3>The fanout trap</h3>${sql(`
-- WRONG: both child tables multiply the booking rows
SELECT SUM(b.gbv) AS gbv, COUNT(DISTINCT c.contact_id) AS contacts, SUM(r.amt) AS refunds
FROM bookings b
LEFT JOIN bc c USING (booking_id)
LEFT JOIN refunds r USING (booking_id)
`)}${out(`
 gbv  contacts  refunds
750.0         3    150.0
`)}
<p>True GBV is 450 and true refunds are 100. Booking b1 has 2 contacts and 2 refunds, so it appears 4 times. COUNT(DISTINCT) hid the problem for contacts, which is exactly why it is dangerous: some measures look right while others are inflated.</p>
${sql(`
-- RIGHT: reduce each child table to one row per booking first
WITH c AS (SELECT booking_id, COUNT(*) AS contacts FROM bc GROUP BY 1),
     r AS (SELECT booking_id, SUM(amt) AS refund_amt FROM refunds GROUP BY 1)
SELECT SUM(b.gbv) AS gbv,
       SUM(COALESCE(c.contacts, 0)) AS contacts,
       SUM(COALESCE(r.refund_amt, 0)) AS refunds
FROM bookings b
LEFT JOIN c USING (booking_id)
LEFT JOIN r USING (booking_id)
`)}${out(`
 gbv  contacts  refunds
450.0       3.0    100.0
`)}
<h3>The monthly metric</h3>${sql(`
WITH b AS (
  SELECT date_trunc('month', created_ts) AS m, COUNT(*) AS bookings
  FROM bookings GROUP BY 1),
c AS (
  SELECT date_trunc('month', created_ts) AS m, COUNT(*) AS contacts
  FROM contacts GROUP BY 1)
SELECT b.m, b.bookings, COALESCE(c.contacts, 0) AS contacts,
       ROUND(1000.0 * COALESCE(c.contacts, 0) / b.bookings, 1) AS contacts_per_1k
FROM b LEFT JOIN c ON b.m = c.m
ORDER BY 1
`)}
${box('Two design choices to state aloud','<b>Period vs cohort.</b> The query above counts contacts in the month they happen. A cohort view attributes contacts to the booking month and needs a maturity window. <b>Time zones.</b> Truncate in one agreed zone; a contact at 23:30 UTC and one at 05:00 IST can land in different months.')}`,
mist:['Joining two one-to-many tables to the same parent','Using COUNT(DISTINCT) to fix one measure and ignoring the others','Dividing contacts of one period by bookings of another without saying so'],
follow:['How would you add case_type to this output without fanout?','Which would you prefer for a dashboard: period or cohort metric?']},

{id:'c1q4',t:'biz',time:'5 min',diff:'Medium',q:'How do you know the 20% is real and not a measurement artefact? List the checks.',
aloud:`"I'd check four things: did the definition of a contact change, did a new entry point or channel start logging contacts, are there duplicates from the same issue across channels, and does an independent source like telephony or workforce-management volume show the same increase."`,
a:`${tbl(['Check','What to look for'],[['Definition change','Reopened cases now counted as new contacts; bot sessions counted as contacts; case-type taxonomy changed'],['New entry point','A new "Contact us" button or in-app flow launched in the period; step change on one date'],['Duplicates','Same user and issue logged on chat then email; ratio of contact_id to distinct user-day-case_type'],['Pipeline','Late-arriving data, backfills, or a table migration; compare row counts to the source system'],['Independent source','Telephony call counts, agent-handled volume, workforce-management actuals'],['Channel pattern','Only one channel moved: suspect instrumentation. All channels moved together: suspect demand.']])}
<p>If the independent source disagrees, you have a measurement problem and the analysis stops until it is resolved.</p>`,
mist:['Starting segmentation before validating the metric','Trusting one dashboard as the only source'],follow:['Telephony shows +3% but the contacts table shows +20%. Now what?']}
]});

CASES.push({n:2,short:'Repeat contacts & FCR',title:'Repeat contacts and first-contact resolution',tags:['SQL','Window functions','Metric design','Right-censoring'],time:'40 min',
scenario:`<p><b>Scenario.</b> Leadership wants a repeat-contact rate and a first-contact-resolution (FCR) rate to judge whether support is actually fixing problems. You have the <code>contacts</code> table below (10 rows, so you can trace every answer by hand). The data cut is <b>2026-11-01</b>.</p>
${tbl(['contact_id','user_id','case_type','channel','created_ts','resolved_ts'],[['1','u1','refund','chat','2026-10-01 09:00','2026-10-01 09:40'],['2','u1','refund','chat','2026-10-03 10:00','2026-10-03 10:20'],['3','u1','refund','phone','2026-10-20 08:00','2026-10-20 08:30'],['4','u2','cancel','chat','2026-10-02 12:00','2026-10-02 12:10'],['5','u2','safety','phone','2026-10-02 18:00','2026-10-02 18:50'],['6','u3','cancel','chat','2026-10-05 07:00','2026-10-05 07:15'],['7','u3','cancel','chat','2026-10-05 20:00','2026-10-05 20:30'],['8','u3','cancel','email','2026-10-12 09:00','2026-10-13 15:00'],['9','u4','refund','email','2026-10-07 11:00','2026-10-08 11:00'],['10','u5','refund','chat','2026-10-30 10:00','NULL']])}`,
qs:[
{id:'c2q1',t:'biz',time:'6 min',diff:'Hard',q:'Define "repeat contact" and "FCR" precisely. Which choices change the number?',
aloud:`"A repeat contact is a customer contacting us again about the same issue within a window. I have to fix four things: the key that defines 'same issue', the window, the direction, and who is eligible. FCR is then resolved with no repeat in the window. Without the right-censoring guard, recent contacts look better than they are, because their window hasn't finished."`,
a:`${tbl(['Choice','Options','Recommendation'],[['Key for "same issue"','user only; user + case_type; user + booking; explicit issue/thread id','user + case_type as a default; booking-level where available. User-only over-counts unrelated issues.'],['Window','24h, 7d, 30d','Match channel latency. A 24h window is meaningless for email that takes a day to resolve. Report 7d as the headline.'],['Direction','Forward ("did this contact lead to another?") or backward ("is this contact a repeat?")','Forward for FCR, because it attributes the failure to the contact that did not resolve the issue.'],['Eligibility','All contacts, or only those whose window has fully elapsed','Only those with created_ts ≤ data cut − window (avoid right-censoring)'],['What counts as a new contact','Reopen, bot-to-agent handoff in one session, outbound proactive contact','Exclude handoffs inside one session and agent-initiated outbound']])}
<p><b>FCR is not "resolved on the first touch".</b> A contact marked resolved that is followed by a repeat in 7 days did not resolve the problem.</p>`,
mist:['Counting every later contact from the same user as a repeat regardless of topic','Ignoring right-censoring, which flatters the latest period','One window for all channels'],
follow:['Why does agent-reported "resolved" overstate FCR?','How would you handle a user who contacts about a different booking but the same case type?']},

{id:'c2q2',t:'sql',time:'8 min',diff:'Medium',q:'Flag each contact that was followed by another contact from the same user and case type within 24 hours, 7 days and 30 days.',
hint:'Look at the next contact in time for the same user and case type. Which window function gives you that?',
aloud:`"I'll use LEAD to get the next created_ts within each user and case_type partition, then compare it with created_ts plus each window. Forward-looking, so each contact is flagged if it was followed by another."`,
a:`${sql(`
WITH nxt AS (
  SELECT contact_id, user_id, case_type, created_ts,
         LEAD(created_ts) OVER (PARTITION BY user_id, case_type ORDER BY created_ts) AS next_ts
  FROM contacts
)
SELECT contact_id, user_id, case_type,
       CASE WHEN next_ts <= created_ts + INTERVAL '24' HOUR THEN 1 ELSE 0 END AS rep_24h,
       CASE WHEN next_ts <= created_ts + INTERVAL '7' DAY   THEN 1 ELSE 0 END AS rep_7d,
       CASE WHEN next_ts <= created_ts + INTERVAL '30' DAY  THEN 1 ELSE 0 END AS rep_30d
FROM nxt
ORDER BY contact_id
`)}${out(`
 contact_id user_id case_type  rep_24h  rep_7d  rep_30d
          1      u1    refund        0       1        1
          2      u1    refund        0       0        1
          3      u1    refund        0       0        0
          4      u2    cancel        0       0        0
          5      u2    safety        0       0        0
          6      u3    cancel        1       1        1
          7      u3    cancel        0       1        1
          8      u3    cancel        0       0        0
          9      u4    refund        0       0        0
         10      u5    refund        0       0        0
`)}
<p><b>Trace it.</b> Contact 7 (Oct 5, 20:00) is followed by contact 8 (Oct 12, 09:00), a gap of 6 days 13 hours, so it is a 7-day and 30-day repeat but not a 24-hour one. Contact 5 is a different case type from contact 4, so neither is a repeat of the other. When next_ts is NULL the comparison is NULL and the CASE returns 0.</p>
${box('Alternative approach','A self-join (c1 JOIN c2 ON same user and case_type AND c2.created_ts BETWEEN c1.created_ts AND c1.created_ts + window) works but multiplies rows for heavy users and scans twice. LEAD is one pass and cleaner. The self-join is only needed if you must count <i>all</i> follow-ups in the window, not just whether one exists.')}`,
mist:['Using LAG (backward) and reading it as forward-looking','Forgetting PARTITION BY case_type, which turns unrelated contacts into repeats','Using a calendar-day diff for the 24-hour window'],
follow:['How would you count the number of follow-ups within 7 days rather than a flag?','What changes if "same issue" is defined by booking_id?']},

{id:'c2q3',t:'sql',time:'8 min',diff:'Hard',q:'Compute the 7-day FCR rate and 7-day repeat rate for October. Handle contacts whose 7-day window has not finished.',
aloud:`"I restrict to contacts created at least 7 days before the data cut so every contact has a full window. Then FCR is resolved and no follow-up within 7 days. Without that filter, the last week looks artificially good."`,
a:`${sql(`
WITH nxt AS (
  SELECT contact_id, user_id, case_type, created_ts, resolved_ts,
         LEAD(created_ts) OVER (PARTITION BY user_id, case_type ORDER BY created_ts) AS next_ts
  FROM contacts                       -- LEAD sees ALL contacts, including recent ones
)
SELECT COUNT(*) AS eligible_contacts,
       SUM(CASE WHEN resolved_ts IS NOT NULL
                 AND (next_ts IS NULL OR next_ts > created_ts + INTERVAL '7' DAY)
                THEN 1 ELSE 0 END) AS fcr_7d,
       ROUND(100.0 * SUM(CASE WHEN resolved_ts IS NOT NULL
                 AND (next_ts IS NULL OR next_ts > created_ts + INTERVAL '7' DAY)
                THEN 1 ELSE 0 END) / COUNT(*), 1) AS fcr_pct,
       ROUND(100.0 * SUM(CASE WHEN next_ts <= created_ts + INTERVAL '7' DAY THEN 1 ELSE 0 END) / COUNT(*), 1) AS repeat_7d_pct
FROM nxt
WHERE created_ts <= TIMESTAMP '2026-11-01 00:00:00' - INTERVAL '7' DAY   -- censoring guard AFTER LEAD
`)}${out(`
 eligible_contacts  fcr_7d  fcr_pct  repeat_7d_pct
                 9     6.0     66.7           33.3
`)}
<p><b>Trace it.</b> Contact 10 (Oct 30) is excluded because its window ends after the cut, so 9 contacts are eligible. Contacts 1, 6 and 7 were followed by another contact within 7 days (3 of 9 = 33.3%). The other six were resolved with no follow-up, so FCR is 6/9 = 66.7%.</p>
${box('Why the guard goes after LEAD','If you filter first, a contact created on Oct 24 loses its follow-up on Oct 28, because that row is outside the filtered set. It then looks like a clean resolution and FCR is overstated. Let LEAD see every contact, then restrict the <i>denominator</i> to contacts whose full window has elapsed.','warn')}`,
mist:['Dropping the censoring guard','Treating unresolved contacts as failures when they simply have not resolved yet'],
follow:['What is the FCR denominator if some contacts are still open?','How would you present FCR by channel when email takes longer?']},

{id:'c2q4',t:'sql',time:'7 min',diff:'Hard',q:'Find users who contacted about the same case type at least three times within any 30-day window.',
aloud:`"For each contact I look two contacts back in the same user and case-type partition. If the third contact is within 30 days of the contact two back, the user has three contacts inside a 30-day span. LAG(1) would only compare consecutive contacts, which is the classic trap."`,
a:`${sql(`
WITH x AS (
  SELECT user_id, case_type, created_ts,
         LAG(created_ts, 2) OVER (PARTITION BY user_id, case_type ORDER BY created_ts) AS two_back
  FROM contacts
)
SELECT DISTINCT user_id, case_type
FROM x
WHERE two_back IS NOT NULL
  AND created_ts <= two_back + INTERVAL '30' DAY
ORDER BY 1, 2
`)}${out(`
 user_id case_type
      u1    refund
      u3    cancel
`)}
<p>u1: contacts on Oct 1, Oct 3, Oct 20. The third (Oct 20) is 19 days after the first, so it qualifies. u3: Oct 5, Oct 5, Oct 12; the third is 7 days after the first. u2 has two different case types, u4 and u5 have one contact each.</p>
${box('The trap','LAG(1) compares each contact with the one before it. "Three in 30 days" means the first and third are at most 30 days apart, so you must look two back. For N events in a window, use LAG(N−1).','warn')}`,
mist:['Using LAG(1)','Using a self-join that explodes for heavy users'],follow:['Extend it to flag users with 3+ contacts in a rolling 30 days that crosses a month boundary.']},

{id:'c2q5',t:'biz',time:'8 min',diff:'Hard',q:'Repeat rate is 20%. How do you identify the biggest drivers, and how do you avoid mistaking correlation for cause?',
aloud:`"I build a contact-level table with the repeat flag and candidate drivers, start descriptive, then adjust with a model that includes case-type fixed effects so I'm not just rediscovering that hard cases repeat. Then I read a sample of the repeated cases to learn why they came back. A driver is only actionable if I can change it, so I'd validate the top one with an experiment."`,
a:`${ol(['<b>Descriptive:</b> repeat rate by case type, channel, first-contact agent tenure, resolution code, refund issued, time to first response.','<b>Adjusted:</b> logistic regression of repeat_7d on those drivers with case-type fixed effects. Coefficients are associations after adjustment, not causal effects.','<b>Why did they come back?</b> Sample 100 repeat pairs and code the reason ("refund not received", "status unclear", "wrong policy applied"). An LLM can tag at scale, but validate its tags on a human-labelled set.','<b>Size the prize:</b> repeats × cost per contact × share attributable to the driver.','<b>Test the fix</b> on the largest driver with an experiment or staged rollout.'])}
<h3>Worked sizing (illustrative)</h3>
<p>74,400 contacts × 20% repeat = 14,880 repeats. At $4 per contact that is <b>$59,520 a month</b>. If the top driver accounts for 40% of repeats and a fix cuts it by 25%, you remove 14,880 × 0.4 × 0.25 = <b>1,488 contacts, about $5,952 a month</b>. State the assumptions and give a range, because the 25% is a guess until tested.</p>
<h3>Causation risk</h3>
<p>Agents with high repeat rates may simply receive harder cases. Compare within case type and difficulty, or use randomised routing if you can.</p>`,
mist:['Ranking agents by raw repeat rate','Treating model coefficients as effects','Skipping the qualitative read of actual repeats'],
follow:['A feature is strongly predictive of repeats but cannot be changed. Is it still useful?','How would you validate an LLM-tagged "reason for return" field?']}
]});

CASES.push({n:3,short:'Resolution time & SLA',title:'Resolution time, SLA breaches and anomalies',tags:['SQL','Percentiles','Event data','Bootstrap','Anomaly detection'],time:'40 min',
scenario:`<p><b>Scenario.</b> The Operations lead says "average resolution time is fine, so why are customers complaining?" You own the resolution-time and SLA metrics. SLA targets: chat 60 min, phone 60 min, email 24 hours (1,440 min).</p>
<p>Below is a summary from a synthetic table of 6,000 resolved contacts (illustrative lognormal-shaped data, which is typical of real resolution times).</p>
${tbl(['Channel','Contacts','Median (min)','p90 (min)','Mean (min)','SLA breach %'],[['chat','3,052','24.0','77.0','36.2','16.0%'],['email','1,217','601.0','1,653.4','833.8','14.1%'],['phone','1,731','35.0','97.0','48.0','24.1%']],[1,2,3,4,5])}`,
qs:[
{id:'c3q1',t:'stat',time:'6 min',diff:'Medium',q:'Which statistic would you put on the executive dashboard for resolution time, and why not just the mean?',
aloud:`"Resolution time is right-skewed, so the mean is dragged up by a long tail and hides what a typical customer sees. I'd show the median for the typical experience, p90 for the tail, and the SLA breach rate for the commitment. And I'd handle still-open cases explicitly, because dropping them makes the numbers look better than they are."`,
a:`<p>Look at the chat row: median 24 min, mean 36.2, p90 77. The mean sits about 50% above the median because of the tail. A mean-based target can be met while one customer in ten waits over an hour.</p>
${tbl(['Statistic','Tells you','Watch out for'],[['Median','Typical customer','Blind to the tail'],['p90 / p95','Bad-day experience','Needs enough volume per segment; noisy for small cells'],['Mean','Total agent-time / capacity planning','Driven by outliers; mean-of-means across channels is wrong'],['SLA breach %','Commitment performance','Depends on the threshold; define business vs wall-clock time']])}
${ul(['<b>Open cases are censored.</b> If you only include resolved cases, you drop the slowest ones and the metric improves for the wrong reason. Report open-case age separately, or use a survival-style view.','<b>Never average medians</b> across channels. Recompute from the combined data or weight properly.','<b>Mix shift:</b> a move toward chat (fast) lowers the blended time with no process change. Report by channel and case type.'])}`,
mist:['Averaging channel averages','Excluding unresolved cases','Reporting one blended number when the channel mix is changing'],
follow:['Median improved but p90 got worse. What does that tell you?','How would you set an SLA threshold?']},

{id:'c3q2',t:'sql',time:'8 min',diff:'Medium',q:'Write the query that produced the table above: median, p90, mean and SLA breach rate by channel.',
aloud:`"Time to resolution in minutes with date_diff, then approx_percentile for median and p90 in Trino, mean, and the breach rate as the average of a CASE that compares against the channel's SLA. Exclude unresolved cases here, and report them separately."`,
a:`${sql(`
SELECT channel,
       COUNT(*) AS n,
       ROUND(approx_percentile(date_diff('minute', created_ts, resolved_ts), 0.5), 1) AS median_min,
       ROUND(approx_percentile(date_diff('minute', created_ts, resolved_ts), 0.9), 1) AS p90_min,
       ROUND(AVG(date_diff('minute', created_ts, resolved_ts)), 1) AS mean_min,
       ROUND(100.0 * AVG(CASE WHEN date_diff('minute', created_ts, resolved_ts) >
                 CASE channel WHEN 'chat' THEN 60 WHEN 'phone' THEN 60 ELSE 1440 END
                 THEN 1 ELSE 0 END), 1) AS sla_breach_pct
FROM contacts
WHERE resolved_ts IS NOT NULL
GROUP BY 1
ORDER BY 1
`)}${out(`
channel    n  median_min  p90_min  mean_min  sla_breach_pct
   chat 3052        24.0     77.0      36.2            16.0
  email 1217       601.0   1653.4     833.8            14.1
  phone 1731        35.0     97.0      48.0            24.1
`)}
${box('Trino note','approx_percentile is approximate (it uses a quantile digest) and returns a value from the data; exact interpolated quantiles, as shown here from a verification run, can differ slightly at small n. For an exact median in Trino you can use ROW_NUMBER and pick the middle row. In the verification run, approx_percentile was mapped to an exact quantile function.')}
<p><b>Phone has the highest breach rate (24.1%) even though its median (35 min) is close to chat's (24).</b> The cause is the tail: phone p90 is 97 min against an SLA of 60. This is exactly what an average-based target hides.</p>`,
mist:['Computing the SLA comparison in calendar days','Letting NULL resolved_ts silently drop open cases without reporting them'],
follow:['Add business-hours logic for email SLA. How?','How would you add a 7-day rolling p90?']},

{id:'c3q3',t:'sql',time:'9 min',diff:'Hard',q:'The events table has duplicate and late-arriving rows and reopened cases. Compute time to first resolution and time to final resolution per case.',
data:`<div class="cap">case_events (note the duplicate "resolved" for k1, ingested twice)</div>${tbl(['case_id','event_type','event_ts','ingested_ts'],[['k1','created','10-01 09:00','10-01 09:01'],['k1','resolved','10-01 10:00','10-01 10:01'],['k1','resolved','10-01 10:00','10-01 10:30'],['k1','reopened','10-02 08:00','10-02 08:01'],['k1','resolved','10-02 12:00','10-02 12:02'],['k2','created','10-01 11:00','10-01 11:01'],['k2','resolved','10-01 11:30','10-01 11:31'],['k3','created','10-01 13:00','10-01 13:02']])}`,
aloud:`"First dedupe on case, event type and event time, keeping the latest ingested row. Then pivot with conditional aggregation: first resolved is the MIN, final resolved is the MAX, and reopened is a flag. Open cases come out NULL, which I report separately as censored."`,
a:`${sql(`
WITH dedup AS (
  SELECT case_id, event_type, event_ts,
         ROW_NUMBER() OVER (PARTITION BY case_id, event_type, event_ts
                            ORDER BY ingested_ts DESC) AS rn
  FROM case_events
),
ev AS (SELECT case_id, event_type, event_ts FROM dedup WHERE rn = 1),
agg AS (
  SELECT case_id,
         MIN(CASE WHEN event_type = 'created'  THEN event_ts END) AS created_ts,
         MIN(CASE WHEN event_type = 'resolved' THEN event_ts END) AS first_resolved_ts,
         MAX(CASE WHEN event_type = 'resolved' THEN event_ts END) AS final_resolved_ts,
         MAX(CASE WHEN event_type = 'reopened' THEN 1 ELSE 0 END) AS was_reopened
  FROM ev GROUP BY 1
)
SELECT case_id, was_reopened,
       date_diff('minute', created_ts, first_resolved_ts) AS first_res_min,
       date_diff('minute', created_ts, final_resolved_ts) AS final_res_min
FROM agg
ORDER BY 1
`)}${out(`
case_id  was_reopened  first_res_min  final_res_min
     k1             1             60           1620
     k2             0             30             30
     k3             0           <NA>           <NA>
`)}
<p><b>Why both metrics.</b> k1 "resolved" in 60 minutes but was reopened and truly finished 27 hours later. Reporting only first resolution flatters the process. The gap between the two is a quality signal; the reopen rate is the share of cases with was_reopened = 1.</p>
<p><b>Late-arriving events:</b> the dedupe keeps the latest ingested copy, but a resolved event that arrives tomorrow changes today's metric. State a data-maturity rule (for example "metrics are final after 3 days") and mark recent days as provisional on the dashboard.</p>`,
mist:['Joining the raw table without deduping, which doubles k1 resolved rows','Using the latest event_type as the status and ignoring the reopen','Treating NULL as zero minutes'],
follow:['How would you compute reopen rate within 7 days of first resolution?','What if event_ts has mixed time zones?']},

{id:'c3q4',t:'py',time:'8 min',diff:'Medium',q:'A new routing rule is tested. Median resolution time is 30.5 min in control and 27.9 in treatment (n = 4,000 each). Give a confidence interval for the effect and defend your method.',
aloud:`"The data is heavily skewed, so I wouldn't rely on a t-test alone. I'd bootstrap the difference in medians, and also report the difference in means with a Welch interval, since capacity planning cares about total minutes. Both intervals exclude zero here, but I'd report the effect size in minutes and the p90 as well."`,
a:`${py(`
import numpy as np
from scipy import stats

rng = np.random.default_rng(3)
a = rng.lognormal(np.log(30), 0.9, 4000)   # control (minutes)
b = rng.lognormal(np.log(28), 0.9, 4000)   # treatment

rng2 = np.random.default_rng(42)
B = 2000
d_med = [np.median(rng2.choice(b, len(b))) - np.median(rng2.choice(a, len(a))) for _ in range(B)]
d_mean = [rng2.choice(b, len(b)).mean() - rng2.choice(a, len(a)).mean() for _ in range(B)]

print('median diff', round(np.median(b) - np.median(a), 2), np.percentile(d_med, [2.5, 97.5]).round(2))
print('mean diff  ', round(b.mean() - a.mean(), 2), np.percentile(d_mean, [2.5, 97.5]).round(2))
print(stats.ttest_ind(b, a, equal_var=False))
`)}${out(`
median diff -2.6 [-4.05 -1.19]
mean diff   -3.42 [-5.64 -1.43]
TtestResult(statistic=-3.13, pvalue=0.0017, df=7979.9)
`)}
<h3>Which test and why</h3>${ul(['<b>Welch t-test</b> compares means and does not assume equal variances. With n = 4,000 per arm the central limit theorem makes the mean comparison valid despite skew.','<b>Mann-Whitney</b> tests whether one distribution tends to be larger (p = 1.2e-5 here). It is not a test of medians unless the shapes match, so do not report it as one.','<b>Bootstrap on the median</b> gives an interval for the statistic you actually report.','If cases are clustered by agent, resample agents, not cases. Otherwise the interval is too narrow.'])}
<h3>Practical reading</h3><p>The treatment saves about 2.6 minutes at the median (roughly 9%). Whether that matters is a business question: multiply by volume to get agent-hours, and check the guardrails (CSAT, reopen rate) before shipping.</p>`,
mist:['Calling Mann-Whitney a test of medians','Resampling cases when randomisation was at agent level','Reporting only a p-value'],
follow:['What if the effect is concentrated in the tail (p90) and the median is flat?','How would you check the result is not driven by a few outliers?']},

{id:'c3q5',t:'sql',time:'9 min',diff:'Hard',q:'Daily contacts show a spike and a zero. Write the SQL that flags anomalies against a trailing baseline, and say which flag is an incident and which is a pipeline problem.',
data:`<div class="cap">daily(d, contacts): 75 days of synthetic volume, weekly cycle, noise, a real 3-day surge from Sep 30 to Oct 2, and one day of zero rows on Oct 10.</div>`,
aloud:`"I compare each day with the mean and standard deviation of the previous 28 days and flag |z| above 3. A zero against a baseline of about a thousand is almost certainly a pipeline gap, not a customer behaviour, so I'd check upstream row counts before treating it as an incident. The spike is a real surge, but note the flag only caught two of the three days, because the surge itself inflated the baseline."`,
a:`${sql(`
WITH s AS (
  SELECT d, contacts,
         AVG(contacts)         OVER (ORDER BY d ROWS BETWEEN 28 PRECEDING AND 1 PRECEDING) AS m,
         STDDEV_SAMP(contacts) OVER (ORDER BY d ROWS BETWEEN 28 PRECEDING AND 1 PRECEDING) AS sd
  FROM daily
)
SELECT d, contacts, ROUND(m, 0) AS m, ROUND(sd, 0) AS sd, ROUND((contacts - m) / sd, 1) AS z
FROM s
WHERE ABS((contacts - m) / sd) > 3
ORDER BY d
`)}${out(`
         d  contacts      m   sd    z
2026-09-30      1282  999.0 62.0  4.6
2026-10-01      1278 1010.0 81.0  3.3
2026-10-10         0 1033.0 106.0 -9.8
`)}
<h3>Reading the output</h3>${ul(['<b>Sep 30 and Oct 1 are real surges</b> (z of 4.6 and 3.3). Oct 2, the third surge day, is <b>not flagged</b>: the first two surge days entered the baseline and inflated the standard deviation, so the same level no longer looks extreme. This is baseline contamination.','<b>Oct 10 is a zero</b> (z = −9.8). A drop to exactly zero from about 1,000 is far more likely missing data than customers suddenly not needing help.'])}
<h3>How to tell an incident from a pipeline failure</h3>${tbl(['Check','Incident','Pipeline problem'],[['Upstream row counts / freshness','Normal','Missing or delayed'],['Other tables from the same source','Normal','Also empty'],['Spread across channels','Concentrated in some case types or channels','All channels drop to zero together'],['Backfill next day','Numbers stay','Numbers reappear'],['Independent source (telephony)','Also shows it','Disagrees']])}
<h3>Making the detector better</h3>${ul(['Use a robust baseline (median and MAD) and exclude previously flagged days.','Compare with the same weekday to handle the weekly cycle.','Require persistence (for example two consecutive flags) before alerting a human, to control false positives.','Run a freshness check first; only evaluate volume anomalies on tables that are fresh.'])}`,
mist:['Alerting on a zero without a freshness check','Leaving flagged days in the baseline','Ignoring weekly seasonality'],
follow:['You monitor 200 segment series daily. How do you control false alerts?','Would you alert on counts or on contact rate?']}
]});

CASES.push({n:4,short:'Help-center search A/B',title:'A/B test: new help-center search',tags:['Experiment design','Sample size','SRM','Guardrails','Interpretation'],time:'45 min',
scenario:`<p><b>Scenario.</b> Product has rebuilt help-center search. The hope: more people find answers without contacting support. You are asked to design the experiment and then read the results.</p>
<p>Baseline (illustrative): <b>12%</b> of users who use help-center search contact support within 24 hours.</p>`,
qs:[
{id:'c4q1',t:'exp',time:'7 min',diff:'Medium',q:'Design the experiment: hypothesis, unit of randomisation, eligibility, metrics and guardrails.',
aloud:`"Hypothesis: the new search reduces the share of searchers who contact support within 24 hours without hurting satisfaction or resolution. I'd randomise by user, because a person's sessions are correlated, with eligibility being users who open help-center search, analysed on users who were actually exposed. Primary metric is 24-hour contact rate per searcher. Guardrails include post-contact CSAT, safety-sensitive contacts, and downstream cancellations."`,
a:`${tbl(['Element','Choice','Reason'],[['Hypothesis','Searchers using the new search contact support less within 24h, with no loss in resolution quality','Directional and falsifiable'],['Unit of randomisation','User (logged-in id), not session','Sessions from one user are correlated; session-level randomisation mixes experiences and inflates sample size'],['Unit of analysis','Same as randomisation unit','Avoids understating variance'],['Eligibility / exposure','Users who reach help-center search; assign at first search (triggered analysis)','Including non-searchers adds noise and dilutes the effect'],['Primary metric','Share of users with a contact within 24h of first search','Closest to the mechanism'],['Secondary','Search success (article opened and no contact), time to resolution, return searches','Explain the mechanism'],['Guardrails','CSAT of those who do contact, safety-related contact rate, cancellation and refund requests in 7d, search latency','Detect "deflection" that hurts customers']])}
${box('Contact deflection is not always good','Fewer contacts could mean users solved the problem, or that they gave up. A safety-related contact that disappears is a harm, not a win. Pair the primary metric with success evidence (article engagement, no repeat search, no later complaint).','warn')}`,
mist:['Randomising by session','Analysing all users instead of exposed users','Using contact deflection alone as success'],
follow:['What if help-center traffic is shared by hosts and guests with different needs?','How do you handle users with multiple devices?']},

{id:'c4q2',t:'stat',time:'8 min',diff:'Medium',q:'How many users do you need per arm? What does the answer tell you about what effect you can detect?',
aloud:`"For a 12% baseline, detecting a 5% relative reduction, so 12% to 11.4%, at 5% significance and 80% power needs about 45,000 users per arm. Halving the detectable effect roughly quadruples the sample, so the minimum detectable effect is a business decision about what's worth shipping."`,
a:`<p>For two proportions, with p̄ = (p₁ + p₂)/2:</p>
<p style="text-align:center">n per arm = [ z<sub>α/2</sub>·√(2·p̄(1−p̄)) + z<sub>β</sub>·√(p₁(1−p₁) + p₂(1−p₂)) ]² / (p₁ − p₂)²</p>
${py(`
from statsmodels.stats.power import NormalIndPower
from statsmodels.stats.proportion import proportion_effectsize

p1 = 0.12
for rel in [0.03, 0.05, 0.10]:
    p2 = p1 * (1 - rel)
    n = NormalIndPower().solve_power(proportion_effectsize(p1, p2), alpha=0.05, power=0.8)
    print(f'{rel:.0%} relative reduction ({p1:.3f} -> {p2:.4f}): {n:,.0f} per arm')
`)}${out(`
3% relative reduction (0.120 -> 0.1164): 126,240 per arm
5% relative reduction (0.120 -> 0.1140): 45,042 per arm
10% relative reduction (0.120 -> 0.1080): 11,004 per arm
`)}
${ul(['<b>n scales with 1/MDE².</b> Going from a 10% to a 5% relative effect needs about 4 times the users.','Check traffic: if 15,000 users a day reach search, 45,042 per arm (90,084 total) takes about 6 days, and you still want at least two full weekly cycles.','<b>Fixed sample:</b> with 20,000 per arm the MDE is about 0.9 percentage points (7.5% relative), not 0.6.','Variance reduction (CUPED using prior contact history) can lower the required n without extending the test.'])}
<p><b>Lead-level move:</b> ask what size of reduction justifies the build cost and the ongoing maintenance. If only a 10% relative reduction would be worth shipping, a smaller test is enough.</p>`,
mist:['Quoting a sample size without stating the MDE, power and alpha','Using the size of the whole user base instead of the eligible population','Stopping when the p-value first dips below 0.05'],
follow:['What if you only have 10,000 users per arm?','One-sided or two-sided test, and why?']},

{id:'c4q3',t:'stat',time:'5 min',diff:'Medium',q:'The test was designed as 50/50. After launch you see 50,900 in treatment and 49,100 in control. What do you do?',
aloud:`"That's a possible sample ratio mismatch. I'd run a chi-square test against the 50/50 expectation. Here chi-square is 32.4 with a p-value around 1e-8, far too unlikely to be chance, so I wouldn't read any treatment results until I find out why the groups differ."`,
a:`${py(`
import numpy as np
from scipy import stats
obs = np.array([50900, 49100]); exp = np.array([50000, 50000])
chi2 = ((obs - exp) ** 2 / exp).sum()
print(round(chi2, 1), 1 - stats.chi2.cdf(chi2, 1))
`)}${out(`
32.4  1.2548647454480033e-08
`)}
<p>A 1.8% imbalance looks small, but with 100,000 users the expected sampling noise is about ±158 users. A gap of 900 is 5.7 standard deviations.</p>
<h3>Why SRM matters</h3><p>It means assignment or logging differs between arms, so the groups are no longer comparable. Any effect estimate is suspect, even if the imbalance is "small".</p>
<h3>Typical causes</h3>${ul(['Bot or internal-traffic filtering applied after assignment and differently by arm','The new search is slower or crashes for some devices, so exposure events are lost in treatment','Redirect or caching issues that drop users from one arm','Triggering logged differently in the two experiences','Re-bucketing mid-test'])}
<p><b>Action:</b> pause interpretation, find the cause (check by platform, country, browser, day), fix it, and rerun if the cause is not purely random loss. Do not "correct" by reweighting without understanding the mechanism.</p>`,
mist:['Dismissing a 1.8% imbalance as small','Reading the results first and checking SRM later'],
follow:['SRM appears only on Android. Now what?']},

{id:'c4q4',t:'py',time:'8 min',diff:'Medium',q:'Results: treatment 5,700 contacts out of 50,000 (11.4%), control 5,850 out of 50,000 (11.7%). Analyse and decide.',
aloud:`"The treatment is 0.3 percentage points lower, a 2.5% relative reduction. The 95% interval runs from a 0.7 point reduction to a 0.1 point increase, and p is about 0.14. That is inconclusive, not a null result. The test was powered for a 0.6 point effect, so it can't distinguish a small benefit from none."`,
a:`${py(`
import numpy as np
from statsmodels.stats.proportion import proportions_ztest

x = np.array([5700, 5850]); n = np.array([50000, 50000])   # treatment, control
z, p = proportions_ztest(x, n)
d = x[0] / n[0] - x[1] / n[1]
se = np.sqrt((x[0]/n[0]) * (1 - x[0]/n[0]) / n[0] + (x[1]/n[1]) * (1 - x[1]/n[1]) / n[1])
print(round(z, 2), round(p, 3), round(d * 100, 2),
      [round((d - 1.96 * se) * 100, 2), round((d + 1.96 * se) * 100, 2)])
`)}${out(`
-1.48 0.138 -0.3 [-0.7, 0.1]
`)}
<h3>Interpretation</h3>${ul(['<b>Point estimate:</b> −0.3 points (−2.5% relative).','<b>Interval</b> [−0.70, +0.10] points: consistent with a meaningful benefit and with a tiny harm.','<b>Power:</b> the design could detect 0.6 points. The observed effect is half that, so the test is underpowered for it.','<b>"Not significant" does not mean "no effect".</b> Absence of evidence of benefit is not evidence of absence.'])}
<h3>Decision options</h3>${tbl(['Option','When it makes sense'],[['Ship','Build and run cost is low, no guardrail is harmed, and the interval rules out meaningful harm (upper bound +0.1 points is small)'],['Extend','A 0.3 point effect is worth having. To detect it at 80% power you need roughly 4 times the sample (about 182,000 per arm)'],['Do not ship','Cost is high or secondary metrics (search success, CSAT) show no sign of improvement']])}
<p>Check guardrails and the secondary metrics before choosing. A pre-registered decision rule ("ship if the upper bound of the contact change is below 0 or non-inferiority holds") prevents arguing after the fact.</p>`,
mist:['Saying "no effect"','Running more users until p < 0.05 without a plan','Slicing into many segments to find a win'],
follow:['What segments would you pre-register before looking?','How would you convert 0.3 points into contacts and cost saved?']},

{id:'c4q5',t:'biz',time:'6 min',diff:'Hard',q:'How do you measure "success" for self-service so a failed journey is not counted as a win?',
aloud:`"I'd define a successful self-service journey as one where the customer got what they needed: they engaged with an answer and did not contact us or come back stuck within a window. Not contacting us alone includes people who gave up. So I'd pair no-contact with a positive signal, and check later complaints, cancellations and return searches."`,
a:`${tbl(['Journey outcome','Naive "contained"?','Truly resolved?'],[['Read article, no contact, no return','Yes','Likely yes'],['Searched, bounced in 5 seconds, no contact','Yes','Unknown or no'],['Searched, no contact, then contacted later through another channel','Yes (missed)','No'],['Searched, gave up, cancelled the booking','Yes','No, and costly']])}
<p>Define containment with a window and guard it: <b>contained = no contact in the 24h to 7d after the session AND no failed-journey signal</b> (immediate return searches, rage clicks, cancellation within 7 days). Validate against surveyed or sampled outcomes, and report by case type, because safety and payment issues should not be deflected.</p>`,
mist:['Counting every no-contact session as resolved','Optimising a metric that rewards hiding the contact button'],
follow:['How would you detect that the contact button has become harder to find?']},

{id:'c4q6',t:'exp',time:'7 min',diff:'Hard',q:'How long do you run the test, and how do you protect against novelty effects, seasonality and early peeking?',
aloud:`"Run at least two full weekly cycles after reaching the sample size, check whether the effect decays with days since exposure, and avoid peeking. If leadership needs interim looks, I'd use a sequential method with alpha spending rather than checking a fixed-horizon p-value each day."`,
a:`${ul(['<b>Duration:</b> the larger of the time to reach sample size and 2 full weekly cycles. Support demand differs by weekday and by travel season, so avoid a window that includes a holiday or a major incident unless you can model it.','<b>Novelty and primacy:</b> plot the treatment effect by days since first exposure. A large early effect that fades is novelty; an effect that grows is learning.','<b>Peeking:</b> repeatedly checking a fixed-horizon test inflates false positives. In simulation, a true-null test with 5 looks gives about 13.6% false positives and 10 looks about 19.5%, against the nominal 5% (see Case 7).','<b>Sequential option:</b> use group-sequential boundaries or alpha-spending, decided in advance.','<b>Holdback:</b> after shipping, keep a small long-term holdout to see whether the effect persists.'])}`,
mist:['Stopping on the first significant day','Ignoring day-of-week effects'],
follow:['An executive asks for an update after three days. What do you show?']}
]});

CASES.push({n:5,short:'Chatbot: did it cause it?',title:'AI chatbot launch: "resolution time fell 15%"',tags:['Causal inference','Diff-in-diff','Interrupted time series','Matching','Selection bias'],time:'50 min',
scenario:`<p><b>Scenario.</b> An AI chatbot launched on Oct 1 in six markets (treated) and not in six others (control). It only handles eligible case types; <b>safety and other high-priority cases are excluded</b>. Average resolution time in treated markets fell from <b>60 to 51 minutes (about −15%)</b>. The product lead wants to claim the chatbot caused the 15%.</p>
${tbl(['','Before (Sep)','After (Oct)','Change'],[['Treated markets','60','51','−9'],['Control markets','61','58','−3']],[1,2,3])}
<p>Illustrative numbers. Control markets also improved by 3 minutes.</p>`,
qs:[
{id:'c5q1',t:'cau',time:'6 min',diff:'Hard',q:'Someone says "the chatbot cut resolution time by 15%". What are your first questions, and what else could explain it?',
aloud:`"A before-and-after number isn't a causal estimate. I'd ask what else changed at the same time: seasonality, the mix of cases, staffing, a policy change, or a change in how resolution time is measured. I'd also ask how the markets were chosen, since launching where times were worst invites regression to the mean. To estimate the causal effect I need a counterfactual, so I'd use the control markets, and ideally a randomised holdout."`,
a:`${tbl(['Alternative explanation','How it creates a fake improvement','Check'],[['Seasonality','October is calmer than September','Control markets and last year\'s seasonal pattern'],['Case mix','Eligible cases are easier, and bot-resolved cases count as very fast','Compare like-for-like case types'],['Regression to the mean','Markets chosen because times were high','Look at pre-period levels and trends'],['Concurrent changes','Hiring, a policy change, a new tool','Change log; compare with controls'],['Measurement change','Bot-resolved cases logged with near-zero time; handoffs not counted','Check metric definition before and after'],['Selection into the bot','Customers with easy issues choose it','Intent-to-treat: analyse everyone offered the bot']])}
<p><b>Association, prediction and causal effect are different things.</b> A before-and-after gap is an association. A model that predicts resolution time is prediction. A causal effect compares what happened with what would have happened without the chatbot, which you can only estimate with a credible counterfactual.</p>`,
mist:['Accepting the before/after number','Not asking how the treated markets were chosen'],
follow:['What is the single most convincing design here, and what can you do if it is impossible?']},

{id:'c5q2',t:'cau',time:'8 min',diff:'Hard',q:'High-priority cases are excluded from the chatbot. How does that change the analysis and the conclusion?',
data:`<div class="cap">Illustrative case mix (average resolution minutes)</div>${tbl(['Segment','Before: share','Before: minutes','After: share','After: minutes'],[['Easy, resolved by bot','–','–','32%','3'],['Easy, handled by human','40%','30','8%','30'],['Hard / excluded, human','60%','80','60%','80'],['<b>Overall average</b>','','<b>60.0</b>','','<b>51.4</b>']],[1,2,3,4])}`,
aloud:`"Because the bot only touches easy cases, the whole improvement comes from easy cases getting faster. Hard cases are unchanged at 80 minutes. So the 15% is a mix effect, and I can't extrapolate it to excluded cases. I'd estimate the effect within the eligible case types, and also report a metric that accounts for bot-resolved customers who come back."`,
a:`<p>Compute the overall average after launch: 0.32 × 3 + 0.08 × 30 + 0.60 × 80 = 0.96 + 2.40 + 48.00 = <b>51.36 minutes, a 14.4% drop</b> from 60.</p>
${ul(['<b>All the improvement is in easy cases.</b> Hard-case time did not move (80 → 80). A headline "−15% overall" tells leadership nothing about cases that matter most.','<b>Estimand:</b> the effect for eligible cases. Eligibility is a design feature, so the result does not generalise to excluded cases (external validity).','<b>Define the comparison unit.</b> Compare eligible case types in treated vs control markets (intent-to-treat: everyone offered the bot), not "users who used the bot", which is self-selected.','<b>Containment illusion:</b> if 20% of bot-closed customers come back and need a 30-minute human contact, time per issue is 51.36 + 0.32 × 0.20 × 30 = <b>53.28 minutes, an 11.2% drop</b>. Include repeats in the outcome.','<b>Quality guardrails:</b> CSAT, reopen rate, escalation rate, and time to reach a human when the bot fails.'])}
${box('Lead-level point','Averages mix two populations. Always report the effect by eligibility and case difficulty, and choose a unit of analysis that cannot be changed by the treatment itself (the customer issue, not the "resolved by bot" contact).','ok')}`,
mist:['Comparing bot users with non-users','Quoting the overall average as the effect','Ignoring customers who return after a bot "resolution"'],
follow:['How would you handle cases that start in the bot and end with an agent?','Which metric should the bot team be rewarded on?']},

{id:'c5q3',t:'cau',time:'10 min',diff:'Hard',q:'Estimate the causal effect using the control markets. State the assumptions and how you test them.',
aloud:`"Difference-in-differences: treated fell 9 minutes, control fell 3, so the estimate is a 6-minute reduction, about 10% of the baseline. It's valid if treated markets would have followed the control markets' trend without the chatbot, the parallel-trends assumption. I'd test it with an event study on pre-period weeks, run placebo launch dates, and cluster errors by market because there are only a dozen."`,
a:`<p>DiD = (51 − 60) − (58 − 61) = −9 − (−3) = <b>−6 minutes</b> (−10% of the treated baseline of 60). The naive before/after said −9; the control markets show that 3 minutes would have happened anyway.</p>
${py(`
import numpy as np, pandas as pd, statsmodels.formula.api as smf

rng = np.random.default_rng(3)
rows = []
for g in range(12):                       # 12 markets, the first 6 get the chatbot
    treated = int(g < 6)
    for w in range(-8, 8):                # 8 weeks before and after launch
        post = int(w >= 0)
        y = 60 + 2 * treated + 0.1 * w - 4 * treated * post + rng.normal(0, 1.5)
        rows.append((g, treated, w, post, y))
df = pd.DataFrame(rows, columns=['market', 'treated', 'week', 'post', 'minutes'])

m = smf.ols('minutes ~ treated * post', df).fit(cov_type='cluster', cov_kwds={'groups': df.market})
print(m.params.round(2)['treated:post'], m.bse.round(2)['treated:post'])
`)}${out(`
-4.04 0.39
`)}
<p>The panel was generated with a true effect of −4, and the DiD coefficient recovers −4.04 (standard error 0.39, clustered by market).</p>
<h3>Assumptions and how to probe them</h3>${tbl(['Assumption','Probe'],[['Parallel trends','Plot weekly treated-minus-control gaps; event-study leads before launch should be near zero. Placebo test: pretend the launch was 4 weeks earlier.'],['No spillover between markets','Do customers or agents move across markets? Is the queue shared? If yes, treated and control are contaminated.'],['No anticipation','Check for behaviour changes before the launch date (pre-announcements)'],['Stable composition','Case mix and channel mix should not change differently across groups. Re-run within case type.'],['No concurrent shocks','Other local changes in treated markets in October. Use the change log.']])}
<h3>Failure modes</h3>${ul(['Markets were chosen because they looked bad or ready: pre-trends differ.','Only 12 clusters: standard errors can be too small. Use cluster-robust with small-sample correction, a wild cluster bootstrap, or randomisation inference.','Heterogeneous effects across markets, with staggered rollout, can bias a simple two-way fixed-effects estimate; use methods designed for staggered timing.'])}
<h3>Communicating uncertainty</h3><p>"About 6 minutes faster for eligible cases (roughly 10%), with the interval from the clustered model. This relies on parallel trends, which the pre-launch weeks support. Spillover between markets would bias it, and we have no evidence of it."</p>`,
mist:['Using only one control market','Using week-level data with unclustered errors','Not looking at pre-trends'],
follow:['Pre-trends diverge by 1 minute per week. What now?','Rollout was staggered over three months. What changes?']},

{id:'c5q4',t:'cau',time:'8 min',diff:'Hard',q:'The chatbot went live across every market at once. There is no control group. What can you do?',
aloud:`"Interrupted time series: fit the trend before launch, test for a level or slope change at launch, and account for autocorrelation. It's only credible with a long, stable pre-period and no other change at the same time. If I can find any untreated comparison series, such as an excluded case type, I'd add it for a comparative ITS."`,
a:`${py(`
import numpy as np, pandas as pd, statsmodels.formula.api as smf

rng = np.random.default_rng(11)
t = np.arange(60); post = (t >= 30).astype(int)
y = 50 + 0.05 * t + rng.normal(0, 1.2, 60) - 3 * post     # true level shift = -3
d = pd.DataFrame({'t': t, 'post': post, 'since': (t - 30) * post, 'y': y})
m = smf.ols('y ~ t + post + since', d).fit(cov_type='HAC', cov_kwds={'maxlags': 4})
print(m.params.round(2).to_dict()); print(m.bse.round(2).to_dict())
`)}${out(`
{'Intercept': 50.65, 't': -0.01, 'post': -1.79, 'since': 0.05}
{'Intercept': 0.23, 't': 0.01, 'post': 0.34, 'since': 0.02}
`)}
<p><b>Read this output carefully.</b> The true level shift was −3, but this run estimated −1.79. The pre-period was only 30 noisy points, the fitted pre-trend came out as −0.01 instead of +0.05, and extrapolating a wrong trend biased the effect. The reported standard error (0.34) does not reflect that trend uncertainty. This is the typical ITS failure: <b>short, noisy pre-periods give fragile counterfactuals</b>.</p>
${tbl(['Item','Detail'],[['Model','y = β₀ + β₁·time + β₂·post + β₃·time-since-launch'],['Assumptions','Pre-trend would have continued; no other change at the launch date; no change in measurement'],['Probes','Longer pre-period; seasonal terms; placebo launch dates; autocorrelation (HAC or ARIMA errors); sensitivity to the trend specification'],['Stronger designs','Comparative ITS using an unaffected series (excluded case types); synthetic control from other products or regions; a staged rollout going forward; a small randomised holdback'],['Interpretation','β₂ is the immediate level change; β₃ is the change in trend, not a permanent effect']])}`,
mist:['Ignoring seasonality and autocorrelation','Too few pre-launch points','Treating the post coefficient as exact'],
follow:['How many pre-period points would you want?','What would make you doubt the ITS result?']},

{id:'c5q5',t:'cau',time:'8 min',diff:'Hard',q:'A colleague proposes comparing customers who used the bot with those who did not, matched on observables. Is that enough?',
aloud:`"Matching helps with observed differences like case type, language and customer tenure, but customers choose to use the bot, and the reasons, like urgency or patience, aren't in the data. So it can reduce bias but not remove it. I'd check balance and overlap, avoid conditioning on anything the bot affects, and run a sensitivity analysis. DiD or a holdout is a better foundation."`,
a:`<p>Compact DAG:</p>
<pre class="code out">Case complexity ──► uses bot ──► resolution time
        └────────────────────────────►┘      (complexity also raises time directly)
Urgency (unobserved) ──► uses bot, and ──► resolution time</pre>
