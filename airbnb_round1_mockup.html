<div class="callout warn"><b class="t">About the data</b>All data, tables and numbers here are synthetic and illustrative. Code and outputs were executed before inclusion. Nothing here is Airbnb data or a claim about how Airbnb\'s support operations work.</div>
<h2>The 60-minute case framework</h2>
${tbl(['Minutes','Stage','What you do and say'],[['0–5','Clarify','Restate the goal. Ask: what decision will this inform? Who are the users (guests or hosts)? What is the unit (contact, case, user)? Which period and data? Any known recent changes?'],['5–10','Metric and unit','Define the metric and denominator precisely. Name a primary metric and 2 to 3 guardrails. State assumptions aloud.'],['10–15','Data checks','Duplicates, late-arriving events, censored (open) cases, time zones, join fanout, definition changes.'],['15–40','Analysis','Decompose, segment, test, model. Think aloud. Sanity-check each number against a rough expectation.'],['40–50','Recommendation','Answer first: what you found, how sure you are, what to do, what could be wrong, what you would do next.'],['50–60','Questions and extensions','Take follow-ups. Say "here is what I would test" instead of guessing.']])}
<h2>Clarifying questions that show Lead-level thinking</h2>
${tbl(['Type of problem','Ask'],[['Metric movement','Did the metric definition, logging or any product change happen near the date? Is the denominator affected?'],['SQL','What is the grain of each table? Can contact_ids repeat? Are timestamps UTC? Which engine (Trino or other)?'],['Experiment','What is the randomisation unit? Any interference through a shared queue? What is the minimum effect worth shipping?'],['Causal / observational','How were the treated units chosen? Is there any comparison group? What changed at the same time?'],['Forecast','What decision uses it, at what granularity and horizon? What does the current process achieve?'],['ML classifier','What do a miss and a false alarm cost? What review capacity exists? What is known at prediction time?']])}
<h2>Eleven things that separate a Lead answer</h2>${ul(['State the estimand and unit before computing anything.','Say what would change your mind.','Name the denominator every time you quote a rate.','Check the metric is real before explaining it.','Separate association, prediction and causal effect.','Quote an interval, not just a point estimate.','Translate error and effect into minutes, tickets or money.','Compare with a baseline.','Consider guests and hosts separately (two-sided marketplace).','Give a recommendation, then the caveats, in that order.','If you do not know, say what you would check and how.'])}
${box('Your honest bridges (use only what is true)','Support analytics has not been your direct domain, so do not claim it. Do bridge from the experience you have: LightGBM and Random Forest forecasting, SQL on Presto/Trino, experimentation and hypothesis-testing preparation, retention analytics at Rapido (repeat behaviour, cost versus experience), and LLM and agent automation work. Say plainly where you are learning the support domain, then show the method transfers.')}
<h2>The 13 cases</h2>
${tbl(['#','Case','Main skills','Time'],CASES.map(function(c){return [c.n,'<a href="#case-'+c.n+'">'+c.title+'</a>',c.tags.join(', '),c.time]}))}
<p>Then: <a href="#wb">12 whiteboard problems</a>, <a href="#ref">reference sheets</a>, and a <a href="#mock">timed 60-minute mock</a>.</p>`;

WB.push(
{id:'wb1',t:'stat',time:'4 min',diff:'Medium',q:'A model flags contacts as safety-sensitive. About 1% of contacts truly are. The model catches 90% of them and wrongly flags 5% of the rest. A contact is flagged. What is the chance it is truly safety-sensitive?',
aloud:`"About 15%. Out of 10,000 contacts, 100 are truly safety-sensitive and 90 get flagged. Of the 9,900 others, 5% or 495 are flagged too. So 90 of 585 flagged contacts are real, about 15%."`,
a:`<p>Natural frequencies, 10,000 contacts:</p>${tbl(['','Flagged','Not flagged','Total'],[['Truly safety-sensitive','90','10','100'],['Not safety-sensitive','495','9,405','9,900'],['Total','585','9,415','10,000']],[1,2,3])}
<p>P(true | flagged) = 90 / 585 = <b>15.4%</b>. By Bayes: 0.009 / (0.009 + 0.0495).</p>
<p><b>Implication:</b> even a good-looking classifier has low precision for a rare class. Use it to prioritise human review, not to act automatically, and require high recall because a miss is costly.</p>`,
mist:['Answering 90% (confusing recall with precision)'],follow:['How does the answer change if prevalence is 5%?']},

{id:'wb2',t:'biz',time:'5 min',diff:'Medium',q:'A self-service flow applies to 30,000 contacts a month. It contains 40% of them. A human contact costs $4, a bot interaction $0.50. 15% of contained customers come back as a human contact. Monthly net saving? How sensitive is it?',
aloud:`"12,000 contained contacts, each saving 3.50, so 42,000. Then 15% of them, 1,800, come back at $4, costing 7,200. Net 34,800 a month. If the return rate doubles to 30%, net falls to 27,600. The saving only disappears if 87.5% come back, so the case is robust to that assumption; containment rate and cost per contact are the assumptions to test."`,
a:`${tbl(['Step','Calculation','Value'],[['Contained','30,000 × 40%','12,000'],['Gross saving','12,000 × ($4 − $0.50)','$42,000'],['Returners','12,000 × 15%','1,800'],['Cost of returners','1,800 × $4','$7,200'],['<b>Net</b>','','<b>$34,800</b>']],[2])}
${ul(['<b>Sensitivity:</b> return rate 30% → returners cost $14,400 → net $27,600. Break-even return rate: 42,000 = 12,000 × r × 4, so r = 87.5%.','<b>Bigger risks than return rate:</b> customers who abandon and cancel (an unmeasured cost), and containment that does not hold across case types.','<b>Say:</b> these are illustrative figures; the decision rests on measured containment and return rates from a test.'])}`,
mist:['Ignoring returners','Counting abandoned journeys as savings'],follow:['What cost would you add for dissatisfied customers who leave?']},

{id:'wb3',t:'stat',time:'4 min',diff:'Medium',q:'400 customers answer a CSAT survey and 72% say they are satisfied. Give a 95% confidence interval and interpret it.',
aloud:`"Standard error is the square root of 0.72 times 0.28 over 400, about 2.2 points, so roughly 67.6 to 76.4%. The Wilson interval is nearly the same. But that interval only describes sampling noise among respondents. If the response rate is low and unhappy customers answer differently, bias can dwarf it."`,
a:`<p>SE = √(0.72 × 0.28 / 400) = 0.0224. Wald interval: 0.72 ± 1.96 × 0.0224 = <b>67.6% to 76.4%</b>. Wilson interval: 67.4% to 76.2% (preferred for proportions away from 0.5 or small n).</p>
${ul(['<b>Interpretation:</b> if we repeated the survey many times, 95% of such intervals would contain the true respondent-population proportion. It does not mean "95% probability the true value is in this interval" in the frequentist sense.','<b>Width</b> shrinks with √n: to halve the width you need 4 times the responses.','<b>Not covered:</b> non-response bias (see W8). A tight interval around a biased estimate is still wrong.'])}`,
mist:['Ignoring non-response bias','Using the interval to compare groups without a proper test'],follow:['How would you compare CSAT between two channels?']},

{id:'wb4',t:'stat',time:'4 min',diff:'Medium',q:'Baseline contact rate is 8%. How many users per arm to detect a drop to 7.5% with 80% power and α = 0.05? What if you wanted to detect 7.75%?',
aloud:`"About 44,900 per arm for a half-point drop. Halving the effect to a quarter point needs about four times the sample, roughly 180,000 per arm."`,
a:`${py(`from statsmodels.stats.power import NormalIndPower
from statsmodels.stats.proportion import proportion_effectsize

for p2 in (0.075, 0.0775):
    n = NormalIndPower().solve_power(proportion_effectsize(0.08, p2), alpha=0.05, power=0.8)
    print(f'8.00% -> {p2:.2%}: {n:,.0f} per arm')`)}${out(`8.00% -> 7.50%: 44,880 per arm
8.00% -> 7.75%: 182,204 per arm`)}
<p>Sample size scales with 1/(effect)². Halving the detectable effect quadruples n. Always ask what effect is worth shipping before choosing n.</p>`,
mist:['Forgetting that n grows with the inverse square of the effect'],follow:['What if you can only get 20,000 per arm?']},

{id:'wb5',t:'stat',time:'6 min',diff:'Hard',q:'A new routing rule seems to lower the resolution rate overall, yet it looks better within every case-difficulty group. How is that possible? Which number do you trust?',
data:`${tbl(['','Treatment','Control'],[['Easy cases','190 / 200 = 95%','720 / 800 = 90%'],['Hard cases','400 / 800 = 50%','90 / 200 = 45%'],['<b>Overall</b>','<b>590 / 1,000 = 59%</b>','<b>810 / 1,000 = 81%</b>']])}`,
aloud:`"This is Simpson's paradox. Treatment is better in both groups, but it got mostly hard cases, 800 of 1,000, while control got mostly easy ones. Overall rates mix different case mixes. If difficulty is determined before routing, I'd compare within strata or standardise to a common mix: at 50/50, treatment is 72.5% versus 67.5% for control, so about 5 points better."`,
a:`${ul(['<b>Mechanism:</b> the group composition differs: 80% of treated cases are hard versus 20% of control cases.','<b>Which to trust:</b> the stratified comparison, <i>if</i> difficulty is a pre-treatment variable that influences both who gets the treatment and the outcome (a confounder).','<b>When not to stratify:</b> if the variable is affected by the treatment (a mediator or collider), conditioning on it introduces bias. Draw the causal graph first.','<b>Standardised comparison:</b> weight each group by a common mix, 50/50: treatment 0.5 × 95 + 0.5 × 50 = 72.5%; control 0.5 × 90 + 0.5 × 45 = 67.5%. Treatment is +5 points.','<b>Real fix:</b> randomise routing, so mix is balanced by design.'])}`,
mist:['Believing the overall number because it uses all the data','Always stratifying without thinking about the causal structure'],follow:['Difficulty was assigned by agents after reading the case. What now?']},

{id:'wb6',t:'stat',time:'3 min',diff:'Medium',q:'You test 20 customer segments and find one with p = 0.03. Should you celebrate?',
aloud:`"No. With 20 independent tests at 0.05, the chance of at least one false positive is 1 minus 0.95 to the 20th, about 64%. A Bonferroni threshold would be 0.0025, and p = 0.03 does not pass. I'd treat it as a hypothesis for a follow-up test."`,
a:`<p>P(at least one p &lt; 0.05 | all nulls true) = 1 − 0.95<sup>20</sup> = <b>64.2%</b>. Bonferroni threshold: 0.05 / 20 = 0.0025. Benjamini-Hochberg would require the smallest p to be at most 0.0025, the next at most 0.005, and so on.</p>
<p>The honest statement: "One of 20 exploratory segments showed p = 0.03; that is about what chance produces. I would pre-register it and test it in a new sample before acting."</p>`,
mist:['Reporting the one significant segment as a finding'],follow:['What if the segments were pre-registered?']},

{id:'wb7',t:'biz',time:'5 min',diff:'Medium',q:'A project costs $0.5M. There is a 30% chance it succeeds and gains $2.0M, otherwise you lose a further $0.1M. Expected value? How confident must you be in success for it to break even?',
aloud:`"EV is 0.3 times 2.0 minus 0.7 times 0.1 minus 0.5, which is plus 0.03 million. It's barely positive, and the break-even probability is 28.6%, so my 30% estimate is only slightly above it. I'd want evidence on that probability before committing, or a cheaper pilot first."`,
a:`<p>EV = p × 2.0 − (1 − p) × 0.1 − 0.5 = 2.1p − 0.6 (in $M). At p = 0.30: 0.63 − 0.60 = <b>+$0.03M</b>. Break-even: p = 0.6 / 2.1 = <b>28.6%</b>.</p>
${ul(['<b>Sensitivity:</b> at p = 25%, EV = −$0.075M. A 5-point error in the estimate flips the sign.','<b>Option value:</b> a small pilot that costs $0.05M and sharpens p can be worth more than deciding now.','<b>Risk:</b> expected value ignores variance; for a large loss relative to budget, consider risk tolerance.'])}`,
mist:['Treating a point estimate of success probability as certain'],follow:['How would you estimate p?']},

{id:'wb8',t:'stat',time:'5 min',diff:'Hard',q:'In truth 70% of customers are satisfied. Satisfied customers answer the survey 5% of the time, dissatisfied ones 12%. What satisfaction rate does the survey show? How would you correct?',
aloud:`"Respondents are 0.7 times 0.05 satisfied, 0.035, versus 0.3 times 0.12 dissatisfied, 0.036. So 49% of responses look satisfied, versus a true 70%. That's non-response bias. If I know or can estimate response rates by group, I weight responses by the inverse of response probability; otherwise I validate against a random sample with follow-up, or triangulate with behavioural signals like repeat contacts."`,
a:`<p>Responders: satisfied 0.70 × 0.05 = 0.035; dissatisfied 0.30 × 0.12 = 0.036. Observed satisfaction = 0.035 / 0.071 = <b>49.3%</b> against a true <b>70%</b>.</p>
${ul(['<b>Inverse-probability weighting:</b> weight each response by 1 / P(respond | group). Needs the grouping variable and its response rates; works if response depends only on observed variables.','<b>Follow-up sample:</b> contact a random sample of non-responders to measure the gap.','<b>Behavioural proxies:</b> repeat contact, reopen, cancellation, rebooking. Track alongside CSAT.','<b>Trend caution:</b> a change in response rate can move CSAT with no change in experience. Always show the response rate with the score.'])}`,
mist:['Treating low-response CSAT as representative','Not showing response rate'],follow:['Response rate fell from 8% to 5%. What do you check?']},

{id:'wb9',t:'stat',time:'5 min',diff:'Medium',q:'Resolution time is lognormal with median 30 minutes and σ = 0.9 on the log scale. What are the mean and 90th percentile?',
aloud:`"For a lognormal the mean is the median times e to the sigma squared over two, so 30 times e to 0.405, about 45, which is 50% above the median. The p90 is the median times e to 1.2816 sigma, about 95 minutes. That's why I'd report median and p90 rather than the mean."`,
a:`<p>Median = e<sup>μ</sup> = 30. Mean = 30 × e<sup>σ²/2</sup> = 30 × e<sup>0.405</sup> = <b>45.0</b>. p90 = 30 × e<sup>1.2816 × 0.9</sup> = 30 × e<sup>1.153</sup> = <b>95.1</b>.</p>
<p>A simulation with these parameters (Case 3, Q3.4) gave a sample mean of 45.3 against a median of 30.5, in line with theory. Heavy tails mean small samples give unstable means, bootstrap intervals are asymmetric, and a few extreme cases can dominate totals.</p>`,
mist:['Quoting the mean as "typical"'],follow:['How would you compute a CI for the p90?']},

{id:'wb10',t:'stat',time:'5 min',diff:'Medium',q:'Expected hourly demand is 400 tickets and arrivals are Poisson. Probability that more than 450 arrive in an hour? Why might the real risk be higher?',
aloud:`"For Poisson with mean 400, the standard deviation is 20, so 450 is 2.5 sigma out and the probability is about 0.65%. The real risk is higher because my forecast of 400 is itself uncertain, and because arrivals cluster in incidents, so variance exceeds the mean. In Case 11, with a total standard deviation of 40, the same probability is 10.6%."`,
a:`<p>Normal approximation with continuity correction: z = (450.5 − 400) / 20 = 2.525, tail ≈ 0.58%. Exact Poisson: <b>0.65%</b>.</p>
${ul(['<b>Overdispersion:</b> real count data often have variance greater than the mean (incidents, clustering). Use a negative binomial.','<b>Forecast uncertainty:</b> the mean itself is estimated. Total variance = Poisson variance + forecast variance.','<b>Planning:</b> set capacity from a quantile of the predictive distribution (Case 11).'])}`,
mist:['Assuming pure Poisson noise'],follow:['How would you test for overdispersion?']},

{id:'wb11',t:'stat',time:'6 min',diff:'Hard',q:'You reward the top 10% of agents by last month\'s CSAT. Next month their average falls back sharply. Is the reward programme at fault?',
aloud:`"Probably not. If part of any month's CSAT is luck, the top group was selected partly for good luck, and it won't repeat. If skill explains 20% of the observed variance, the top decile's expected lead next month is only 20% of last month's. That's regression to the mean. I'd use a longer window, shrink scores towards the mean, and judge programmes against a randomised or matched comparison."`,
a:`<p>Model: observed = skill + noise, with Var(skill) = 0.25 and Var(noise) = 1.0. Reliability = 0.25 / 1.25 = <b>0.2</b>.</p>
<p>Observed top-decile mean ≈ 1.96 (the top 10% of a normal with sd √1.25 = 1.118 averages 1.755 sd). Expected next month ≈ 0.2 × 1.96 = <b>0.39</b>. They lose about <b>80%</b> of their lead with no change in skill.</p>
${ul(['<b>Remedies:</b> average across several months; empirical-Bayes shrinkage; evaluate programmes against a control group selected the same way.','<b>Same trap in Case 5:</b> markets chosen because times were high will improve without any intervention.'])}`,
mist:['Concluding that the programme caused the decline'],follow:['How would you estimate reliability from data?']},

{id:'wb12',t:'stat',time:'5 min',diff:'Medium',q:'You have 20,000 users per arm and a 12% baseline. What is the smallest effect you can detect with 80% power? What is the power for a 0.5-point drop?',
aloud:`"About a 0.9 point drop, roughly 7.5% relative, for 80% power. A 0.5 point drop has only about 34% power, so the test would miss it two times out of three. If 0.5 points matters, I need a bigger sample or variance reduction."`,
a:`${py(`from scipy.optimize import brentq
from statsmodels.stats.power import NormalIndPower
from statsmodels.stats.proportion import proportion_effectsize as es

n, p = 20000, 0.12
power = lambda d: NormalIndPower().power(es(p, p - d), nobs1=n, alpha=0.05)
mde = brentq(lambda d: power(d) - 0.8, 0.001, 0.05)
print(f'MDE at 80% power: {mde * 100:.2f} points ({mde / p:.1%} relative)')
for d in (0.005, 0.0075, 0.01):
    print(f'power for a {d * 100:.2f}-point drop: {power(d):.0%}')`)}${out(`MDE at 80% power: 0.90 points (7.5% relative)
power for a 0.50-point drop: 34%
power for a 0.75-point drop: 65%
power for a 1.00-point drop: 88%`)}
<p>Power for a 0.5-point effect is only about a third. An inconclusive result on such a test says little about whether a 0.5-point effect exists.</p>`,
mist:['Running an underpowered test and reading "not significant" as "no effect"'],follow:['How would CUPED change these numbers?']}
);

{title:'SQL patterns for support data',html:tbl(['Need','Pattern'],[['Next / previous event','<code>LEAD/LAG(ts) OVER (PARTITION BY user_id, case_type ORDER BY ts)</code>'],['N events inside a window','<code>LAG(ts, N−1)</code>, then <code>ts &lt;= lag_ts + INTERVAL \'30\' DAY</code>'],['Repeat contact (forward)','<code>LEAD(created_ts)</code> then compare with <code>created_ts + INTERVAL \'7\' DAY</code>'],['Right-censoring','Apply the eligibility filter <b>after</b> LEAD, to the denominator'],['Median / p90 (Trino)','<code>approx_percentile(x, 0.5)</code>, <code>approx_percentile(x, 0.9)</code>'],['Minutes between','<code>date_diff(\'minute\', start_ts, end_ts)</code>'],['Dedupe events','<code>ROW_NUMBER() OVER (PARTITION BY k ORDER BY ingested_ts DESC) = 1</code>'],['Pivot events to columns','<code>MIN(CASE WHEN event_type = \'x\' THEN event_ts END)</code>'],['Avoid fanout','Aggregate each many-side table to the parent grain, then join'],['Rolling baseline','<code>AVG(x) OVER (ORDER BY d ROWS BETWEEN 28 PRECEDING AND 1 PRECEDING)</code> (exclude today)'],['Rate','<code>1000.0 * SUM(num) / SUM(den)</code>, never AVG of ratios'],['Conditional rate','<code>AVG(CASE WHEN cond THEN 1.0 ELSE 0 END)</code>']])+'<p>Trino has no named WINDOW clause; repeat the OVER definition. Use <code>1000.0 *</code> to avoid integer division.</p>'},
{title:'Tests, intervals and sample size',html:tbl(['Task','Method','Note'],[['Two proportions','z-test; CI = diff ± 1.96·SE','SE = √(p₁q₁/n₁ + p₂q₂/n₂)'],['Two means (unequal variances)','Welch t-test','Default; large n tolerates skew'],['Skewed metric','Bootstrap CI for median or mean; resample the randomisation unit','Mann-Whitney is not a test of medians'],['Sample size, proportions','n = [z<sub>α/2</sub>√(2p̄q̄) + z<sub>β</sub>√(p₁q₁ + p₂q₂)]² / (p₁−p₂)²','Scales 1/effect²'],['SRM','χ² goodness of fit vs designed split','p &lt; 0.001 = investigate before reading results'],['Clustered data','Design effect = 1 + (m − 1)·ICC; analyse at cluster level or use cluster-robust SE','Effective n = n / DE'],['Variance reduction','CUPED: Y − θ(X − X̄), θ = cov(Y,X)/var(X)','Variance × (1 − ρ²)'],['Multiple metrics','Primary at full α; others Holm or BH; guardrails by non-inferiority','1 − 0.95<sup>k</sup> false-positive risk'],['Peeking','Group-sequential or alpha-spending boundaries','5 looks ≈ 13.6% false positives at nominal 5%']])},
{title:'Causal method chooser',html:tbl(['Method','Use when','Key assumption','How to probe','Typical failure'],[['Randomised test','You can assign','Randomisation holds; no interference','SRM check; balance table','Interference through shared queues'],['Difference-in-differences','Treated and untreated groups, before and after','Parallel trends','Event-study leads; placebo dates','Few clusters; staggered timing; spillover'],['Interrupted time series','One unit, long pre-period','Pre-trend continues; nothing else changes','Longer pre-period; placebo dates; comparison series','Short noisy pre-period; seasonality'],['Matching / propensity','Selection on observables','No unmeasured confounding; overlap','Balance (SMD &lt; 0.1); sensitivity analysis','Adjusting for post-treatment variables'],['Regression discontinuity','Assignment by a cut-off','No manipulation at the cut-off','Density test; bandwidth sensitivity','Local effect only'],['Instrumental variable','Encouragement or random nudge','Relevance; exclusion; monotonicity','First-stage strength','Weak instruments; answers a LATE question'],['Synthetic control','One treated unit, many donors','Pre-period fit implies a good counterfactual','Placebo-in-space; pre-fit RMSE','Poor pre-fit']])},
{title:'Forecast metrics at a glance',html:tbl(['Metric','Formula','Use when','Watch out'],[['MAE','mean |F − A|','Easy, same units','Scale-dependent'],['RMSE','√mean (F − A)²','Large misses are costly','Dominated by outliers'],['MAPE','mean |F − A| / A','All actuals large','Zero or tiny actuals; favours low forecasts'],['sMAPE','mean 2|F − A| / (|A| + |F|)','Rarely; avoid','Unstable near zero; not truly symmetric'],['WAPE','Σ|F − A| / ΣA','Workload planning; compare segments','Hides direction'],['Bias','Σ(F − A) / ΣA','Direction of error','Cancels over hours'],['MASE','MAE / MAE(naive)','Compare across series','Needs the naive benchmark'],['Skill score','1 − WAPE(model) / WAPE(naive)','Is the model worth it?','Choose the naive carefully'],['Pinball loss','max(τ(y − q), (τ − 1)(y − q))','Quantile forecasts','Check coverage as well'],['Coverage','Share of actuals inside the interval','Prediction intervals','Check by horizon and segment']])+'<p><b>Validation:</b> split by time; rolling origin; judge at the decision horizon; report normal and event weeks separately; always include a seasonal-naive baseline.</p>'},
{title:'Classifier evaluation',html:ul(['<b>Imbalance:</b> accuracy is misleading. Use precision, recall, PR-AUC (baseline = prevalence).','<b>Threshold:</b> flag if p ≥ c<sub>FP</sub> / (c<sub>FP</sub> + c<sub>FN</sub>) when scores are calibrated. Or choose top-k by review capacity.','<b>Calibration:</b> reliability table by decile, Brier score; recalibrate with isotonic or Platt scaling on a separate set.','<b>Leakage:</b> only features known at prediction time.','<b>Slices:</b> language, region, channel, guest vs host.','<b>LLM labelling:</b> stratified gold set, inter-annotator agreement, per-class precision and recall, confusion matrix, versioned prompts.','<b>Impact:</b> offline metrics are not enough; test the routing or action in an experiment.'])},
{title:'Traps to avoid',html:ul(['Using LAG(1) when you need LAG(N−1).','Filtering the eligibility window before LEAD.','COUNT(DISTINCT) hiding fanout in other measures.','Averaging channel medians or ratios.','Excluding open cases from resolution time.','Reading results before an SRM check.','Randomising agents when they share a queue.','Calling "not significant" "no effect".','Quoting MAPE as accuracy.','Evaluating a forecast with a random split.','Conditioning on a post-treatment variable.','Judging a classifier with accuracy at 5% prevalence.'])},
{title:'When you hit an unfamiliar question',html:ol(['<b>Pause and restate</b> the problem in your words. Ask one clarifying question.','<b>Name the family</b> it belongs to (metric, SQL pattern, experiment, causal, forecast, classifier).','<b>State a simple version first</b> and solve that. Then add complexity.','<b>Say your assumptions</b> out loud, and what would break them.','<b>Sanity-check</b> with a tiny example or an order-of-magnitude estimate.','<b>If stuck, say what you would try</b> and why. That is a legitimate Lead-level answer.','<b>Never guess a number</b> you cannot defend. Give a range with the logic.'])}
);

/* ---------------- MOCK ---------------- */
MOCK={title:'Timed 60-minute mock: payout contacts rising',
scenario:`<p><b>Prompt (read aloud to yourself).</b> "Weekly support contacts about host payouts have risen 35% in three weeks. Payout volume looks flat. Tell me what is going on and what we should do."</p>
${tbl(['Week','Payout contacts','Payouts processed','Contacts per 1,000 payouts'],[['W1','8,000','400,000','20.0'],['W2','8,400','402,000','20.9'],['W3','9,600','399,000','24.1'],['W4','10,800','401,000','26.9']],[1,2,3])}
<p>Move through the five stages in order. Do not open the model answer for a stage until you have spoken or written your own answer to it. Synthetic data throughout.</p>`,
qs:[
{id:'mk1',stage:'Frame (0–10 min)',t:'biz',time:'10 min',diff:'Hard',q:'Clarify, define the metric and give your plan of attack. What do you ask first?',
aloud:`"The rate per 1,000 payouts went from 20 to 27, so it's a rate increase, not a volume effect. Before decomposing, I'd check the metric is real, then split by payout method, country, and host type, because a change in one method or corridor would look like this. My questions: did anything change in the payout flow or notifications, did the contact taxonomy change, and are contacts counted by payout date or contact date?"`,
a:`${ul(['<b>Confirm:</b> contacts up 35%, payouts +0.25%, so rate per 1,000 payouts rose 34.7% (20.0 → 26.9). It is a propensity effect.','<b>Is it real?</b> Definition or logging changes, a new contact entry point, a pipeline backfill, duplicates across channels.','<b>Questions to ask:</b> product or policy changes to payouts in the last month; new payout methods or banks; maturity of the latest weeks; whether payouts are measured by initiation or completion date.','<b>Plan:</b> (1) measurement check; (2) decompose rate by method, country, host tenure, channel; (3) compare timing to launches; (4) quantify impact and cost; (5) hypothesis and test; (6) recommendation and monitoring.','<b>Two-sided:</b> payouts affect hosts directly, but guest-side contacts about the same booking may also move. Check both.'])}`,
mist:['Starting with a model before checking the metric','Using bookings or contacts as the denominator instead of payouts'],follow:['Payouts per host might have changed. How does that affect the denominator?']},

{id:'mk2',stage:'SQL (10–25 min)',t:'sql',time:'15 min',diff:'Hard',q:'Write the SQL for contacts per 1,000 payouts by payout method and week. Then say what the output shows.',
data:`<div class="cap">Tables</div>${tbl(['Table','Grain','Columns'],[['payouts','one row per payout','payout_id, method, created_ts'],['contacts','one row per contact','contact_id, payout_id (nullable), case_type, created_ts']])}<p>The synthetic data in the output below is scaled 1:100 from the scenario; the rates per 1,000 payouts are identical.</p>`,
aloud:`"Aggregate payouts to week and method, aggregate payout contacts to the same week and method by joining each contact to its payout, which is many-to-one so there's no fanout, then join the two aggregates and divide. Wallet payouts went from 20 to 40 contacts per 1,000; bank rose a little; card fell. The wallet increase explains more than the entire net increase."`,
a:`${sql(`
WITH p AS (
  SELECT date_trunc('week', created_ts) AS wk, method, COUNT(*) AS payouts
  FROM payouts GROUP BY 1, 2),
c AS (
  SELECT date_trunc('week', p.created_ts) AS wk, p.method, COUNT(*) AS contacts   -- payout-cohort week
  FROM contacts c JOIN payouts p ON c.payout_id = p.payout_id
  WHERE c.case_type = 'payout'
  GROUP BY 1, 2)
SELECT CAST(p.wk AS DATE) AS wk, p.method, p.payouts, COALESCE(c.contacts, 0) AS contacts,
       ROUND(1000.0 * COALESCE(c.contacts, 0) / p.payouts, 1) AS per_1k_payouts
FROM p LEFT JOIN c ON p.wk = c.wk AND p.method = c.method
ORDER BY p.method, p.wk
`)}${out(`        wk method  payouts  contacts  per_1k_payouts
2026-10-05   bank     2000        40            20.0
2026-10-26   bank     1900        44            23.2
2026-10-05   card      750        15            20.0
2026-10-26   card      710         8            11.3
2026-10-05 wallet     1250        25            20.0
2026-10-26 wallet     1400        56            40.0`)}
<p>At full scale (W1 vs W4):</p>${tbl(['Method','W1 contacts','W4 contacts','Change','W1 per 1k','W4 per 1k'],[['Wallet','2,500','5,600','+3,100','20.0','40.0'],['Bank transfer','4,000','4,400','+400','20.0','23.2'],['Card','1,500','800','−700','20.0','11.3'],['<b>Total</b>','8,000','10,800','<b>+2,800</b>','20.0','26.9']],[1,2,3,4,5])}
${ul(['<b>Wallet contributes +3,100</b> against a net +2,800 (111% of the change). Card falling partly masks it.','<b>The wallet rate doubled</b> (20 to 40 per 1,000). This is propensity, not volume: wallet payouts grew only 12% (125,000 to 140,000).','<b>Design choices to state:</b> contacts attributed to the payout cohort week (needs a maturity window); LEFT JOIN so methods with zero contacts still show; no fanout because each contact maps to one payout.','<b>Next cut:</b> country, wallet provider, contact reason, host tenure.'])}`,
mist:['Joining contacts to payouts and counting payouts after the join','Attributing contacts by contact date and payouts by payout date in the same ratio without saying so'],follow:['How would you add a rolling 4-week view with partial-week handling?']},

{id:'mk3',stage:'Experiment (25–40 min)',t:'exp',time:'15 min',diff:'Hard',q:'Product proposes an in-app payout tracking page for wallet payouts. Design the test, size it, and interpret the result below.',
data:`<p>Baseline wallet contact rate: 4.0% of payouts (40 per 1,000). A pilot ran with 70,000 payouts per arm: control 2,800 contacts, treatment 2,646.</p>`,
aloud:`"Randomise by host, since a host has repeated payouts and sees the page repeatedly, and analyse per host or with host-clustered errors. Primary metric: payout contacts per payout within 7 days. Guardrails: repeat contact, CSAT, host satisfaction, and no rise in unresolved payouts. To detect a 10% relative reduction, 4.0% to 3.6%, I need about 36,000 payouts per arm. The result is 3.78% versus 4.00%, a 0.22 point or 5.5% relative drop, interval minus 0.42 to minus 0.02, p of 0.03: a real but smaller effect than hoped."`,
a:`${py(`import numpy as np
from statsmodels.stats.power import NormalIndPower
from statsmodels.stats.proportion import proportion_effectsize, proportions_ztest

p1 = 0.04                                              # wallet payout contact rate (40 per 1,000)
n = NormalIndPower().solve_power(proportion_effectsize(p1, p1 * 0.9), alpha=0.05, power=0.8)
print('n per arm to detect 10% relative reduction (4.00% -> 3.60%):', round(n))

x = np.array([2646, 2800]); N = np.array([70000, 70000])      # treatment, control contacts
z, p = proportions_ztest(x, N)
d = x[0] / N[0] - x[1] / N[1]
se = np.sqrt((x[0]/N[0]) * (1 - x[0]/N[0]) / N[0] + (x[1]/N[1]) * (1 - x[1]/N[1]) / N[1])
print('rates', x / N, 'diff pp', round(d * 100, 2), 'CI pp', [round((d - 1.96 * se) * 100, 2), round((d + 1.96 * se) * 100, 2)],
      'p', round(p, 3), 'relative', round(100 * d / (x[1] / N[1]), 1), '%')

actual = np.array([5200, 5600, 6100, 5900, 6300, 6700])
model = np.array([5000, 5800, 5700, 6200, 6100, 6900])
naive = np.array([5000, 5200, 5600, 6100, 5900, 6300])        # last week's actual
wape = lambda a, f: 100 * np.abs(a - f).sum() / a.sum()
bias = lambda a, f: 100 * (f - a).sum() / a.sum()
print('model WAPE', round(wape(actual, model), 2), 'bias', round(bias(actual, model), 2))
print('naive WAPE', round(wape(actual, naive), 2), 'bias', round(bias(actual, naive), 2))
print('skill vs naive', round(1 - wape(actual, model) / wape(actual, naive), 3))`)}${out(`n per arm to detect 10% relative reduction (4.00% -> 3.60%): 35841
rates [0.0378 0.04  ] diff pp -0.22 CI pp [np.float64(-0.42), np.float64(-0.02)] p 0.033 relative -5.5 %
model WAPE 4.19 bias -0.28
naive WAPE 5.87 bias -4.75
skill vs naive 0.286`)}
${ul(['<b>Unit:</b> host, not payout. Payouts from the same host are correlated, and a host sees the tracking page across payouts. If analysing payouts, use host-clustered standard errors.','<b>Primary metric:</b> contacts per payout within 7 days of the payout. Guardrails: repeat contacts, CSAT of those who contact, percentage of payouts later reported as unresolved, host satisfaction.','<b>Sample size:</b> 35,841 per arm for 10% relative at 80% power. 70,000 per arm gives ample power for 10% and about 78% power for a 7% relative drop.','<b>Result:</b> −0.22 points, 95% CI [−0.42, −0.02], p = 0.033. Statistically significant, but the plausible range is a 0.5% to 10.5% relative reduction; the point estimate (5.5%) is half the MDE.','<b>Practical value:</b> at 140,000 wallet payouts a week, 0.22 points is about 308 fewer contacts a week; at $4 a contact, about $1,230 a week. Compare with build and maintenance cost.','<b>It does not explain the spike.</b> The test reduces contacts for any payout; it does not address why the rate doubled. Find the root cause too.'])}`,
mist:['Randomising by payout','Treating significance as importance','Not asking why the rate rose'],follow:['The effect is concentrated in new hosts. What do you do?']},

{id:'mk4',stage:'Forecast / ML (40–50 min)',t:'ml',time:'10 min',diff:'Hard',q:'Operations wants a 4-week forecast of wallet payout contacts. You compare your model with "last week\'s value". Evaluate.',
data:`${tbl(['Week','Actual','Model','Naive (last week)'],[['1','5,200','5,000','5,000'],['2','5,600','5,800','5,200'],['3','6,100','5,700','5,600'],['4','5,900','6,200','6,100'],['5','6,300','6,100','5,900'],['6','6,700','6,900','6,300']],[1,2,3])}`,
aloud:`"The model's WAPE is 4.2% with bias around minus 0.3%, against 5.9% and minus 4.8% for last-week's value. So the model has about a 29% skill improvement and the naive is systematically low in a growing series. But it's six points, so I'd not oversell it: I'd backtest across more windows and report intervals, and judge at the planning horizon of four weeks, not one."`,
a:`<p>From the verification run: model <b>WAPE 4.19%, bias −0.28%</b>; naive <b>WAPE 5.87%, bias −4.75%</b>; skill = 1 − 4.19/5.87 = <b>28.6%</b>.</p>
${ul(['<b>Why naive is biased low:</b> volumes are trending up, so last week is persistently under the next week.','<b>Caution:</b> six points is a very small sample. Report an interval or run a rolling-origin backtest with many windows before claiming a win.','<b>Horizon:</b> naive "last week" is a 1-week-ahead rule. For a 4-week forecast, compare with a 4-week-ahead baseline (for example last week plus trend, or the value 4 weeks earlier).','<b>Segment:</b> check by country and wallet provider. Aggregate error can hide a bad segment.','<b>Quantiles:</b> give Ops P50 and P75 so they can staff for shortfall risk.','<b>Event risk:</b> the payout contact spike is a structural change. Check whether the model adapts, and add a monitoring rule.'])}`,
mist:['Comparing at the wrong horizon','Claiming a win from six points'],follow:['The spike was caused by a bug that has been fixed. What do you do with those weeks in training?']},

{id:'mk5',stage:'Recommend and Q&A (50–60 min)',t:'biz',time:'10 min',diff:'Hard',q:'Give the director a 90-second summary and recommendation. Then state what you do not know.',
aloud:`"Payout contacts per 1,000 payouts rose 35%, from 20 to 27, and nearly all of it is in wallet payouts, where the rate doubled while bank and card are flat or lower. So this is not demand or volume, it's something specific to wallet payouts. My recommendation: first, find the root cause with product, since a status page treats symptoms; the pilot of a tracking page cuts contacts by about 5% and is worth running broadly if cheap. Second, set a monitor on wallet contact rate with a threshold. What I don't know yet: the reason hosts are contacting us, whether it's a new wallet provider, a delay, or a messaging change, and whether the data is final for the latest weeks."`,
a:`${tbl(['Part','Content'],[['Answer first','Rate up 35%; wallet payouts are the driver; rate doubled (20 → 40 per 1,000); not a volume effect.'],['Evidence','Decomposition by method; wallet +3,100 vs net +2,800; pilot shows −0.22 points (−5.5%), CI −0.42 to −0.02.'],['Recommendation','1. Root-cause review of wallet payouts with Product and Payments. 2. Roll out the tracking page if cost is low, with a holdout. 3. Add a wallet contact-rate alert. 4. Staff at P75 in the interim.'],['Risks and unknowns','Contact reasons not yet read; recent weeks may be immature; test effect is smaller than hoped; guardrail results pending.'],['Next 2 weeks','Reason-code analysis of wallet contacts; country and provider cut; staged rollout plan; weekly review.']])}
<p>Practise delivering this in 90 seconds. Lead with the finding. Avoid listing everything you did.</p>`,
mist:['Walking through the method instead of the finding','Hiding unknowns'],follow:['The director asks: "should we pause wallet payouts?" How do you respond?']}
],
